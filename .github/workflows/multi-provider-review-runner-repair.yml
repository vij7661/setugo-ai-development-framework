name: Multi Provider Review Runner Repair

on:
  push:
    branches: [governance/live-conversation-runtime]
    paths:
      - governance-runtime/platform_candidate_review_v3.py
      - governance-runtime/test_platform_candidate_review_v3.py
      - governance-runtime/platform_candidate_review_v7.py
      - governance-runtime/test_platform_candidate_review_v7.py
      - governance-runtime/repair-preregistrations/GOV-MULTI-PROVIDER-REVIEW-RUNNER-001.md
      - governance-runtime/repair-preregistrations/GOV-REVIEWER-SERVING-PROVIDER-PIN-001.md
      - .github/workflows/governance-candidate-platform-review.yml
      - .github/workflows/multi-provider-review-runner-repair.yml

permissions:
  contents: read

jobs:
  deterministic-multi-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen multi-provider tests
        run: |
          python governance-runtime/test_platform_candidate_review_v3.py
          python governance-runtime/test_platform_candidate_review_v7.py
      - name: Assert deterministic test files make no real provider call
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'https://api\.groq\.com|generativelanguage\.googleapis\.com' governance-runtime/test_platform_candidate_review_v3.py
          ! grep -Eq 'OPENROUTER_API_KEY.*os\.environ|https://openrouter\.ai/api/v1/chat/completions' governance-runtime/test_platform_candidate_review_v7.py
      - name: Assert production workflow uses provider-neutral v7 and exact provider routing
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/governance-candidate-platform-review.yml
          grep -q 'platform_candidate_review_v7.py' "$wf"
          grep -q -- '--provider "$REVIEW_PROVIDER"' "$wf"
          grep -q 'provider not in' "$wf"
          grep -q "groq) test -n \"\$GROQ_API_KEY\"" "$wf"
          grep -q "gemini) test -n \"\$GEMINI_API_KEY\"" "$wf"
          grep -q 'REVIEWER_SLOT' "$wf"
