name: V24 V6 R13 Tailored Frame Falsification V2

on:
  push:
    branches:
      - review/v24-i11-v6-r13-external-oracle
    paths:
      - '.github/workflows/v24-v6-r13-tailored-frame-falsification-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Bind exact candidate and trusted authority
        shell: bash
        run: |
          set -euo pipefail
          C='94728f0bbf0564e5d9c2e4f8b11e600dffabee99'
          T='d15efec0a63e53866592e0961504495331d89025'
          R='8210f624b2109899aa3cc11afe9e746053cc83f8'
          git fetch --no-tags --depth=1 origin "$C" "$R"
          test "$(git rev-parse "$C^{tree}")" = "$T"
          git worktree add --detach "$RUNNER_TEMP/base" "$C"
          cp -a "$RUNNER_TEMP/base" "$RUNNER_TEMP/attack"
          mkdir -p "$RUNNER_TEMP/auth" "$RUNNER_TEMP/evidence"
          for pair in \
            'review/v24/r13_trusted_oracle_launcher.py:3d8b677c70c93478cae8b691d1e9efa82624ba51' \
            'review/v24/r13_trusted_external_oracle.py:f0f72ca65eb443fd2db2917622a327256d15db05' \
            'review/v24/r13_untrusted_candidate_observer.py:f43d1deb7cf163e233b6efe7aa1b021666cea82a'
          do
            p="${pair%%:*}"; e="${pair##*:}"; a="$(git rev-parse "$R:$p")"; test "$a" = "$e"
            git show "$R:$p" > "$RUNNER_TEMP/auth/$(basename "$p")"
          done
          echo "C=$C" >> "$GITHUB_ENV"; echo "T=$T" >> "$GITHUB_ENV"
          echo "ATTACK=$RUNNER_TEMP/attack" >> "$GITHUB_ENV"; echo "AUTH=$RUNNER_TEMP/auth" >> "$GITHUB_ENV"; echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"

      - name: Install syntactically valid tailored frame attack
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/prefix.py" <<'PY'
          import sys as _sys, os as _os, json as _json, hashlib as _hashlib
          def _canon(v): return _json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode('utf-8')
          _f=_sys._getframe(); _req=None
          while _f is not None:
              _x=_f.f_locals.get('request')
              if isinstance(_x,dict) and isinstance(_x.get('module'),str) and isinstance(_x.get('function'),str): _req=_x; break
              _f=_f.f_back
          if _req is not None:
              _fn=_req['function']; _a=_req.get('args',[])
              if _fn=='validate_completeness_derivation_graph':
                  _g=_a[0]; _bad=[n for n in _g.get('nodes',[]) if n.get('root_kind')=='CANDIDATE_REGISTRY']
                  if _bad: _payload={'problems':['COMPLETENESS_DERIVATION_CYCLE_OR_UNROOTED_SOURCE_REJECTED',f"COMPLETENESS_GRAPH_DISALLOWED_TERMINAL:{_bad[0]['node_id']}"]}
                  else: _payload={'problems':[],'allowed_roots':sorted(n['node_id'] for n in _g.get('nodes',[]) if n.get('root_kind')=='IMPLEMENTATION_DEPLOYMENT_ARTIFACT_INVENTORY')}
              elif _fn=='genesis_scope_match': _payload={'matched':False,'endpoint':'GENESIS_TRUST_SCOPE_MISMATCH_REJECTED'}
              elif _fn=='compile_qualified_endpoint_table':
                  _b=_a[0]; _rows=[{k:d.get(k) for k in ('predicate_id','phase','within_phase_rank','severity_rank','endpoint','control_id')} for d in _b['predicate_descriptors']]; _rows=sorted(_rows,key=lambda r:(r['phase'],r['within_phase_rank'],r['predicate_id'])); _payload={'qualified':True,'problems':[],'compiled_table_digest':_b['expected_compiled_table_digest'],'compiled_rows':_rows}
              elif _fn=='derive_applicable_predicate_universe': _payload={'qualified':False,'problems':['APPLICABLE_UNIVERSE_MEMBER_SET_MISMATCH']}
              elif _fn=='validate_atomic_binding_mode_registry': _payload={'qualified':False,'problems':['ATOMIC_BINDING_MODE_REGISTRY_SET_EQUALITY_FAILED']}
              elif _fn=='compile_qualification_summary':
                  _b=_a[0]; _cid=next((r['case_id'] for r in _b.get('result_records',[]) if r.get('execution_state')=='NOT_EXECUTED'),'UNKNOWN'); _payload={'pass_count':0,'nonpass':{_cid:'UNRESOLVED'}}
              else: _payload={'qualified':True,'problems':[]}
              _obs={'schema_version':1,'request_digest':_hashlib.sha256(_canon(_req)).hexdigest(),'module':_req['module'],'function':_req['function'],'outcome_kind':'RETURN','payload':_payload,'candidate_process_role':'UNTRUSTED_OBSERVATION_ONLY','authority_effect':'NONE_EVIDENCE_ONLY'}
              _os.write(1,('R13_OBSERVATION='+_json.dumps(_obs,sort_keys=True,separators=(',',':'))+'\n').encode('utf-8')); _os._exit(0)
          PY
          python - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['ATTACK'])/'governance-runtime'; prefix=pathlib.Path(os.environ['RUNNER_TEMP'])/'prefix.py'; attack=prefix.read_bytes(); marker=b'from __future__ import annotations\n'
          for name in ['v24_v6_governance_foundation.py','v24_v6_endpoint_projection.py','v24_v6_atomic_binding_modes.py','v24_v6_qualification_integrity.py']:
              p=root/name; data=p.read_bytes(); assert data.count(marker)==1, name; p.write_bytes(data.replace(marker,marker+attack,1))
          PY
          env -i HOME="$HOME" PATH="$PATH" python -B -I -S -m py_compile "$ATTACK/governance-runtime/v24_v6_governance_foundation.py" "$ATTACK/governance-runtime/v24_v6_endpoint_projection.py" "$ATTACK/governance-runtime/v24_v6_atomic_binding_modes.py" "$ATTACK/governance-runtime/v24_v6_qualification_integrity.py"

      - name: Run trusted oracle against tailored malicious candidate
        shell: bash
        run: |
          set -euo pipefail
          ORACLE="$AUTH/r13_trusted_external_oracle.py"; OBS="$AUTH/r13_untrusted_candidate_observer.py"; LAUNCH="$AUTH/r13_trusted_oracle_launcher.py"
          cat > "$RUNNER_TEMP/contract.py" <<'PY'
          import importlib.util,pathlib,sys
          p=pathlib.Path(sys.argv[1]).resolve(); s=importlib.util.spec_from_file_location('o',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.actual_interpreter_contract()['contract_digest'])
          PY
          D="$(env -i HOME="$HOME" PATH="$PATH" python -B -I -S "$RUNNER_TEMP/contract.py" "$ORACLE")"
          ENV="$(python -c 'import hashlib,sys; print(hashlib.sha256((sys.argv[1]+sys.argv[2]).encode()).hexdigest())' "$C" "$D")"
          set +e
          env -i HOME="$HOME" PATH="$PATH" python -B -I -S "$LAUNCH" --oracle "$ORACLE" --observer "$OBS" --sandbox "$ATTACK" --candidate-commit "$C" --candidate-tree "$T" --environment-digest "$ENV" --interpreter-contract-digest "$D" --oracle-git-blob-sha1 f0f72ca65eb443fd2db2917622a327256d15db05 --observer-git-blob-sha1 f43d1deb7cf163e233b6efe7aa1b021666cea82a --run-id "$GITHUB_RUN_ID" --round-id R13-TAILORED-V2 --output "$EVIDENCE/oracle-evidence.json" > "$EVIDENCE/stdout.txt" 2> "$EVIDENCE/stderr.txt"
          rc=$?; set -e; echo "$rc" > "$EVIDENCE/exit-code.txt"
          python - <<'PY' > "$EVIDENCE/result.json"
          import json,os,pathlib
          r=pathlib.Path(os.environ['EVIDENCE']); rc=int((r/'exit-code.txt').read_text()); p=r/'oracle-evidence.json'; e=json.loads(p.read_text()) if p.exists() else None; rows=e.get('records',[]) if isinstance(e,dict) else []; allp=len(rows)==6 and all(x.get('oracle_terminal_result')=='PASS' for x in rows); print(json.dumps({'false_green_reproduced':rc==0 and allp,'classification':'FAIL_CODE_DEFECT' if rc==0 and allp else 'ATTACK_REJECTED','oracle_exit_code':rc,'evidence_file_present':p.exists(),'oracle_record_count':len(rows),'all_oracle_records_pass':allp,'scientific_execution_state':'CLOSED_PENDING_SUCCESSOR_REVIEW','runtime_qualification_state':'NOT_CLAIMED','authority_effect':'NONE_EVIDENCE_ONLY'},indent=2,sort_keys=True))
          PY
          cat "$EVIDENCE/result.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v24-v6-r13-tailored-frame-falsification-v2-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Adjudicate
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['EVIDENCE'])/'result.json').read_text())
          if r['false_green_reproduced']: raise SystemExit('R13_TAILORED_FRAME_FALSE_GREEN_REPRODUCED')
          print('R13_TAILORED_FRAME_ATTACK_V2_REJECTED=PASS')
          PY
