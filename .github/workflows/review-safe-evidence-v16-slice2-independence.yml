name: Review Safe Evidence V16 Slice 2 Independence

on:
  push:
    branches: [implementation/review-safe-evidence-v16]
    paths:
      - 'governance-runtime/review_safe_evidence_v16_independence.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence.py'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest.json'
      - 'implementation/review-safe-evidence/V16-SLICE-2-CONTROL-DOMAIN-INDEPENDENCE-CONTRACT.md'
      - 'governance-runtime/review_safe_evidence_v16_trust.py'
      - 'governance-runtime/review_safe_evidence_v16_artifact_binding.py'
      - 'governance-runtime/test_review_safe_evidence_v16_trust.py'
      - '.github/workflows/review-safe-evidence-v16-slice2-independence.yml'
permissions: {contents: read}
concurrency:
  group: review-safe-evidence-v16-slice2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independence-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - name: Record candidate and verify frozen Slice 1 dependency identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git hash-object governance-runtime/review_safe_evidence_v16_trust.py)" = "7030d6643e76743cf086f7749292442bdadc3262"
          test "$(git hash-object governance-runtime/review_safe_evidence_v16_artifact_binding.py)" = "90e70c20e322fd801c0dc58291bb838d2a996c88"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_trust.py)" = "41cdb6a6caccd1a24797f0859f50ece557c83ea0"
          echo "V16_SLICE1_FROZEN_COMMIT=36f22a35ff57b6994d55c705c08686609276ddb3"
          echo "V16_SLICE1_DEPENDENCY_BLOBS=EXACT_MATCH"
          echo "IMPLEMENTATION_QUALIFICATION=NOT_CLAIMED"
          echo "RUNTIME_QUALIFICATION=NOT_CLAIMED"
          echo "AUTHORITY_EFFECT=NONE_EVIDENCE_ONLY"
      - name: Install pinned crypto dependency
        run: |
          python -m pip install --disable-pip-version-check -r governance-runtime/requirements-review-safe-evidence-v16.txt
          python - <<'PY'
          import cryptography
          assert cryptography.__version__ == "46.0.4", cryptography.__version__
          print("V16_SLICE2_CRYPTOGRAPHY_VERSION=" + cryptography.__version__)
          PY
      - name: Compile Slice 2 source and tests
        run: |
          python -m compileall -q \
            governance-runtime/review_safe_evidence_v16_independence.py \
            governance-runtime/test_review_safe_evidence_v16_independence.py
      - name: Run Slice 2 mandatory adversarial tests
        working-directory: governance-runtime
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/v16-slice2-unittest.log"
          python -m unittest -v test_review_safe_evidence_v16_independence.py 2>&1 | tee "$LOG"
          echo "V16_SLICE2_TEST_LOG=$LOG" >> "$GITHUB_ENV"
      - name: Verify stable Slice 2 manifest against source and raw execution log
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json, os, pathlib, re
          root=pathlib.Path("governance-runtime")
          source=root/"test_review_safe_evidence_v16_independence.py"
          manifest=json.loads((root/"review-safe-evidence-v16-slice2-test-manifest.json").read_text(encoding="utf-8"))
          assert type(manifest["schema_version"]) is int and manifest["schema_version"] == 1
          assert manifest["manifest_id"] == "REVIEW-SAFE-EVIDENCE-V16-SLICE2-MANDATORY-TESTS-001"
          assert manifest["slice_id"] == "V16-S2-CONTROL-DOMAIN-INDEPENDENCE"
          assert manifest["slice1_frozen_commit"] == "36f22a35ff57b6994d55c705c08686609276ddb3"
          assert manifest["authority_effect"] == "NONE_EVIDENCE_ONLY"
          assert manifest["implementation_qualification"] == "NOT_CLAIMED"
          assert manifest["runtime_qualification"] == "NOT_CLAIMED"
          rows=manifest["tests"]
          assert len(rows)==30,len(rows)
          assert all(row["mandatory"] is True for row in rows)
          requirement_ids=[row["requirement_test_id"] for row in rows]
          declared=[row["python_test_id"] for row in rows]
          assert len(requirement_ids)==len(set(requirement_ids))
          assert len(declared)==len(set(declared))
          tree=ast.parse(source.read_text(encoding="utf-8"),filename=str(source))
          discovered=[]; module=source.stem
          for node in tree.body:
              if isinstance(node,ast.ClassDef):
                  for child in node.body:
                      if isinstance(child,(ast.FunctionDef,ast.AsyncFunctionDef)) and child.name.startswith("test_"):
                          discovered.append(f"{module}.{node.name}.{child.name}")
          log=pathlib.Path(os.environ["V16_SLICE2_TEST_LOG"]).read_text(encoding="utf-8",errors="strict")
          executed=re.findall(
              r"^test_[A-Za-z0-9_]+ \((test_review_safe_evidence_v16_independence\.[A-Za-z0-9_]+\.[A-Za-z0-9_]+)\) \.\.\. ok$",
              log,flags=re.MULTILINE,
          )
          assert len(discovered)==30,len(discovered)
          assert len(executed)==30,len(executed)
          assert set(declared)==set(discovered),sorted(set(declared)^set(discovered))
          assert set(declared)==set(executed),sorted(set(declared)^set(executed))
          assert "skipped=" not in log
          assert "FAILED" not in log
          assert "\nOK\n" in log
          print("V16_SLICE2_MANDATORY_TESTS_VERIFIED=30")
          print("V16_SLICE2_SOURCE_MANIFEST_EXECUTION_SET_EQUALITY=PASS")
          PY
      - name: Construction boundary
        run: |
          echo "V16_SLICE2_CONTROL_DOMAIN_GRAPH=CONSTRUCTION_TESTS_PASS_NONAUTHORITATIVE"
          echo "V16_SLICE2_INDEPENDENCE_DERIVATION=CONSTRUCTION_TESTS_PASS_NONAUTHORITATIVE"
          echo "V16_SLICE2_REGISTRY_AUTHORITY_RESOLUTION=CONSTRUCTION_TESTS_PASS_NONAUTHORITATIVE"
          echo "V16_SLICE2_GRAPH_COMPLETENESS_REAL_WORLD_PROVEN=false"
          echo "V16_SLICE2_TRUST_HEAD_PROVISIONING=OUT_OF_BAND_NOT_PROVEN"
          echo "INTERNAL_ADVERSARIAL_REVIEW_EXHAUSTED=false"
          echo "IMPLEMENTATION_QUALIFICATION=NOT_CLAIMED"
          echo "RUNTIME_QUALIFICATION=NOT_CLAIMED"
          echo "SCIENTIFIC_AUTHORITY=NOT_CLAIMED"
          echo "AUTHORITY_EFFECT=NONE_EVIDENCE_ONLY"
