name: R8 v15-r1 IG-1 Successor3 Baseline Group Measurement
on:
  push:
    branches:
      - governance/r8-v15-r1-integration-gate1-proposal-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-IG1-SUCCESSOR3-BASELINE-GROUP-MEASURE-MARKER.json
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create exact Slice7 worktree
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/ig1-s3-baseline"
          git worktree add --detach "$TARGET" 751162ee42c603cb6c84ee12021d16bab6fa626b
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
      - name: Measure exact group counts
        run: python3 tools/measure_r8_v15_r1_ig1_successor3_baseline_groups.py "$TARGET" | tee baseline-groups.json
      - name: Upload measurement
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-ig1-successor3-baseline-groups
          path: baseline-groups.json
          if-no-files-found: error
          retention-days: 30
