name: R8 v15-r1 Stage2 SG-1 Proposal Preflight
on:
  push:
    branches:
      - governance/r8-v15-r1-stage2-semantic-gate-proposal-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-STAGE2-SG1-PROPOSAL-PREFLIGHT-MARKER.json
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Syntax-check SG-1 proposal machinery
        run: |
          python3 -m py_compile governance-runtime/test_r8_v15_r1_stage2_sg1_dependency_semantics.py
          python3 -m py_compile tools/compare_r8_v15_r1_stage2_sg1_results.py
      - name: Verify exact proposal identities without semantic execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, json, pathlib, subprocess
          EXPECTED={
            "governance-runtime/test_r8_v15_r1_stage2_sg1_dependency_semantics.py":"15cb741fedd6f65d4f1cf5a5a3873e70649ed4ad",
            "tools/compare_r8_v15_r1_stage2_sg1_results.py":"097464a6b99bc79117501f7700d012ebeddd8675",
            ".github/workflows/r8-v15-r1-stage2-sg1-core.yml":"93ea0cccfdb1392ef38ee41dd053512372de0c87",
            "tools/verify_r8_v15_r1_ig1_successor3_exact_candidate.py":"dc8b76d6710dee27af4a3502b157853959d34ba7",
            "governance-r8/R8-V15-R1-STAGE2-SG1-DEPENDENCY-SEMANTIC-SURFACE.json":"94e3275edbb32baca640966830352f5e6c9f4ada",
            "governance-r8/R8-V15-R1-IG1-SUCCESSOR3-STAGE1-CLOSURE.json":"3ad11c9d9ed00dff314c2bf47893e51ce65ff2ce",
            "governance-r8/R8-V15-R1-IG1-SUCCESSOR3-STAGE1-INDEPENDENT-REVIEW-005.txt":"7b9c5c0eefaa782753abf92a2fa88afbf23ff450",
          }
          for path,blob in EXPECTED.items():
              got=subprocess.check_output(["git","rev-parse",f"HEAD:{path}"],text=True).strip()
              if got!=blob: raise SystemExit(f"blob mismatch {path}: {got} != {blob}")
          s=json.loads(pathlib.Path("governance-r8/R8-V15-R1-STAGE2-SG1-DEPENDENCY-SEMANTIC-SURFACE.json").read_text())
          if s["candidate"]!="4984f06a4420b76ad1ad475751aebda04a2d2c5c": raise SystemExit("candidate mismatch")
          if s["candidate_tree"]!="5a34e0d7db3e750dd5b0f722ccecc8014be189ef": raise SystemExit("candidate tree mismatch")
          if s["direct_r8_dependency_edges"]!=32 or s["unique_dependency_targets"]!=2: raise SystemExit("dependency surface mismatch")
          targets=s["targets"]
          if targets["governance-runtime/r8_v15_r1_frozen_schema_runtime.py"]["blob"]!="e5a06f43b98131f0730852757a83bb7fe5882001": raise SystemExit("frozen target blob mismatch")
          if targets["governance-runtime/r8_v15_r1_effect_intent_validator.py"]["blob"]!="50c5f3edd905ec23ae8e97d3cc2d441489935786": raise SystemExit("effect-intent target blob mismatch")
          if set(targets["governance-runtime/r8_v15_r1_frozen_schema_runtime.py"]["attributes"])!={"GCPError","INT64_MAX","canonicalize_json_text"}: raise SystemExit("frozen surface attrs mismatch")
          if set(targets["governance-runtime/r8_v15_r1_effect_intent_validator.py"]["attributes"])!={"EffectIntentError","validate_effect_intent"}: raise SystemExit("effect-intent surface attrs mismatch")
          h=pathlib.Path("governance-runtime/test_r8_v15_r1_stage2_sg1_dependency_semantics.py").read_text()
          tree=ast.parse(h)
          imports=set()
          for n in ast.walk(tree):
              if isinstance(n,ast.Import):
                  imports.update(a.name for a in n.names)
              elif isinstance(n,ast.ImportFrom):
                  imports.add(n.module or "")
          forbidden=("socket","requests","urllib","http","ctypes","pickle","marshal","unittest.mock")
          if any(any(i==f or i.startswith(f+".") for f in forbidden) for i in imports): raise SystemExit(f"forbidden harness import: {sorted(imports)}")
          if h.count('cases["SG1-')!=18: raise SystemExit("expected exactly 18 preregistered SG1 cases")
          core=pathlib.Path(".github/workflows/r8-v15-r1-stage2-sg1-core.yml").read_text()
          if "workflow_call:" not in core: raise SystemExit("core is not workflow_call-only")
          if "\n  push:" in core or "\n  workflow_dispatch:" in core: raise SystemExit("core has direct trigger")
          if "4984f06a4420b76ad1ad475751aebda04a2d2c5c" not in core: raise SystemExit("core candidate binding absent")
          if pathlib.Path("governance-r8/R8-V15-R1-STAGE2-SG1-ACTIVATION.json").exists(): raise SystemExit("activation artifact must be absent")
          print("STAGE2_SG1_PROPOSAL_PREFLIGHT_PASS_NO_SEMANTIC_EXECUTION")
          PY
