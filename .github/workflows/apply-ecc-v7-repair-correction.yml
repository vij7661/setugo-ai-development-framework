name: Apply ECC V7 Repair Correction

on:
  push:
    branches:
      - experiments/ecc-derived-parallel-v7-seal-capability
    paths:
      - '.github/scripts/apply_ecc_v7_repair_correction.py'
      - '.github/workflows/apply-ecc-v7-repair-correction.yml'

permissions:
  contents: write

jobs:
  repair-correction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V7 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record correction input
        run: |
          echo "CORRECTION_INPUT_SHA=$(git rev-parse HEAD)"
          git status --short

      - name: Apply deterministic V7 repair correction
        run: python .github/scripts/apply_ecc_v7_repair_correction.py

      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/ecc_derived/ecc_candidate_boundary.py \
            experiments/ecc_derived/ecc_governance_trust_manifest.json
          git diff --cached --exit-code && { echo "No correction diff produced"; exit 1; } || true
          git commit -m "Correct ECC V7 runtime verifier regression"
          git push origin HEAD:experiments/ecc-derived-parallel-v7-seal-capability
