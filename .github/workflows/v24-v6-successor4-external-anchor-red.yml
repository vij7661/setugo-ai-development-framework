name: V24 V6 Successor-4 External Anchor RED

on:
  push:
    branches:
      - remediation/v24-i11-v6-successor-4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-anchor-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Run exact successor-4 external-anchor self-grant falsification
        working-directory: governance-runtime
        run: |
          set -euo pipefail
          python -m unittest -v test_v24_v6_successor4_external_anchor_red.py
