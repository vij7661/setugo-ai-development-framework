name: V24 V6 R10 Atomic Remediation Recovery

on:
  push:
    branches:
      - implementation/v24-i11-v6-r10-successor-review-remediation
    paths:
      - '.github/workflows/v24-v6-r10-atomic-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-apply-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Reconstruct verified recoverable R10 remediation baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '8126153ce33b60e467f758f2cb732c41a4897d8a5b06746bdba44f5ef9ab7189  remediation/v24/r10-apply-gz/part-001.b64' | sha256sum -c -
          echo '2cea28692fe992e4fd5ffaeb7f6f254349c2c4093d3f0d95a8d8bc7bd0cf8609  remediation/v24/r10-apply-gz/part-002.b64' | sha256sum -c -
          echo 'da301e1366f3b9aa5553bf136500b02716e1980f4bb3cb7437f99a8a443625c4  remediation/v24/r10-apply-gz/part-003.b64' | sha256sum -c -
          cat remediation/v24/r10-apply-gz/part-*.b64 | base64 -d > /tmp/r10-recoverable.patch.gz
          echo 'f04d1e7b1b55ea93da96b65f7e995919c46de870c5589d33dbbe4374ec82f6f4  /tmp/r10-recoverable.patch.gz' | sha256sum -c -
          gzip -t /tmp/r10-recoverable.patch.gz
          gzip -dc /tmp/r10-recoverable.patch.gz > /tmp/r10-recoverable.patch
          echo 'af25bbe634a6a3a238a89cb6207a445c6e5f5fb8d976c9e6c0ed3b2f09ab93d2  /tmp/r10-recoverable.patch' | sha256sum -c -
          git apply --check /tmp/r10-recoverable.patch
          git apply /tmp/r10-recoverable.patch
          git diff --check

      - name: Deterministically rebind R9 to repaired R1-R8 production blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('.')
          manifest_path = root / 'implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          old_expected = {
              'R1': '069a0575c5bf4841cbf752180bbe192094d60623',
              'R2': '424765c9c89f21247aad2c15a0a893ea2abe022e',
              'R3': '1a35d00913b2fac80ab0eac9b2ad1b7474e5b7e3',
              'R4': 'db629734134fe135b15671d1594b8dff5006b844',
              'R5': '4f6b0c8765684ee2d2f776d5ff62328d04a7de58',
              'R6': '7b82883f670f94022d9644135ca843bed0653bc6',
              'R7': '33a772a034582f0ec2bdbb6a3227ff502435f659',
              'R8': '4685389eb1444de7cbafdc137579efcd0e52da0a',
          }
          new_expected = {
              'R1': 'e93684a6886fc34e7f618a83281b72fa505dc90f',
              'R2': '424765c9c89f21247aad2c15a0a893ea2abe022e',
              'R3': '9abfbb8416744c97b83e5946fd6ef4b20873fcba',
              'R4': 'fc251f572cd36b581fb8245fa00d261ceb7770f3',
              'R5': 'da045b5cbdcffc2e44a4c63aa2784d0a632a8585',
              'R6': 'ebe12ef71bafef221ca9e602adba54373aec8bac',
              'R7': 'e9fb5b38ac66350709ab57332f2dc78872268158',
              'R8': '7b8c8ed92a03dddf7000393a0517142a5931113f',
          }

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          changed = set()
          for row in manifest['workstreams']:
              wid = row['workstream_id']
              assert row['production_git_blob_sha'] == old_expected[wid], (wid, row['production_git_blob_sha'])
              actual = blob_sha((root / row['production_module_path']).read_bytes())
              assert actual == new_expected[wid], (wid, actual, new_expected[wid])
              if actual != old_expected[wid]:
                  changed.add(wid)
              row['production_git_blob_sha'] = actual

          assert changed == {'R1','R3','R4','R5','R6','R7','R8'}, changed
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert manifest_sha == '8193b35de08444742b6cefa53a02e2408b3a8fd2a9fef1244eb08fb8be951f2d', manifest_sha
          print('R10_REBOUND_WORKSTREAMS=' + ','.join(sorted(changed)))
          print('R10_REBOUND_MANIFEST_SHA256=' + manifest_sha)
          PY
          git diff --check

      - name: Compile repaired successor modules
        working-directory: governance-runtime
        run: |
          python -m py_compile \
            v24_v6_governance_foundation.py \
            v24_v6_endpoint_projection.py \
            v24_v6_material_surface.py \
            v24_v6_decision_apply.py \
            v24_v6_normative_clause_projection.py \
            v24_v6_effect_ledger_closure.py \
            v24_v6_atomic_binding_modes.py \
            v24_v6_qualification_integrity.py \
            v24_v6_integrated_successor.py

      - name: Run reviewer-bypass adversarial suites
        working-directory: governance-runtime
        run: |
          python -m unittest -v \
            test_v24_v6_governance_foundation.py \
            test_v24_v6_atomic_binding_modes.py \
            test_v24_v6_normative_clause_projection.py \
            test_v24_v6_qualification_integrity.py \
            test_v24_v6_material_surface.py \
            test_v24_v6_decision_apply.py \
            test_v24_v6_effect_ledger_closure.py

      - name: Run complete R1-R8 construction regression
        working-directory: governance-runtime
        run: |
          python -m unittest -v \
            test_v24_v6_governance_foundation.py \
            test_v24_v6_endpoint_projection.py \
            test_v24_v6_material_surface.py \
            test_v24_v6_decision_apply.py \
            test_v24_v6_normative_clause_projection.py \
            test_v24_v6_effect_ledger_closure.py \
            test_v24_v6_atomic_binding_modes.py \
            test_v24_v6_qualification_integrity.py

      - name: Run R9 integration regression
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_integrated_successor.py

      - name: Run inherited V24 construction regressions
        working-directory: governance-runtime
        run: |
          python -m unittest -v \
            test_normative_control_catalog.py \
            test_v24_authority_universe.py \
            test_v24_effective_control.py \
            test_v24_completeness_bootstrap.py \
            test_v24_endpoint_proof_compiler.py \
            test_v24_admission_application_witness.py \
            test_v24_aggregate_budget.py \
            test_v24_generation_migration.py \
            test_v24_review_proof_audit.py

      - name: Assert construction-only posture
        working-directory: governance-runtime
        run: |
          python - <<'PY'
          import v24_v6_integrated_successor as r9
          x = r9.construction_frontier()
          assert x['qualified'] is False
          assert x['authority_effect'] == 'NONE_EVIDENCE_ONLY'
          assert x['scientific_execution_state'] == 'CLOSED_PENDING_SUCCESSOR_REVIEW'
          print(x)
          PY

      - name: Preserve R10 transport failure and recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > implementation/v24/V24-I11-V6-R10-REMEDIATION-EVIDENCE.md <<EOF
          # V24 I11 V6 R10 Successor Review Remediation Evidence

          ## Disposition

          **CONSTRUCTION_REMEDIATION_PASS_PENDING_MANUAL_REVIEW**

          This record is construction evidence only. It does not grant runtime qualification, release, deployment, scientific-pass, or terminal authority.

          - authority_effect: `NONE_EVIDENCE_ONLY`
          - scientific_execution_state: `CLOSED_PENDING_SUCCESSOR_REVIEW`
          - qualified: `false`
          - reviewer API calls: none

          ## Preserved transport failure

          The first corrected-v2 atomic application attempt failed before remediation application because the committed transport did not satisfy its own frozen byte/hash contract.

          - failed atomic run: `34761250702`
          - expected corrected patch SHA-256: `658db6f8aec86640c930c43635f187cc850fe987746e704bd96369f75c518ddc`
          - historical-fragment recovery run: `34762061506`
          - corrected-v2 part 1 exact expected bytes: not present in reachable Git history
          - corrected-v2 part 2 exact expected bytes: recovered historically at `ea0a32bc2073e68ade64ed42b33d923078202859`
          - corrected-v2 part 3 exact expected bytes: not present in reachable Git history

          The failed transport is not rewritten as a scientific or implementation failure; it remains a distinct transport-integrity failure in Git/Actions history.

          ## Deterministic recovery

          Recovery used the last internally valid remediation patch plus the exact R9 manifest rebinding required by the repaired production blobs.

          - recoverable baseline patch SHA-256: `af25bbe634a6a3a238a89cb6207a445c6e5f5fb8d976c9e6c0ed3b2f09ab93d2`
          - manifest-rebind proof run: `34761991465`
          - rebound manifest SHA-256: `8193b35de08444742b6cefa53a02e2408b3a8fd2a9fef1244eb08fb8be951f2d`
          - atomic recovery validation run: `${GITHUB_RUN_ID}`

          Rebound production Git blobs:

          - R1: `e93684a6886fc34e7f618a83281b72fa505dc90f`
          - R2: unchanged `424765c9c89f21247aad2c15a0a893ea2abe022e`
          - R3: `9abfbb8416744c97b83e5946fd6ef4b20873fcba`
          - R4: `fc251f572cd36b581fb8245fa00d261ceb7770f3`
          - R5: `da045b5cbdcffc2e44a4c63aa2784d0a632a8585`
          - R6: `ebe12ef71bafef221ca9e602adba54373aec8bac`
          - R7: `e9fb5b38ac66350709ab57332f2dc78872268158`
          - R8: `7b8c8ed92a03dddf7000393a0517142a5931113f`

          ## Validation boundary

          Before this evidence record was committed, the atomic recovery workflow required successful completion of:

          1. Python compilation of R1-R9 successor modules.
          2. Reviewer-bypass adversarial suites.
          3. Complete R1-R8 construction regression.
          4. R9 integrated-successor regression.
          5. Inherited V24 construction regressions.
          6. Explicit construction-only assertions preserving `qualified=false`, `NONE_EVIDENCE_ONLY`, and `CLOSED_PENDING_SUCCESSOR_REVIEW`.

          Independent manual review remains required before any successor-review closure or scientific WDPC execution is claimed.
          EOF

      - name: Commit coherent R10 successor repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remediation/v24/r10-apply remediation/v24/r10-apply-gz remediation/v24/r10-apply-gz-v2
          rm -f .github/workflows/v24-v6-r10-transport-diagnostic.yml
          rm -f .github/workflows/v24-v6-r10-atomic-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          echo 'R10_FINAL_CHANGED_PATHS_BEGIN'
          git diff --cached --name-only
          echo 'R10_FINAL_CHANGED_PATHS_END'
          git commit -m 'Repair V24 V6 successor review bypasses (R10)'
          git push origin HEAD:implementation/v24-i11-v6-r10-successor-review-remediation
