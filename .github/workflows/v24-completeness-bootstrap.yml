name: V24 Completeness Bootstrap
on:
  push:
    branches: [implementation/v24-i4-completeness-bootstrap]
    paths:
      - 'governance-runtime/v24_completeness_bootstrap.py'
      - 'governance-runtime/test_v24_completeness_bootstrap.py'
      - '.github/workflows/v24-completeness-bootstrap.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: governance-runtime
        run: python -m unittest -v test_v24_completeness_bootstrap.py
