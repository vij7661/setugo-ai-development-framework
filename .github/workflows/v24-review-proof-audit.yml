name: V24 Review Proof Audit
on:
  push:
    branches: [implementation/v24-i10-review-proof-audit]
    paths:
      - 'governance-runtime/v24_review_proof_audit.py'
      - 'governance-runtime/test_v24_review_proof_audit.py'
      - '.github/workflows/v24-review-proof-audit.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: governance-runtime
        run: python -m unittest -v test_v24_review_proof_audit.py
