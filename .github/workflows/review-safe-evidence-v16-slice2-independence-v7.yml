      - name: Verify strict manifests and trusted parent receipt
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=governance-runtime python - "$V16_SLICE2_EXPECTED_RECEIPT_INPUT" "$V16_SLICE2_PARENT_RECEIPT" <<'PY'
          import json, pathlib, re, sys
          import review_safe_evidence_v16_manifest_validation as mv

          expected_path = pathlib.Path(sys.argv[1])
          receipt_path = pathlib.Path(sys.argv[2])
          expected = json.loads(expected_path.read_text(encoding="utf-8"))
          declared = expected["declared_test_ids"]
          discovered = expected["source_discovered_test_ids"]
          assert len(declared) == 77
          assert len(discovered) == 77
          assert len(set(declared)) == 77
          assert set(declared) == set(discovered)

          rows = []
          for line in receipt_path.read_text(encoding="utf-8").splitlines():
              parts = line.split("\t")
              assert len(parts) == 4, parts
              seq_text, test_id, rc_text, diagnostic_sha = parts
              assert re.fullmatch(r"[0-9]+", seq_text)
              assert re.fullmatch(r"[0-9]+", rc_text)
              assert re.fullmatch(r"[0-9a-f]{64}", diagnostic_sha)
              rows.append((int(seq_text), test_id, int(rc_text), diagnostic_sha))

          assert len(rows) == 77, len(rows)
          assert [row[0] for row in rows] == list(range(1, 78))
          receipt_ids = [row[1] for row in rows]
          assert len(receipt_ids) == len(set(receipt_ids))
          assert receipt_ids == declared
          assert set(receipt_ids) == set(discovered)
          assert all(row[2] == 0 for row in rows)

          strict = mv.validate_current_manifest_set(pathlib.Path("governance-runtime"))
          assert strict["valid"], strict["problems"]
          assert strict["test_count"] == 77
          assert strict["authority_effect"] == "NONE_EVIDENCE_ONLY"

          print("V16_SLICE2_MANDATORY_PARENT_RECEIPTS_VERIFIED=77")
          print("V16_SLICE2_DECLARED_SOURCE_PARENT_RECEIPT_EQUALITY=PASS")
          print("V16_SLICE2_CHILD_DIAGNOSTIC_TEXT_USED_FOR_EXECUTION_IDENTITY=false")
          print("V16_SLICE2_STRICT_MANIFEST_VALIDATION=PASS")
          PY

