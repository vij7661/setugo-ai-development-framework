name: Web Production Promotion Boundary

on:
  push:
    branches: [feature/web-production-promotion-boundary]
    paths:
      - experiments/governed-platform/WEB_PRODUCTION_PROMOTION_BOUNDARY_CONTRACT.md
      - experiments/governed-platform/governance/production_promotion_gate.py
      - experiments/governed-platform/governance/test_production_promotion_gate.py
      - .github/workflows/web-production-promotion-boundary.yml

permissions:
  contents: read

jobs:
  deterministic-promotion-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen PB-01 through PB-16
        working-directory: experiments/governed-platform/governance
        run: python test_production_promotion_gate.py
      - name: Assert qualification is provider- and production-secret-free
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'GEMINI_API_KEY|GROQ_API_KEY|OPENROUTER_API_KEY|AWS_SECRET|AZURE_|GOOGLE_APPLICATION_CREDENTIALS' experiments/governed-platform/governance/test_production_promotion_gate.py
          ! grep -Eq 'urlopen|requests\.|subprocess\.|os\.environ' experiments/governed-platform/governance/test_production_promotion_gate.py
