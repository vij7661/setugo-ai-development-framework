name: V24 Endpoint Proof Compilers
on:
  push:
    branches: [implementation/v24-i5-endpoint-proof-compilers]
    paths:
      - 'governance-runtime/v24_endpoint_proof_compiler.py'
      - 'governance-runtime/test_v24_endpoint_proof_compiler.py'
      - '.github/workflows/v24-endpoint-proof-compilers.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: governance-runtime
        run: python -m unittest -v test_v24_endpoint_proof_compiler.py
