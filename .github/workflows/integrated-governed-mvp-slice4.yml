name: Integrated Governed MVP Slice 4

on:
  push:
    branches:
      - feature/integrated-governed-mvp-slice4-isolated-tool-runner-gateway
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice4-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Slice 4 construction branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run frozen Slice 4 acceptance harness
        run: |
          cd experiments/governed-platform/governance
          python -m unittest -v test_integrated_governed_mvp_slice4.py
