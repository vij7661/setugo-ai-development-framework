name: V24 V6 R15 Clean Manual Review Package V2

on:
  push:
    branches: [review/v24-i11-v6-r15-path-normalization]
    paths: ['.github/workflows/v24-v6-r15-clean-review-package-v2.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - name: Fetch exact candidate, review metadata, design and construction evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          C='2e875bb29be48d39c9be6f3525d4f4610869848c'; T='d2c9c0c85564808941fdb54cfbbd53f51f5397ee'
          M='1171b15eae418feb736911e71e975753d67b5a0d'; V6='0e1c6dd99e608d6771df98549bb28a9b92b8e7a0'
          A='10324065691'; AS='0c16e6e523ce5b4d5e4da38ff01e0ed00f4024891554d5665c1a548fc5a02601'
          git fetch --no-tags origin "$C" "$M" "$V6"; test "$(git rev-parse "$C^{tree}")" = "$T"
          E="$RUNNER_TEMP/full.zip"; gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$A/zip" > "$E"; test "$(sha256sum "$E"|awk '{print $1}')" = "$AS"
          D="$RUNNER_TEMP/evidence"; mkdir -p "$D"; unzip -q "$E" -d "$D"; test "$(sha256sum "$D/pin.json"|awk '{print $1}')" = 'e2f7689d4b9902823d94fe11e87c895e4036a080e0795aacfd9070354cf134b9'
          echo "C=$C" >> "$GITHUB_ENV"; echo "T=$T" >> "$GITHUB_ENV"; echo "M=$M" >> "$GITHUB_ENV"; echo "V6=$V6" >> "$GITHUB_ENV"; echo "EVID=$D" >> "$GITHUB_ENV"; echo "AS=$AS" >> "$GITHUB_ENV"
      - name: Stage and independently verify clean review contents
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/stage"; mkdir -p "$S"/{candidate,external,evidence,design,historical,review}
          git show "$M:review/v24/V24-I11-V6-R15-CLEAN-SUCCESSOR-REVIEW-INSTRUCTIONS.md" > "$S/00-REVIEW-INSTRUCTIONS.md"
          python - "$EVID/pin.json" "$C" "$T" "$S" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          pin=json.load(open(sys.argv[1])); c,t,s=sys.argv[2],sys.argv[3],pathlib.Path(sys.argv[4]); assert pin['candidate_commit']==c and pin['candidate_tree']==t
          rows=pin['admitted_files']; assert len(rows)==190 and len({r['path'] for r in rows})==190
          for r in rows:
              d=subprocess.check_output(['git','show',f"{c}:{r['path']}"]); assert len(d)==r['bytes']; assert hashlib.sha256(d).hexdigest()==r['raw_sha256']; assert hashlib.sha1(f"blob {len(d)}\0".encode()+d).hexdigest()==r['git_blob_sha1']
              p=s/'candidate'/r['path']; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(d)
          print('R15_PACKAGE_CANDIDATE_FILES=190')
          PY
          cp "$EVID/pin.json" "$S/evidence/V24-I11-V6-R15-EXTERNAL-PINSET.json"
          cp "$EVID/r13.json" "$S/evidence/V24-I11-V6-R15-R13-REGRESSION.json"
          cp "$EVID/path.json" "$S/evidence/V24-I11-V6-R15-PATH-REGRESSION.json"
          cp "$EVID/oracle.json" "$S/evidence/V24-I11-V6-R15-NATIVE-ORACLE-EVIDENCE.json"
          cp "$EVID/construction.json" "$S/evidence/V24-I11-V6-R15-NATIVE-CONSTRUCTION.json"
          test "$(sha256sum "$S/evidence/V24-I11-V6-R15-R13-REGRESSION.json"|awk '{print $1}')" = '895af7dadf0018203c25b67ee2ab77c8395bbedd2325f0bf88ae0f493a1a374a'
          test "$(sha256sum "$S/evidence/V24-I11-V6-R15-PATH-REGRESSION.json"|awk '{print $1}')" = '3534babb7e03308630a6c07e42779372379d3e725e8b0839be1593e1888bead3'
          test "$(sha256sum "$S/evidence/V24-I11-V6-R15-NATIVE-ORACLE-EVIDENCE.json"|awk '{print $1}')" = '99802aabf7b6d1451a7e698aaa6b540592a036f4870366fbe3fd577a333aebd8'
          test "$(sha256sum "$S/evidence/V24-I11-V6-R15-NATIVE-CONSTRUCTION.json"|awk '{print $1}')" = '08e8972dc759b7b08b5fd31f552e50d19b7b8c4e4a2d7d67bfdf62c0ca001494'
          for p in r15_native_observer.c r15_trusted_external_guard.py r14_native_observer.c r14_python_home_binding.c r14_trusted_external_oracle.py r14_trusted_oracle_launcher.py r13_trusted_external_oracle.py; do git show "$M:review/v24/$p" > "$S/external/$p"; done
          test "$(git rev-parse "$M:review/v24/r15_native_observer.c")" = 'bfd16c1f3b7103b25c2f1abee536ebceb199e295'
          test "$(git rev-parse "$M:review/v24/r15_trusted_external_guard.py")" = '988a69decfb8f02f20b89bdee74da7b8a48ad51d'
          test "$(git rev-parse "$M:review/v24/r14_native_observer.c")" = '59916850a7b81b0d2ba77ce51198536277615555'
          test "$(git rev-parse "$M:review/v24/r14_python_home_binding.c")" = '6e5f3e02146adff92c70bdd12199644b35656721'
          test "$(git rev-parse "$M:review/v24/r14_trusted_external_oracle.py")" = '9b9e2714ef9f71aefe99ceb62e8eac25319fdf10'
          test "$(git rev-parse "$M:review/v24/r13_trusted_external_oracle.py")" = 'f0f72ca65eb443fd2db2917622a327256d15db05'
          for p in V24-I11-V6-R14-FALSIFICATION-ADJUDICATION-001.md V24-I11-V6-R14-BYTES-PROC-MEM-FALSIFICATION-001.json V24-I11-V6-R15-CONSTRUCTION-RED-001.md V24-I11-V6-R15-CONSTRUCTION-RED-002.md V24-I11-V6-R15-ALIAS-REPRESENTATION-RED-003.md V24-I11-V6-R15-ALIAS-REPRESENTATION-FALSIFICATION-001.json V24-I11-V6-R15-SYMLINK-ALIAS-FALSIFICATION-V2.json V24-I11-V6-R15-PATH-NORMALIZATION-CONSTRUCTION-EVIDENCE.md V24-I11-V6-R15-FULL-NATIVE-CONSTRUCTION-EVIDENCE.md V24-I11-V6-R15-FALSIFICATION-CLOSURE-001.md; do git show "$M:review/v24/$p" > "$S/historical/$p"; done
          git show "$V6:remediation/v24/V24-I11-SYSTEMIC-REMEDIATION-DESIGN-V6-CLEAN-REVIEW-PACKET.md" > "$RUNNER_TEMP/v6src"
          python - "$RUNNER_TEMP/v6src" "$S/design/V24-I11-V6-APPROVED-DESIGN-EXACT.md" <<'PY'
          import hashlib,pathlib,sys
          d=pathlib.Path(sys.argv[1]).read_bytes(); assert len(d)==19296 and hashlib.sha256(d).hexdigest()=='5164747405b2de4d97228318a200e97c6b9c0e2afe58e4daddf09fe804bbc9d9'; assert hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()=='8682df137aa12d57927e7891c16048e90b04caac'; d=d[:17321]+b'\n'+d[17321:]; assert len(d)==19297 and hashlib.sha256(d).hexdigest()=='96ec464fbf602ac6b8c89fca5af16aa71a8d53f9f042605e46a07b4cd628ca62'; assert hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()=='4a15d50a0488464816d235b273d1dbf808fdce94'; pathlib.Path(sys.argv[2]).write_bytes(d)
          PY
          cat > "$S/review/R15-PACKAGE-BINDING.json" <<EOF
          {"schema_version":1,"candidate_commit":"$C","candidate_tree":"$T","review_metadata_commit":"$M","full_construction_run":"34776147253","full_construction_artifact_id":"10324065691","full_construction_artifact_sha256":"$AS","symlink_falsification_run":"34776332464","symlink_falsification_artifact_id":"10323866558","symlink_falsification_artifact_sha256":"2218f9ca487d285262c98864e4b555db182dc0047426b954e6d3093bd2fb544c","scientific_execution_state":"CLOSED_PENDING_SUCCESSOR_REVIEW","runtime_qualification_state":"NOT_CLAIMED","automated_reviewer_api_calls":false,"authority_effect":"NONE_EVIDENCE_ONLY"}
          EOF
          echo "STAGE=$S" >> "$GITHUB_ENV"
      - name: Build deterministic ZIP twice with POSIX-relative ordering
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/out"; mkdir -p "$O"
          python - "$STAGE" "$O" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          s=pathlib.Path(sys.argv[1]); o=pathlib.Path(sys.argv[2]); key=lambda p:p.relative_to(s).as_posix()
          files=sorted((p for p in s.rglob('*') if p.is_file()),key=key); rows=[{'path':key(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
          mp=s/'PACKAGE-MANIFEST.json'; mp.write_text(json.dumps({'schema_version':1,'candidate_commit':'2e875bb29be48d39c9be6f3525d4f4610869848c','candidate_tree':'d2c9c0c85564808941fdb54cfbbd53f51f5397ee','listed_file_count':len(rows),'files':rows,'authority_effect':'NONE_EVIDENCE_ONLY'},indent=2,sort_keys=True)+'\n')
          allf=sorted((p for p in s.rglob('*') if p.is_file()),key=key)
          def build(dst):
              with zipfile.ZipFile(dst,'w',compression=zipfile.ZIP_STORED) as z:
                  for p in allf:
                      n=key(p); i=zipfile.ZipInfo(n,(1980,1,1,0,0,0)); i.compress_type=zipfile.ZIP_STORED; i.external_attr=0o100644<<16; i.create_system=3; z.writestr(i,p.read_bytes())
          a=o/'V24-I11-V6-R15-CLEAN-REVIEW.zip'; b=o/'repeat.zip'; build(a); build(b); assert a.read_bytes()==b.read_bytes(); b.unlink()
          with zipfile.ZipFile(a) as z:
              names=z.namelist(); assert names==sorted(names) and len(names)==len(set(names)); assert names==[key(p) for p in allf]
              for p in allf: assert z.read(key(p))==p.read_bytes()
          zs=hashlib.sha256(a.read_bytes()).hexdigest(); ms=hashlib.sha256(mp.read_bytes()).hexdigest(); (o/'V24-I11-V6-R15-CLEAN-REVIEW.sha256').write_text(f'{zs}  V24-I11-V6-R15-CLEAN-REVIEW.zip\n'); (o/'V24-I11-V6-R15-CLEAN-REVIEW.MANIFEST.sha256').write_text(f'{ms}  PACKAGE-MANIFEST.json\n')
          rec={'schema_version':1,'zip_bytes':a.stat().st_size,'zip_sha256':zs,'manifest_sha256':ms,'zip_entry_count':len(allf),'manifest_listed_file_count':len(rows),'candidate_file_count':sum(n.startswith('candidate/') for n in names),'deterministic_double_build':'PASS','content_reverification':'PASS','approved_design_reconstruction':'PASS','authority_effect':'NONE_EVIDENCE_ONLY'}; (o/'V24-I11-V6-R15-CLEAN-REVIEW.BUILD-RECORD.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n'); print(json.dumps(rec,sort_keys=True))
          PY
          echo "OUT=$O" >> "$GITHUB_ENV"
      - name: Upload clean package
        uses: actions/upload-artifact@v4
        with:
          name: v24-v6-r15-clean-manual-review-package-v2
          path: |
            ${{ env.OUT }}/V24-I11-V6-R15-CLEAN-REVIEW.zip
            ${{ env.OUT }}/V24-I11-V6-R15-CLEAN-REVIEW.sha256
            ${{ env.OUT }}/V24-I11-V6-R15-CLEAN-REVIEW.MANIFEST.sha256
            ${{ env.OUT }}/V24-I11-V6-R15-CLEAN-REVIEW.BUILD-RECORD.json
          if-no-files-found: error
          retention-days: 90
