name: EXP-L L6 Prompt Injection Isolation

on:
  push:
    branches: [experiment/exp-l-independent-review-evidence-prompt]
    paths:
      - governance-runtime/review-trust-kernel/evidence_prompt_isolation_v1.py
      - governance-runtime/exp-l/test_l6_prompt_injection_isolation.py
      - governance-runtime/exp-l/L6-PROMPT-INJECTION-PREREG.json
      - .github/workflows/exp-l-l6-prompt-injection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-l6:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout experiment history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run L6 prompt-injection isolation tests without provider APIs
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v governance-runtime/exp-l/test_l6_prompt_injection_isolation.py
