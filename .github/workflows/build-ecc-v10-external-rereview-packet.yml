name: Build ECC V10 External Rereview Packet

on:
  push:
    branches:
      - review/ecc-derived-v10-external-rereview-packet
    paths:
      - '.github/workflows/build-ecc-v10-external-rereview-packet.yml'
      - '.github/scripts/build_ecc_v10_external_rereview_packet.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify packaging-only diff
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='63617dd1f01f0063b5534de128d5afce17f169be'
          REVIEW_COMMIT='e34dfe387920e7f5fddf902cafceaa6fa13e0eb8'
          git cat-file -e "${CANDIDATE}^{commit}"
          git fetch origin "${REVIEW_COMMIT}" --depth=1
          git cat-file -e "${REVIEW_COMMIT}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          mapfile -t changed < <(git diff --name-only "$CANDIDATE"..HEAD | sort)
          printf 'PACKAGING_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'CANDIDATE_SHA=%s\n' "$CANDIDATE"
          printf 'PACKAGING_DIFF=%s\n' "${changed[*]}"
          expected=(
            '.github/scripts/build_ecc_v10_external_rereview_packet.py'
            '.github/workflows/build-ecc-v10-external-rereview-packet.yml'
          )
          if [[ ${#changed[@]} -ne 2 || "${changed[0]}" != "${expected[0]}" || "${changed[1]}" != "${expected[1]}" ]]; then
            echo 'Packaging branch contains non-packaging changes.' >&2
            exit 1
          fi

      - name: Build exact self-contained Markdown packet
        run: python .github/scripts/build_ecc_v10_external_rereview_packet.py

      - name: Show packet metadata
        run: cat packet-metadata.txt

      - name: Upload packet artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecc-derived-v10-external-rereview-packet
          path: |
            ECC_Derived_V10_External_Engineering_Rereview_Packet.md
            packet-metadata.txt
          if-no-files-found: error
          retention-days: 30
