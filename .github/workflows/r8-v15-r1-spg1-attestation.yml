name: R8 v15-r1 SPG-1 Stage A Attestation

on:
  push:
    branches:
      - attestation/r8-v15-r1-spg1-github-actions-v1
    paths:
      - governance-r8/R8-V15-R1-SPG-STAGE-A-EXECUTION-MARKER.json

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: r8-v15-r1-spg1-stage-a
  cancel-in-progress: false

env:
  CANDIDATE_COMMIT: 8c71169f9d6eb474ec89e950e452eb2130860ede
  SEMANTIC_CANDIDATE_COMMIT: c721b38cf8b00294797300b526596ce723a47ff8
  EXPECTED_GENERATOR_SHA256: 388fb8a61f31cbf99b001a2313d554c8a4aac36e61188eb95230b93c6b0077e6
  EXPECTED_POLICY_SHA256: 7a6579ba1d3c61bcd746e0ae3a1441ebfc363548ee363b49bfade0eb6b5fa44c
  EXPECTED_HELPER_SHA256: 6833f9b5609fbc33c2457504261448a82a684768fb7c6a4305b8510d432020eb
  PYTHON_IMAGE_REF: python:3.13.7-slim-bookworm
  POLICY_REL: governance-r8/R8-V15-R1-SPG-GITHUB-ACTIONS-ATTESTATION-POLICY.json
  WORKFLOW_REL: .github/workflows/r8-v15-r1-spg1-attestation.yml
  HELPER_REL: tools/build_r8_v15_r1_spg1_qualification_evidence.py

jobs:
  stage-a-qualification-evidence:
    name: Produce signed SPG-1 qualification evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout attestation control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen schema candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Fail closed on control or generator drift
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = "vij7661/setugo-ai-development-framework"
          test "${{ github.repository_id }}" = "1354031068"
          test "${{ github.ref }}" = "refs/heads/attestation/r8-v15-r1-spg1-github-actions-v1"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(sha256sum "candidate/tools/generate_r8_v15_r1_spm.py" | awk '{print $1}')" = "$EXPECTED_GENERATOR_SHA256"
          test "$(sha256sum "control/$POLICY_REL" | awk '{print $1}')" = "$EXPECTED_POLICY_SHA256"
          test "$(sha256sum "control/$HELPER_REL" | awk '{print $1}')" = "$EXPECTED_HELPER_SHA256"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("candidate/schemas/governance-r8/v15-r1/schema-provenance-generator-binding.json")
          b = json.loads(p.read_text(encoding="utf-8"))
          assert b["qualification_status"] == "UNATTESTED_RUNTIME"
          assert b["revocation_state"] == "UNKNOWN"
          assert b["runtime_manifest"]["runtime_manifest_digest"] is None
          assert b["workload_attestation_policy_digest"] is None
          assert b["workload_attestation_proof_digest"] is None
          assert b["signing_credential_id"] is None
          PY

      - name: Resolve immutable Python container and build Stage-A evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker pull "$PYTHON_IMAGE_REF"
          REPO_DIGEST="$(docker image inspect "$PYTHON_IMAGE_REF" --format '{{index .RepoDigests 0}}')"
          IMAGE_ID="$(docker image inspect "$PYTHON_IMAGE_REF" --format '{{.Id}}')"
          test -n "$REPO_DIGEST"
          test -n "$IMAGE_ID"
          case "$REPO_DIGEST" in
            python@sha256:*) ;;
            *) echo "Unexpected RepoDigest: $REPO_DIGEST" >&2; exit 1 ;;
          esac
          docker run --rm             -v "$PWD/control:/control:ro"             -v "$PWD/candidate:/candidate:ro"             -v "$PWD/evidence:/evidence"             "$REPO_DIGEST"             python "/control/$HELPER_REL"               --candidate-root /candidate               --control-root /control               --output-dir /evidence               --candidate-commit "$CANDIDATE_COMMIT"               --control-commit "${{ github.sha }}"               --policy-rel "$POLICY_REL"               --workflow-rel "$WORKFLOW_REL"               --container-reference "$PYTHON_IMAGE_REF"               --container-repo-digest "$REPO_DIGEST"               --container-image-id "$IMAGE_ID"               --runner-os "${{ runner.os }}"               --runner-arch "${{ runner.arch }}"               --runner-image-os "${ImageOS:-UNKNOWN}"               --runner-image-version "${ImageVersion:-UNKNOWN}"               --repository "${{ github.repository }}"               --repository-id "${{ github.repository_id }}"               --run-id "${{ github.run_id }}"               --run-attempt "${{ github.run_attempt }}"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -cf spg1-stage-a-subject.tar -C evidence .
          sha256sum spg1-stage-a-subject.tar > spg1-stage-a-subject.sha256

      - name: Generate GitHub/Sigstore artifact attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: spg1-stage-a-subject.tar

      - name: Record and self-check attestation without granting authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -f "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" stage-a-attestation-bundle.jsonl
          PROOF_SHA256="$(sha256sum stage-a-attestation-bundle.jsonl | awk '{print $1}')"
          SUBJECT_SHA256="$(sha256sum spg1-stage-a-subject.tar | awk '{print $1}')"
          python3 - "$PROOF_SHA256" "$SUBJECT_SHA256" "$ATTESTATION_ID" "$ATTESTATION_URL" <<'PY'
          import json, sys
          proof, subject, att_id, att_url = sys.argv[1:]
          obj = {
              "schema": "r8-v15-r1-spg1-stage-a-attestation-output/v1",
              "status": "SIGNED_EVIDENCE_PENDING_INDEPENDENT_POST_RUN_VERIFICATION",
              "authority_effect": "NONE",
              "subject_sha256": subject,
              "attestation_bundle_sha256": proof,
              "attestation_id": att_id,
              "attestation_url": att_url,
              "qualification_status": "UNATTESTED_RUNTIME",
              "revocation_state": "UNKNOWN",
              "note": "Same-run verification is diagnostic only and cannot close SFV-36."
          }
          print(json.dumps(obj, indent=2))
          PY
          python3 - "$PROOF_SHA256" "$SUBJECT_SHA256" "$ATTESTATION_ID" "$ATTESTATION_URL" <<'PY' > stage-a-attestation-output.json
          import json, sys
          proof, subject, att_id, att_url = sys.argv[1:]
          print(json.dumps({
              "schema": "r8-v15-r1-spg1-stage-a-attestation-output/v1",
              "status": "SIGNED_EVIDENCE_PENDING_INDEPENDENT_POST_RUN_VERIFICATION",
              "authority_effect": "NONE",
              "subject_sha256": subject,
              "attestation_bundle_sha256": proof,
              "attestation_id": att_id,
              "attestation_url": att_url,
              "qualification_status": "UNATTESTED_RUNTIME",
              "revocation_state": "UNKNOWN",
              "note": "Same-run verification is diagnostic only and cannot close SFV-36."
          }, indent=2))
          PY
          gh attestation verify spg1-stage-a-subject.tar             --repo "${{ github.repository }}"             --bundle stage-a-attestation-bundle.jsonl             --format json > stage-a-same-run-verification.json

      - name: Upload Stage-A evidence for independent verification
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-spg1-stage-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            spg1-stage-a-subject.tar
            spg1-stage-a-subject.sha256
            stage-a-attestation-bundle.jsonl
            stage-a-attestation-output.json
            stage-a-same-run-verification.json
            evidence/**
          if-no-files-found: error
          retention-days: 90
