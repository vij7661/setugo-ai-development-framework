name: R8 v15-r1 IG-1 Successor3 Activation Gate

on:
  push:
    branches:
      - governance/r8-v15-r1-integration-gate1-proposal-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-IG1-SUCCESSOR3-ACTIVATION.json

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact proposal, review, evidence, machinery and explicit approval
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess

          EXPECTED_PROPOSAL_ID="R8V15R1-IG1-MECHANICAL-INTEGRATION-SUCCESSOR3"
          EXPECTED_PROPOSAL_COMMIT="c4d00fcd2f52ba77f4ee90a1aa9b6c62c0a7c317"
          EXPECTED_PROPOSAL_BLOB="4f3cab0b33caa19fcb81da3cff53456714de3da3"
          EXPECTED_PROPOSAL_PATH="governance-r8/R8-V15-R1-INTEGRATION-GATE1-SUCCESSOR3-PROPOSAL.json"
          EXPECTED_REVIEW_PATH="governance-r8/R8-V15-R1-INTEGRATION-GATE1-SUCCESSOR3-INDEPENDENT-REVIEW-004.txt"
          GATE_PATH=".github/workflows/r8-v15-r1-ig1-successor3-activation-gate.yml"

          EXPECTED_MACHINERY={
            "tools/r8_v15_r1_ig1_successor3_materialize.py":"eb4231b1bd6f1c1b4e312d263c01665ae87fbd76",
            "governance-runtime/test_r8_v15_r1_ig1_successor3_integration_oracle.py":"6cecb7db86a8268a1bcea988986150a24f7f1b69",
            "tools/r8_v15_r1_ig1_successor3_unittest_child.py":"c3c4c029fcd91afb3ee6c4ae82560c87a4a60075",
            ".github/workflows/r8-v15-r1-ig1-successor3-core.yml":"f61f16adcbd8ce30c3410a7b21c89c094a295946",
          }
          EXPECTED_EVIDENCE={
            "governance-r8/R8-V15-R1-IG1-SUCCESSOR1-EXACT-TREE-ENTRY-ALLOWLIST.json":"15cbe7947d0f6f872fabd00b2fc5b0d01a894e2b",
            "governance-r8/R8-V15-R1-IG1-SUCCESSOR1-FULL-CHANGE-INVENTORY.json":"1a745cf09c9958115664b2b6fa03312c737697d9",
            "governance-r8/R8-V15-R1-IG1-SUCCESSOR1-PREFLIGHT-SUMMARY.json":"c76891e92d5d8ea5391a91d76c0286720ea3dd57",
            "governance-r8/R8-V15-R1-IG1-SUCCESSOR3-INHERITED-BASELINE-TEST-IDENTITY.json":"761f1e2a60e0ab21d2b7b1dc392f0562b28fb9bd",
            "governance-r8/R8-V15-R1-IG1-SUCCESSOR3-PROPOSAL-PREFLIGHT-FAILURE-001.json":"ca96cadabbb6a8fbf463a817279893c2e905f4de",
            "governance-r8/R8-V15-R1-IG1-SUCCESSOR3-PROPOSAL-PREFLIGHT-GREEN-001.json":"143836f6b1ca1da0c3b8a2060aca65fc35640c4a",
          }
          TOP_KEYS={
            "schema","status","proposal_id","exact_proposal_commit","proposal_blob_sha1","proposal_path",
            "independent_review","bound_machinery_blobs","bound_evidence_blobs","explicit_user_approval","authority_effect"
          }
          REVIEW_KEYS={"path","blob_sha1","disposition","critical_findings","high_findings"}
          APPROVAL_KEYS={"approved","approved_proposal_commit","approved_proposal_blob","approved_review_blob","approved_activation_gate_blob"}

          def git_blob(rev):
              return subprocess.check_output(["git","rev-parse",rev],text=True).strip()

          a=json.loads(pathlib.Path("governance-r8/R8-V15-R1-IG1-SUCCESSOR3-ACTIVATION.json").read_text())
          if set(a)!=TOP_KEYS: raise SystemExit("activation top-level key set mismatch")
          if a["schema"]!="r8-v15-r1-ig1-successor3-activation/v1": raise SystemExit("activation schema mismatch")
          if a["status"]!="ACTIVE_EXPLICIT_USER_APPROVAL": raise SystemExit("activation status mismatch")
          if a["proposal_id"]!=EXPECTED_PROPOSAL_ID: raise SystemExit("proposal id mismatch")
          if a["exact_proposal_commit"]!=EXPECTED_PROPOSAL_COMMIT: raise SystemExit("proposal commit mismatch")
          if a["proposal_blob_sha1"]!=EXPECTED_PROPOSAL_BLOB: raise SystemExit("proposal blob mismatch")
          if a["proposal_path"]!=EXPECTED_PROPOSAL_PATH: raise SystemExit("proposal path mismatch")
          if a["authority_effect"]!="STAGE1_MECHANICAL_INTEGRATION_EXECUTION_ONLY_NON_AUTHORITATIVE": raise SystemExit("authority boundary mismatch")
          if a["bound_machinery_blobs"]!=EXPECTED_MACHINERY or set(a["bound_machinery_blobs"])!=set(EXPECTED_MACHINERY):
              raise SystemExit("machinery key/value set mismatch")
          if a["bound_evidence_blobs"]!=EXPECTED_EVIDENCE or set(a["bound_evidence_blobs"])!=set(EXPECTED_EVIDENCE):
              raise SystemExit("evidence key/value set mismatch")

          subprocess.check_call(["git","cat-file","-e",EXPECTED_PROPOSAL_COMMIT+"^{commit}"])
          if git_blob(f"{EXPECTED_PROPOSAL_COMMIT}:{EXPECTED_PROPOSAL_PATH}")!=EXPECTED_PROPOSAL_BLOB:
              raise SystemExit("proposal blob mismatch at frozen commit")
          if git_blob(f"HEAD:{EXPECTED_PROPOSAL_PATH}")!=EXPECTED_PROPOSAL_BLOB:
              raise SystemExit("current proposal bytes differ from frozen proposal")
          for path,blob in {**EXPECTED_MACHINERY,**EXPECTED_EVIDENCE}.items():
              if git_blob(f"HEAD:{path}")!=blob:
                  raise SystemExit(f"bound blob mismatch: {path}")

          ir=a["independent_review"]
          if set(ir)!=REVIEW_KEYS: raise SystemExit("independent_review key set mismatch")
          if ir["path"]!=EXPECTED_REVIEW_PATH: raise SystemExit("review path mismatch")
          if ir["disposition"]!="BOUNDED_PASS" or ir["critical_findings"]!=0 or ir["high_findings"]!=0:
              raise SystemExit("activation review claims are not clean")
          if not re.fullmatch(r"[0-9a-f]{40}",ir["blob_sha1"]): raise SystemExit("review blob syntax invalid")
          if git_blob(f"HEAD:{EXPECTED_REVIEW_PATH}")!=ir["blob_sha1"]:
              raise SystemExit("review artifact blob mismatch")

          review=pathlib.Path(EXPECTED_REVIEW_PATH).read_text()
          if not re.search(r"(?m)^A\. OVERALL_DISPOSITION\s*(?:—|-|:)?\s*BOUNDED_PASS\s*$",review):
              raise SystemExit("review artifact does not state BOUNDED_PASS")
          if EXPECTED_PROPOSAL_ID not in review or EXPECTED_PROPOSAL_COMMIT not in review:
              raise SystemExit("review artifact not bound to exact proposal")
          c=re.search(r"(?ms)^C\. CRITICAL_FINDINGS\s*\n(.*?)(?=^D\.)",review)
          d=re.search(r"(?ms)^D\. HIGH_FINDINGS\s*\n(.*?)(?=^E\.)",review)
          if not c or c.group(1).strip() not in {"None","None."}: raise SystemExit("review Critical section not clean")
          if not d or d.group(1).strip() not in {"None","None."}: raise SystemExit("review High section not clean")
          if not re.search(r"(?mi)IG-1 Successor3 proposal may be explicitly activated by user:\s*YES",review):
              raise SystemExit("review final gate is not YES")
          if not re.search(r"(?mi)Stage2 semantic integration authorized:\s*NO",review):
              raise SystemExit("review does not preserve Stage2 prohibition")

          approval=a["explicit_user_approval"]
          if set(approval)!=APPROVAL_KEYS: raise SystemExit("explicit_user_approval key set mismatch")
          if approval["approved"] is not True: raise SystemExit("explicit user approval flag false")
          if approval["approved_proposal_commit"]!=EXPECTED_PROPOSAL_COMMIT: raise SystemExit("approved proposal commit mismatch")
          if approval["approved_proposal_blob"]!=EXPECTED_PROPOSAL_BLOB: raise SystemExit("approved proposal blob mismatch")
          if approval["approved_review_blob"]!=ir["blob_sha1"]: raise SystemExit("approved review blob mismatch")
          gate_blob=git_blob(f"HEAD:{GATE_PATH}")
          if approval["approved_activation_gate_blob"]!=gate_blob:
              raise SystemExit("approved activation gate blob mismatch")

          print("IG1_SUCCESSOR3_EXACT_ACTIVATION_GATE_PASS")
          PY

  integrate:
    needs: verify
    uses: ./.github/workflows/r8-v15-r1-ig1-successor3-core.yml
    secrets: inherit
