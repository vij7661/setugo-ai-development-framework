name: V24 Normative Control Foundation

on:
  push:
    branches:
      - implementation/v24-i1-normative-control-foundation
    paths:
      - 'governance-runtime/normative_control_catalog.py'
      - 'governance-runtime/test_normative_control_catalog.py'
      - 'governance-runtime/v24_normative_bundle_preflight.py'
      - 'governance-runtime/v24_legacy_inventory_candidate.py'
      - 'governance-runtime/v24_legacy_v7_classifier.py'
      - 'governance-runtime/v24_legacy_continuity_manifest.py'
      - 'governance-runtime/v24-normative-inventory-source.json'
      - 'governance-runtime/NORMATIVE-CONTROL-CATALOG-V24-CONTRACT.md'
      - 'standards/*v24*.md'
      - '.github/workflows/v24-normative-control-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run normative catalog tests
        working-directory: governance-runtime
        run: python -m unittest -v test_normative_control_catalog.py
      - name: Derive conservative V23 standards inventory
        working-directory: governance-runtime
        run: |
          python v24_legacy_inventory_candidate.py \
            --repo-root .. \
            --report /tmp/v24-legacy-inventory.json \
            --expect-pending
      - name: Classify V5-V7 predecessor controls from exact map evidence
        working-directory: governance-runtime
        run: |
          python v24_legacy_v7_classifier.py \
            --repo-root .. \
            --report /tmp/v24-v5-v7-classification.json \
            --expect-bounded-pass
      - name: Build exact inherited-control continuity surface
        working-directory: governance-runtime
        run: |
          python v24_legacy_continuity_manifest.py \
            --repo-root .. \
            --report /tmp/v24-legacy-continuity.json \
            --expect-construction-complete
      - name: Verify real V24 bundle remains fail-closed pending semantic qualification
        working-directory: governance-runtime
        run: |
          python v24_normative_bundle_preflight.py \
            --repo-root .. \
            --source v24-normative-inventory-source.json \
            --report /tmp/v24-normative-preflight.json \
            --expect-incomplete
      - name: Show bounded construction result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output = {}
          legacy = Path('/tmp/v24-legacy-inventory.json')
          if legacy.exists():
              d = json.loads(legacy.read_text())
              output['v23_standards_inventory'] = {
                  'state': d.get('state'),
                  'artifact_count': d.get('artifact_count'),
                  'candidate_clause_count': d.get('candidate_clause_count'),
                  'current_drift_paths': d.get('current_drift_paths'),
                  'source_problem_count': len(d.get('problems', [])),
              }
          tranche = Path('/tmp/v24-v5-v7-classification.json')
          if tranche.exists():
              d = json.loads(tranche.read_text())
              output['v5_v7_explicit_classification'] = {
                  'state': d.get('state'),
                  'classified_count': d.get('classified_count'),
                  'active_mapped_count': d.get('active_mapped_count'),
                  'superseded_count': d.get('superseded_count'),
                  'reference_only_count': d.get('reference_only_count'),
                  'problem_count': len(d.get('problems', [])),
              }
          continuity = Path('/tmp/v24-legacy-continuity.json')
          if continuity.exists():
              d = json.loads(continuity.read_text())
              output['legacy_continuity'] = {
                  'state': d.get('state'),
                  'inherited_artifact_count': d.get('inherited_artifact_count'),
                  'adjacent_separate_standard_count': d.get('adjacent_separate_standard_count'),
                  'inherited_clause_count': d.get('inherited_clause_count'),
                  'active_mapped_count': d.get('active_mapped_count'),
                  'superseded_count': d.get('superseded_count'),
                  'reference_only_count': d.get('reference_only_count'),
                  'pending_semantic_disposition_count': d.get('pending_semantic_disposition_count'),
                  'problem_count': len(d.get('problems', [])),
              }
          current = Path('/tmp/v24-normative-preflight.json')
          if current.exists():
              d = json.loads(current.read_text())
              problems = d.get('problems', [])
              descriptor_pending = [x for x in problems if x.startswith('DESCRIPTOR_SEMANTIC_MAPPING_PENDING:')]
              legacy_semantic = [x for x in problems if x.startswith('LEGACY_SEMANTIC_DISPOSITION_PENDING:')]
              unexpected = [x for x in problems if x not in descriptor_pending and x not in legacy_semantic]
              output['v24_normative_bundle'] = {
                  'state': d.get('state'),
                  'qualified': d.get('qualified'),
                  'current_descriptor_count': d.get('current_descriptor_count'),
                  'inherited_active_descriptor_count': d.get('inherited_active_descriptor_count'),
                  'generated_descriptor_count': d.get('generated_descriptor_count'),
                  'manifest_artifact_count': d.get('manifest_artifact_count'),
                  'legacy_inventory_count': d.get('legacy_inventory_count'),
                  'descriptor_semantic_pending_count': len(descriptor_pending),
                  'legacy_semantic_disposition_pending_count': len(legacy_semantic),
                  'unexpected_problem_count': len(unexpected),
                  'unexpected_problems': unexpected,
              }
          print(json.dumps(output, indent=2))
          PY
