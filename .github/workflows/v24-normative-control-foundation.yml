name: V24 Normative Control Foundation

on:
  push:
    branches:
      - implementation/v24-i1-normative-control-foundation
    paths:
      - 'governance-runtime/normative_control_catalog.py'
      - 'governance-runtime/test_normative_control_catalog.py'
      - 'governance-runtime/NORMATIVE-CONTROL-CATALOG-V24-CONTRACT.md'
      - '.github/workflows/v24-normative-control-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run normative catalog tests
        working-directory: governance-runtime
        run: python -m unittest -v test_normative_control_catalog.py
