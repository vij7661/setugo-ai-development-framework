name: V24 Aggregate Budgets
on:
  push:
    branches: [implementation/v24-i7-aggregate-budgets]
    paths:
      - 'governance-runtime/v24_aggregate_budget.py'
      - 'governance-runtime/test_v24_aggregate_budget.py'
      - '.github/workflows/v24-aggregate-budgets.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: governance-runtime
        run: python -m unittest -v test_v24_aggregate_budget.py
