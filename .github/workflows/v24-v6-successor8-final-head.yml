name: V24 V6 Successor-8 Exact Final Head

on:
  push:
    branches:
      - implementation/v24-i11-v6-successor8-authenticated-authority
    paths:
      - '.github/workflows/v24-v6-successor8-final-head.yml'
      - 'governance-runtime/native/v24_v6_trusted_authority_service.c'
      - 'governance-runtime/build_v24_v6_trusted_authority_service.sh'
      - 'governance-runtime/v24_v6_trusted_service_client.py'
      - 'governance-runtime/v24_v6_successor8_record_probe.py'
      - 'governance-runtime/test_v24_v6_successor8_authenticated_authority.py'
      - 'governance-runtime/test_v24_v6_successor8_candidate_local_red.py'
      - 'governance-runtime/test_v24_v6_successor7_trusted_service.py'
      - 'implementation/v24/V24-I11-V6-SUCCESSOR-8-AUTHENTICATED-AUTHORITY-CHANNEL-REPAIR-DESIGN.md'
      - 'implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-final-head:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Capture exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Assert host construction dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v gcc
          command -v jq
          command -v openssl
          command -v sudo
          command -v git
          command -v unshare
          test -x /usr/bin/python3

      - name: Create fixed candidate identity
        shell: bash
        run: |
          set -euo pipefail
          if ! id v24candidate >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin v24candidate
          fi
          test "$(id -u v24candidate)" != "0"
          if sudo -u v24candidate -- sudo -n true 2>/dev/null; then
            echo "candidate identity unexpectedly has sudo"
            exit 1
          fi

      - name: Fetch exact Successor-8 external bootstrap authority
        shell: bash
        run: |
          set -euo pipefail
          TRUST_COMMIT='bd1000404d6e7c7f2f0e130a49c2747e7b2d83ac'
          TRUST_TREE='0a1c277976fdc6c51eb5465d2f7c945e7de090eb'
          MANIFEST_BLOB='8fe0ad1c96d1f1c2ce855846dfe342c79d947483'
          BOOTSTRAP_BLOB='7412614144e160d6a493d6e39e5a2cf3805375a1'

          git fetch --no-tags --depth=1 origin "$TRUST_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$TRUST_COMMIT"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$TRUST_TREE"
          test "$(git ls-tree FETCH_HEAD trust/v24-v6-successor8-trusted-authority-bootstrap-v4.json | awk '{print $3}')" = "$MANIFEST_BLOB"
          test "$(git ls-tree FETCH_HEAD trust/install-v24-v6-successor8-trusted-authority-v4.sh | awk '{print $3}')" = "$BOOTSTRAP_BLOB"

          mkdir -p "$RUNNER_TEMP/v24-s8-trust"
          git show "$TRUST_COMMIT:trust/v24-v6-successor8-trusted-authority-bootstrap-v4.json" > "$RUNNER_TEMP/v24-s8-trust/manifest.json"
          git show "$TRUST_COMMIT:trust/install-v24-v6-successor8-trusted-authority-v4.sh" > "$RUNNER_TEMP/v24-s8-trust/bootstrap.sh"
          chmod 0555 "$RUNNER_TEMP/v24-s8-trust/bootstrap.sh"
          test "$(git hash-object "$RUNNER_TEMP/v24-s8-trust/manifest.json")" = "$MANIFEST_BLOB"

      - name: Reject candidate-selected trusted root
        shell: bash
        run: |
          set -euo pipefail
          if sudo env V24_V6_TRUSTED_ROOT=/tmp/candidate-selected-root               bash "$RUNNER_TEMP/v24-s8-trust/bootstrap.sh"               "$GITHUB_WORKSPACE/governance-runtime"               "$RUNNER_TEMP/v24-s8-trust/manifest.json"; then
            echo "external bootstrap accepted candidate-selected trusted root"
            exit 1
          fi
          test ! -e /tmp/candidate-selected-root

      - name: Reject coherent candidate source and self-manifest substitution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v24-s8-coherent-substitution
          cp -a governance-runtime /tmp/v24-s8-coherent-substitution
          printf '\n/* coherent candidate substitution */\n' >> /tmp/v24-s8-coherent-substitution/native/v24_v6_trusted_authority_service.c
          bash /tmp/v24-s8-coherent-substitution/build_v24_v6_external_authority_gate.sh
          bash /tmp/v24-s8-coherent-substitution/build_v24_v6_trusted_authority_service.sh
          if sudo bash "$RUNNER_TEMP/v24-s8-trust/bootstrap.sh"               /tmp/v24-s8-coherent-substitution               "$RUNNER_TEMP/v24-s8-trust/manifest.json"; then
            echo "external bootstrap accepted coherent Successor-8 substitution"
            exit 1
          fi
          sudo rm -rf /tmp/v24-s8-coherent-substitution

      - name: Install only externally pinned Successor-8 trusted runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo bash "$RUNNER_TEMP/v24-s8-trust/bootstrap.sh"             "$GITHUB_WORKSPACE/governance-runtime"             "$RUNNER_TEMP/v24-s8-trust/manifest.json"

          test "$(sha256sum /opt/v24-v6-trusted-runtime/.gate-build/v24_v6_external_authority_gate | awk '{print $1}')" = '7c69d78f5bf0f0d09dfe0ec92b738f86f7b6c18de3895cef23662ecb91e30069'
          test "$(sha256sum /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service | awk '{print $1}')" = '77a6f8c68a16fc4277c087d68a4338664106f232cf538459707e22af8b3c1124'
          test "$(jq -r '.build_input_sha256' /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service_build.json)" = 'a30bc2742d0eb730b4340e852879884a15e71f8422742c4501eac4beb041e746'
          test "$(jq -r '.service_version' /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service_build.json)" = '2'

      - name: Start trusted service outside candidate process domain
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /run/v24-v6-authority
          sudo env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8             /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service --serve             >/tmp/v24-v6-successor8-service.log 2>&1 &
          for i in $(seq 1 50); do
            test -S /run/v24-v6-authority/service.sock && break
            sleep 0.1
          done
          test -S /run/v24-v6-authority/service.sock
          test "$(stat -c '%u' /run/v24-v6-authority/service.sock)" = "0"
          test "$(sudo stat -c '%a' /run/v24-v6-authority/private)" = "700"
          test "$(sudo stat -c '%a' /run/v24-v6-authority/private/records)" = "700"
          test "$(sudo stat -c '%a' /run/v24-v6-authority/private/consumed)" = "700"

      - name: Enforce frozen host namespace prohibition
        shell: bash
        run: |
          set -euo pipefail
          if sudo -u v24candidate -- unshare --user --map-root-user --mount /bin/true 2>/dev/null; then
            echo 'candidate_user_mount_namespace=AVAILABLE' | tee /tmp/s8-namespace-policy.txt
            echo 'Successor-8 construction requires unprivileged user/mount namespace creation to be blocked.'
            exit 1
          fi
          echo 'candidate_user_mount_namespace=BLOCKED_LOAD_BEARING' | tee /tmp/s8-namespace-policy.txt

      - name: Compile full Successor-8 candidate test surface
        working-directory: governance-runtime
        run: |
          python -m py_compile             v24_v6_trusted_service_client.py             v24_v6_successor8_record_probe.py             test_v24_v6_successor8_candidate_local_red.py             test_v24_v6_successor8_authenticated_authority.py             test_v24_v6_successor7_trusted_service.py             test_v24_v6_successor6_trusted_control_domain.py             test_v24_v6_successor5_external_authority_gate.py             test_v24_v6_successor4_root_attestation.py             test_v24_v6_successor4_external_anchor_red.py

      - name: Stage root-owned read-only candidate test surface
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /tmp/v24candidate-successor8
          sudo cp -a governance-runtime /tmp/v24candidate-successor8
          sudo chown -R root:root /tmp/v24candidate-successor8
          sudo find /tmp/v24candidate-successor8 -type d -exec chmod 0555 {} +
          sudo find /tmp/v24candidate-successor8 -type f -exec chmod 0444 {} +

      - name: Run Successor-8 and inherited authority regressions as candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v24candidate-successor8
          sudo -u v24candidate -- env             V24_V6_TRUSTED_GATE_PATH=/opt/v24-v6-trusted-runtime/.gate-build/v24_v6_external_authority_gate             PYTHONDONTWRITEBYTECODE=1             PYTHONPATH=/tmp/v24candidate-successor8             /usr/bin/python3 -m unittest -v               test_v24_v6_successor8_candidate_local_red.py               test_v24_v6_successor8_authenticated_authority.py               test_v24_v6_successor7_trusted_service.py               test_v24_v6_successor6_trusted_control_domain.py               test_v24_v6_successor5_external_authority_gate.py               test_v24_v6_successor4_root_attestation.py               test_v24_v6_successor4_external_anchor_red.py

      - name: Produce genuine candidate diagnostic records
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v24candidate-successor8
          for mode in positive da1 ncp1; do
            sudo -u v24candidate -- env               PYTHONDONTWRITEBYTECODE=1               PYTHONPATH=/tmp/v24candidate-successor8               /usr/bin/python3 v24_v6_successor8_record_probe.py "$mode"               > "/tmp/s8-$mode.json"
          done
          test "$(jq -r '.decision' /tmp/s8-positive.json)" = "ALLOW"
          test "$(jq -r '.decision' /tmp/s8-da1.json)" = "DENY"
          test "$(jq -r '.decision' /tmp/s8-ncp1.json)" = "DENY"

      - name: Enforce one-shot root-only authority records
        shell: bash
        run: |
          set -euo pipefail
          RID="$(jq -r '.trusted_record_id' /tmp/s8-positive.json)"
          REQ="$(jq -r '.request_sha256' /tmp/s8-positive.json)"
          sudo /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service             --consume-record "$RID" "$REQ" > /tmp/s8-positive-consumed.json
          test "$(jq -r '.construction_authoritative' /tmp/s8-positive-consumed.json)" = "true"
          test "$(jq -r '.decision' /tmp/s8-positive-consumed.json)" = "ALLOW"
          test "$(jq -r '.service_build_input_sha256' /tmp/s8-positive-consumed.json)" = 'a30bc2742d0eb730b4340e852879884a15e71f8422742c4501eac4beb041e746'

          if sudo /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service               --consume-record "$RID" "$REQ" > /tmp/s8-positive-replay.json; then
            echo "authority record replay unexpectedly succeeded"
            exit 1
          fi
          test "$(jq -r '.reason' /tmp/s8-positive-replay.json)" = "AUTHORITY_RECORD_UNAVAILABLE_OR_REPLAYED"

      - name: Reject authority-record request rebind
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v24candidate-successor8
          sudo -u v24candidate -- env             PYTHONDONTWRITEBYTECODE=1             PYTHONPATH=/tmp/v24candidate-successor8             /usr/bin/python3 v24_v6_successor8_record_probe.py positive > /tmp/s8-rebind.json
          RID="$(jq -r '.trusted_record_id' /tmp/s8-rebind.json)"
          REQ="$(jq -r '.request_sha256' /tmp/s8-rebind.json)"
          if sudo /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service               --consume-record "$RID" "$(printf 'f%.0s' {1..64})" > /tmp/s8-rebind-denied.json; then
            echo "request-rebound authority record unexpectedly succeeded"
            exit 1
          fi
          test "$(jq -r '.reason' /tmp/s8-rebind-denied.json)" = "AUTHORITY_RECORD_BINDING_INVALID"
          sudo /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service             --consume-record "$RID" "$REQ" > /tmp/s8-rebind-correct.json

      - name: Preserve authoritative DA-1 and NCP-1 denial
        shell: bash
        run: |
          set -euo pipefail
          for mode in da1 ncp1; do
            RID="$(jq -r '.trusted_record_id' /tmp/s8-$mode.json)"
            REQ="$(jq -r '.request_sha256' /tmp/s8-$mode.json)"
            if sudo /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service                 --consume-record "$RID" "$REQ" > "/tmp/s8-$mode-consumed.json"; then
              echo "$mode authoritative denial unexpectedly returned success"
              exit 1
            fi
            test "$(jq -r '.construction_authoritative' /tmp/s8-$mode-consumed.json)" = "true"
            test "$(jq -r '.decision' /tmp/s8-$mode-consumed.json)" = "DENY"
          done

      - name: Prove fabricated client record cannot become authority
        shell: bash
        run: |
          set -euo pipefail
          if sudo /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service               --consume-record "$(printf 'a%.0s' {1..64})" "$(printf 'b%.0s' {1..64})"               > /tmp/s8-fabricated-record.json; then
            echo "fabricated authority record unexpectedly consumed"
            exit 1
          fi
          test "$(jq -r '.construction_authoritative' /tmp/s8-fabricated-record.json)" = "false"

      - name: Prove unauthorized peer remains rejected
        working-directory: governance-runtime
        run: |
          python - <<'PY'
          import json
          import socket

          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          try:
              sock.connect("/run/v24-v6-authority/service.sock")
              size = bytearray()
              while True:
                  b = sock.recv(1)
                  if not b:
                      raise AssertionError("service closed before unauthorized-peer denial")
                  if b == b"\n":
                      break
                  size.extend(b)
              n = int(size.decode("ascii"))
              body = bytearray()
              while len(body) < n:
                  chunk = sock.recv(n - len(body))
                  if not chunk:
                      raise AssertionError("truncated unauthorized-peer denial")
                  body.extend(chunk)
          finally:
              sock.close()

          r = json.loads(body)
          assert r["decision"] == "DENY", r
          assert r["reason"] == "PEER_IDENTITY_REJECTED", r
          assert r["service_authoritative"] is False, r
          assert r["construction_authoritative"] is False, r
          PY

      - name: Run complete V24-V6 R1-R9 regressions
        working-directory: governance-runtime
        run: |
          python -m unittest -v             test_v24_v6_governance_foundation.py             test_v24_v6_proof_reference_closure.py             test_v24_v6_proof_resolution_red.py             test_v24_v6_endpoint_projection.py             test_v24_v6_material_surface.py             test_v24_v6_decision_apply.py             test_v24_v6_normative_clause_projection.py             test_v24_v6_effect_ledger_closure.py             test_v24_v6_atomic_binding_modes.py             test_v24_v6_qualification_integrity.py             test_v24_v6_integrated_successor.py             test_v24_v6_integrated_successor_dependency_red.py

      - name: Run inherited V24 regressions
        working-directory: governance-runtime
        run: |
          python -m unittest -v             test_normative_control_catalog.py             test_v24_authority_universe.py             test_v24_effective_control.py             test_v24_completeness_bootstrap.py             test_v24_endpoint_proof_compiler.py             test_v24_admission_application_witness.py             test_v24_aggregate_budget.py             test_v24_generation_migration.py             test_v24_review_proof_audit.py

      - name: Assert preserved Successor-8 RED and predecessor review
        shell: bash
        run: |
          set -euo pipefail
          grep -n '35342416032' implementation/v24/V24-I11-V6-SUCCESSOR-8-AUTHENTICATED-AUTHORITY-CHANNEL-REPAIR-DESIGN.md
          grep -n '3cb3a9efb82f58bca9fb7734b285e2e2d8a2bde1' implementation/v24/V24-I11-V6-SUCCESSOR-8-AUTHENTICATED-AUTHORITY-CHANNEL-REPAIR-DESIGN.md

      - name: Generate exact Successor-8 verification report
        working-directory: governance-runtime
        env:
          CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
          CANDIDATE_TREE: ${{ env.CANDIDATE_TREE }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import v24_v6_integrated_successor as r9
          import v24_v6_root_attestation as root

          repo = Path('..').resolve()
          manifest = json.loads(
              (repo / 'implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json').read_text(encoding='utf-8')
          )
          result = r9.validate_integrated_successor_manifest(repo_root=repo, manifest=manifest)
          trusted = Path('/opt/v24-v6-trusted-runtime')
          gate_build = json.loads(
              (trusted / '.gate-build/v24_v6_external_authority_gate_build.json').read_text(encoding='utf-8')
          )
          service_build = json.loads(
              (trusted / 'v24_v6_trusted_authority_service_build.json').read_text(encoding='utf-8')
          )

          assert result['integration_valid'], result['problems']
          assert result['qualified'] is False
          assert result['bound_file_count'] == 16 + len(r9.EXPECTED_SHARED_PRODUCTION_DEPENDENCIES)
          assert result['bound_file_count'] == 28
          assert result['authority_effect'] == 'NONE_EVIDENCE_ONLY'
          assert result['scientific_execution_state'] == r9.SCIENTIFIC_EXECUTION_CLOSED
          assert manifest['candidate_family_id'] == 'V24-I11-V6-INTEGRATED-SUCCESSOR-8'

          s8 = manifest['successor8_authenticated_authority_channel']
          assert s8['preserved_red_run_id'] == '35342416032'
          assert s8['predecessor_successor7_review_commit'] == '3cb3a9efb82f58bca9fb7734b285e2e2d8a2bde1'
          assert s8['construction_state'] == 'READY_FOR_EXACT_FINAL_HEAD'
          assert s8['runtime_qualification_state'] == 'NOT_CLAIMED'
          assert s8['authority_effect'] == 'NONE_EVIDENCE_ONLY'
          assert s8['namespace_policy'] == 'BLOCKED_LOAD_BEARING'
          assert s8['namespace_falsification_run_id'] == '35345014849'
          assert s8['namespace_falsification_result'] == 'UNPRIVILEGED_USER_NAMESPACE_BLOCKED'
          assert s8['harness_failure_run_id'] == '35345236566'
          assert s8['harness_failure_classification'] == 'TEST_HARNESS_EXPECTATION_DEFECT'
          assert s8['all_up_run_id'] == '35345347709'
          assert s8['total_all_up_test_count'] == 337
          assert gate_build['build_input_sha256'] == s8['gate_build_input_sha256']
          assert gate_build['binary_sha256'] == s8['gate_binary_sha256']
          assert service_build['build_input_sha256'] == s8['service_build_input_sha256']
          assert service_build['binary_sha256'] == s8['service_binary_sha256']
          assert service_build['service_version'] == '2'

          trust = manifest['successor4_root_attestation']
          assert trust['trust_commit_sha'] == root.TRUST_COMMIT_SHA
          assert trust['public_artifact_source_blob_sha'] == root.TRUST_PUBLIC_ARTIFACT_BLOB_SHA
          assert trust['signature_bundle_source_blob_sha'] == root.TRUST_SIGNATURE_BUNDLE_BLOB_SHA
          assert trust['signing_ceremony_source_blob_sha'] == root.TRUST_CEREMONY_BLOB_SHA

          required = {
              'CANDIDATE_LOCAL_SOCKET_PEER_FORGERY_REJECTED',
              'CANDIDATE_REQUEST_SERVICE_REPLACEMENT_NONAUTHORITATIVE',
              'NAMESPACE_LOCAL_FAKE_SERVICE_NONAUTHORITATIVE',
              'AUTHORITY_RECORD_REQUEST_BINDING_ENFORCED',
              'AUTHORITY_RECORD_REPLAY_REJECTED',
              'AUTHORITY_RECORD_SERVICE_BUILD_BINDING_ENFORCED',
              'AUTHORITY_RECORD_GATE_RESULT_BINDING_ENFORCED',
              'TRUSTED_AUTHORITY_RECORD_POSITIVE',
              'UNPRIVILEGED_USER_NAMESPACE_PROHIBITION_ENFORCED',
              'DA1_FRESH_EFFECT_PATH_SELF_GRANT_REJECTED',
              'NCP1_FRESH_CLAUSE_CONTROL_SELF_GRANT_REJECTED',
          }
          assert required.issubset(set(manifest['mandatory_v6_adversarial_checks']))

          report = {
              'schema_version': 8,
              'candidate_family_id': manifest['candidate_family_id'],
              'candidate_commit': os.environ['CANDIDATE_COMMIT'],
              'candidate_tree': os.environ['CANDIDATE_TREE'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID_VALUE'],
              'integration_binding_digest': result['binding_digest'],
              'bound_file_count': result['bound_file_count'],
              'bound_files': result['bound_files'],
              'predecessor_successor7_review_disposition': 'CHANGES_REQUIRED',
              'predecessor_successor7_review_commit': s8['predecessor_successor7_review_commit'],
              'preserved_successor8_red_run_id': s8['preserved_red_run_id'],
              'successor8_all_up_run_id': s8['all_up_run_id'],
              'successor8_evidence_artifact_id': s8['evidence_artifact_id'],
              'successor8_evidence_artifact_digest': s8['evidence_artifact_digest'],
              'service_id': s8['service_id'],
              'service_version': s8['service_version'],
              'authority_record_schema': s8['authority_record_schema'],
              'consumption_mode': s8['consumption_mode'],
              'trusted_root': s8['trusted_root'],
              'trusted_socket_path': s8['trusted_socket_path'],
              'candidate_os_identity': s8['candidate_os_identity'],
              'bootstrap_trust_commit': s8['trust_commit_sha'],
              'bootstrap_trust_tree': s8['trust_tree_sha'],
              'bootstrap_manifest_blob_sha': s8['bootstrap_manifest_blob_sha'],
              'bootstrap_script_blob_sha': s8['bootstrap_script_blob_sha'],
              'gate_build_input_sha256': gate_build['build_input_sha256'],
              'gate_binary_sha256': gate_build['binary_sha256'],
              'service_build_input_sha256': service_build['build_input_sha256'],
              'service_binary_sha256': service_build['binary_sha256'],
              'namespace_policy': s8['namespace_policy'],
              'namespace_falsification_run_id': s8['namespace_falsification_run_id'],
              'namespace_falsification_result': s8['namespace_falsification_result'],
              'root_attestation_trust_commit': root.TRUST_COMMIT_SHA,
              'scientific_execution_state': result['scientific_execution_state'],
              'runtime_qualification_state': 'NOT_CLAIMED',
              'successor_review_state': 'REQUIRED_MANUAL_INDEPENDENT_REVIEW',
              'authority_effect': result['authority_effect'],
          }
          out = repo / 'v24-v6-successor8-verification.json'
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text())
          PY

      - name: Record Successor-8 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p successor8-authority-evidence
          cp /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service_build.json successor8-authority-evidence/
          cp /opt/v24-v6-trusted-runtime/.gate-build/v24_v6_external_authority_gate_build.json successor8-authority-evidence/
          cp /opt/v24-v6-trusted-runtime/bootstrap/v24-v6-successor8-trusted-authority-bootstrap-v4.json successor8-authority-evidence/
