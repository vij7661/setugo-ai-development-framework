name: EXP-L Prompt Benchmark

on:
  push:
    branches: [experiment/exp-l-independent-review-evidence-prompt]
    paths: [.github/exp-l-prompt-benchmark-trigger.json]

permissions:
  contents: read

jobs:
  prompt-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout frozen experiment head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify trigger and frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json,subprocess
          from pathlib import Path
          t=json.loads(Path('.github/exp-l-prompt-benchmark-trigger.json').read_text())
          if t.get('enabled') is not True: raise SystemExit('trigger disabled')
          if t.get('benchmark_id')!='EXP-L-PROMPT-BENCHMARK-V1': raise SystemExit('benchmark mismatch')
          if t.get('provider')!='gemini': raise SystemExit('provider mismatch')
          model=t.get('model')
          if not isinstance(model,str) or not model.startswith('gemini-'): raise SystemExit('model required')
          for key,path in [('benchmark_blob_sha','governance-runtime/exp-l/benchmark-v1.json'),('ground_truth_blob_sha','governance-runtime/exp-l/ground-truth-v1.json'),('runner_blob_sha','governance-runtime/exp-l/run_prompt_benchmark.py')]:
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got!=t.get(key): raise SystemExit(f'{key} mismatch: {got}')
          print('EXP_L_MODEL='+model)
          PY
      - name: Validate benchmark runner construction
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile governance-runtime/exp-l/run_prompt_benchmark.py
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('governance-runtime/exp-l/benchmark-v1.json').read_text())
          g=json.loads(Path('governance-runtime/exp-l/ground-truth-v1.json').read_text())
          ids=[x['case_id'] for x in b['cases']]
          assert len(ids)==6 and len(set(ids))==6
          assert set(ids)==set(g['cases'])
          assert sum(1 for x in g['cases'].values() if x['pass_is_promotable'])==1
          assert sum(1 for x in g['cases'].values() if not x['pass_is_promotable'])==5
          PY
      - name: Execute P1 P2 P3 on identical frozen cases
        shell: bash
        run: |
          set -o pipefail
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY required'; exit 2; }
          mkdir -p exp-l-results
          python governance-runtime/exp-l/run_prompt_benchmark.py \
            --model "$EXP_L_MODEL" \
            --output-dir exp-l-results \
            2> >(tee exp-l-results/provider-error.log >&2)
      - name: Record execution envelope
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('exp-l-results'); out.mkdir(exist_ok=True)
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def blob(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          env={
            'schema_version':1,
            'experiment':'EXP-L',
            'benchmark_id':'EXP-L-PROMPT-BENCHMARK-V1',
            'head_sha':os.environ.get('GITHUB_SHA'),
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'provider':'gemini',
            'model':os.environ.get('EXP_L_MODEL'),
            'temperature':0.0,
            'benchmark_blob_sha':blob('governance-runtime/exp-l/benchmark-v1.json'),
            'ground_truth_blob_sha':blob('governance-runtime/exp-l/ground-truth-v1.json'),
            'runner_blob_sha':blob('governance-runtime/exp-l/run_prompt_benchmark.py'),
            'benchmark_sha256':sha('governance-runtime/exp-l/benchmark-v1.json'),
            'ground_truth_sha256':sha('governance-runtime/exp-l/ground-truth-v1.json'),
            'runner_sha256':sha('governance-runtime/exp-l/run_prompt_benchmark.py'),
            'authority_effect':'NONE_EXPERIMENTAL_EVIDENCE_ONLY'
          }
          (out/'execution-envelope.json').write_text(json.dumps(env,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload EXP-L results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-l-prompt-benchmark-v1
          path: exp-l-results/
          if-no-files-found: error
          retention-days: 30
