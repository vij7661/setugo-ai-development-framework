name: V24 V6 RQ1 Remediation 5 Run 34 Evidence Recovery

on:
  push:
    branches:
      - evidence/v24-i11-v6-rq1-remediation5-run34-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-raw-evidence:
    runs-on: [self-hosted, v24-rq1]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read-only recover run 35432866726 evidence
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/var/lib/v24-rq1/runs/20260919T084559Z-8923d3076714674677bb51221e27aead73bf2bc2
          STAGE="$RUNNER_TEMP/rq1-remediation5-run35432866726-recovery"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/raw-evidence"
          sudo test -d "$SOURCE"
          {
            echo "original_workflow_run=35432866726"
            echo "original_head_sha=8923d3076714674677bb51221e27aead73bf2bc2"
            echo "scientific_candidate_sha=0757ea18bd281b727e25d1fb4f73abc7ced42778"
            echo "original_evidence_directory=$SOURCE"
            echo "recovery_operation=READ_ONLY_EVIDENCE_RECOVERY"
            echo "authority_effect=NONE_EVIDENCE_ONLY"
            echo "source_stat="
            sudo stat -c '%n %F %U:%G %a %u:%g %i %D %s %y %z' "$SOURCE"
            echo "source_listing="
            sudo find "$SOURCE" -printf '%M %u:%g %s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' | sort
            echo "source_file_hashes="
            sudo bash -c "find '$SOURCE' -type f -print0 | sort -z | xargs -0 sha256sum"
          } > "$STAGE/recovery-manifest.txt"
          sudo cp -a "$SOURCE"/. "$STAGE/raw-evidence/"
          sudo chown -R "$USER":"$USER" "$STAGE"
          test -f "$STAGE/raw-evidence/RQ1-remediation2-targeted-bundle.json"
          test -f "$STAGE/raw-evidence/run-summary.json"
          test -f "$STAGE/raw-evidence/exit-code.txt"
          find "$STAGE" -type f -print0 | sort -z | xargs -0 sha256sum > "$STAGE/recovery-file-hashes.sha256"
          sha256sum "$STAGE/recovery-manifest.txt" > "$STAGE/recovery-manifest.sha256"
          tar -cf "$STAGE/recovery-bundle.tar" -C "$STAGE" raw-evidence recovery-manifest.txt recovery-file-hashes.sha256 recovery-manifest.sha256
          sha256sum "$STAGE/recovery-bundle.tar" > "$STAGE/recovery-bundle.tar.sha256"
          mkdir -p run34-recovery-artifact
          cp -a "$STAGE"/. run34-recovery-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: rq1-remediation5-run35432866726-raw-evidence-recovery
          path: run34-recovery-artifact
          if-no-files-found: error
          retention-days: 30
