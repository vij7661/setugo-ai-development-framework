name: R8 v15-r1 Stage2 SG-1 Review 004 List Marker Remediation Packet
on:
  push:
    branches:
      - governance/r8-v15-r1-stage2-sg1-parser-remediation2-2026-09-26
    paths:
      - governance-r8/R8-V15-R1-STAGE2-SG1-REVIEW004-PACKET-MARKER.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repaired parser against preserved Review 002 and Review 003
        run: |
          python3 tools/validate_r8_v15_r1_stage2_sg1_activation_gate_parser.py --review governance-r8/R8-V15-R1-STAGE2-SG1-INDEPENDENT-EARLY-REVIEW-003.txt\n\n          python3 tools/preflight_r8_v15_r1_stage2_sg1_review.py \
            --review governance-r8/R8-V15-R1-STAGE2-SG1-INDEPENDENT-EARLY-REVIEW-003.txt \
            --expected-sha256 a6fa7935264092d489eb7dac84706bc0e2dcb460c1fc46d54a3d49945ac246e2 \
            --expected-blob 378ffe70e131b6c63e95f4142596ae091ba37ebe

      - name: Build focused Review 004 remediation packet
        run: python3 tools/build_r8_v15_r1_stage2_sg1_review004_list_marker_remediation_packet.py

      - name: Verify exact Review 004 remediation bundle
        run: python3 tools/verify_r8_v15_r1_stage2_sg1_review004_remediation_bundle.py

      - name: Upload one-file Review 004 packet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-stage2-sg1-review004-list-marker-remediation
          path: stage2-sg1-review/R8-V15-R1-STAGE2-SG1-REVIEW-004-LIST-MARKER-REMEDIATION-PACKET.txt
          if-no-files-found: error
          retention-days: 30
