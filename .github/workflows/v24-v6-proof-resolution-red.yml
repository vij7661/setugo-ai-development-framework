name: V24 V6 Proof Resolution Repair

on:
  push:
    branches:
      - remediation/v24-i11-v6-proof-resolution
    paths:
      - 'governance-runtime/test_v24_v6_proof_resolution_red.py'
      - 'governance-runtime/test_v24_v6_proof_reference_closure.py'
      - 'governance-runtime/test_v24_v6_integrated_successor_dependency_red.py'
      - 'governance-runtime/test_v24_v6_integrated_successor.py'
      - 'governance-runtime/test_v24_v6_endpoint_projection.py'
      - 'governance-runtime/test_v24_v6_material_surface.py'
      - 'governance-runtime/test_v24_v6_decision_apply.py'
      - 'governance-runtime/test_v24_v6_normative_clause_projection.py'
      - 'governance-runtime/test_v24_v6_effect_ledger_closure.py'
      - 'governance-runtime/test_v24_v6_atomic_binding_modes.py'
      - 'governance-runtime/test_v24_v6_qualification_integrity.py'
      - 'governance-runtime/v24_v6_test_proof_context.py'
      - 'governance-runtime/v24_v6_proof_reference_closure.py'
      - 'governance-runtime/v24_v6_governance_foundation.py'
      - 'governance-runtime/v24_v6_endpoint_projection.py'
      - 'governance-runtime/v24_v6_material_surface.py'
      - 'governance-runtime/v24_v6_decision_apply.py'
      - 'governance-runtime/v24_v6_normative_clause_projection.py'
      - 'governance-runtime/v24_v6_effect_ledger_closure.py'
      - 'governance-runtime/v24_v6_atomic_binding_modes.py'
      - 'governance-runtime/v24_v6_qualification_integrity.py'
      - 'governance-runtime/v24_v6_integrated_successor.py'
      - 'governance-runtime/v24_endpoint_proof_compiler.py'
      - 'governance-runtime/normative_control_catalog.py'
      - 'implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json'
      - 'implementation/v24/V24-I11-V6-R*-CONSTRUCTION-EVIDENCE.md'
      - '.github/workflows/v24-v6-proof-resolution-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-reference-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Compile exact V6 surface and repair layer
        working-directory: governance-runtime
        run: |
          python -m py_compile \
            v24_v6_governance_foundation.py \
            v24_v6_proof_reference_closure.py \
            v24_v6_test_proof_context.py \
            v24_v6_endpoint_projection.py \
            v24_v6_material_surface.py \
            v24_v6_decision_apply.py \
            v24_v6_normative_clause_projection.py \
            v24_v6_effect_ledger_closure.py \
            v24_v6_atomic_binding_modes.py \
            v24_v6_qualification_integrity.py \
            v24_v6_integrated_successor.py
      - name: Verify shared proof-reference closure contract
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_proof_reference_closure.py
      - name: Verify R2 endpoint/predicate migration
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_endpoint_projection.py
      - name: Verify R3 material-surface migration
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_material_surface.py
      - name: Verify R4 decision/apply migration
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_decision_apply.py
      - name: Verify R5 normative projection migration
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_normative_clause_projection.py
      - name: Verify R6 effect/ledger closure migration
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_effect_ledger_closure.py
      - name: Verify R7 atomic-binding migration
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_atomic_binding_modes.py
      - name: Verify R8 qualification-integrity migration
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_qualification_integrity.py
      - name: Verify historical opaque-proof REDs are permanently closed
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_proof_resolution_red.py
      - name: Verify R9 shared-dependency freeze regression
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_integrated_successor_dependency_red.py
      - name: Verify R9 integrated successor preflight
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_integrated_successor.py
