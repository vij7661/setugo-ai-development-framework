name: R8 v15-r1 Implementation Slice 1

on:
  push:
    branches:
      - implementation/r8-v15-r1-slice1-frozen-schema-runtime-2026-09-24
      - implementation/r8-v15-r1-slice1-successor-1-2026-09-25
      - implementation/r8-v15-r1-slice1-successor-2-2026-09-25
    paths:
      - governance-runtime/r8_v15_r1_frozen_schema_runtime.py
      - governance-runtime/test_r8_v15_r1_implementation_slice1.py
      - governance-runtime/test_r8_v15_r1_implementation_slice1_successor1.py
      - governance-runtime/test_r8_v15_r1_implementation_slice1_successor2.py
      - governance-runtime/test_r8_v15_r1_post_freeze_regression.py
      - governance-runtime/test_r8_v15_r1_sfv45_r2_repair.py
      - governance-r8/R8-V15-R1-IMPLEMENTATION-SLICE1-PREREGISTRATION.md
      - governance-r8/R8-V15-R1-IMPLEMENTATION-SLICE1-SUCCESSOR1-PREREGISTRATION.md
      - governance-r8/R8-V15-R1-IMPLEMENTATION-SLICE1-SUCCESSOR2-PREREGISTRATION.md
      - governance-r8/R8-V15-R1-IMPLEMENTATION-SLICE1-MARKER.json
      - .github/workflows/r8-v15-r1-implementation-slice1.yml

permissions:
  contents: read

concurrency:
  group: r8-v15-r1-implementation-slice1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run frozen Slice 1 acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v governance-runtime/test_r8_v15_r1_implementation_slice1.py

      - name: Run Slice 1 Successor 1 frozen repair harness
        if: github.ref == 'refs/heads/implementation/r8-v15-r1-slice1-successor-1-2026-09-25' || github.ref == 'refs/heads/implementation/r8-v15-r1-slice1-successor-2-2026-09-25'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v governance-runtime/test_r8_v15_r1_implementation_slice1_successor1.py

      - name: Run Slice 1 Successor 2 frozen repair harness
        if: github.ref == 'refs/heads/implementation/r8-v15-r1-slice1-successor-2-2026-09-25'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v governance-runtime/test_r8_v15_r1_implementation_slice1_successor2.py

      - name: Run applicable post-freeze R8 regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            governance-runtime/test_r8_v15_r1_sfv45_r2_repair.py \
            governance-runtime/test_r8_v15_r1_post_freeze_regression.py
