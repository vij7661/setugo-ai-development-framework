name: Review Safe Evidence V16 Slice 2 Independence V6

on:
  push:
    branches: [implementation/review-safe-evidence-v16-iar5-repair]
    paths:
      - 'governance-runtime/review_safe_evidence_v16_trust.py'
      - 'governance-runtime/review_safe_evidence_v16_independence.py'
      - 'governance-runtime/review_safe_evidence_v16_independence_v2.py'
      - 'governance-runtime/review_safe_evidence_v16_manifest_validation.py'
      - 'governance-runtime/test_review_safe_evidence_v16_trust.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_v2.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_iar2.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_iar3.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_iar4.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_iar5.py'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-v2.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar1.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar1-v2.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar2.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar2-v2.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar3.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar4.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar5.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-current-manifests.json'
      - 'governance-runtime/requirements-review-safe-evidence-v16.txt'
      - 'implementation/review-safe-evidence/V16-SLICE-2-INTERNAL-ADVERSARIAL-REVIEW-005.md'
      - 'implementation/review-safe-evidence/V16-SLICE-2-IAR5-REPAIR-CONTRACT.md'
      - '.github/workflows/review-safe-evidence-v16-slice2-independence-v6.yml'

permissions: {contents: read}
concurrency:
  group: review-safe-evidence-v16-slice2-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independence-iar5-repair-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}

      - name: Record candidate and verify exact governed blobs before execution
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"

          check_blob() {
            local path="$1" expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "PRE_TEST_BLOB_MISMATCH path=$path expected=$expected actual=$actual" >&2
              exit 1
            }
          }

          check_blob governance-runtime/review_safe_evidence_v16_trust.py 7030d6643e76743cf086f7749292442bdadc3262
          check_blob governance-runtime/review_safe_evidence_v16_independence.py 268095665ff8b414c532bb9289437ca72782e8db
          check_blob governance-runtime/review_safe_evidence_v16_independence_v2.py b76a4a6ecdcb4c001107e9ce22d6addbf8b39dfa
          check_blob governance-runtime/review_safe_evidence_v16_manifest_validation.py d6899fd9dff439b853e4301ccb028711354fc937
          check_blob governance-runtime/requirements-review-safe-evidence-v16.txt c011dd5d074245a5d49692b0d7044fd80d8a855f

          check_blob governance-runtime/test_review_safe_evidence_v16_trust.py 41cdb6a6caccd1a24797f0859f50ece557c83ea0
          check_blob governance-runtime/test_review_safe_evidence_v16_independence.py 8ed790401280862796ea1f79eadb17f18cfe7ff8
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_v2.py f5f130543641d7675fe4eba9f52dca969d52d74e
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_iar2.py d62eb7cde62805ace95b1dff6d27a08cdf295213
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_iar3.py 7537c9517366bbff30c430306975da3b4caf6b96
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_iar4.py dcbfde5e548d500cbececed331956965cc10d5ff
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_iar5.py 99c560edbba1c1ac8518862e432df8032680cc16

          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest.json 27983a245408589ec39681aa69da3a003294ddd8
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-v2.json 38feefe3437b8c4460f4b89d0268eaf415af6b7f
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar1.json a63d613298ba2514a3d11fb86fd2a67dc70c756b
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar1-v2.json 7f10991935ae47bb826787223269152140513db9
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar2.json d72f7c72b46c680e8d4f94b1d03bbb4e0765dc5c
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar2-v2.json fb8c6d0685e5f66dd1bf5c2788cb36d2f966c2d9
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar3.json 76b6f42e31a8d0750f9983718bcc19f19070345c
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar4.json beda2c0ca7c8cf54ecccbfe5b765bd3c2e3ef336
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar5.json 4382204e713cc27051704c1bb56d984c9b79b9dd
          check_blob governance-runtime/review-safe-evidence-v16-slice2-current-manifests.json cc8786f086e3452e634376a1eab4a05af7b11cfb

          check_blob implementation/review-safe-evidence/V16-SLICE-2-INTERNAL-ADVERSARIAL-REVIEW-005.md 1dc5892874a6255cfbcc629b38150c38a783ad6d
          check_blob implementation/review-safe-evidence/V16-SLICE-2-IAR5-REPAIR-CONTRACT.md 9170a0d92aac6e696fa5bb7ea6482df90c86b9ae

          echo "V16_SLICE1_FROZEN_COMMIT=36f22a35ff57b6994d55c705c08686609276ddb3"
          echo "V16_SLICE2_PRE_TEST_GOVERNED_BLOBS=EXACT_MATCH"
          echo "IMPLEMENTATION_QUALIFICATION=NOT_CLAIMED"
          echo "RUNTIME_QUALIFICATION=NOT_CLAIMED"
          echo "AUTHORITY_EFFECT=NONE_EVIDENCE_ONLY"

      - name: Install pinned crypto dependency
        run: |
          python -m pip install --disable-pip-version-check -r governance-runtime/requirements-review-safe-evidence-v16.txt
          python - <<'PY'
          import cryptography
          assert cryptography.__version__ == "46.0.4", cryptography.__version__
          print("V16_SLICE2_CRYPTOGRAPHY_VERSION=" + cryptography.__version__)
          PY

      - name: Syntax-compile Slice 2 sources without repository bytecode writes
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/v16-s2-pycache"
          python -m compileall -q \
            governance-runtime/review_safe_evidence_v16_trust.py \
            governance-runtime/review_safe_evidence_v16_independence.py \
            governance-runtime/review_safe_evidence_v16_independence_v2.py \
            governance-runtime/review_safe_evidence_v16_manifest_validation.py \
            governance-runtime/test_review_safe_evidence_v16_trust.py \
            governance-runtime/test_review_safe_evidence_v16_independence.py \
            governance-runtime/test_review_safe_evidence_v16_independence_v2.py \
            governance-runtime/test_review_safe_evidence_v16_independence_iar2.py \
            governance-runtime/test_review_safe_evidence_v16_independence_iar3.py \
            governance-runtime/test_review_safe_evidence_v16_independence_iar4.py \
            governance-runtime/test_review_safe_evidence_v16_independence_iar5.py

      - name: Prove clean checkout and build root-owned read-only execution snapshot
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          id nobody
          test -z "$(find governance-runtime implementation/review-safe-evidence -xdev -perm -0002 -print -quit)"
          sudo -u nobody -H test ! -w governance-runtime
          sudo -u nobody -H test ! -w governance-runtime/review_safe_evidence_v16_manifest_validation.py
          if sudo -u nobody -H sh -c 'touch governance-runtime/.v16-s2-iar5-write-probe 2>/dev/null'; then
            rm -f governance-runtime/.v16-s2-iar5-write-probe
            echo "NONWRITER_ISOLATION_FAILED: nobody could create a repository file" >&2
            exit 1
          fi
          test ! -e governance-runtime/.v16-s2-iar5-write-probe

          SNAPSHOT_ROOT=/tmp/v16-s2-iar5-readonly
          sudo rm -rf "$SNAPSHOT_ROOT"
          sudo install -d -o root -g root -m 0755 "$SNAPSHOT_ROOT"
          sudo cp -a governance-runtime "$SNAPSHOT_ROOT/governance-runtime"
          sudo chown -R root:root "$SNAPSHOT_ROOT/governance-runtime"
          sudo chmod -R u+rwX,go+rX,go-w "$SNAPSHOT_ROOT/governance-runtime"
          diff -qr governance-runtime "$SNAPSHOT_ROOT/governance-runtime"
          sudo -u nobody -H test -r "$SNAPSHOT_ROOT/governance-runtime/test_review_safe_evidence_v16_independence.py"
          sudo -u nobody -H test ! -w "$SNAPSHOT_ROOT/governance-runtime"
          if sudo -u nobody -H sh -c "touch '$SNAPSHOT_ROOT/governance-runtime/.v16-s2-snapshot-write-probe' 2>/dev/null"; then
            sudo rm -f "$SNAPSHOT_ROOT/governance-runtime/.v16-s2-snapshot-write-probe"
            echo "SNAPSHOT_ISOLATION_FAILED: nobody could mutate the execution snapshot" >&2
            exit 1
          fi
          test ! -e "$SNAPSHOT_ROOT/governance-runtime/.v16-s2-snapshot-write-probe"

          echo "V16_SLICE2_EXECUTION_SNAPSHOT=$SNAPSHOT_ROOT/governance-runtime" >> "$GITHUB_ENV"
          echo "V16_SLICE2_TEST_EXECUTION_PRINCIPAL_PRECHECK=NON_REPOSITORY_WRITER"
          echo "V16_SLICE2_EXECUTION_SNAPSHOT=ROOT_OWNED_NONWRITABLE_TO_TEST_PRINCIPAL"
          echo "V16_SLICE2_PRE_TEST_WORKTREE_CLEAN=PASS"

      - name: Run 77 mandatory adversarial tests as non-repository writer
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/v16-slice2-v6-unittest.log"
          cd "$V16_SLICE2_EXECUTION_SNAPSHOT"
          sudo -u nobody -H env \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$V16_SLICE2_EXECUTION_SNAPSHOT" \
            "$pythonLocation/bin/python" -m unittest -v \
              test_review_safe_evidence_v16_independence.py \
              test_review_safe_evidence_v16_independence_v2.py \
              test_review_safe_evidence_v16_independence_iar2.py \
              test_review_safe_evidence_v16_independence_iar3.py \
              test_review_safe_evidence_v16_independence_iar4.py \
              test_review_safe_evidence_v16_independence_iar5.py \
              2>&1 | tee "$LOG"
          echo "V16_SLICE2_TEST_LOG=$LOG" >> "$GITHUB_ENV"

      - name: Re-attest execution snapshot checkout and exact governed blobs after execution
        shell: bash
        run: |
          set -euo pipefail
          diff -qr governance-runtime "$V16_SLICE2_EXECUTION_SNAPSHOT"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          check_blob() {
            local path="$1" expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "POST_TEST_BLOB_MISMATCH path=$path expected=$expected actual=$actual" >&2
              exit 1
            }
          }

          check_blob governance-runtime/review_safe_evidence_v16_trust.py 7030d6643e76743cf086f7749292442bdadc3262
          check_blob governance-runtime/review_safe_evidence_v16_independence.py 268095665ff8b414c532bb9289437ca72782e8db
          check_blob governance-runtime/review_safe_evidence_v16_independence_v2.py b76a4a6ecdcb4c001107e9ce22d6addbf8b39dfa
          check_blob governance-runtime/review_safe_evidence_v16_manifest_validation.py d6899fd9dff439b853e4301ccb028711354fc937
          check_blob governance-runtime/requirements-review-safe-evidence-v16.txt c011dd5d074245a5d49692b0d7044fd80d8a855f

          check_blob governance-runtime/test_review_safe_evidence_v16_trust.py 41cdb6a6caccd1a24797f0859f50ece557c83ea0
          check_blob governance-runtime/test_review_safe_evidence_v16_independence.py 8ed790401280862796ea1f79eadb17f18cfe7ff8
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_v2.py f5f130543641d7675fe4eba9f52dca969d52d74e
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_iar2.py d62eb7cde62805ace95b1dff6d27a08cdf295213
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_iar3.py 7537c9517366bbff30c430306975da3b4caf6b96
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_iar4.py dcbfde5e548d500cbececed331956965cc10d5ff
          check_blob governance-runtime/test_review_safe_evidence_v16_independence_iar5.py 99c560edbba1c1ac8518862e432df8032680cc16

          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest.json 27983a245408589ec39681aa69da3a003294ddd8
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-v2.json 38feefe3437b8c4460f4b89d0268eaf415af6b7f
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar1.json a63d613298ba2514a3d11fb86fd2a67dc70c756b
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar1-v2.json 7f10991935ae47bb826787223269152140513db9
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar2.json d72f7c72b46c680e8d4f94b1d03bbb4e0765dc5c
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar2-v2.json fb8c6d0685e5f66dd1bf5c2788cb36d2f966c2d9
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar3.json 76b6f42e31a8d0750f9983718bcc19f19070345c
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar4.json beda2c0ca7c8cf54ecccbfe5b765bd3c2e3ef336
          check_blob governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar5.json 4382204e713cc27051704c1bb56d984c9b79b9dd
          check_blob governance-runtime/review-safe-evidence-v16-slice2-current-manifests.json cc8786f086e3452e634376a1eab4a05af7b11cfb

          check_blob implementation/review-safe-evidence/V16-SLICE-2-INTERNAL-ADVERSARIAL-REVIEW-005.md 1dc5892874a6255cfbcc629b38150c38a783ad6d
          check_blob implementation/review-safe-evidence/V16-SLICE-2-IAR5-REPAIR-CONTRACT.md 9170a0d92aac6e696fa5bb7ea6482df90c86b9ae

          echo "V16_SLICE2_POST_TEST_EXECUTION_SNAPSHOT=EXACT_MATCH"
          echo "V16_SLICE2_POST_TEST_WORKTREE_CLEAN=PASS"
          echo "V16_SLICE2_POST_TEST_GOVERNED_BLOBS=EXACT_MATCH"

      - name: Verify strict manifests against source and raw execution log
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=governance-runtime python - <<'PY'
          import ast, os, pathlib, re
          import review_safe_evidence_v16_manifest_validation as mv

          root = pathlib.Path("governance-runtime")
          validation = mv.validate_current_manifest_set(root)
          assert validation["valid"], validation["problems"]
          assert validation["test_count"] == 77
          assert validation["authority_effect"] == "NONE_EVIDENCE_ONLY"

          source_paths = [
              root / "test_review_safe_evidence_v16_independence.py",
              root / "test_review_safe_evidence_v16_independence_v2.py",
              root / "test_review_safe_evidence_v16_independence_iar2.py",
              root / "test_review_safe_evidence_v16_independence_iar3.py",
              root / "test_review_safe_evidence_v16_independence_iar4.py",
              root / "test_review_safe_evidence_v16_independence_iar5.py",
          ]
          manifest_paths = [
              root / "review-safe-evidence-v16-slice2-test-manifest-v2.json",
              root / "review-safe-evidence-v16-slice2-test-manifest-iar1-v2.json",
              root / "review-safe-evidence-v16-slice2-test-manifest-iar2-v2.json",
              root / "review-safe-evidence-v16-slice2-test-manifest-iar3.json",
              root / "review-safe-evidence-v16-slice2-test-manifest-iar4.json",
              root / "review-safe-evidence-v16-slice2-test-manifest-iar5.json",
          ]

          discovered = []
          for source in source_paths:
              tree = ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
              module = source.stem
              for node in tree.body:
                  if isinstance(node, ast.ClassDef):
                      for child in node.body:
                          if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)) and child.name.startswith("test_"):
                              discovered.append(f"{module}.{node.name}.{child.name}")

          declared = []
          requirement_ids = []
          for path in manifest_paths:
              manifest = mv.load_strict_json(path)
              for row in manifest["tests"]:
                  declared.append(row["python_test_id"])
                  requirement_ids.append(row["requirement_test_id"])

          log = pathlib.Path(os.environ["V16_SLICE2_TEST_LOG"]).read_text(encoding="utf-8", errors="strict")
          executed = re.findall(
              r"^test_[A-Za-z0-9_]+ \((test_review_safe_evidence_v16_independence(?:_v2|_iar2|_iar3|_iar4|_iar5)?\.[A-Za-z0-9_]+\.[A-Za-z0-9_]+)\) \.\.\. ok$",
              log,
              flags=re.MULTILINE,
          )

          assert len(declared) == 77, len(declared)
          assert len(discovered) == 77, len(discovered)
          assert len(executed) == 77, len(executed)
          assert len(requirement_ids) == len(set(requirement_ids))
          assert len(declared) == len(set(declared))
          assert set(declared) == set(discovered), sorted(set(declared) ^ set(discovered))
          assert set(declared) == set(executed), sorted(set(declared) ^ set(executed))
          assert "skipped=" not in log
          assert "FAILED" not in log
          assert "\nOK\n" in log

          print("V16_SLICE2_MANDATORY_TESTS_VERIFIED=77")
          print("V16_SLICE2_STRICT_MANIFEST_VALIDATION=PASS")
          print("V16_SLICE2_IAR1_IAR2_SOURCE_BINDING=REVISIONED_AND_PREDECESSOR_BLOB_BOUND")
          print("V16_SLICE2_SOURCE_MANIFEST_EXECUTION_SET_EQUALITY=PASS")
          print("V16_SLICE2_COMPOSITE_MANIFEST=30_PLUS_15_PLUS_8_PLUS_8_PLUS_8_PLUS_8")
          PY

      - name: Construction boundary
        run: |
          echo "V16_SLICE2_IAR5_REPAIRS=CONSTRUCTION_PASS_NONAUTHORITATIVE"
          echo "V16_SLICE2_TEST_EXECUTION_PRINCIPAL=NON_REPOSITORY_WRITER"
          echo "V16_SLICE2_EXECUTION_SNAPSHOT=ROOT_OWNED_EXACT_READABLE_COPY_NONWRITABLE_TO_TEST_PRINCIPAL"
          echo "V16_SLICE2_PRE_POST_TEST_WORKTREE_ATTESTATION=PASS"
          echo "V16_SLICE2_POST_TEST_BLOB_REVERIFICATION=PASS"
          echo "V16_SLICE2_IAR1_IAR2_SOURCE_BINDING=REVISIONED_AND_PREDECESSOR_BLOB_BOUND"
          echo "V16_SLICE2_GLOBAL_PROMOTION_BLOCKING=ENFORCED_WHILE_REAL_WORLD_COMPLETENESS_UNPROVEN"
          echo "V16_SLICE2_VALIDATOR_ARTIFACT_MEASUREMENT_INDEPENDENTLY_PROVEN=false"
          echo "V16_SLICE2_GENERATION_CURRENTNESS=LOCAL_EQUALITY_CONTRACT_NOT_FINAL_AUTHENTICATED_GENERATION_MECHANISM"
          echo "V16_SLICE2_GRAPH_COMPLETENESS_REAL_WORLD_PROVEN=false"
          echo "V16_SLICE2_TRUST_HEAD_PROVISIONING=OUT_OF_BAND_NOT_PROVEN"
          echo "INTERNAL_ADVERSARIAL_REVIEW_EXHAUSTED=false"
          echo "IMPLEMENTATION_QUALIFICATION=NOT_CLAIMED"
          echo "RUNTIME_QUALIFICATION=NOT_CLAIMED"
          echo "SCIENTIFIC_AUTHORITY=NOT_CLAIMED"
          echo "AUTHORITY_EFFECT=NONE_EVIDENCE_ONLY"
