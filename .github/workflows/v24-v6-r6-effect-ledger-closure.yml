name: V24 V6 R6 Effect Ledger Closure

on:
  push:
    branches:
      - implementation/v24-i11-v6-r6-effect-ledger-closure
    paths:
      - 'governance-runtime/v24_v6_governance_foundation.py'
      - 'governance-runtime/v24_v6_endpoint_projection.py'
      - 'governance-runtime/v24_v6_material_surface.py'
      - 'governance-runtime/v24_v6_decision_apply.py'
      - 'governance-runtime/v24_v6_normative_clause_projection.py'
      - 'governance-runtime/v24_v6_effect_ledger_closure.py'
      - 'governance-runtime/test_v24_v6_effect_ledger_closure.py'
      - '.github/workflows/v24-v6-r6-effect-ledger-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construction-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Compile V6 R1-R6
        working-directory: governance-runtime
        run: python -m py_compile v24_v6_governance_foundation.py v24_v6_endpoint_projection.py v24_v6_material_surface.py v24_v6_decision_apply.py v24_v6_normative_clause_projection.py v24_v6_effect_ledger_closure.py

      - name: Run R6 construction tests
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_effect_ledger_closure.py

      - name: Run R1-R5 regression
        working-directory: governance-runtime
        run: |
          python -m unittest -v \
            test_v24_v6_governance_foundation.py \
            test_v24_v6_endpoint_projection.py \
            test_v24_v6_material_surface.py \
            test_v24_v6_decision_apply.py \
            test_v24_v6_normative_clause_projection.py

      - name: Run inherited material and ledger regressions
        working-directory: governance-runtime
        run: |
          python -m unittest -v \
            test_v24_authority_universe.py \
            test_v24_admission_application_witness.py

      - name: Anti-case-specific and anti-caller-authority gate
        shell: bash
        run: |
          for F in governance-runtime/v24_v6_governance_foundation.py governance-runtime/v24_v6_endpoint_projection.py governance-runtime/v24_v6_material_surface.py governance-runtime/v24_v6_decision_apply.py governance-runtime/v24_v6_normative_clause_projection.py governance-runtime/v24_v6_effect_ledger_closure.py; do
            if grep -nE 'WDPC-[0-9]+|fixture[_ -]?branch|expected[_ -]?endpoint|reviewer[_ -]?finding[_ -]?id|material_discovery_pending' "$F"; then
              echo "Case-specific or caller-authority coupling found in $F"
              exit 1
            fi
          done
          if grep -nE 'PROCESS_MEMORY.*qualified|UNANCHORED_LOCAL.*qualified|caller[_ -]?effect[_ -]?class' governance-runtime/v24_v6_effect_ledger_closure.py; then
            echo 'Forbidden local-head or caller effect-class authority pattern found.'
            exit 1
          fi
          echo 'No case-specific or caller-defined authority coupling found.'

      - name: Assert construction-only authority posture
        working-directory: governance-runtime
        run: |
          python - <<'PY'
          import v24_v6_effect_ledger_closure as r6
          x=r6.construction_frontier()
          assert x['qualified'] is False
          assert x['authority_effect']=='NONE_EVIDENCE_ONLY'
          print(x)
          PY
