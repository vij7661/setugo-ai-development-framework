# Retry 1: comment-only trigger after prolonged queued zero-job state. Scientific semantics and Python 3.12.7 binding unchanged.
name: V24 I11 Scientific Reference Sweep C-H

on:
  push:
    branches:
      - testing/v24-i11-scientific-reference-sweep-c-h-v1
    paths:
      - 'testing/v24/execute_v24_i11_reference_sweep_c_h.py'
      - '.github/workflows/v24-i11-scientific-reference-sweep-c-h.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  PYTHONHASHSEED: '0'

jobs:
  scientific-reference-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Verify exact pre-science ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor e9a02e722edcd5e16b82abeeb37f7ab68c9295bf "$GITHUB_SHA"
          test "$(git rev-parse e9a02e722edcd5e16b82abeeb37f7ab68c9295bf^{tree})" = "f9de48189b7d304f50f169277dc1b4dceb642546"
      - name: Execute reference sweep C-H
        run: python testing/v24/execute_v24_i11_reference_sweep_c_h.py
      - name: Show exact scientific result
        run: cat testing/v24/results/V24-I11-REFERENCE-SWEEP-C-H.json
      - name: Preserve result artifact
        uses: actions/upload-artifact@v4
        with:
          name: v24-i11-reference-sweep-c-h
          path: testing/v24/results/V24-I11-REFERENCE-SWEEP-C-H.json
          if-no-files-found: error
