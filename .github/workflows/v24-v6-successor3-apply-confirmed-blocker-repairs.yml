name: V24 V6 Successor-3 Apply Confirmed Blocker Repairs

on:
  push:
    branches:
      - remediation/v24-i11-v6-successor-3
    paths:
      - 'remediation/v24/successor3/apply_confirmed_blocker_repairs.py'
      - '.github/workflows/v24-v6-successor3-apply-confirmed-blocker-repairs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/v24-i11-v6-successor-3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Apply preregistered exact-source transformation
        shell: bash
        run: |
          set -euo pipefail
          python remediation/v24/successor3/apply_confirmed_blocker_repairs.py
          git diff --check

      - name: Assert production cannot synthesize trusted boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --include='v24_v6_*.py' 'trusted_boundary_for' governance-runtime | grep -v 'v24_v6_test_proof_context.py'; then
            echo 'Production/test source still exposes trusted_boundary_for'
            exit 1
          fi
          grep -n 'TRUSTED_PROOF_BOUNDARY_EXTERNAL_ANCHOR' governance-runtime/v24_v6_proof_reference_closure.py

      - name: Run confirmed blocker and affected regressions
        working-directory: governance-runtime
        run: |
          python -m unittest -v \
            test_v24_v6_successor3_manual_review_red.py \
            test_v24_v6_proof_reference_closure.py \
            test_v24_v6_governance_foundation.py \
            test_v24_v6_decision_apply.py \
            test_v24_v6_normative_clause_projection.py \
            test_v24_v6_proof_resolution_red.py

      - name: Commit repair only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vij7661'
          git config user.email '58181021+vij7661@users.noreply.github.com'
          git add \
            governance-runtime/v24_v6_proof_reference_closure.py \
            governance-runtime/v24_v6_test_proof_context.py \
            governance-runtime/test_v24_v6_proof_reference_closure.py \
            governance-runtime/v24_v6_decision_apply.py \
            governance-runtime/test_v24_v6_decision_apply.py \
            governance-runtime/v24_v6_normative_clause_projection.py \
            governance-runtime/test_v24_v6_normative_clause_projection.py \
            governance-runtime/test_v24_v6_successor3_manual_review_red.py
          git diff --cached --check
          git commit -m 'Repair successor-3 confirmed manual-review blockers'
          git push origin HEAD:remediation/v24-i11-v6-successor-3
