name: Apply ECC V10 Filesystem Primitive Integrity Repair

on:
  push:
    branches:
      - experiments/ecc-derived-parallel-v10-filesystem-primitive-integrity
    paths:
      - '.github/scripts/apply_ecc_v10_filesystem_primitive_integrity_repair.py'
      - '.github/workflows/apply-ecc-v10-filesystem-primitive-integrity-repair.yml'

permissions:
  contents: write

jobs:
  filesystem-primitive-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V10 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record repair input
        run: |
          echo "REPAIR_INPUT_SHA=$(git rev-parse HEAD)"
          git status --short

      - name: Apply deterministic V10 filesystem primitive repair
        run: python .github/scripts/apply_ecc_v10_filesystem_primitive_integrity_repair.py

      - name: Commit exact V10 repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/ecc_derived/ecc_candidate_boundary.py \
            experiments/ecc_derived/ecc_governance_trust_manifest.json
          git diff --cached --exit-code && { echo "No V10 repair diff produced"; exit 1; } || true
          git commit -m "Repair ECC V10 filesystem primitive integrity"
          git push origin HEAD:experiments/ecc-derived-parallel-v10-filesystem-primitive-integrity
