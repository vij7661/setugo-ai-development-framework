name: V24 V6 Successor-4 Exact Final Head

on:
  push:
    branches:
      - implementation/v24-i11-v6-successor4-root-attestation
    paths:
      - '.github/workflows/v24-v6-successor4-final-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-final-head:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/v24-i11-v6-successor4-root-attestation
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Capture exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Verify exact external construction trust artifacts
        shell: bash
        run: |
          set -euo pipefail
          TRUST_COMMIT='2515582a5e2f0e1041bf5cc83523ffa732620724'
          TRUST_TREE='1c2a1d0f60d3e2a62a2355831dc46f76ff72df7e'
          PUBLIC_BLOB='7722a5725324fb805283bce9764b2d151a774ec2'
          SIGNATURE_BLOB='b16e2a2bfac013e6e600cf9944595a88eefd2ca8'
          CEREMONY_BLOB='cc2d8bec17b6775392094920f9549ca2e5174d44'

          git fetch --no-tags --depth=1 origin "$TRUST_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$TRUST_COMMIT"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$TRUST_TREE"

          test "$(git ls-tree FETCH_HEAD trust/v24-v6-construction-root-attestation-v3.json | awk '{print $3}')" = "$PUBLIC_BLOB"
          test "$(git ls-tree FETCH_HEAD trust/v24-v6-construction-context-signatures-v3.json | awk '{print $3}')" = "$SIGNATURE_BLOB"
          test "$(git ls-tree FETCH_HEAD trust/v24-v6-construction-signing-ceremony-v3.json | awk '{print $3}')" = "$CEREMONY_BLOB"

          test "$(git hash-object governance-runtime/fixtures/v24-v6-construction-root-attestation-v3.json)" = "$PUBLIC_BLOB"
          test "$(git hash-object governance-runtime/fixtures/v24-v6-construction-context-signatures-v3.json)" = "$SIGNATURE_BLOB"

      - name: Compile complete Successor-4 production surface
        working-directory: governance-runtime
        run: |
          python -m py_compile \
            v24_v6_governance_foundation.py \
            v24_v6_root_attestation.py \
            v24_v6_proof_reference_closure.py \
            v24_v6_endpoint_projection.py \
            v24_v6_material_surface.py \
            v24_v6_decision_apply.py \
            v24_v6_normative_clause_projection.py \
            v24_v6_effect_ledger_closure.py \
            v24_v6_atomic_binding_modes.py \
            v24_v6_qualification_integrity.py \
            v24_v6_integrated_successor.py \
            v24_endpoint_proof_compiler.py \
            normative_control_catalog.py

      - name: Run complete Successor-4 and R1-R9 regressions
        working-directory: governance-runtime
        run: |
          set -euo pipefail
          python -m unittest discover -v -p 'test_v24_v6_*.py'

      - name: Run inherited V24 construction regressions
        working-directory: governance-runtime
        run: |
          python -m unittest -v \
            test_normative_control_catalog.py \
            test_v24_authority_universe.py \
            test_v24_effective_control.py \
            test_v24_completeness_bootstrap.py \
            test_v24_endpoint_proof_compiler.py \
            test_v24_admission_application_witness.py \
            test_v24_aggregate_budget.py \
            test_v24_generation_migration.py \
            test_v24_review_proof_audit.py

      - name: Assert anti-self-grant and construction-only boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -n --include='v24_v6_*.py' 'v24_v6_test_proof_context' governance-runtime \
            | grep -v 'test_v24_v6_' \
            | grep -v 'v24_v6_test_proof_context.py'; then
            echo 'Production imports test proof context.'
            exit 1
          fi

          if grep -R -n --include='v24_v6_*.py' 'attested_boundary_for_test' governance-runtime \
            | grep -v 'test_v24_v6_' \
            | grep -v 'v24_v6_test_proof_context.py'; then
            echo 'Production imports construction fixture authority.'
            exit 1
          fi

          if grep -R -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' governance-runtime implementation/v24; then
            echo 'Private signing key material found in candidate surface.'
            exit 1
          fi

          grep -n 'validate_root_attestation' governance-runtime/v24_v6_proof_reference_closure.py
          grep -n 'ROOT_ATTESTATION_KEY_ID' governance-runtime/v24_v6_root_attestation.py
          grep -n 'SAME_PROCESS_ANCHOR_REWRITE_REJECTED' implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json
          grep -n 'CONSTRUCTION_ROOT_ATTESTATION_VERIFIER' implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json
          grep -n 'CONSTRUCTION_ROOT_PUBLIC_ARTIFACT' implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json

      - name: Generate exact Successor-4 verification report
        working-directory: governance-runtime
        env:
          CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
          CANDIDATE_TREE: ${{ env.CANDIDATE_TREE }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import v24_v6_integrated_successor as r9
          import v24_v6_root_attestation as root

          repo = Path('..').resolve()
          manifest_path = repo / 'implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          result = r9.validate_integrated_successor_manifest(repo_root=repo, manifest=manifest)

          assert result['integration_valid'], result['problems']
          assert result['qualified'] is False
          assert result['bound_file_count'] == 21
          assert result['authority_effect'] == 'NONE_EVIDENCE_ONLY'
          assert result['scientific_execution_state'] == r9.SCIENTIFIC_EXECUTION_CLOSED
          assert manifest['candidate_family_id'] == 'V24-I11-V6-INTEGRATED-SUCCESSOR-4'

          required = {
              'SAME_PROCESS_ANCHOR_REWRITE_REJECTED',
              'UNSIGNED_CONTEXT_REJECTED',
              'WRONG_CONTEXT_SIGNATURE_REJECTED',
              'CALLER_SELECTED_PUBLIC_KEY_REJECTED',
              'ATTESTATION_SCOPE_SUBSTITUTION_REJECTED',
              'SIGNED_CONTEXT_POSITIVE',
              'DECISION_EFFECT_PATH_TARGET_MISMATCH_REJECTED',
              'CLAUSE_CONTROL_REASSIGNMENT_REJECTED',
          }
          assert required.issubset(set(manifest['mandatory_v6_adversarial_checks']))

          trust = manifest['successor4_root_attestation']
          assert trust['trust_commit_sha'] == root.TRUST_COMMIT_SHA
          assert trust['public_artifact_source_blob_sha'] == root.TRUST_PUBLIC_ARTIFACT_BLOB_SHA
          assert trust['signature_bundle_source_blob_sha'] == root.TRUST_SIGNATURE_BUNDLE_BLOB_SHA
          assert trust['signing_ceremony_source_blob_sha'] == root.TRUST_CEREMONY_BLOB_SHA
          assert trust['runtime_qualification_state'] == 'NOT_CLAIMED'
          assert trust['authority_effect'] == 'NONE_EVIDENCE_ONLY'

          report = {
              'schema_version': 4,
              'candidate_family_id': manifest['candidate_family_id'],
              'candidate_commit': os.environ['CANDIDATE_COMMIT'],
              'candidate_tree': os.environ['CANDIDATE_TREE'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID_VALUE'],
              'integration_binding_digest': result['binding_digest'],
              'bound_file_count': result['bound_file_count'],
              'bound_files': result['bound_files'],
              'approved_design_packet_sha256': manifest['approved_design_packet_sha256'],
              'approved_design_body_sha256': manifest['approved_design_body_sha256'],
              'approved_design_git_blob_sha': manifest['approved_design_git_blob_sha'],
              'successor3_review_disposition': 'CHANGES_REQUIRED',
              'successor3_final_adjudication_commit': '3b16e06e8e2d6dc7d5d1f0864b8dea508edada8f',
              'preserved_successor4_self_grant_red_run_id': '35318618058',
              'successor4_construction_all_up_run_id': '35323905839',
              'trust_branch': root.TRUST_BRANCH,
              'trust_commit_sha': root.TRUST_COMMIT_SHA,
              'trust_public_artifact_blob_sha': root.TRUST_PUBLIC_ARTIFACT_BLOB_SHA,
              'trust_signature_bundle_blob_sha': root.TRUST_SIGNATURE_BUNDLE_BLOB_SHA,
              'trust_ceremony_blob_sha': root.TRUST_CEREMONY_BLOB_SHA,
              'trust_public_key_der_sha256': root.TRUST_PUBLIC_KEY_DER_SHA256,
              'scientific_execution_state': result['scientific_execution_state'],
              'runtime_qualification_state': 'NOT_CLAIMED',
              'successor_review_state': 'REQUIRED_MANUAL_INDEPENDENT_REVIEW',
              'authority_effect': result['authority_effect'],
          }

          out = repo / 'v24-v6-successor4-verification.json'
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v24-v6-successor4-exact-verification
          path: v24-v6-successor4-verification.json
          if-no-files-found: error
