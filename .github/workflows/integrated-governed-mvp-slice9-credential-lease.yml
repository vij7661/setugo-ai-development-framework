name: Integrated Governed MVP Slice9 Credential Lease Gate

on:
  pull_request:
    paths:
      - 'experiments/governed-platform/INTEGRATED_GOVERNED_MVP_SLICE9_CREDENTIAL_LEASE_GATE_CONTRACT.md'
      - 'experiments/governed-platform/governance/integrated_governed_mvp_credential_lease.py'
      - 'experiments/governed-platform/governance/test_integrated_governed_mvp_slice9_credential_lease.py'
      - '.github/workflows/integrated-governed-mvp-slice9-credential-lease.yml'
  workflow_dispatch:

jobs:
  falsify-slice9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen Slice9 S9-01 through S9-25
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice9_credential_lease.py
      - name: Accepted Slice8 regression
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice8_remote_transport.py
      - name: Accepted Slice7 original regression
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice7_terminal_executor.py
      - name: Accepted Slice7 Option B regression
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice7_option_b.py
      - name: Accepted Slice7 structured-failure regression
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice7_adapter_failure_result.py
      - name: Accepted Slice6 regression
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice6_terminal_authority.py
      - name: Accepted Slice1 regression
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp.py
      - name: Accepted Slice2 regression
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice2.py
      - name: Accepted Slice3 regression
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice3.py
      - name: Accepted Slice4 regression
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice4.py
      - name: Accepted Slice1 through Slice5 composition
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_integrated_governed_mvp_slice1_to_slice5.py
      - name: Accepted Slice5 ledger regression
        working-directory: experiments/governed-platform
        run: python -m unittest -v test_slice5_authoritative_state_ledger.py test_slice5_authoritative_state_ledger_v2.py
