name: V24 V6 Runtime Qualification 1 Entry Preflight

on:
  push:
    branches:
      - qualification/v24-i11-v6-runtime-qualification-1
    paths:
      - '.github/workflows/v24-v6-runtime-qualification1-entry-preflight.yml'
      - 'governance-runtime/v24_v6_runtime_qualification_preflight.py'
      - 'governance-runtime/test_v24_v6_runtime_qualification_preflight.py'
      - 'implementation/v24/V24-I11-V6-RUNTIME-QUALIFICATION-1-PLAN.md'
      - 'implementation/v24/V24-I11-V6-RUNTIME-QUALIFICATION-1-SUBJECT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Verify immutable predecessor ancestry and phase branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'qualification/v24-i11-v6-runtime-qualification-1'
          test "$(git merge-base HEAD c6304d0f14914c3b1e9f30a8a42ac231f152fa8f)" = 'c6304d0f14914c3b1e9f30a8a42ac231f152fa8f'
          test "$(git rev-parse c6304d0f14914c3b1e9f30a8a42ac231f152fa8f^{tree})" = 'dc55289eff2294dbc172e41b045ec80b05d61299'
          test -z "$(git status --porcelain)"

      - name: Run permanent entry-preflight regressions
        working-directory: governance-runtime
        run: python -m unittest -v test_v24_v6_runtime_qualification_preflight.py

      - name: Confirm unbound subject fails closed
        shell: bash
        run: |
          set -euo pipefail
          cd governance-runtime
          set +e
          python v24_v6_runtime_qualification_preflight.py > "$RUNNER_TEMP/rq1-unbound-preflight.json"
          status=$?
          set -e
          test "$status" = '2'
          test "$(jq -r '.entry_ready' "$RUNNER_TEMP/rq1-unbound-preflight.json")" = 'false'
          test "$(jq -r '.qualified' "$RUNNER_TEMP/rq1-unbound-preflight.json")" = 'false'
          test "$(jq -r '.current_disposition' "$RUNNER_TEMP/rq1-unbound-preflight.json")" = 'NOT_QUALIFIED'
          test "$(jq -r '.problems | index("RUNTIME_NOT_NOMINATED") != null' "$RUNNER_TEMP/rq1-unbound-preflight.json")" = 'true'
          cat "$RUNNER_TEMP/rq1-unbound-preflight.json"

      - name: Observe ephemeral runner without nominating it
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.runtime_binding.status' implementation/v24/V24-I11-V6-RUNTIME-QUALIFICATION-1-SUBJECT.json)" = 'NOT_NOMINATED'
          test "$(jq -r '.scientific_execution_state' implementation/v24/V24-I11-V6-RUNTIME-QUALIFICATION-1-SUBJECT.json)" = 'CLOSED_PENDING_SUCCESSOR_REVIEW'
          test "$(jq -r '.authority_effect' implementation/v24/V24-I11-V6-RUNTIME-QUALIFICATION-1-SUBJECT.json)" = 'NONE_EVIDENCE_ONLY'
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          os_release = pathlib.Path('/etc/os-release').read_text(encoding='utf-8')
          mount_line = command('findmnt', '-n', '-o', 'SOURCE,FSTYPE,OPTIONS', '/')
          observation = {
              'observation_class': 'EPHEMERAL_CI_NOT_NOMINATED',
              'runner_image': os.environ.get('ImageOS'),
              'runner_image_version': os.environ.get('ImageVersion'),
              'architecture': platform.machine(),
              'kernel_release': platform.release(),
              'os_release_sha256': hashlib.sha256(os_release.encode()).hexdigest(),
              'root_mount_sha256': hashlib.sha256(mount_line.encode()).hexdigest(),
              'commit_sha': os.environ['GITHUB_SHA'],
              'qualified': False,
              'authority_effect': 'NONE_EVIDENCE_ONLY',
          }
          print(json.dumps(observation, sort_keys=True, separators=(',', ':')))
          PY

      - name: Assert no qualification transition
        shell: bash
        run: |
          set -euo pipefail
          S=implementation/v24/V24-I11-V6-RUNTIME-QUALIFICATION-1-SUBJECT.json
          test "$(jq -r '.phase_state' "$S")" = 'IN_PROGRESS_NOT_QUALIFIED'
          test "$(jq -r '.execution_state' "$S")" = 'NOT_STARTED_ENTRY_PENDING'
          test "$(jq -r '.current_disposition' "$S")" = 'NOT_QUALIFIED'
          test "$(jq -r '.entry_criteria.runtime_execution_permitted' "$S")" = 'false'
