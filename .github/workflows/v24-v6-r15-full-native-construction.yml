name: V24 V6 R15 Full Native Construction

on:
  push:
    branches:
      - review/v24-i11-v6-r15-path-normalization
    paths:
      - 'review/v24/r15_native_observer.c'
      - 'review/v24/r15_trusted_external_guard.py'
      - '.github/workflows/v24-v6-r15-full-native-construction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Bind frozen R15 candidate and external authority separation
        shell: bash
        run: |
          set -euo pipefail
          C='2e875bb29be48d39c9be6f3525d4f4610869848c'
          T='d2c9c0c85564808941fdb54cfbbd53f51f5397ee'
          git fetch --no-tags origin "$C"
          test "$(git rev-parse "$C^{tree}")" = "$T"
          for p in \
            review/v24/r15_native_observer.c \
            review/v24/r15_trusted_external_guard.py \
            review/v24/r14_python_home_binding.c \
            review/v24/r14_trusted_external_oracle.py \
            review/v24/r14_trusted_oracle_launcher.py; do
            if git cat-file -e "$C:$p" 2>/dev/null; then echo "R15_EXTERNAL_OBJECT_IN_CANDIDATE:$p"; exit 1; fi
          done
          SUBJECT="$RUNNER_TEMP/r15-candidate"
          rm -rf "$SUBJECT"; mkdir -p "$SUBJECT"
          git archive "$C" | tar -xf - -C "$SUBJECT"
          echo "R15_CANDIDATE=$C" >> "$GITHUB_ENV"
          echo "R15_TREE=$T" >> "$GITHUB_ENV"
          echo "R15_SUBJECT=$SUBJECT" >> "$GITHUB_ENV"
          echo "R15_REVIEW_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R15_NATIVE_SOURCE_BLOB=$(git rev-parse HEAD:review/v24/r15_native_observer.c)" >> "$GITHUB_ENV"
          echo "R15_GUARD_BLOB=$(git rev-parse HEAD:review/v24/r15_trusted_external_guard.py)" >> "$GITHUB_ENV"
          echo "R15_HOME_BINDING_BLOB=$(git rev-parse HEAD:review/v24/r14_python_home_binding.c)" >> "$GITHUB_ENV"
          echo "R15_ORACLE_BLOB=$(git rev-parse HEAD:review/v24/r14_trusted_external_oracle.py)" >> "$GITHUB_ENV"
          echo "R15_LAUNCHER_BLOB=$(git rev-parse HEAD:review/v24/r14_trusted_oracle_launcher.py)" >> "$GITHUB_ENV"
          echo "R15_SCENARIO_BLOB=$(git rev-parse HEAD:review/v24/r13_trusted_external_oracle.py)" >> "$GITHUB_ENV"
          echo 'R15_EXTERNAL_AUTHORITY_SEPARATION=PASS'

      - name: Compile and bind R15 native observer
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/review/v24/r15_native_observer.c"
          HOME_SRC="$GITHUB_WORKSPACE/review/v24/r14_python_home_binding.c"
          BIN="$RUNNER_TEMP/r15-native-observer"
          PREFIX="$(python -c 'import sys; print(sys.prefix)')"
          PROGRAM="$(python -c 'import sys; print(sys.executable)')"
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          PROGRAM_SHA="$(sha256sum "$PROGRAM" | awk '{print $1}')"
          gcc -O2 -fPIE -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
            $(python3-config --includes) \
            -DPyConfig_InitIsolatedConfig=R14_PyConfig_InitIsolatedConfig \
            -c "$SRC" -o "$RUNNER_TEMP/observer.o"
          gcc -O2 -fPIE -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
            $(python3-config --includes) \
            -DR14_PYTHON_HOME='"'"$PREFIX"'"' \
            -DR14_PYTHON_PROGRAM='"'"$PROGRAM"'"' \
            -c "$HOME_SRC" -o "$RUNNER_TEMP/home.o"
          gcc -pie "$RUNNER_TEMP/observer.o" "$RUNNER_TEMP/home.o" -o "$BIN" \
            $(python3-config --embed --ldflags) -lcrypto -Wl,-z,relro,-z,now -Wl,-rpath,"$LIBDIR"
          BINARY_SHA="$(sha256sum "$BIN" | awk '{print $1}')"
          COMPILER_DIGEST="$({ printf 'r15_source=%s\n' "$R15_NATIVE_SOURCE_BLOB"; printf 'home=%s\n' "$R15_HOME_BINDING_BLOB"; printf 'prefix=%s\n' "$PREFIX"; printf 'program=%s\n' "$PROGRAM"; printf 'program_sha=%s\n' "$PROGRAM_SHA"; gcc --version; python3-config --includes; python3-config --embed --ldflags; } | sha256sum | awk '{print $1}')"
          echo "R15_NATIVE_BIN=$BIN" >> "$GITHUB_ENV"
          echo "R15_NATIVE_BINARY_SHA=$BINARY_SHA" >> "$GITHUB_ENV"
          echo "R15_COMPILER_DIGEST=$COMPILER_DIGEST" >> "$GITHUB_ENV"
          echo "R15_PYTHON_HOME=$PREFIX" >> "$GITHUB_ENV"
          echo "R15_PYTHON_PROGRAM=$PROGRAM" >> "$GITHUB_ENV"
          echo "R15_PYTHON_PROGRAM_SHA=$PROGRAM_SHA" >> "$GITHUB_ENV"
          echo "R15_NATIVE_BINARY_SHA256=$BINARY_SHA"

      - name: Build R15 external exact-file pinset and stage sandbox
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"; CLEAN_PATH="$(dirname "$PY"):/usr/bin:/bin"
          GUARD="$GITHUB_WORKSPACE/review/v24/r15_trusted_external_guard.py"
          PIN="$RUNNER_TEMP/V24-I11-V6-R15-EXTERNAL-PINSET.json"
          SANDBOX="$RUNNER_TEMP/r15-sandbox"
          env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S "$GUARD" build-pinset --root "$R15_SUBJECT" --commit "$R15_CANDIDATE" --tree "$R15_TREE" --review-commit "$R15_REVIEW_COMMIT" --output "$PIN"
          env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S "$GUARD" verify-source --root "$R15_SUBJECT" --pinset "$PIN" --commit "$R15_CANDIDATE" --tree "$R15_TREE"
          env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S "$GUARD" stage --root "$R15_SUBJECT" --pinset "$PIN" --commit "$R15_CANDIDATE" --tree "$R15_TREE" --target "$SANDBOX"
          env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S "$GUARD" verify-sandbox --root "$SANDBOX" --pinset "$PIN" --commit "$R15_CANDIDATE" --tree "$R15_TREE"
          echo "R15_PINSET=$PIN" >> "$GITHUB_ENV"
          echo "R15_PINSET_SHA=$(sha256sum "$PIN" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "R15_SANDBOX=$SANDBOX" >> "$GITHUB_ENV"

      - name: Exact-file substitution attacks remain rejected
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"; CLEAN_PATH="$(dirname "$PY"):/usr/bin:/bin"; GUARD="$GITHUB_WORKSPACE/review/v24/r15_trusted_external_guard.py"
          reject() {
            n="$1"; d="$RUNNER_TEMP/r15-pin-$n"; rm -rf "$d"; cp -a "$R15_SANDBOX" "$d"
            case "$n" in
              production-swap) printf 'raise SystemExit(0)\n' > "$d/governance-runtime/v24_v6_governance_foundation.py" ;;
              support-swap) printf '{}\n' > "$d/implementation/v24/V24-I11-V6-R15-EXECUTION-CONTRACT.json" ;;
              unpinned) printf 'evil\n' > "$d/governance-runtime/r15_unpinned.txt" ;;
              symlink) rm "$d/governance-runtime/v24_v6_governance_foundation.py"; ln -s v24_v6_endpoint_projection.py "$d/governance-runtime/v24_v6_governance_foundation.py" ;;
            esac
            if env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S "$GUARD" verify-sandbox --root "$d" --pinset "$R15_PINSET" --commit "$R15_CANDIDATE" --tree "$R15_TREE"; then
              echo "R15_FALSE_GREEN_PIN_ATTACK_ACCEPTED:$n"; exit 1
            fi
            echo "R15_PIN_ATTACK_REJECTED:$n"
          }
          for x in production-swap support-swap unpinned symlink; do reject "$x"; done

      - name: Compute bound interpreter and environment digests
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"; CLEAN_PATH="$(dirname "$PY"):/usr/bin:/bin"
          INTERPRETER_DIGEST="$(env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S - <<'PY'
          import hashlib,json,pathlib,sys
          def c(x): return json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          flags={'isolated':bool(sys.flags.isolated),'no_site':bool(sys.flags.no_site),'ignore_environment':bool(sys.flags.ignore_environment),'safe_path':bool(sys.flags.safe_path)}
          assert all(flags.values()) and sys.flags.optimize==0
          exe=pathlib.Path(sys.executable).resolve()
          r={'flags':flags,'implementation':sys.implementation.name,'cache_tag':sys.implementation.cache_tag,'version':list(sys.version_info),'hexversion':sys.hexversion,'executable_sha256':hashlib.sha256(exe.read_bytes()).hexdigest(),'stdlib_names_digest':hashlib.sha256(c(sorted(sys.stdlib_module_names))).hexdigest()}
          print(hashlib.sha256(c(r)).hexdigest())
          PY
          )"
          ENV_DIGEST="$(python - "$R15_CANDIDATE" "$R15_TREE" "$R15_PINSET_SHA" "$R15_NATIVE_BINARY_SHA" "$R15_COMPILER_DIGEST" "$INTERPRETER_DIGEST" "$R15_NATIVE_SOURCE_BLOB" "$R15_HOME_BINDING_BLOB" "$R15_ORACLE_BLOB" "$R15_LAUNCHER_BLOB" "$R15_SCENARIO_BLOB" "$R15_PYTHON_PROGRAM_SHA" <<'PY'
          import hashlib,json,sys
          print(hashlib.sha256(json.dumps(sys.argv[1:],separators=(',',':')).encode()).hexdigest())
          PY
          )"
          echo "R15_INTERPRETER_DIGEST=$INTERPRETER_DIGEST" >> "$GITHUB_ENV"
          echo "R15_ENV_DIGEST=$ENV_DIGEST" >> "$GITHUB_ENV"

      - name: Normal frozen candidate request succeeds through R15 observer
        shell: bash
        run: |
          set -euo pipefail
          REQ="$RUNNER_TEMP/normal.json"; printf '%s' '{"args":[{"edges":[],"nodes":[]}],"function":"validate_completeness_derivation_graph","kwargs":{},"module":"v24_v6_governance_foundation","schema_version":1}' > "$REQ"
          env -i HOME="$HOME" PATH="/usr/bin:/bin" "$R15_NATIVE_BIN" --sandbox "$R15_SANDBOX" --request "$REQ" > "$RUNNER_TEMP/normal.out" 2> "$RUNNER_TEMP/normal.err"
          test ! -s "$RUNNER_TEMP/normal.err"; grep -q '^R14_NATIVE_OBSERVATION=' "$RUNNER_TEMP/normal.out"

      - name: Historical R13 native-boundary attacks remain rejected
        shell: bash
        run: |
          set -euo pipefail
          REQ="$RUNNER_TEMP/r13-attack.json"; printf '%s' '{"args":[{"edges":[],"nodes":[]}],"function":"validate_completeness_derivation_graph","kwargs":{},"module":"v24_v6_governance_foundation","schema_version":1}' > "$REQ"
          RESULT="$RUNNER_TEMP/V24-I11-V6-R15-R13-REGRESSION.json"
          python - "$R15_SANDBOX" "$R15_NATIVE_BIN" "$REQ" "$RESULT" <<'PY'
          import json,os,pathlib,shutil,subprocess,sys,tempfile
          base=pathlib.Path(sys.argv[1]); native=sys.argv[2]; req=sys.argv[3]; out=pathlib.Path(sys.argv[4]); marker='from __future__ import annotations\n'
          attacks={
            'r13_tailored_sys_getframe':"import sys as _s\n_s._getframe()\n",
            'early_os_exit_zero':"import os as _o\n_o._exit(0)\n",
            'fd_scan_junk_injection':"import os as _o\nfor _fd in range(3,96):\n    try: _o.write(_fd,b'R14F1\\n'+b'0'*64+b'\\n2\\n{}')\n    except OSError: pass\n_o._exit(0)\n",
            'ctypes_memory_escape':"import ctypes as _c\n",
            'proc_self_mem':"open('/proc/self/mem','rb')\n",
            'settrace_mutation':"import sys as _s\n_s.settrace(lambda *a: None)\n",
            'thread_escape':"import threading as _t\n",
          }
          rows=[]
          for name,prefix in attacks.items():
            with tempfile.TemporaryDirectory(prefix='r15-r13-') as td:
              d=pathlib.Path(td)/'candidate'; shutil.copytree(base,d); p=d/'governance-runtime/v24_v6_governance_foundation.py'; text=p.read_text(); p.write_text(text.replace(marker,marker+prefix,1))
              cp=subprocess.run([native,'--sandbox',str(d),'--request',req],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=30)
              rejected=cp.returncode!=0 and not cp.stdout.startswith('R14_NATIVE_OBSERVATION='); rows.append({'attack':name,'returncode':cp.returncode,'authenticated_observation_emitted':cp.stdout.startswith('R14_NATIVE_OBSERVATION='),'rejected':rejected,'stderr_tail':cp.stderr[-500:]})
              if not rejected: raise SystemExit(f'R15_HISTORICAL_ATTACK_ACCEPTED:{name}')
          obj={'schema_version':1,'candidate_commit':os.environ['R15_CANDIDATE'],'candidate_tree':os.environ['R15_TREE'],'native_observer_binary_sha256':os.environ['R15_NATIVE_BINARY_SHA'],'attacks':rows,'all_rejected':all(x['rejected'] for x in rows),'scientific_execution_state':'CLOSED_PENDING_SUCCESSOR_REVIEW','runtime_qualification_state':'NOT_CLAIMED','authority_effect':'NONE_EVIDENCE_ONLY'}
          out.write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          PY
          echo "R15_R13_REGRESSION_RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "R15_R13_REGRESSION_DIGEST=$(sha256sum "$RESULT" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Seven R15 path-memory regressions reject at exact endpoint
        shell: bash
        run: |
          set -euo pipefail
          REQ="$RUNNER_TEMP/path-attack.json"; printf '%s' '{"args":[{"edges":[],"nodes":[]}],"function":"validate_completeness_derivation_graph","kwargs":{},"module":"v24_v6_governance_foundation","schema_version":1}' > "$REQ"
          OUT="$RUNNER_TEMP/V24-I11-V6-R15-PATH-REGRESSION.json"
          python - "$R15_SANDBOX" "$R15_NATIVE_BIN" "$REQ" "$OUT" <<'PY'
          import json,os,pathlib,shutil,subprocess,sys,tempfile
          base=pathlib.Path(sys.argv[1]); native=sys.argv[2]; req=sys.argv[3]; out=pathlib.Path(sys.argv[4]); marker='from __future__ import annotations\n'
          attacks={
            'PROC_SELF_MEM_UNICODE_PATH_REJECTED':"_x=open('/proc/self/mem','rb',buffering=0); _x.close()\n",
            'PROC_SELF_MEM_BYTES_PATH_REJECTED':"_x=open(b'/proc/self/mem','rb',buffering=0); _x.close()\n",
            'PROC_SELF_MAPS_BYTES_PATH_REJECTED':"_x=open(b'/proc/self/maps','rb',buffering=0); _x.read(1); _x.close()\n",
            'OS_OPEN_PROC_SELF_MEM_BYTES_REJECTED':"import os as _o\n_fd=_o.open(b'/proc/self/mem',_o.O_RDONLY); _o.close(_fd)\n",
            'IO_FILEIO_PROC_SELF_MEM_BYTES_REJECTED':"import _io as _i\n_x=_i.FileIO(b'/proc/self/mem','rb'); _x.close()\n",
            'DEV_MEM_UNICODE_PATH_REJECTED':"_x=open('/dev/mem','rb',buffering=0); _x.close()\n",
            'DEV_MEM_BYTES_PATH_REJECTED':"_x=open(b'/dev/mem','rb',buffering=0); _x.close()\n",
          }
          rows=[]
          for name,prefix in attacks.items():
            with tempfile.TemporaryDirectory(prefix='r15-path-') as td:
              d=pathlib.Path(td)/'candidate'; shutil.copytree(base,d); p=d/'governance-runtime/v24_v6_governance_foundation.py'; text=p.read_text(); p.write_text(text.replace(marker,marker+prefix,1))
              cp=subprocess.run([native,'--sandbox',str(d),'--request',req],env={'HOME':'/tmp','PATH':'/usr/bin:/bin'},stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=30)
              authenticated=cp.stdout.startswith('R14_NATIVE_OBSERVATION='); intended='R15_AUDIT_FORBIDDEN_NORMALIZED_PATH' in cp.stderr; rejected=cp.returncode!=0 and not authenticated and intended
              rows.append({'attack':name,'returncode':cp.returncode,'authenticated_observation_emitted':authenticated,'intended_policy_diagnostic':intended,'rejected':rejected,'stderr_tail':cp.stderr[-500:]})
              if not rejected: raise SystemExit(f'R15_PATH_ATTACK_NOT_REJECTED_AT_INTENDED_ENDPOINT:{name}')
          obj={'schema_version':1,'candidate_commit':os.environ['R15_CANDIDATE'],'candidate_tree':os.environ['R15_TREE'],'attacks':rows,'all_rejected_at_intended_endpoint':all(x['rejected'] for x in rows),'authority_effect':'NONE_EVIDENCE_ONLY'}; out.write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          PY
          echo "R15_PATH_REGRESSION_RESULT=$OUT" >> "$GITHUB_ENV"
          echo "R15_PATH_REGRESSION_DIGEST=$(sha256sum "$OUT" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Oracle launcher isolation and optimization probes
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"; LAUNCH="$GITHUB_WORKSPACE/review/v24/r14_trusted_oracle_launcher.py"; ORACLE="$GITHUB_WORKSPACE/review/v24/r14_trusted_external_oracle.py"; SCEN="$GITHUB_WORKSPACE/review/v24/r13_trusted_external_oracle.py"
          COMMON=(--oracle "$ORACLE" --sandbox "$R15_SANDBOX" --native-observer "$R15_NATIVE_BIN" --scenario-library "$SCEN" --candidate-commit "$R15_CANDIDATE" --candidate-tree "$R15_TREE" --environment-digest "$R15_ENV_DIGEST" --interpreter-contract-digest "$R15_INTERPRETER_DIGEST" --native-observer-source-git-blob-sha1 "$R15_NATIVE_SOURCE_BLOB" --native-runtime-binding-source-git-blob-sha1 "$R15_HOME_BINDING_BLOB" --native-observer-binary-sha256 "$R15_NATIVE_BINARY_SHA" --native-observer-compiler-digest "$R15_COMPILER_DIGEST" --oracle-git-blob-sha1 "$R15_ORACLE_BLOB" --child-python-home "$R15_PYTHON_HOME" --child-python-program "$R15_PYTHON_PROGRAM" --child-python-program-sha256 "$R15_PYTHON_PROGRAM_SHA" --child-python-version 3.12.14 --run-id "$GITHUB_RUN_ID" --round-id R15-PROBE --r13-regression-evidence-digest "$R15_R13_REGRESSION_DIGEST" --output "$RUNNER_TEMP/probe.json")
          if "$PY" "$LAUNCH" "${COMMON[@]}" >"$RUNNER_TEMP/noiso.out" 2>"$RUNNER_TEMP/noiso.err"; then exit 1; fi
          grep -q 'R14_LAUNCHER_INTERPRETER_FLAGS_INVALID' "$RUNNER_TEMP/noiso.err"
          if "$PY" -O -I -S "$LAUNCH" "${COMMON[@]}" >"$RUNNER_TEMP/opt.out" 2>"$RUNNER_TEMP/opt.err"; then exit 1; fi
          grep -q 'R14_LAUNCHER_OPTIMIZATION_FORBIDDEN' "$RUNNER_TEMP/opt.err"
          test ! -e "$RUNNER_TEMP/probe.json"

      - name: Execute six external oracle checks through R15 native observations
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"; CLEAN_PATH="$(dirname "$PY"):/usr/bin:/bin"; LAUNCH="$GITHUB_WORKSPACE/review/v24/r14_trusted_oracle_launcher.py"; ORACLE="$GITHUB_WORKSPACE/review/v24/r14_trusted_external_oracle.py"; SCEN="$GITHUB_WORKSPACE/review/v24/r13_trusted_external_oracle.py"; OUT="$RUNNER_TEMP/V24-I11-V6-R15-NATIVE-ORACLE-EVIDENCE.json"
          env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S "$LAUNCH" --oracle "$ORACLE" --sandbox "$R15_SANDBOX" --native-observer "$R15_NATIVE_BIN" --scenario-library "$SCEN" --candidate-commit "$R15_CANDIDATE" --candidate-tree "$R15_TREE" --environment-digest "$R15_ENV_DIGEST" --interpreter-contract-digest "$R15_INTERPRETER_DIGEST" --native-observer-source-git-blob-sha1 "$R15_NATIVE_SOURCE_BLOB" --native-runtime-binding-source-git-blob-sha1 "$R15_HOME_BINDING_BLOB" --native-observer-binary-sha256 "$R15_NATIVE_BINARY_SHA" --native-observer-compiler-digest "$R15_COMPILER_DIGEST" --oracle-git-blob-sha1 "$R15_ORACLE_BLOB" --child-python-home "$R15_PYTHON_HOME" --child-python-program "$R15_PYTHON_PROGRAM" --child-python-program-sha256 "$R15_PYTHON_PROGRAM_SHA" --child-python-version 3.12.14 --run-id "$GITHUB_RUN_ID" --round-id R15-NATIVE-ROUND-1 --r13-regression-evidence-digest "$R15_R13_REGRESSION_DIGEST" --output "$OUT"
          echo "R15_ORACLE_EVIDENCE=$OUT" >> "$GITHUB_ENV"; echo "R15_ORACLE_EVIDENCE_SHA=$(sha256sum "$OUT" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Candidate structural validator accepts bound external evidence only
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"; CLEAN_PATH="$(dirname "$PY"):/usr/bin:/bin"
          env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S - "$R15_SANDBOX" "$R15_ORACLE_EVIDENCE" <<'PY'
          import json,pathlib,sys
          sandbox=pathlib.Path(sys.argv[1]).resolve();sys.path.insert(0,str(sandbox/'governance-runtime'))
          from v24_v6_r14_successor import validate_native_observation_evidence_bundle
          r=validate_native_observation_evidence_bundle(json.load(open(sys.argv[2],encoding='utf-8')))
          assert r['valid'],r; assert r['qualified'] is False; assert r['bound_check_count']==6
          print('R15_INHERITED_EXTERNAL_EVIDENCE_VALIDATOR=PASS_NONAUTHORITATIVE')
          PY

      - name: Native binary substitution evidence is rejected
        shell: bash
        run: |
          set -euo pipefail
          BAD="$RUNNER_TEMP/bad.json"; python - "$R15_ORACLE_EVIDENCE" "$BAD" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1]));o['records'][0]['native_observer_binary_sha256']='f'*64;json.dump(o,open(sys.argv[2],'w'),indent=2,sort_keys=True)
          PY
          PY="$(command -v python)"; CLEAN_PATH="$(dirname "$PY"):/usr/bin:/bin"
          env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S - "$R15_SANDBOX" "$BAD" <<'PY'
          import json,pathlib,sys
          s=pathlib.Path(sys.argv[1]);sys.path.insert(0,str(s/'governance-runtime'))
          from v24_v6_r14_successor import validate_native_observation_evidence_bundle
          r=validate_native_observation_evidence_bundle(json.load(open(sys.argv[2])));assert not r['valid'] and any('NATIVE_BINARY_MISMATCH' in x for x in r['problems']),r
          PY

      - name: Post-execution sandbox remains exact
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"; CLEAN_PATH="$(dirname "$PY"):/usr/bin:/bin"; GUARD="$GITHUB_WORKSPACE/review/v24/r15_trusted_external_guard.py"
          env -i HOME="$HOME" PATH="$CLEAN_PATH" "$PY" -B -I -S "$GUARD" verify-sandbox --root "$R15_SANDBOX" --pinset "$R15_PINSET" --commit "$R15_CANDIDATE" --tree "$R15_TREE"

      - name: Build R15 construction record
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/V24-I11-V6-R15-NATIVE-CONSTRUCTION.json"
          python - "$OUT" <<'PY'
          import json,os,sys
          o={'schema_version':1,'candidate_commit':os.environ['R15_CANDIDATE'],'candidate_tree':os.environ['R15_TREE'],'review_commit':os.environ['R15_REVIEW_COMMIT'],'pinset_sha256':os.environ['R15_PINSET_SHA'],'guard_git_blob_sha1':os.environ['R15_GUARD_BLOB'],'native_source_git_blob_sha1':os.environ['R15_NATIVE_SOURCE_BLOB'],'native_binary_sha256':os.environ['R15_NATIVE_BINARY_SHA'],'compiler_digest':os.environ['R15_COMPILER_DIGEST'],'python_program_sha256':os.environ['R15_PYTHON_PROGRAM_SHA'],'interpreter_contract_digest':os.environ['R15_INTERPRETER_DIGEST'],'environment_digest':os.environ['R15_ENV_DIGEST'],'r13_regression_sha256':os.environ['R15_R13_REGRESSION_DIGEST'],'r15_path_regression_sha256':os.environ['R15_PATH_REGRESSION_DIGEST'],'oracle_evidence_sha256':os.environ['R15_ORACLE_EVIDENCE_SHA'],'all_path_regressions_rejected_at_intended_endpoint':True,'scientific_execution_state':'CLOSED_PENDING_SUCCESSOR_REVIEW','runtime_qualification_state':'NOT_CLAIMED','authority_effect':'NONE_EVIDENCE_ONLY'}
          open(sys.argv[1],'w').write(json.dumps(o,indent=2,sort_keys=True)+'\n')
          PY
          echo "R15_CONSTRUCTION_RECORD=$OUT" >> "$GITHUB_ENV"

      - name: Upload full R15 construction evidence
        uses: actions/upload-artifact@v4
        with:
          name: v24-v6-r15-full-native-construction-evidence
          path: |
            ${{ env.R15_PINSET }}
            ${{ env.R15_R13_REGRESSION_RESULT }}
            ${{ env.R15_PATH_REGRESSION_RESULT }}
            ${{ env.R15_ORACLE_EVIDENCE }}
            ${{ env.R15_CONSTRUCTION_RECORD }}
          if-no-files-found: error
          retention-days: 90
