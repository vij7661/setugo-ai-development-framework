name: R8 v15-r1 Frozen Candidate Review Packet

on:
  push:
    branches:
      - evidence/r8-v15-r1-post-sg1-frozen-candidate-2026-09-26
    paths:
      - .github/workflows/r8-v15-r1-frozen-candidate-review-packet.yml
      - tools/build_r8_v15_r1_frozen_candidate_review_packet.py

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  CANDIDATE_SHA: "ca1ae48be3d01025b7811d50d8482db30d15e4e9"
  CANDIDATE_TREE: "db50bcbead24390cc147278dd371188e54a3166d"
  BASE_SHA: "7cd2787d85b189a4161f271ee131e42bd961140a"

jobs:
  build-review-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create exact frozen candidate worktree
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ROOT="$RUNNER_TEMP/frozen-candidate"
          git worktree add --detach "$CANDIDATE_ROOT" "$CANDIDATE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git -C "$CANDIDATE_ROOT" status --porcelain=v1)"
          echo "CANDIDATE_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"

      - name: Run candidate checks and capture exact logs
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="$RUNNER_TEMP/review-logs"
          mkdir -p "$LOGDIR"
          cd "$CANDIDATE_ROOT"
          python3 tools/verify_r8_v15_r1_post_sg1_integration_invariants.py 2>&1 | tee "$LOGDIR/01-invariants.txt"
          python3 tools/test_r8_v15_r1_review_contract_parser.py 2>&1 | tee "$LOGDIR/02-parser.txt"
          python3 tools/test_r8_v15_r1_stage2_sg1_review_preflight.py 2>&1 | tee "$LOGDIR/03-preflight.txt"
          python3 tools/test_r8_v15_r1_stage2_semantic_gap_inventory.py 2>&1 | tee "$LOGDIR/04-semantic-inventory.txt"
          python3 governance-runtime/test_r8_v15_r1_runtime_toctou_hardening.py 2>&1 | tee "$LOGDIR/05-runtime-safe-read.txt"
          python3 tools/test_r8_evidence_bundle_integrity.py 2>&1 | tee "$LOGDIR/06-evidence-integrity.txt"
          python3 tools/test_r8_work_queue.py 2>&1 | tee "$LOGDIR/07-work-queue.txt"
          python3 tools/verify_r8_v15_r1_ig1_successor3_exact_candidate.py "$RUNNER_TEMP/stage1-pre" 2>&1 | tee "$LOGDIR/08-stage1-guard-pre.txt"
          python3 tools/verify_r8_v15_r1_ig1_successor3_exact_candidate.py "$RUNNER_TEMP/stage1-post" 2>&1 | tee "$LOGDIR/09-stage1-guard-post.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain=v1)"

      - name: Generate one self-contained packet from exact frozen SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_r8_v15_r1_frozen_candidate_review_packet.py \
            --candidate-root "$CANDIDATE_ROOT" \
            --base "$BASE_SHA" \
            --head "$CANDIDATE_SHA" \
            --tree "$CANDIDATE_TREE" \
            --log-dir "$RUNNER_TEMP/review-logs" \
            --out "$RUNNER_TEMP/R8-V15-R1-POST-SG1-FROZEN-CANDIDATE-REVIEW-PACKET.txt" \
            --run-id "${{ github.run_id }}" \
            --job "${{ github.job }}"

      - name: Verify packet completeness against exact candidate
        shell: bash
        run: |
          set -euo pipefail
          PACKET="$RUNNER_TEMP/R8-V15-R1-POST-SG1-FROZEN-CANDIDATE-REVIEW-PACKET.txt"
          test -s "$PACKET"
          grep -F "candidate commit: $CANDIDATE_SHA" "$PACKET"
          grep -F "candidate tree: $CANDIDATE_TREE" "$PACKET"
          grep -F "DO NOT STOP AFTER THE FIRST FINDING." "$PACKET"
          while IFS= read -r path; do
            blob="$(git -C "$CANDIDATE_ROOT" rev-parse "$CANDIDATE_SHA:$path")"
            grep -F -- "----- BEGIN FILE $path | blob $blob |" "$PACKET" >/dev/null
          done < <(git -C "$CANDIDATE_ROOT" diff --name-only "$BASE_SHA..$CANDIDATE_SHA")
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git -C "$CANDIDATE_ROOT" status --porcelain=v1)"

      - name: Upload exact frozen-candidate review packet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-post-sg1-frozen-candidate-review-packet
          path: ${{ runner.temp }}/R8-V15-R1-POST-SG1-FROZEN-CANDIDATE-REVIEW-PACKET.txt
          if-no-files-found: error
          retention-days: 30
