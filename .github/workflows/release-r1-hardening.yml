name: RELEASE R1 Hardening

on:
  push:
    branches:
      - release/r1-hardening
  pull_request:
    paths:
      - 'governance-runtime/**'
      - '.gitignore'
      - '.github/workflows/release-r1-hardening.yml'
      - '.github/workflows/testing-qualification-boundary-ownership.yml'
      - '.github/workflows/governed-execution-accelerator.yml'
      - '.github/workflows/integrated-governed-mvp-slice11-coding-agent-adapter.yml'

permissions:
  contents: read

jobs:
  r1-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reject committed Python bytecode
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo 'Committed Python bytecode/cache is forbidden in RELEASE qualification.' >&2
            exit 1
          fi

      - name: Run frozen REL-R1-01 regression
        working-directory: governance-runtime
        run: python -m unittest -v test_release_r1_bridge_shape_guard.py

      - name: Run immutable third-party action pinning regression
        working-directory: governance-runtime
        run: python -m unittest -v test_release_r1_action_pinning.py

      - name: Run qualification bridge regressions
        working-directory: governance-runtime
        run: python -m unittest -v test_qualification_boundary_unittest_bridge.py
