name: R8 v15-r1 S20-22 Successor1 S24-25 Review Continuation

on:
  push:
    branches:
      - implementation/r8-v15-r1-slice22-canonical-scope-tuple-local-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-S20-22-SUCCESSOR1-S24-25-REVIEW-CONTINUATION-MARKER.json

permissions:
  contents: read
  actions: read

jobs:
  build-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build single-file targeted review continuation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/build_r8_v15_r1_s20_22_successor1_s24_25_review_continuation.py
          test "$(find review-continuation -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Upload single continuation file
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-s20-22-successor1-s24-25-review-continuation
          path: review-continuation/R8-V15-R1-S20-22-SUCCESSOR1-S24-25-REVIEW-CONTINUATION.txt
          if-no-files-found: error
          retention-days: 30
