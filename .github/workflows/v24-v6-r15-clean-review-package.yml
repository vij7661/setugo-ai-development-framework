name: V24 V6 R15 Clean Manual Review Package

on:
  push:
    branches: [review/v24-i11-v6-r15-path-normalization]
    paths:
      - '.github/workflows/v24-v6-r15-clean-review-package.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}

      - name: Fetch and bind exact frozen inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          C='2e875bb29be48d39c9be6f3525d4f4610869848c'
          T='d2c9c0c85564808941fdb54cfbbd53f51f5397ee'
          REVIEW_META='1171b15eae418feb736911e71e975753d67b5a0d'
          V6='0e1c6dd99e608d6771df98549bb28a9b92b8e7a0'
          ART='10324065691'
          ART_SHA='0c16e6e523ce5b4d5e4da38ff01e0ed00f4024891554d5665c1a548fc5a02601'
          git fetch --no-tags origin "$C" "$REVIEW_META" "$V6"
          test "$(git rev-parse "$C^{tree}")" = "$T"
          E="$RUNNER_TEMP/full-evidence.zip"
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART/zip" > "$E"
          test "$(sha256sum "$E"|awk '{print $1}')" = "$ART_SHA"
          mkdir -p "$RUNNER_TEMP/full-evidence"; unzip -q "$E" -d "$RUNNER_TEMP/full-evidence"
          test "$(sha256sum "$RUNNER_TEMP/full-evidence/pin.json"|awk '{print $1}')" = 'e2f7689d4b9902823d94fe11e87c895e4036a080e0795aacfd9070354cf134b9'
          echo "C=$C" >> "$GITHUB_ENV"; echo "T=$T" >> "$GITHUB_ENV"; echo "REVIEW_META=$REVIEW_META" >> "$GITHUB_ENV"; echo "V6=$V6" >> "$GITHUB_ENV"; echo "ART=$ART" >> "$GITHUB_ENV"; echo "ART_SHA=$ART_SHA" >> "$GITHUB_ENV"; echo "FULL_EVIDENCE=$RUNNER_TEMP/full-evidence" >> "$GITHUB_ENV"; echo "FULL_EVIDENCE_ZIP=$E" >> "$GITHUB_ENV"

      - name: Build exact staged review tree and verify all bindings
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/r15-review-stage"; rm -rf "$STAGE"; mkdir -p "$STAGE"/{candidate,external,evidence,design,review,historical}
          git show "$REVIEW_META:review/v24/V24-I11-V6-R15-CLEAN-SUCCESSOR-REVIEW-INSTRUCTIONS.md" > "$STAGE/00-REVIEW-INSTRUCTIONS.md"

          python - "$FULL_EVIDENCE/pin.json" "$C" "$T" "$STAGE" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          pin=pathlib.Path(sys.argv[1]); commit,tree,stage=sys.argv[2],sys.argv[3],pathlib.Path(sys.argv[4])
          obj=json.loads(pin.read_text())
          assert obj['candidate_commit']==commit and obj['candidate_tree']==tree
          rows=obj['admitted_files']; assert len(rows)==190 and len({r['path'] for r in rows})==190
          for r in rows:
              path=r['path']; data=subprocess.check_output(['git','show',f'{commit}:{path}'])
              raw=hashlib.sha256(data).hexdigest(); blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              assert raw==r['raw_sha256'],(path,'raw'); assert blob==r['git_blob_sha1'],(path,'blob'); assert len(data)==r['bytes'],(path,'bytes')
              out=stage/'candidate'/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          print(f'R15_PACKAGE_CANDIDATE_FILES={len(rows)}')
          PY

          cp "$FULL_EVIDENCE/pin.json" "$STAGE/evidence/V24-I11-V6-R15-EXTERNAL-PINSET.json"
          cp "$FULL_EVIDENCE/r13.json" "$STAGE/evidence/V24-I11-V6-R15-R13-REGRESSION.json"
          cp "$FULL_EVIDENCE/path.json" "$STAGE/evidence/V24-I11-V6-R15-PATH-REGRESSION.json"
          cp "$FULL_EVIDENCE/oracle.json" "$STAGE/evidence/V24-I11-V6-R15-NATIVE-ORACLE-EVIDENCE.json"
          cp "$FULL_EVIDENCE/construction.json" "$STAGE/evidence/V24-I11-V6-R15-NATIVE-CONSTRUCTION.json"
          cp "$FULL_EVIDENCE_ZIP" "$STAGE/evidence/V24-I11-V6-R15-FULL-CONSTRUCTION-ARTIFACT.zip"

          test "$(sha256sum "$STAGE/evidence/V24-I11-V6-R15-R13-REGRESSION.json"|awk '{print $1}')" = '895af7dadf0018203c25b67ee2ab77c8395bbedd2325f0bf88ae0f493a1a374a'
          test "$(sha256sum "$STAGE/evidence/V24-I11-V6-R15-PATH-REGRESSION.json"|awk '{print $1}')" = '3534babb7e03308630a6c07e42779372379d3e725e8b0839be1593e1888bead3'
          test "$(sha256sum "$STAGE/evidence/V24-I11-V6-R15-NATIVE-ORACLE-EVIDENCE.json"|awk '{print $1}')" = '99802aabf7b6d1451a7e698aaa6b540592a036f4870366fbe3fd577a333aebd8'
          test "$(sha256sum "$STAGE/evidence/V24-I11-V6-R15-NATIVE-CONSTRUCTION.json"|awk '{print $1}')" = '08e8972dc759b7b08b5fd31f552e50d19b7b8c4e4a2d7d67bfdf62c0ca001494'

          for p in \
            review/v24/r15_native_observer.c \
            review/v24/r15_trusted_external_guard.py \
            review/v24/r14_native_observer.c \
            review/v24/r14_python_home_binding.c \
            review/v24/r14_trusted_external_oracle.py \
            review/v24/r14_trusted_oracle_launcher.py \
            review/v24/r13_trusted_external_oracle.py; do
            git show "$REVIEW_META:$p" > "$STAGE/external/$(basename "$p")"
          done
          test "$(git rev-parse "$REVIEW_META:review/v24/r15_native_observer.c")" = 'bfd16c1f3b7103b25c2f1abee536ebceb199e295'
          test "$(git rev-parse "$REVIEW_META:review/v24/r15_trusted_external_guard.py")" = '988a69decfb8f02f20b89bdee74da7b8a48ad51d'
          test "$(git rev-parse "$REVIEW_META:review/v24/r14_native_observer.c")" = '59916850a7b81b0d2ba77ce51198536277615555'
          test "$(git rev-parse "$REVIEW_META:review/v24/r14_python_home_binding.c")" = '6e5f3e02146adff92c70bdd12199644b35656721'
          test "$(git rev-parse "$REVIEW_META:review/v24/r14_trusted_external_oracle.py")" = '9b9e2714ef9f71aefe99ceb62e8eac25319fdf10'
          test "$(git rev-parse "$REVIEW_META:review/v24/r13_trusted_external_oracle.py")" = 'f0f72ca65eb443fd2db2917622a327256d15db05'

          for p in \
            review/v24/V24-I11-V6-R14-FALSIFICATION-ADJUDICATION-001.md \
            review/v24/V24-I11-V6-R14-BYTES-PROC-MEM-FALSIFICATION-001.json \
            review/v24/V24-I11-V6-R15-CONSTRUCTION-RED-001.md \
            review/v24/V24-I11-V6-R15-CONSTRUCTION-RED-002.md \
            review/v24/V24-I11-V6-R15-ALIAS-REPRESENTATION-RED-003.md \
            review/v24/V24-I11-V6-R15-ALIAS-REPRESENTATION-FALSIFICATION-001.json \
            review/v24/V24-I11-V6-R15-SYMLINK-ALIAS-FALSIFICATION-V2.json \
            review/v24/V24-I11-V6-R15-PATH-NORMALIZATION-CONSTRUCTION-EVIDENCE.md \
            review/v24/V24-I11-V6-R15-FULL-NATIVE-CONSTRUCTION-EVIDENCE.md \
            review/v24/V24-I11-V6-R15-FALSIFICATION-CLOSURE-001.md; do
            git show "$REVIEW_META:$p" > "$STAGE/historical/$(basename "$p")"
          done

          SRC="$RUNNER_TEMP/v6-source.md"
          git show "$V6:remediation/v24/V24-I11-SYSTEMIC-REMEDIATION-DESIGN-V6-CLEAN-REVIEW-PACKET.md" > "$SRC"
          python - "$SRC" "$STAGE/design/V24-I11-V6-APPROVED-DESIGN-EXACT.md" <<'PY'
          import hashlib,pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(src)==19296
          assert hashlib.sha256(src).hexdigest()=='5164747405b2de4d97228318a200e97c6b9c0e2afe58e4daddf09fe804bbc9d9'
          blob=hashlib.sha1(f'blob {len(src)}\0'.encode()+src).hexdigest(); assert blob=='8682df137aa12d57927e7891c16048e90b04caac'
          off=17321; out=src[:off]+b'\n'+src[off:]
          assert len(out)==19297
          assert hashlib.sha256(out).hexdigest()=='96ec464fbf602ac6b8c89fca5af16aa71a8d53f9f042605e46a07b4cd628ca62'
          assert hashlib.sha1(f'blob {len(out)}\0'.encode()+out).hexdigest()=='4a15d50a0488464816d235b273d1dbf808fdce94'
          pathlib.Path(sys.argv[2]).write_bytes(out)
          print('R15_APPROVED_DESIGN_RECONSTRUCTION=PASS')
          PY

          cat > "$STAGE/review/R15-PACKAGE-BINDING.json" <<EOF
          {
            "schema_version": 1,
            "candidate_commit": "$C",
            "candidate_tree": "$T",
            "review_metadata_commit": "$REVIEW_META",
            "full_construction_run": "34776147253",
            "full_construction_artifact_id": "10324065691",
            "full_construction_artifact_sha256": "$ART_SHA",
            "symlink_falsification_run": "34776332464",
            "symlink_falsification_artifact_id": "10323866558",
            "symlink_falsification_artifact_sha256": "2218f9ca487d285262c98864e4b555db182dc0047426b954e6d3093bd2fb544c",
            "scientific_execution_state": "CLOSED_PENDING_SUCCESSOR_REVIEW",
            "runtime_qualification_state": "NOT_CLAIMED",
            "automated_reviewer_api_calls": false,
            "authority_effect": "NONE_EVIDENCE_ONLY"
          }
          EOF

          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Build deterministic clean review ZIP twice and reverify contents
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          python - "$STAGE" "$OUT" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          stage=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          files=sorted(p for p in stage.rglob('*') if p.is_file())
          manifest=[]
          for p in files:
              d=p.read_bytes(); manifest.append({'path':p.relative_to(stage).as_posix(),'bytes':len(d),'sha256':hashlib.sha256(d).hexdigest()})
          m={'schema_version':1,'candidate_commit':'2e875bb29be48d39c9be6f3525d4f4610869848c','candidate_tree':'d2c9c0c85564808941fdb54cfbbd53f51f5397ee','listed_file_count':len(manifest),'files':manifest,'authority_effect':'NONE_EVIDENCE_ONLY'}
          mp=stage/'PACKAGE-MANIFEST.json'; mp.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          allfiles=sorted(p for p in stage.rglob('*') if p.is_file())
          def build(path):
              with zipfile.ZipFile(path,'w',compression=zipfile.ZIP_STORED) as z:
                  for p in allfiles:
                      rel=p.relative_to(stage).as_posix(); info=zipfile.ZipInfo(rel,(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_STORED; info.external_attr=(0o100644<<16); info.create_system=3; z.writestr(info,p.read_bytes())
          a=out/'V24-I11-V6-R15-CLEAN-REVIEW.zip'; b=out/'repeat.zip'; build(a); build(b)
          assert a.read_bytes()==b.read_bytes(); b.unlink()
          with zipfile.ZipFile(a) as z:
              names=z.namelist(); assert names==sorted(names) and len(names)==len(set(names))
              for p in allfiles: assert z.read(p.relative_to(stage).as_posix())==p.read_bytes()
          (out/'V24-I11-V6-R15-CLEAN-REVIEW.sha256').write_text(hashlib.sha256(a.read_bytes()).hexdigest()+'  V24-I11-V6-R15-CLEAN-REVIEW.zip\n')
          (out/'V24-I11-V6-R15-CLEAN-REVIEW.MANIFEST.sha256').write_text(hashlib.sha256(mp.read_bytes()).hexdigest()+'  PACKAGE-MANIFEST.json\n')
          rec={'schema_version':1,'zip_bytes':a.stat().st_size,'zip_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),'manifest_sha256':hashlib.sha256(mp.read_bytes()).hexdigest(),'zip_entry_count':len(allfiles),'manifest_listed_file_count':len(manifest),'candidate_file_count':sum(1 for x in names if x.startswith('candidate/')),'deterministic_double_build':'PASS','content_reverification':'PASS','approved_design_reconstruction':'PASS','authority_effect':'NONE_EVIDENCE_ONLY'}
          (out/'V24-I11-V6-R15-CLEAN-REVIEW.BUILD-RECORD.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          print(json.dumps(rec,indent=2,sort_keys=True))
          PY
          echo "PACKAGE_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload clean manual review package
        uses: actions/upload-artifact@v4
        with:
          name: v24-v6-r15-clean-manual-review-package
          path: |
            ${{ env.PACKAGE_OUT }}/V24-I11-V6-R15-CLEAN-REVIEW.zip
            ${{ env.PACKAGE_OUT }}/V24-I11-V6-R15-CLEAN-REVIEW.sha256
            ${{ env.PACKAGE_OUT }}/V24-I11-V6-R15-CLEAN-REVIEW.MANIFEST.sha256
            ${{ env.PACKAGE_OUT }}/V24-I11-V6-R15-CLEAN-REVIEW.BUILD-RECORD.json
          if-no-files-found: error
          retention-days: 90
