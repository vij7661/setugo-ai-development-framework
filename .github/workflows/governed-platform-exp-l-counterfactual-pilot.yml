name: Governed Platform EXP-L Counterfactual Pilot
on:
  push:
    branches: [experiment/governed-platform-falsification-harness]
    paths: [.github/exp-l-counterfactual-trigger.json]
permissions: {contents: read}
env:
  MECHANISMS: experiments/governed-platform/runner/mechanisms.remote-free.example.json
jobs:
  fixture-counterfactual:
    name: EXP-L Counterfactual C001 Groq
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Execute controlled counterfactual samples
        run: |
          N="$(python -c 'import json;print(json.load(open(".github/exp-l-counterfactual-trigger.json")).get("sample_count",3))')"
          CASE_ID=EXP-L-CF-001
          mkdir -p exp-l-cf/c001
          python experiments/governed-platform/runner/prepare_run.py --case "experiments/governed-platform/cases/pilot/model-visible/${CASE_ID}.json" --mechanisms "$MECHANISMS" --mechanism-id remote-reasoner-a --instruction-version exp-l-counterfactual-v1 --out "exp-l-cf/c001/${CASE_ID}.envelope.json"
          for i in $(seq 1 "$N"); do
            python experiments/governed-platform/runner/run_remote_canary.py --envelope "exp-l-cf/c001/${CASE_ID}.envelope.json" --provider groq --base-url https://api.groq.com/openai/v1 --model openai/gpt-oss-20b --api-key-env GROQ_API_KEY --timeout-seconds 120 --temperature 0.7 --out "exp-l-cf/c001/${CASE_ID}.sample-${i}.raw-result.json" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: exp-l-counterfactual-c001, path: exp-l-cf/c001/, if-no-files-found: error}

  ambiguity-counterfactual:
    name: EXP-L Counterfactual C003 Groq
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Execute controlled counterfactual samples
        run: |
          N="$(python -c 'import json;print(json.load(open(".github/exp-l-counterfactual-trigger.json")).get("sample_count",3))')"
          CASE_ID=EXP-L-CF-003
          mkdir -p exp-l-cf/c003
          python experiments/governed-platform/runner/prepare_run.py --case "experiments/governed-platform/cases/pilot/model-visible/${CASE_ID}.json" --mechanisms "$MECHANISMS" --mechanism-id remote-reasoner-a --instruction-version exp-l-counterfactual-v1 --out "exp-l-cf/c003/${CASE_ID}.envelope.json"
          for i in $(seq 1 "$N"); do
            python experiments/governed-platform/runner/run_remote_canary.py --envelope "exp-l-cf/c003/${CASE_ID}.envelope.json" --provider groq --base-url https://api.groq.com/openai/v1 --model openai/gpt-oss-20b --api-key-env GROQ_API_KEY --timeout-seconds 120 --temperature 0.7 --out "exp-l-cf/c003/${CASE_ID}.sample-${i}.raw-result.json" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: exp-l-counterfactual-c003, path: exp-l-cf/c003/, if-no-files-found: error}
