name: EXP-M R2E Offline Falsification

on:
  push:
    branches:
      - experiment/exp-m-deterministic-r2e
    paths:
      - 'governance-runtime/**'
      - 'experiments/governed-platform/EXP-M-R5-QUALIFICATION-PROTOCOL.json'
      - 'experiments/governed-platform/EXP-M-R2E-*'
      - 'experiments/governed-platform/r2e-authority/**'
      - '.github/workflows/exp-m-r2e-offline.yml'
      - '.github/workflows/exp-m-r2e-sep.yml'

permissions:
  contents: read

jobs:
  offline-falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Run EXP-M offline unit and phase tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q governance-runtime
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path

          root = Path(".").resolve()
          sys.path.insert(0, str(root / "governance-runtime"))
          from freeze_source import source_paths
          from generate_evidence import _reproducibility_environment
          from build_exp_m_r2e_packet import _authority_bundle

          repro = _reproducibility_environment({path: "" for path in source_paths()})
          if repro.get("third_party_python_dependencies") != []:
              raise SystemExit("reproducibility_preflight_third_party_dependency")
          if repro.get("network_capable_imports") != []:
              raise SystemExit("reproducibility_preflight_network_import")
          if repro.get("github_actions_all_pinned_by_commit_sha") is not True:
              raise SystemExit("reproducibility_preflight_unpinned_action")

          head = subprocess.check_output(("git", "rev-parse", "HEAD"), cwd=root, text=True).strip()
          authority = _authority_bundle(head)
          if not authority.get("files") or not authority.get("authority_commit"):
              raise SystemExit("packet_authority_bundle_preflight_failed")
          print("R2E_REPRODUCIBILITY_AND_PACKET_HELPER_PREFLIGHT=PASS")
          PY
          # Exercise the exact final evidence generator before any source freeze is authorized.
          # This runs the full offline command set and validates fresh artifact/source binding
          # without committing E or granting authority.
          python governance-runtime/generate_evidence.py
          python governance-runtime/self_adjudicate_r2d.py
          python governance-runtime/build_exp_m_portable_review_bundle.py \
            --source 63b9f08998db0dce0a3ee2fbd46bf80fa4f6852a \
            --evidence ae0fd712b1a8a1a703898bf361ff071d9b7edabb \
            --packet 2e166e75a56c53d3947b5487e5ac274e8c190c06 \
            --handoff b85a924b437dc482ff45d083d29dfb46e9fc2327 \
            --output /tmp/EXP-M-R2E-PORTABLE-REVIEW-BUNDLE-regression.zip
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          path = Path("/tmp/EXP-M-R2E-PORTABLE-REVIEW-BUNDLE-regression.zip")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("portable_bundle_regression_missing")
          with zipfile.ZipFile(path, "r") as archive:
              names = archive.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("portable_bundle_regression_duplicate_entry")
              manifest = json.loads(archive.read("BUNDLE-MANIFEST.json"))
              entries = manifest.get("entries") or []
              if manifest.get("entry_count") != len(entries):
                  raise SystemExit("portable_bundle_regression_entry_count_mismatch")
              if manifest.get("attested_entry_count") != len(entries):
                  raise SystemExit("portable_bundle_regression_attested_count_mismatch")
              if manifest.get("archive_entry_count") != len(names):
                  raise SystemExit("portable_bundle_regression_archive_count_mismatch")
              observed = {str(row.get("bundle_path", "")) for row in entries}
              if observed != set(names) - {"BUNDLE-MANIFEST.json"}:
                  raise SystemExit("portable_bundle_regression_manifest_coverage_mismatch")
              for row in entries:
                  raw = archive.read(str(row["bundle_path"]))
                  if len(raw) != int(row["size"]) or hashlib.sha256(raw).hexdigest() != str(row["sha256"]):
                      raise SystemExit("portable_bundle_regression_integrity_mismatch")
          print("R2E_PORTABLE_BUNDLE_REGRESSION=PASS")
          PY
      - name: Assert no live provider execution marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/governed-platform')
          for p in root.glob('EXP-M-*-RESULTS.json'):
              try:
                  data=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              text=json.dumps(data, sort_keys=True)
              if '"live_provider_execution": true' in text or '"live_provider_api_execution": true' in text:
                  raise SystemExit(f'live provider/API execution marker found in {p}')
          print('offline-only boundary preserved')
          PY
