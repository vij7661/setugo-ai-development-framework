name: V24 V6 Successor-9 Exact Final Head

on:
  push:
    branches:
      - remediation/v24-i11-v6-successor-9
    paths:
      - '.github/workflows/v24-v6-successor9-trusted-consume.yml'
      - '.github/workflows/v24-v6-successor9-final-head.yml'
      - 'governance-runtime/native/v24_v6_trusted_authority_service.c'
      - 'governance-runtime/build_v24_v6_trusted_authority_service.sh'
      - 'governance-runtime/v24_v6_trusted_service_client.py'
      - 'governance-runtime/v24_v6_successor8_record_probe.py'
      - 'governance-runtime/v24_v6_successor9_trusted_control.py'
      - 'governance-runtime/test_v24_v6_successor9_consume_loader_red.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-final-head:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assert exact immutable workflow head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Assert construction dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v gcc
          command -v jq
          command -v openssl
          command -v sudo
          command -v unshare
          test -x /usr/bin/python3

      - name: Create fixed candidate identity
        shell: bash
        run: |
          set -euo pipefail
          if ! id v24candidate >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin v24candidate
          fi
          test "$(id -u v24candidate)" != "0"
          if sudo -u v24candidate -- sudo -n true 2>/dev/null; then
            echo "candidate identity unexpectedly has sudo"
            exit 1
          fi

      - name: Compile Successor-9 surface
        working-directory: governance-runtime
        run: |
          python -m py_compile \
            v24_v6_trusted_service_client.py \
            v24_v6_successor8_record_probe.py \
            v24_v6_successor9_trusted_control.py \
            test_v24_v6_successor9_consume_loader_red.py

      - name: Fetch exact Successor-9 external bootstrap authority
        shell: bash
        run: |
          set -euo pipefail
          TRUST_COMMIT='af3ab8ab846119292a1b3a36fca5d0cc2c71b1ee'
          TRUST_TREE='fc063773b077c855cf34eebf28c886ee496d3fe9'
          MANIFEST_BLOB='488f50501b945f4f4a7f56ff6935587c091f4372'
          BOOTSTRAP_BLOB='ca1a108f7899d3e81c01c8eaa2219528cd945dcc'

          git fetch --no-tags --depth=1 origin "$TRUST_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$TRUST_COMMIT"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$TRUST_TREE"
          test "$(git ls-tree FETCH_HEAD trust/v24-v6-successor9-trusted-consume-bootstrap-v1.json | awk '{print $3}')" = "$MANIFEST_BLOB"
          test "$(git ls-tree FETCH_HEAD trust/install-v24-v6-successor9-trusted-consume-v1.sh | awk '{print $3}')" = "$BOOTSTRAP_BLOB"

          mkdir -p "$RUNNER_TEMP/v24-s9-trust"
          git show "$TRUST_COMMIT:trust/v24-v6-successor9-trusted-consume-bootstrap-v1.json" > "$RUNNER_TEMP/v24-s9-trust/manifest.json"
          git show "$TRUST_COMMIT:trust/install-v24-v6-successor9-trusted-consume-v1.sh" > "$RUNNER_TEMP/v24-s9-trust/bootstrap.sh"
          chmod 0555 "$RUNNER_TEMP/v24-s9-trust/bootstrap.sh"
          test "$(git hash-object "$RUNNER_TEMP/v24-s9-trust/manifest.json")" = "$MANIFEST_BLOB"

      - name: Reject candidate-selected trusted root
        shell: bash
        run: |
          set -euo pipefail
          if sudo env V24_V6_TRUSTED_ROOT=/tmp/candidate-selected-root \
              bash "$RUNNER_TEMP/v24-s9-trust/bootstrap.sh" \
              "$GITHUB_WORKSPACE/governance-runtime" \
              "$RUNNER_TEMP/v24-s9-trust/manifest.json"; then
            echo "external bootstrap accepted candidate-selected trusted root"
            exit 1
          fi
          test ! -e /tmp/candidate-selected-root

      - name: Reject coherent candidate source and self-manifest substitution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v24-s9-coherent-substitution
          cp -a governance-runtime /tmp/v24-s9-coherent-substitution
          printf '\n/* coherent candidate substitution */\n' >> /tmp/v24-s9-coherent-substitution/native/v24_v6_trusted_authority_service.c
          bash /tmp/v24-s9-coherent-substitution/build_v24_v6_external_authority_gate.sh
          bash /tmp/v24-s9-coherent-substitution/build_v24_v6_trusted_authority_service.sh
          if sudo bash "$RUNNER_TEMP/v24-s9-trust/bootstrap.sh" \
              /tmp/v24-s9-coherent-substitution \
              "$RUNNER_TEMP/v24-s9-trust/manifest.json"; then
            echo "external bootstrap accepted coherent Successor-9 substitution"
            exit 1
          fi
          sudo rm -rf /tmp/v24-s9-coherent-substitution

      - name: Install only externally pinned Successor-9 trusted runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo bash "$RUNNER_TEMP/v24-s9-trust/bootstrap.sh" \
            "$GITHUB_WORKSPACE/governance-runtime" \
            "$RUNNER_TEMP/v24-s9-trust/manifest.json"

          T=/opt/v24-v6-trusted-runtime
          test "$(sha256sum "$T/.gate-build/v24_v6_external_authority_gate" | awk '{print $1}')" = '7c69d78f5bf0f0d09dfe0ec92b738f86f7b6c18de3895cef23662ecb91e30069'
          test "$(sha256sum "$T/v24_v6_trusted_authority_service" | awk '{print $1}')" = 'a9567ea1677456949e79bb64c06c6880426afcaaaa5235e5579ca3e62e7b021d'
          test "$(jq -r '.build_input_sha256' "$T/.gate-build/v24_v6_external_authority_gate_build.json")" = 'b0f0b0f91c88b1746d6bffa7d3b4955aa6f494cc525de45d7435582dfb77f1b9'
          test "$(jq -r '.build_input_sha256' "$T/v24_v6_trusted_authority_service_build.json")" = 'b74631643c529e26264be7aa56f1df278749aea7f61326e0d18f47c6fc82a0fc'
          test "$(jq -r '.service_version' "$T/v24_v6_trusted_authority_service_build.json")" = '3'

      - name: Start separately controlled trusted service
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /run/v24-v6-authority
          sudo env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 \
            /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service --serve \
            >/tmp/v24-v6-successor9-service.log 2>&1 &
          for i in $(seq 1 50); do
            test -S /run/v24-v6-authority/service.sock && break
            sleep 0.1
          done
          test -S /run/v24-v6-authority/service.sock
          test "$(stat -c '%u' /run/v24-v6-authority/service.sock)" = "0"
          test "$(sudo stat -c '%a' /run/v24-v6-authority/private)" = "700"

      - name: Preserve load-bearing namespace prohibition
        shell: bash
        run: |
          set -euo pipefail
          if sudo -u v24candidate -- unshare --user --map-root-user --mount /bin/true 2>/dev/null; then
            echo "unprivileged namespace unexpectedly available"
            exit 1
          fi

      - name: Stage read-only candidate test surface
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /tmp/v24candidate-successor9
          sudo cp -a governance-runtime /tmp/v24candidate-successor9
          sudo chown -R root:root /tmp/v24candidate-successor9
          sudo find /tmp/v24candidate-successor9 -type d -exec chmod 0555 {} +
          sudo find /tmp/v24candidate-successor9 -type f -exec chmod 0444 {} +

      - name: Direct candidate consume remains non-authoritative
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v24candidate-successor9
          sudo -u v24candidate -- env \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=/tmp/v24candidate-successor9 \
            /usr/bin/python3 -m unittest -v test_v24_v6_successor9_consume_loader_red.py

      - name: Candidate cannot use trusted consume protocol
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v24candidate-successor9
          if sudo -u v24candidate -- env \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPATH=/tmp/v24candidate-successor9 \
              /usr/bin/python3 v24_v6_successor9_trusted_control.py \
              positive /tmp/nonexistent.json; then
            echo "candidate unexpectedly invoked trusted consume harness"
            exit 1
          fi

      - name: Produce genuine diagnostic records as candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v24candidate-successor9
          for mode in positive da1 ncp1; do
            sudo -u v24candidate -- env \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPATH=/tmp/v24candidate-successor9 \
              /usr/bin/python3 v24_v6_successor8_record_probe.py "$mode" \
              > "/tmp/s9-$mode.json"
          done
          test "$(jq -r '.decision' /tmp/s9-positive.json)" = "ALLOW"
          test "$(jq -r '.decision' /tmp/s9-da1.json)" = "DENY"
          test "$(jq -r '.decision' /tmp/s9-ncp1.json)" = "DENY"

      - name: Reject genuine ALLOW record rebound to another operation
        shell: bash
        run: |
          set -euo pipefail
          cd governance-runtime
          if sudo env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD" \
              /usr/bin/python3 v24_v6_successor9_trusted_control.py \
              positive-wrong-operation /tmp/s9-positive.json \
              > /tmp/s9-wrong-operation.json; then
            echo "cross-operation ALLOW substitution unexpectedly succeeded"
            exit 1
          fi
          test "$(jq -r '.decision' /tmp/s9-wrong-operation.json)" = "DENY"
          test "$(jq -r '.reason' /tmp/s9-wrong-operation.json)" = "AUTHORITY_RECORD_BINDING_INVALID"

      - name: Reject genuine ALLOW record rebound to another payload effect
        shell: bash
        run: |
          set -euo pipefail
          cd governance-runtime
          if sudo env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD" \
              /usr/bin/python3 v24_v6_successor9_trusted_control.py \
              positive-wrong-payload /tmp/s9-positive.json \
              > /tmp/s9-wrong-payload.json; then
            echo "cross-payload ALLOW substitution unexpectedly succeeded"
            exit 1
          fi
          test "$(jq -r '.decision' /tmp/s9-wrong-payload.json)" = "DENY"
          test "$(jq -r '.reason' /tmp/s9-wrong-payload.json)" = "AUTHORITY_RECORD_BINDING_INVALID"

      - name: Trusted in-service exact positive consume
        shell: bash
        run: |
          set -euo pipefail
          cd governance-runtime
          sudo env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD" \
            /usr/bin/python3 v24_v6_successor9_trusted_control.py \
            positive /tmp/s9-positive.json > /tmp/s9-positive-consumed.json
          test "$(jq -r '.construction_authoritative' /tmp/s9-positive-consumed.json)" = "true"
          test "$(jq -r '.service_authoritative' /tmp/s9-positive-consumed.json)" = "true"
          test "$(jq -r '.decision' /tmp/s9-positive-consumed.json)" = "ALLOW"
          test "$(jq -r '.record_state' /tmp/s9-positive-consumed.json)" = "CONSUMED"

      - name: One-shot replay remains rejected
        shell: bash
        run: |
          set -euo pipefail
          cd governance-runtime
          if sudo env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD" \
              /usr/bin/python3 v24_v6_successor9_trusted_control.py \
              positive /tmp/s9-positive.json > /tmp/s9-positive-replay.json; then
            echo "trusted record replay unexpectedly succeeded"
            exit 1
          fi
          test "$(jq -r '.decision' /tmp/s9-positive-replay.json)" = "DENY"
          test "$(jq -r '.reason' /tmp/s9-positive-replay.json)" = "AUTHORITY_RECORD_UNAVAILABLE_OR_REPLAYED"

      - name: DA-1 and NCP-1 remain authoritative DENY
        shell: bash
        run: |
          set -euo pipefail
          cd governance-runtime
          for mode in da1 ncp1; do
            if sudo env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD" \
                /usr/bin/python3 v24_v6_successor9_trusted_control.py \
                "$mode" "/tmp/s9-$mode.json" > "/tmp/s9-$mode-consumed.json"; then
              echo "$mode authoritative denial unexpectedly returned success"
              exit 1
            fi
            test "$(jq -r '.construction_authoritative' /tmp/s9-$mode-consumed.json)" = "true"
            test "$(jq -r '.service_authoritative' /tmp/s9-$mode-consumed.json)" = "true"
            test "$(jq -r '.decision' /tmp/s9-$mode-consumed.json)" = "DENY"
          done

      - name: Run Successor-8 through Successor-4 authority regressions
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v24candidate-successor9
          sudo -u v24candidate -- env \
            V24_V6_TRUSTED_GATE_PATH=/opt/v24-v6-trusted-runtime/.gate-build/v24_v6_external_authority_gate \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=/tmp/v24candidate-successor9 \
            /usr/bin/python3 -m unittest -v \
              test_v24_v6_successor8_candidate_local_red.py \
              test_v24_v6_successor8_authenticated_authority.py \
              test_v24_v6_successor7_trusted_service.py \
              test_v24_v6_successor6_trusted_control_domain.py \
              test_v24_v6_successor5_external_authority_gate.py \
              test_v24_v6_successor4_root_attestation.py \
              test_v24_v6_successor4_external_anchor_red.py

      - name: Run complete V24-V6 R1-R9 regressions
        working-directory: governance-runtime
        run: |
          python -m unittest -v \
            test_v24_v6_governance_foundation.py \
            test_v24_v6_proof_reference_closure.py \
            test_v24_v6_proof_resolution_red.py \
            test_v24_v6_endpoint_projection.py \
            test_v24_v6_material_surface.py \
            test_v24_v6_decision_apply.py \
            test_v24_v6_normative_clause_projection.py \
            test_v24_v6_effect_ledger_closure.py \
            test_v24_v6_atomic_binding_modes.py \
            test_v24_v6_qualification_integrity.py \
            test_v24_v6_integrated_successor.py \
            test_v24_v6_integrated_successor_dependency_red.py

      - name: Run inherited V24 regressions
        working-directory: governance-runtime
        run: |
          python -m unittest -v \
            test_normative_control_catalog.py \
            test_v24_authority_universe.py \
            test_v24_effective_control.py \
            test_v24_completeness_bootstrap.py \
            test_v24_endpoint_proof_compiler.py \
            test_v24_admission_application_witness.py \
            test_v24_aggregate_budget.py \
            test_v24_generation_migration.py \
            test_v24_review_proof_audit.py

      - name: Assert preserved RED review and closed claim boundary
        shell: bash
        run: |
          set -euo pipefail
          D=implementation/v24/V24-I11-V6-SUCCESSOR-9-TRUSTED-CONSUME-REPAIR-DESIGN.md
          M=implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json
          grep -q '35347420339' "$D"
          grep -q 'test_candidate_loader_interposition_cannot_forge_authoritative_consume' "$D"
          grep -q 'CHANGES_REQUIRED' "$D"
          test "$(jq -r '.scientific_execution_state' "$M")" = 'CLOSED_PENDING_SUCCESSOR_REVIEW'
          test "$(jq -r '.authority_effect' "$M")" = 'NONE_EVIDENCE_ONLY'
          test "$(jq -r '.successor9_trusted_consume.runtime_qualification_state' "$M")" = 'NOT_CLAIMED'
          test "$(jq -r '.successor9_trusted_consume.authority_effect' "$M")" = 'NONE_EVIDENCE_ONLY'

      - name: Record targeted Successor-9 identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service
          cat /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service_build.json
