name: R8 v15-r1 IG-1 Successor1 Proposal Preflight

on:
  push:
    branches:
      - governance/r8-v15-r1-integration-gate1-proposal-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-IG1-SUCCESSOR1-PROPOSAL-PREFLIGHT-MARKER.json

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Syntax check frozen proposal machinery
        run: |
          python3 -m py_compile tools/r8_v15_r1_ig1_successor1_materialize.py
          python3 -m py_compile governance-runtime/test_r8_v15_r1_ig1_integration_oracle.py
      - name: Preflight exact roster/tree-entry rules only
        run: python3 tools/r8_v15_r1_ig1_successor1_materialize.py --preflight-only
      - name: Assert activation remains absent
        run: test ! -e governance-r8/R8-V15-R1-IG1-SUCCESSOR1-ACTIVATION.json
