name: V24 I11 Plan V8 Binding Repair

on:
  push:
    branches:
      - testing/v24-i11-falsification-plan-v8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebind V8 packet to repository-materialized bytes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess

          packet_path = Path('testing/v24/WDPC_V24_I11_Falsification_Plan_V8_Clean_Review_Packet.md')
          binding_path = Path('testing/v24/V24-I11-FALSIFICATION-PLAN-V8-REVIEW-BINDING.json')
          harness_path = Path('testing/v24/v24_i11_harness_contract_v7.py')

          packet = packet_path.read_text(encoding='utf-8')
          parts = packet.split('\n---\n\n', 1)
          if len(parts) != 2:
              raise SystemExit('V8 wrapper delimiter missing')
          wrapper, body = parts
          body_sha = hashlib.sha256(body.encode('utf-8')).hexdigest()

          repaired_wrapper, count = re.subn(
              r'(\*\*PLAN_BODY_SHA256:\*\* `)[0-9a-f]{64}(`)',
              rf'\g<1>{body_sha}\g<2>',
              wrapper,
              count=1,
          )
          if count != 1:
              raise SystemExit('V8 PLAN_BODY_SHA256 wrapper field not uniquely repairable')

          repaired_packet = repaired_wrapper + '\n---\n\n' + body
          packet_path.write_text(repaired_packet, encoding='utf-8')

          packet_bytes = packet_path.read_bytes()
          packet_sha = hashlib.sha256(packet_bytes).hexdigest()
          packet_blob = subprocess.check_output(
              ['git', 'hash-object', str(packet_path)], text=True
          ).strip()
          harness_blob = subprocess.check_output(
              ['git', 'hash-object', str(harness_path)], text=True
          ).strip()

          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          binding.update({
              'packet_sha256': packet_sha,
              'plan_body_sha256': body_sha,
              'packet_bytes': len(packet_bytes),
              'packet_git_blob_sha': packet_blob,
              'harness_blob_sha': harness_blob,
              'harness_version': '1.6.0-PLAN-REVIEW',
          })
          binding_path.write_text(json.dumps(binding, indent=2) + '\n', encoding='utf-8')

          print('packet_sha256=' + packet_sha)
          print('body_sha256=' + body_sha)
          print('packet_git_blob=' + packet_blob)
          print('harness_git_blob=' + harness_blob)
          PY

          if git diff --quiet -- \
            testing/v24/WDPC_V24_I11_Falsification_Plan_V8_Clean_Review_Packet.md \
            testing/v24/V24-I11-FALSIFICATION-PLAN-V8-REVIEW-BINDING.json; then
            echo 'V8 binding already canonical; no commit needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            testing/v24/WDPC_V24_I11_Falsification_Plan_V8_Clean_Review_Packet.md \
            testing/v24/V24-I11-FALSIFICATION-PLAN-V8-REVIEW-BINDING.json
          git commit -m 'Canonicalize V24 I11 V8 repository binding'
          git push origin HEAD:testing/v24-i11-falsification-plan-v8
