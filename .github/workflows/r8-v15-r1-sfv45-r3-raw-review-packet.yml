name: R8 v15-r1 SFV45 R3 Raw Review Packet

on:
  push:
    branches:
      - review-packet/r8-v15-r1-sfv45-r3-raw-evidence-2026-09-24
    paths:
      - governance-r8/R8-V15-R1-SFV45-R3-RAW-PACKET-MARKER.json

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-v15-r1-sfv45-r3-raw-review-packet
  cancel-in-progress: false

env:
  CANDIDATE_SHA: f93ca26975ecb64f0da13779889c75b36140cdfc
  FIXED_POINT_SHA: d61f9278f1daceac6de536a8894d266726733345
  PRIOR_REVIEWED_SHA: 5cde19b285989da95c7e68b489663ba2e503ef02
  SEMANTIC_SHA: 1fa49fa4adfa6aa47fae68c0f1938083eeb1497f
  SEMANTIC_ACCEPTANCE_SHA: c1d983ebd6eca0a78a41c946709bf246cf876f68
  EVIDENCE_HEAD_SHA: 96113f437846ba002e39394b758490295081d986
  RUN_STAGE1: "36050313120"
  RUN_STAGE1_VERIFY: "36050575731"
  RUN_FINAL: "36051390674"
  RUN_FINAL_VERIFY: "36051607632"
  ART_STAGE1: "10830007314"
  ART_STAGE1_VERIFY: "10830052586"
  ART_FINAL: "10831151305"
  ART_FINAL_VERIFY: "10830213828"
  ART_STAGE1_SHA256: ed5c6004904be47922b2b86f44ca03cd36522a631f1c87b537888a30e14517fc
  ART_STAGE1_VERIFY_SHA256: ab3a3197216091ca5a66247b45b666024f2c94b0a33695a4bbffb2e64b95dbe3
  ART_FINAL_SHA256: d1b5df7c294a9e208ee72ecfe2ee5cb9ef3b34b0a5f3f44e610c516546c6dd44
  ART_FINAL_VERIFY_SHA256: 5821dbc2b9bb367a361ef79da2153df43ffbd98066a6e7752715fa60974eab85
  FINAL_SPM_SHA256: 84c484121c4c8dd0592bcd7e4c070d8a3ab7f17215f4c3d2b31863fb6dbf6797

jobs:
  build-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact semantic and evidence refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin semantic/r8-v15-r1-gcp-p05-correction-2026-09-24
          git fetch --no-tags origin freeze/r8-v15-r1-executable-schema-qualified-r3-reviewed-semantic
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$SEMANTIC_SHA^{commit}")" = "$SEMANTIC_SHA"
          test "$(git rev-parse "$SEMANTIC_ACCEPTANCE_SHA^{commit}")" = "$SEMANTIC_ACCEPTANCE_SHA"
          test "$(git rev-parse "$EVIDENCE_HEAD_SHA^{commit}")" = "$EVIDENCE_HEAD_SHA"

      - name: Build exact candidate and semantic-source packets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-packet/raw-artifacts

          cat > review-packet/00_MANIFEST_AND_INSTRUCTIONS.txt <<'EOF'
R8 v15-r1 SFV-45 — EXACT RAW-EVIDENCE REVIEW PACKET
Review mode: fresh blind exact-candidate review.
Do not use prior R2/R3 reviews, adjudications, conversation history, or model recollection.
Do not accept PASS from labels alone; recompute and cross-check from the exact material supplied.

Exact candidate: f93ca26975ecb64f0da13779889c75b36140cdfc
Fixed-point input: d61f9278f1daceac6de536a8894d266726733345
Reviewed semantic candidate: 1fa49fa4adfa6aa47fae68c0f1938083eeb1497f
Semantic acceptance commit: c1d983ebd6eca0a78a41c946709bf246cf876f68
Final SPM SHA-256: 84c484121c4c8dd0592bcd7e4c070d8a3ab7f17215f4c3d2b31863fb6dbf6797

The earlier fresh review returned INSUFFICIENT_EVIDENCE because only summaries were supplied.
This transport supplies exact candidate file bytes, exact semantic source bytes, the complete final
SPM/source map, and raw generation/attestation/verifier artifacts. The earlier review disposition is
not a candidate defect and must not be treated as evidence for or against PASS.

Required final response:
A. OVERALL_DISPOSITION — BOUNDED_PASS / CHANGES_REQUIRED / INSUFFICIENT_EVIDENCE
B. EXACT_CANDIDATE_IDENTITY
C. CRITICAL_FINDINGS
D. HIGH_FINDINGS
E. MEDIUM_LOW_FINDINGS
F. REPAIR_CLOSURE_ASSESSMENT
G. SFV_ASSESSMENT — specifically SFV-17,27,30,31,33,35,36,37,44 and whether SFV-45 may be granted
H. AUTHORITY_BOUNDARY

No review result grants implementation, runtime qualification, release, deployment, production,
policy, or terminal authority.
EOF

          {
            echo "R8 v15-r1 SFV-45 — PART 1: EXACT CANDIDATE BYTES"
            echo
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "FIXED_POINT_SHA=$FIXED_POINT_SHA"
            echo
            git show --no-patch --format=fuller "$CANDIDATE_SHA"
            echo
            echo "=== EXACT DIFF NAME/STATUS: PRIOR REVIEWED CANDIDATE -> CURRENT ==="
            git diff --name-status "$PRIOR_REVIEWED_SHA" "$CANDIDATE_SHA"
            for p in               schemas/governance-r8/v15-r1/runtime-contracts.schema.json               schemas/governance-r8/v15-r1/gcp-rvm-2.json               schemas/governance-r8/v15-r1/schema-freeze-validator-contract.json               schemas/governance-r8/v15-r1/schema-freeze-traceability.json               governance-r8/R8-V15-R1-SFV45-R3-REVIEWED-SEMANTIC-REBIND.json               governance-r8/R8-V15-R1-SPG1-ENROLLMENT-EXTENSION-V2-R1.json               governance-r8/R8-V15-R1-SPG1-V2-R1-POST-RUN-VERIFICATION.json
            do
              echo
              echo "===== BEGIN EXACT FILE: $p ====="
              echo "git_blob_sha1=$(git rev-parse "$CANDIDATE_SHA:$p")"
              echo "sha256=$(git show "$CANDIDATE_SHA:$p" | sha256sum | awk '{print $1}')"
              git show "$CANDIDATE_SHA:$p"
              echo "===== END EXACT FILE: $p ====="
            done
          } > review-packet/01_EXACT_CANDIDATE_BYTES.txt

          {
            echo "R8 v15-r1 SFV-45 — PART 2: EXACT SEMANTIC/SOURCE CONTRACTS"
            for spec in               "$SEMANTIC_SHA:governance-r8/R8-V15-NORMALIZED-EFFECTIVE-SPEC.md"               "$SEMANTIC_SHA:governance-r8/R8-V15-NORMALIZED-DETAIL-APPENDIX.md"               "$SEMANTIC_SHA:governance-r8/R8-V15-R1-GCP-P05-SEMANTIC-CORRECTION.json"               "$SEMANTIC_ACCEPTANCE_SHA:governance-r8/R8-V15-R1-GCP-P05-SEMANTIC-SUCCESSOR-INDEPENDENT-REVIEW.json"               "$SEMANTIC_ACCEPTANCE_SHA:governance-r8/R8-V15-R1-GCP-P05-SEMANTIC-SUCCESSOR-ACCEPTANCE.json"               "$SEMANTIC_SHA:governance-r8/R8-META-GOVERNANCE-PREREGISTRATION-V3.md"               "$SEMANTIC_SHA:governance-r8/R8-META-GOVERNANCE-PREREGISTRATION-V5.md"               "$SEMANTIC_SHA:governance-r8/R8-META-GOVERNANCE-PREREGISTRATION-V11.md"               "$SEMANTIC_SHA:governance-r8/R8-META-GOVERNANCE-PREREGISTRATION-V12.md"               "$SEMANTIC_SHA:governance-r8/R8-META-GOVERNANCE-PREREGISTRATION-V13.md"               "$SEMANTIC_SHA:governance-r8/R8-META-GOVERNANCE-PREREGISTRATION-V14.md"
            do
              ref="${spec%%:*}"
              p="${spec#*:}"
              echo
              echo "===== BEGIN EXACT SOURCE: $ref:$p ====="
              echo "git_blob_sha1=$(git rev-parse "$ref:$p")"
              echo "sha256=$(git show "$ref:$p" | sha256sum | awk '{print $1}')"
              git show "$ref:$p"
              echo "===== END EXACT SOURCE: $ref:$p ====="
            done
          } > review-packet/02_SEMANTIC_SOURCE_CONTRACTS.txt

          {
            echo "R8 v15-r1 SFV-45 — PART 3: FULL PROVENANCE SOURCE MAP + FINAL MATERIALIZED SPM"
            for p in               schemas/governance-r8/v15-r1/schema-provenance-source-map.json               schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json
            do
              echo
              echo "===== BEGIN EXACT FILE: $p ====="
              echo "git_blob_sha1=$(git rev-parse "$CANDIDATE_SHA:$p")"
              echo "sha256=$(git show "$CANDIDATE_SHA:$p" | sha256sum | awk '{print $1}')"
              git show "$CANDIDATE_SHA:$p"
              echo "===== END EXACT FILE: $p ====="
            done
          } > review-packet/03_PROVENANCE_AND_FULL_SPM.txt

      - name: Download and verify raw qualification artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, pathlib
          repo=os.environ['GITHUB_REPOSITORY']
          runs=[
            (os.environ['RUN_STAGE1'], os.environ['ART_STAGE1'], os.environ['ART_STAGE1_SHA256']),
            (os.environ['RUN_STAGE1_VERIFY'], os.environ['ART_STAGE1_VERIFY'], os.environ['ART_STAGE1_VERIFY_SHA256']),
            (os.environ['RUN_FINAL'], os.environ['ART_FINAL'], os.environ['ART_FINAL_SHA256']),
            (os.environ['RUN_FINAL_VERIFY'], os.environ['ART_FINAL_VERIFY'], os.environ['ART_FINAL_VERIFY_SHA256']),
          ]
          meta=[]
          for run_id, art_id, expected_digest in runs:
              run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert run['status']=='completed' and run['conclusion']=='success'
              arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}/artifacts']))['artifacts']
              art=[a for a in arts if str(a['id'])==art_id]
              assert len(art)==1
              art=art[0]
              assert art['digest']=='sha256:'+expected_digest
              assert not art['expired']
              meta.append({'run':run,'artifact':art})
          pathlib.Path('review-packet/run-and-artifact-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY

          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_STAGE1/zip" > review-packet/raw-artifacts/stage1.zip
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_STAGE1_VERIFY/zip" > review-packet/raw-artifacts/stage1-verify.zip
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_FINAL/zip" > review-packet/raw-artifacts/final.zip
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_FINAL_VERIFY/zip" > review-packet/raw-artifacts/final-verify.zip

          test "$(sha256sum review-packet/raw-artifacts/stage1.zip | awk '{print $1}')" = "$ART_STAGE1_SHA256"
          test "$(sha256sum review-packet/raw-artifacts/stage1-verify.zip | awk '{print $1}')" = "$ART_STAGE1_VERIFY_SHA256"
          test "$(sha256sum review-packet/raw-artifacts/final.zip | awk '{print $1}')" = "$ART_FINAL_SHA256"
          test "$(sha256sum review-packet/raw-artifacts/final-verify.zip | awk '{print $1}')" = "$ART_FINAL_VERIFY_SHA256"

          mkdir -p review-packet/raw-artifacts/stage1 review-packet/raw-artifacts/stage1-verify review-packet/raw-artifacts/final review-packet/raw-artifacts/final-verify
          unzip -q review-packet/raw-artifacts/stage1.zip -d review-packet/raw-artifacts/stage1
          unzip -q review-packet/raw-artifacts/stage1-verify.zip -d review-packet/raw-artifacts/stage1-verify
          unzip -q review-packet/raw-artifacts/final.zip -d review-packet/raw-artifacts/final
          unzip -q review-packet/raw-artifacts/final-verify.zip -d review-packet/raw-artifacts/final-verify

          test "$(sha256sum review-packet/raw-artifacts/final/final-r1/spm-final-v2-r1.json | awk '{print $1}')" = "$FINAL_SPM_SHA256"
          cmp -s review-packet/raw-artifacts/final/final-r1/spm-final-v2-r1.json schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json

      - name: Build raw evidence packet
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "R8 v15-r1 SFV-45 — PART 4: RAW QUALIFICATION / ATTESTATION / VERIFIER EVIDENCE"
            echo
            echo "===== RUN + ARTIFACT METADATA ====="
            cat review-packet/run-and-artifact-metadata.json

            echo
            echo "===== STAGE-R1 RAW GENERATION EVIDENCE ====="
            for p in               stage-r1-attestation-bundle.jsonl               stage-r1-output.json               stage-r1-same-run-verification.json               stage-r1/subject-manifest.json               stage-r1/enrollment-extension.json               stage-r1/qualified-binding.json               stage-r1/schema-freeze-traceability.json               stage-r1/schema-provenance-source-map.json               stage-r1/spm-qualified-v2-r1.sha256               stage-r1/workflow.yml
            do
              echo
              echo "----- $p -----"
              sha256sum "review-packet/raw-artifacts/stage1/$p"
              cat "review-packet/raw-artifacts/stage1/$p"
            done

            echo
            echo "===== STAGE-R1 INDEPENDENT POST-RUN EVIDENCE ====="
            for p in post-run-gh-attestation-verification.json post-run-verification.json
            do
              echo
              echo "----- $p -----"
              sha256sum "review-packet/raw-artifacts/stage1-verify/$p"
              cat "review-packet/raw-artifacts/stage1-verify/$p"
            done

            echo
            echo "===== FINAL FIXED-POINT RAW GENERATION EVIDENCE ====="
            for p in               final-r1-attestation-bundle.jsonl               final-r1-output.json               final-r1-same-run-verification.json               final-r1/final-subject-manifest.json               final-r1/enrollment-extension.json               final-r1/prior-post-run-verification.json               final-r1/qualified-binding.json               final-r1/schema-freeze-traceability.json               final-r1/schema-provenance-source-map.json               final-r1/spm-final-v2-r1.sha256               final-r1/workflow.yml
            do
              echo
              echo "----- $p -----"
              sha256sum "review-packet/raw-artifacts/final/$p"
              cat "review-packet/raw-artifacts/final/$p"
            done

            echo
            echo "===== FINAL INDEPENDENT POST-RUN EVIDENCE ====="
            for p in final-post-run-gh-attestation-verification.json final-post-run-verification.json
            do
              echo
              echo "----- $p -----"
              sha256sum "review-packet/raw-artifacts/final-verify/$p"
              cat "review-packet/raw-artifacts/final-verify/$p"
            done

            echo
            echo "===== MATERIALIZATION EVIDENCE FROM EVIDENCE-ONLY HEAD ====="
            git show "$EVIDENCE_HEAD_SHA:governance-r8/R8-V15-R1-R3-REVIEWED-SEMANTIC-FINAL-SPM-MATERIALIZATION-EVIDENCE.json"
            echo
            echo "===== FINAL VERIFIER EVIDENCE FROM EVIDENCE-ONLY HEAD ====="
            git show "$EVIDENCE_HEAD_SHA:governance-r8/R8-V15-R1-SPG1-R3-REVIEWED-SEMANTIC-FINAL-POST-RUN-VERIFICATION.json"
          } > review-packet/04_RAW_QUALIFICATION_EVIDENCE.txt

      - name: Build packet integrity manifest and all-in-one transport
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "R8 v15-r1 SFV-45 RAW REVIEW PACKET MANIFEST"
            echo "candidate=$CANDIDATE_SHA"
            echo "fixed_point=$FIXED_POINT_SHA"
            echo "semantic=$SEMANTIC_SHA"
            echo "semantic_acceptance=$SEMANTIC_ACCEPTANCE_SHA"
            echo "final_spm_sha256=$FINAL_SPM_SHA256"
            echo
            sha256sum review-packet/00_MANIFEST_AND_INSTRUCTIONS.txt                       review-packet/01_EXACT_CANDIDATE_BYTES.txt                       review-packet/02_SEMANTIC_SOURCE_CONTRACTS.txt                       review-packet/03_PROVENANCE_AND_FULL_SPM.txt                       review-packet/04_RAW_QUALIFICATION_EVIDENCE.txt
          } > review-packet/05_PACKET_SHA256_MANIFEST.txt

          cat             review-packet/00_MANIFEST_AND_INSTRUCTIONS.txt             review-packet/01_EXACT_CANDIDATE_BYTES.txt             review-packet/02_SEMANTIC_SOURCE_CONTRACTS.txt             review-packet/03_PROVENANCE_AND_FULL_SPM.txt             review-packet/04_RAW_QUALIFICATION_EVIDENCE.txt             review-packet/05_PACKET_SHA256_MANIFEST.txt             > review-packet/SFV45_R3_FULL_RAW_EVIDENCE_PACKET.txt

          sha256sum review-packet/SFV45_R3_FULL_RAW_EVIDENCE_PACKET.txt > review-packet/SFV45_R3_FULL_RAW_EVIDENCE_PACKET.sha256
          wc -c review-packet/*.txt

      - name: Upload review packet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-sfv45-r3-raw-review-packet
          path: |
            review-packet/00_MANIFEST_AND_INSTRUCTIONS.txt
            review-packet/01_EXACT_CANDIDATE_BYTES.txt
            review-packet/02_SEMANTIC_SOURCE_CONTRACTS.txt
            review-packet/03_PROVENANCE_AND_FULL_SPM.txt
            review-packet/04_RAW_QUALIFICATION_EVIDENCE.txt
            review-packet/05_PACKET_SHA256_MANIFEST.txt
            review-packet/SFV45_R3_FULL_RAW_EVIDENCE_PACKET.txt
            review-packet/SFV45_R3_FULL_RAW_EVIDENCE_PACKET.sha256
          if-no-files-found: error
          retention-days: 30
