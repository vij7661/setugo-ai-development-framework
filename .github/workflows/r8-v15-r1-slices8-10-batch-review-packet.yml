name: R8 v15-r1 Slices 8-10 Three-Loop Batch Review Packet

on:
  push:
    branches:
      - review/r8-v15-r1-slices8-10-three-loop-batch-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-IMPLEMENTATION-SLICES8-10-BATCH-REVIEW-PACKET-MARKER.json

permissions:
  contents: read
  actions: read

jobs:
  build-batch-review-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout review-only batch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure exact loop branches are fetched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin             implementation/r8-v15-r1-slice7-effect-intent-local-binding-2026-09-25             implementation/r8-v15-r1-slice8-effect-state-local-2026-09-25             implementation/r8-v15-r1-slice9-evidence-record-local-2026-09-25             implementation/r8-v15-r1-slice10-review-attestation-local-2026-09-25
          git cat-file -e 751162ee42c603cb6c84ee12021d16bab6fa626b^{commit}
          git cat-file -e fa94f8dd96bc54515baabf3f34ed37d25f41f6db^{commit}
          git cat-file -e 9d82c3f095fa08e81808d7e0d4c4b0a0a26556ea^{commit}
          git cat-file -e 33d112b5e2d3d6bc75fb07f14f6cf55c4d6b19f4^{commit}

      - name: Build exact seven-file three-loop batch review packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/build_r8_v15_r1_slices8_10_batch_review_packet.py
          test "$(find review-packet-slices8-10 -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Upload batch review packet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-slices8-10-three-loop-batch-review
          path: review-packet-slices8-10/*.txt
          if-no-files-found: error
          retention-days: 30
