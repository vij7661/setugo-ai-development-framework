name: R8 v15-r1 Slices 14-16 Review Packet

on:
  push:
    branches:
      - implementation/r8-v15-r1-slice16-rcs-evidence-local-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-IMPLEMENTATION-SLICES14-16-REVIEW-PACKET-MARKER.json

permissions:
  contents: read
  actions: read

jobs:
  build-review-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact seven-file batch packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/build_r8_v15_r1_slices14_16_review_packet.py
          test "$(find review-packet-slices14-16 -maxdepth 1 -type f | wc -l)" -eq 7
      - name: Upload review packet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-slices14-16-review-packet
          path: review-packet-slices14-16/*.txt
          if-no-files-found: error
          retention-days: 30
