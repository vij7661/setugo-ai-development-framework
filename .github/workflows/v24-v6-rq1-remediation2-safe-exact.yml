name: V24 V6 RQ1 Remediation 2 Exact Safe Slice

on:
  push:
    branches:
      - qualification/v24-i11-v6-runtime-qualification-1-remediation-2
      - qualification/v24-i11-v6-runtime-qualification-1-remediation-3
      - qualification/v24-i11-v6-runtime-qualification-1-remediation-4
      - qualification/v24-i11-v6-runtime-qualification-1-remediation-5
      - qualification/v24-i11-v6-runtime-qualification-1-remediation-6
    paths:
      - '.github/workflows/v24-v6-rq1-remediation2-safe-exact.yml'
      - 'governance-runtime/v24_v6_rq1_observer.py'
      - 'governance-runtime/v24_v6_rq1_remediation2_harness.py'
      - 'governance-runtime/test_v24_v6_rq1_crash_observation.py'
      - 'implementation/v24/V24-I11-V6-RQ1-REMEDIATION-2-ORACLE-CONTRACT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Compile remediation harness
        run: |
          set -euo pipefail
          python -m py_compile governance-runtime/v24_v6_rq1_observer.py
          python -m py_compile governance-runtime/v24_v6_rq1_remediation2_harness.py
          python governance-runtime/test_v24_v6_rq1_crash_observation.py
          python governance-runtime/validate_rq1_oracle_contract.py implementation/v24/V24-I11-V6-RQ1-REMEDIATION-2-ORACLE-CONTRACT.json
      - name: Assert governance boundary
        run: |
          set -euo pipefail
          grep -q 'CLOSED_PENDING_SUCCESSOR_REVIEW' governance-runtime/v24_v6_rq1_remediation2_harness.py
          grep -q 'NONE_EVIDENCE_ONLY' governance-runtime/v24_v6_rq1_remediation2_harness.py
          grep -q 'NOT_QUALIFIED' governance-runtime/v24_v6_rq1_remediation2_harness.py

  bound-runtime-safe-exact:
    needs: source-preflight
    runs-on: [self-hosted, v24-rq1]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rq1-worktree-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a fresh run-specific worktree so stale root-owned caches in the
          # legacy runner worktree cannot block checkout.  No runner state is
          # deleted or rewritten.
          path: rq1-worktree-${{ github.run_id }}
          fetch-depth: 0
      - name: Use fresh bound-runtime worktree
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/rq1-worktree-${GITHUB_RUN_ID}/governance-runtime"
          echo "RQ1_WORKTREE=$GITHUB_WORKSPACE/rq1-worktree-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Bounded workspace hygiene cleanup
        id: workspace_hygiene
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/v24-rq1-workspace-hygiene-${GITHUB_RUN_ID}.txt"
          worktree="$GITHUB_WORKSPACE/rq1-worktree-${GITHUB_RUN_ID}"
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workspace=$worktree"
            echo "before_root_owned_cache_files"
            sudo find "$worktree/governance-runtime" -type f -name '*.pyc' -printf '%u:%g %p\\n' 2>&1 || true
            # Scope is strictly this fresh checked-out governance-runtime tree.
            sudo find "$worktree/governance-runtime" -type f -name '*.pyc' -delete
            sudo find "$worktree/governance-runtime" -type d -name '__pycache__' -empty -delete
            echo "after_cache_files"
            if sudo find "$worktree/governance-runtime" -type f -name '*.pyc' -print -quit | grep -q .; then
              echo "workspace_hygiene=FAIL"
              exit 1
            fi
            echo "workspace_hygiene=PASS"
          } | tee "$report"
      - name: Prepare append-only evidence directory
        shell: bash
        run: |
          set -euo pipefail
          E="/var/lib/v24-rq1/runs/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA}"
          sudo mkdir -p "$E"
          sudo chown "$(id -u):$(id -g)" "$E"
          if test -f "$RUNNER_TEMP/v24-rq1-workspace-hygiene-${GITHUB_RUN_ID}.txt"; then
            cp "$RUNNER_TEMP/v24-rq1-workspace-hygiene-${GITHUB_RUN_ID}.txt" "$E/workspace-hygiene.txt"
          fi
          printf 'EVIDENCE_DIR=%s\n' "$E" >> "$GITHUB_ENV"
          printf 'HARNESS_RC=99\n' >> "$GITHUB_ENV"
      - name: Diagnose and restore exact bound runtime
        id: preflight
        shell: bash
        run: |
          set -uo pipefail
          ready=true
          {
            echo "runner=$RUNNER_NAME"
            preconditions=true
            test "$RUNNER_NAME" = 'v24-rq1-aws' || preconditions=false
            sudo -n true || preconditions=false
            id v24candidate || preconditions=false
            candidate_uid="$(id -u v24candidate 2>/dev/null || true)"
            test -n "$candidate_uid" && test "$candidate_uid" != '0' || preconditions=false
            if ! systemctl is-active --quiet v24-v6-trusted-authority.service || ! test -S /run/v24-v6-authority/service.sock; then
              echo "service inactive or socket unlinked; attempting restore"
              sudo systemctl restart v24-v6-trusted-authority.service || ready=false
            fi
            # Type=simple reaches active before serve() has necessarily bound the
            # socket and written service.pid.  Wait only for the original
            # invariants, with a bounded loop, and never treat partial readiness
            # as success.
            expected_service_hash='a9567ea1677456949e79bb64c06c6880426afcaaaa5235e5579ca3e62e7b021d'
            expected_service_mode='555'
            ready=false
            for attempt in $(seq 1 30); do
              attempt_ready="$preconditions"
              systemctl is-active --quiet v24-v6-trusted-authority.service || attempt_ready=false
              test -S /run/v24-v6-authority/service.sock || attempt_ready=false
              test -f /run/v24-v6-authority/service.pid || attempt_ready=false
              if test -S /run/v24-v6-authority/service.sock; then
                test "$(stat -c '%u:%g:%a' /run/v24-v6-authority/service.sock 2>/dev/null || true)" = '0:0:666' || attempt_ready=false
              fi
              if test -f /run/v24-v6-authority/service.pid; then
                service_pid="$(sudo -n cat /run/v24-v6-authority/service.pid 2>/dev/null || true)"
                case "$service_pid" in
                  ''|*[!0-9]*) attempt_ready=false ;;
                  *)
                    main_pid="$(systemctl show -p MainPID --value v24-v6-trusted-authority.service 2>/dev/null || true)"
                    test "$service_pid" = "$main_pid" || attempt_ready=false
                    sudo -n test -r "/proc/$service_pid/status" || attempt_ready=false
                    service_uid="$(sudo -n awk '/^Uid:/{print $2; exit}' "/proc/$service_pid/status" 2>/dev/null || true)"
                    service_exe="$(sudo -n readlink -f "/proc/$service_pid/exe" 2>/dev/null || true)"
                    service_hash="$(sudo -n sha256sum "/proc/$service_pid/exe" 2>/dev/null | awk '{print $1}' || true)"
                    test "$service_uid" = '0' || attempt_ready=false
                    test "$service_exe" = '/opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service' || attempt_ready=false
                    test "$service_hash" = "$expected_service_hash" || attempt_ready=false
                    if sudo -n -u v24candidate kill -0 "$service_pid" 2>/dev/null; then
                      echo "candidate_signal_probe=UNEXPECTED_SUCCESS"
                      attempt_ready=false
                    else
                      echo "candidate_signal_probe=DENIED"
                    fi
                    ;;
                esac
              fi
              test -d /run/v24-v6-authority || attempt_ready=false
              if test -d /run/v24-v6-authority; then
                test "$(stat -c '%u:%g' /run/v24-v6-authority 2>/dev/null || true)" = '0:0' || attempt_ready=false
              fi
              test -f /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service || attempt_ready=false
              if test -f /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service; then
                test "$(stat -c '%u:%a' /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service 2>/dev/null || true)" = "0:$expected_service_mode" || attempt_ready=false
                test "$(sha256sum /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service | awk '{print $1}')" = "$expected_service_hash" || attempt_ready=false
              fi
              if $attempt_ready; then
                ready=true
                echo "bound readiness achieved on attempt=$attempt"
                break
              fi
              echo "bound readiness pending attempt=$attempt"
              sleep 0.5
            done
            systemctl is-active v24-v6-trusted-authority.service || ready=false
            echo "--- unit ---"
            sudo systemctl cat v24-v6-trusted-authority.service || true
            echo "--- status ---"
            sudo systemctl status --no-pager -l v24-v6-trusted-authority.service || true
            echo "--- runtime dir ---"
            sudo find /run/v24-v6-authority -maxdepth 3 -printf '%M %u:%g %p -> %l\n' 2>&1 || true
            echo "--- trusted root ---"
            sudo find /opt/v24-v6-trusted-runtime -maxdepth 2 -printf '%M %u:%g %p -> %l\n' 2>&1 || true
            echo "--- journal ---"
            sudo journalctl -u v24-v6-trusted-authority.service -n 80 --no-pager -o short-iso 2>&1 || true
            echo "--- processes ---"
            ps -ef | grep -E 'v24_v6_trusted_authority_service|v24-v6-authority' | grep -v grep || true
            if test -S /run/v24-v6-authority/service.sock; then echo "socket_present=true"; else echo "socket_present=false"; ready=false; fi
            if test -f /run/v24-v6-authority/service.pid; then echo "pid_present=true"; else echo "pid_present=false"; ready=false; fi
            if test -f /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service; then
              sha256sum /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service
            else
              echo "service_binary_missing=true"; ready=false
            fi
            if command -v strace; then echo "strace_present=true"; else echo "strace_present=false"; fi
            echo "bound_ready=$ready"
          } 2>&1 | tee "$EVIDENCE_DIR/preflight.txt"
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$ready" > "$EVIDENCE_DIR/bound-ready.txt"
          exit 0
      - name: Execute exact safe RQ slice
        if: steps.preflight.outputs.ready == 'true'
        id: exact
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 governance-runtime/v24_v6_rq1_remediation2_harness.py --case RQ-13 --case RQ-14 --case RQ-15 --evidence-dir "$EVIDENCE_DIR" | tee "$EVIDENCE_DIR/run-summary.json"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/exit-code.txt"
          sha256sum governance-runtime/v24_v6_rq1_remediation2_harness.py > "$EVIDENCE_DIR/harness.sha256"
          sha256sum governance-runtime/v24_v6_rq1_observer.py > "$EVIDENCE_DIR/observer.sha256"
          if test -f "$EVIDENCE_DIR/RQ1-remediation2-targeted-bundle.json"; then
            sha256sum "$EVIDENCE_DIR/RQ1-remediation2-targeted-bundle.json" > "$EVIDENCE_DIR/bundle.sha256"
          fi
          printf 'HARNESS_RC=%s\n' "$rc" >> "$GITHUB_ENV"
          exit 0
      - name: Build self-contained Remediation-5 review bundle
        if: steps.preflight.outcome == 'success' && steps.workspace_hygiene.outcome == 'success' && steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$EVIDENCE_DIR/remediation-6-review-bundle"
          mkdir -p "$BUNDLE/source" "$BUNDLE/design" "$BUNDLE/raw-evidence"
          git cat-file -e 479ce0459b6065bc2626b56c9faf5cb31f7b7558^{commit}
          git diff 479ce0459b6065bc2626b56c9faf5cb31f7b7558 "$GITHUB_SHA" > "$BUNDLE/exact-diff-from-remediation-4.patch"
          cp governance-runtime/v24_v6_rq1_remediation2_harness.py "$BUNDLE/source/"
          cp governance-runtime/v24_v6_rq1_observer.py "$BUNDLE/source/"
          cp governance-runtime/test_v24_v6_rq1_crash_observation.py "$BUNDLE/source/"
          cp governance-runtime/validate_rq1_oracle_contract.py "$BUNDLE/source/"
          cp implementation/v24/V24-I11-V6-RQ1-REMEDIATION-2-ORACLE-CONTRACT.json "$BUNDLE/design/"
          cp implementation/v24/V24-I11-V6-RQ1-REMEDIATION-2-ORACLE-CONTRACT.md "$BUNDLE/design/"
          cp implementation/v24/V24-I11-V6-RUNTIME-QUALIFICATION-1-PLAN.md "$BUNDLE/design/"
          cp implementation/v24/V24-I11-V6-RQ1-REMAINING-CASE-EXECUTION-PLAN-20260919.md "$BUNDLE/design/"
          python governance-runtime/test_v24_v6_rq1_crash_observation.py > "$BUNDLE/regression-tests.txt"
          python governance-runtime/validate_rq1_oracle_contract.py implementation/v24/V24-I11-V6-RQ1-REMEDIATION-2-ORACLE-CONTRACT.json > "$BUNDLE/oracle-validator.txt"
          find "$EVIDENCE_DIR" -mindepth 1 -maxdepth 1 ! -name remediation-5-review-bundle -exec cp -a {} "$BUNDLE/raw-evidence/" \;
          {
            echo "commit=$GITHUB_SHA"
            git rev-parse HEAD^{tree} | sed 's/^/tree=/'
            echo "workflow_run=${{ github.run_id }}"
            echo "workflow_job=${{ github.job }}"
          echo "artifact_name=rq1-remediation6-exact-safe-${GITHUB_SHA}"
            echo "governance=NOT_QUALIFIED,CLOSED_PENDING_SUCCESSOR_REVIEW,NONE_EVIDENCE_ONLY"
          } > "$BUNDLE/manifest.txt"
          find "$BUNDLE" -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > "$BUNDLE/manifest.sha256"
          test -s "$BUNDLE/manifest.txt"
          test -s "$BUNDLE/manifest.sha256"
          test -s "$BUNDLE/exact-diff-from-remediation-4.patch"
          test -s "$BUNDLE/source/v24_v6_rq1_remediation2_harness.py"
          test -s "$BUNDLE/source/v24_v6_rq1_observer.py"
          test -s "$BUNDLE/source/test_v24_v6_rq1_crash_observation.py"
          test -s "$BUNDLE/source/validate_rq1_oracle_contract.py"
          test -s "$BUNDLE/regression-tests.txt"
          test -s "$BUNDLE/oracle-validator.txt"
          for c in RQ-13 RQ-14 RQ-15; do
            test -s "$BUNDLE/raw-evidence/$c.result.json"
            test -s "$BUNDLE/raw-evidence/$c.baseline.observer.json"
            test -s "$BUNDLE/raw-evidence/$c.prepared.observer.json"
            test -s "$BUNDLE/raw-evidence/$c.boundary.json"
            test -s "$BUNDLE/raw-evidence/$c.recovery.observer.json"
            test -s "$BUNDLE/raw-evidence/$c.post-retry.observer.json"
            test -s "$BUNDLE/raw-evidence/$c.post-replay.observer.json"
          done
      - name: Stage evidence for artifact
        id: stage_evidence
        if: steps.preflight.outcome == 'success' && steps.workspace_hygiene.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rq1-remediation2-evidence
          mkdir rq1-remediation2-evidence
          cp -a "$EVIDENCE_DIR"/. rq1-remediation2-evidence/
      - uses: actions/upload-artifact@v4
        if: steps.stage_evidence.outcome == 'success'
        with:
          name: rq1-remediation6-exact-safe-${{ github.sha }}
          path: rq1-worktree-${{ github.run_id }}/rq1-remediation2-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on RED or harness defect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.preflight.outputs.ready }}" = "true"
          test "${HARNESS_RC:-99}" = "0"
