name: V24 V6 RQ1 Remediation 2 Exact Safe Slice

on:
  push:
    branches:
      - qualification/v24-i11-v6-runtime-qualification-1-remediation-2
    paths:
      - '.github/workflows/v24-v6-rq1-remediation2-safe-exact.yml'
      - 'governance-runtime/v24_v6_rq1_observer.py'
      - 'governance-runtime/v24_v6_rq1_remediation2_harness.py'
      - 'implementation/v24/V24-I11-V6-RQ1-REMEDIATION-2-ORACLE-CONTRACT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Compile remediation harness
        run: |
          set -euo pipefail
          python -m py_compile governance-runtime/v24_v6_rq1_observer.py
          python -m py_compile governance-runtime/v24_v6_rq1_remediation2_harness.py
          python governance-runtime/validate_rq1_oracle_contract.py implementation/v24/V24-I11-V6-RQ1-REMEDIATION-2-ORACLE-CONTRACT.json
      - name: Assert governance boundary
        run: |
          set -euo pipefail
          grep -q 'CLOSED_PENDING_SUCCESSOR_REVIEW' governance-runtime/v24_v6_rq1_remediation2_harness.py
          grep -q 'NONE_EVIDENCE_ONLY' governance-runtime/v24_v6_rq1_remediation2_harness.py
          grep -q 'NOT_QUALIFIED' governance-runtime/v24_v6_rq1_remediation2_harness.py

  bound-runtime-safe-exact:
    needs: source-preflight
    runs-on: [self-hosted, v24-rq1]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Prepare append-only evidence directory
        shell: bash
        run: |
          set -euo pipefail
          E="/var/lib/v24-rq1/runs/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA}"
          sudo mkdir -p "$E"
          sudo chown "$(id -u):$(id -g)" "$E"
          printf 'EVIDENCE_DIR=%s\n' "$E" >> "$GITHUB_ENV"
          printf 'HARNESS_RC=99\n' >> "$GITHUB_ENV"
      - name: Verify exact bound runner and restore trusted service
        id: preflight
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo "runner=$RUNNER_NAME"
            test "$RUNNER_NAME" = 'v24-rq1-aws'
            sudo -n true
            id v24candidate
            if ! systemctl is-active --quiet v24-v6-trusted-authority.service; then
              echo "service inactive; restoring trusted service"
              sudo systemctl restart v24-v6-trusted-authority.service
            fi
            systemctl is-active v24-v6-trusted-authority.service
            test -S /run/v24-v6-authority/service.sock
            test -f /run/v24-v6-authority/service.pid
            sha256sum /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service
            if command -v strace; then echo "strace_present=true"; else echo "strace_present=false"; fi
          } 2>&1 | tee "$EVIDENCE_DIR/preflight.txt"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/preflight-exit-code.txt"
          exit "$rc"
      - name: Execute exact safe RQ slice
        if: steps.preflight.outcome == 'success'
        id: exact
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python governance-runtime/v24_v6_rq1_remediation2_harness.py --safe-slice --evidence-dir "$EVIDENCE_DIR" | tee "$EVIDENCE_DIR/run-summary.json"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/exit-code.txt"
          sha256sum governance-runtime/v24_v6_rq1_remediation2_harness.py > "$EVIDENCE_DIR/harness.sha256"
          sha256sum governance-runtime/v24_v6_rq1_observer.py > "$EVIDENCE_DIR/observer.sha256"
          if test -f "$EVIDENCE_DIR/RQ1-remediation2-targeted-bundle.json"; then
            sha256sum "$EVIDENCE_DIR/RQ1-remediation2-targeted-bundle.json" > "$EVIDENCE_DIR/bundle.sha256"
          fi
          printf 'HARNESS_RC=%s\n' "$rc" >> "$GITHUB_ENV"
          exit 0
      - name: Stage evidence for artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rq1-remediation2-evidence
          mkdir rq1-remediation2-evidence
          cp -a "$EVIDENCE_DIR"/. rq1-remediation2-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rq1-remediation2-exact-safe-${{ github.sha }}
          path: rq1-remediation2-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on RED or harness defect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.preflight.outcome }}" = "success"\n          test "${HARNESS_RC:-99}" = "0"
