name: R8 v15-r1 IG-1 Successor1 Mechanical Materialization

on:
  push:
    branches:
      - governance/r8-v15-r1-integration-gate1-proposal-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-IG1-SUCCESSOR1-ACTIVATION.json

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify activation and reviewed integration machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('.')
          a=json.loads((root/'governance-r8/R8-V15-R1-IG1-SUCCESSOR1-ACTIVATION.json').read_text())
          if a['status']!='ACTIVE_EXPLICIT_USER_APPROVAL': raise SystemExit('bad activation status')
          if a['proposal_id']!='R8V15R1-IG1-MECHANICAL-INTEGRATION-SUCCESSOR1': raise SystemExit('bad proposal id')
          pc=a['exact_proposal_commit']
          subprocess.check_call(['git','cat-file','-e',pc+'^{commit}'])
          ppath='governance-r8/R8-V15-R1-INTEGRATION-GATE1-SUCCESSOR1-PROPOSAL.json'
          proposal_blob=subprocess.check_output(['git','rev-parse',f'{pc}:{ppath}'],text=True).strip()
          if proposal_blob!=a['proposal_blob_sha1']: raise SystemExit('proposal blob mismatch at exact proposal commit')
          current_proposal_blob=subprocess.check_output(['git','rev-parse',f'HEAD:{ppath}'],text=True).strip()
          if current_proposal_blob!=a['proposal_blob_sha1']: raise SystemExit('current proposal bytes differ from approved proposal')
          if a['independent_review_disposition']!='BOUNDED_PASS': raise SystemExit('review disposition not bounded pass')
          if a['critical_findings']!=0 or a['high_findings']!=0: raise SystemExit('review findings block activation')
          for path,blob in a['bound_integration_machinery_blobs'].items():
              got=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
              if got!=blob: raise SystemExit(f'machinery blob mismatch {path}: {got} != {blob}')
          print('ACTIVATION_PROPOSAL_REVIEW_AND_MACHINERY_BINDING_PASS')
          PY
      - name: Preflight before any materialization
        run: python3 tools/r8_v15_r1_ig1_successor1_materialize.py --preflight-only
      - name: Create candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c integration/r8-v15-r1-ig1-successor1-candidate-${GITHUB_SHA::12}
      - name: Materialize exact allowlisted entries and run strict oracle
        run: python3 tools/r8_v15_r1_ig1_successor1_materialize.py
      - name: Commit non-authoritative integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance-runtime .github/workflows governance-r8/R8-V15-R1-IG1-SUCCESSOR1-INTEGRATED-CANDIDATE-MANIFEST.json
          git commit -m "integration(r8): materialize IG-1 successor1 non-authoritative candidate"
          git push origin HEAD
          echo "INTEGRATED_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Record candidate identity
        run: |
          echo "Integrated candidate: $INTEGRATED_CANDIDATE_SHA"
          echo "Status: NON_AUTHORITATIVE_PENDING_FRESH_INDEPENDENT_REVIEW"
