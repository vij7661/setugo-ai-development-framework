name: Review Safe Evidence V16 Slice 2 Independence V4

on:
  push:
    branches: [implementation/review-safe-evidence-v16]
    paths:
      - 'governance-runtime/review_safe_evidence_v16_trust.py'
      - 'governance-runtime/review_safe_evidence_v16_independence.py'
      - 'governance-runtime/review_safe_evidence_v16_independence_v2.py'
      - 'governance-runtime/test_review_safe_evidence_v16_trust.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_v2.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_iar2.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_iar3.py'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-v2.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar1.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar2.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar3.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-current-manifests.json'
      - 'governance-runtime/requirements-review-safe-evidence-v16.txt'
      - 'implementation/review-safe-evidence/V16-SLICE-2-IAR3-REPAIR-CONTRACT.md'
      - '.github/workflows/review-safe-evidence-v16-slice2-independence-v4.yml'
permissions: {contents: read}
concurrency:
  group: review-safe-evidence-v16-slice2-v4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independence-iar3-repair-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - name: Record candidate and verify exact dependency blobs
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git hash-object governance-runtime/review_safe_evidence_v16_trust.py)" = "7030d6643e76743cf086f7749292442bdadc3262"
          test "$(git hash-object governance-runtime/review_safe_evidence_v16_independence.py)" = "268095665ff8b414c532bb9289437ca72782e8db"
          test "$(git hash-object governance-runtime/review_safe_evidence_v16_independence_v2.py)" = "9f74ba848264a099280a4f1b5a5ce505b4f17c37"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_trust.py)" = "41cdb6a6caccd1a24797f0859f50ece557c83ea0"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_independence.py)" = "8ed790401280862796ea1f79eadb17f18cfe7ff8"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_independence_v2.py)" = "f5f130543641d7675fe4eba9f52dca969d52d74e"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_independence_iar2.py)" = "d62eb7cde62805ace95b1dff6d27a08cdf295213"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_independence_iar3.py)" = "7537c9517366bbff30c430306975da3b4caf6b96"
          echo "V16_SLICE1_FROZEN_COMMIT=36f22a35ff57b6994d55c705c08686609276ddb3"
          echo "V16_SLICE2_CORE_BLOB=EXACT_MATCH"
          echo "V16_SLICE2_BOUND_WRAPPER_BLOB=EXACT_MATCH"
          echo "V16_SLICE2_TEST_BLOBS=EXACT_MATCH"
          echo "IMPLEMENTATION_QUALIFICATION=NOT_CLAIMED"
          echo "RUNTIME_QUALIFICATION=NOT_CLAIMED"
          echo "AUTHORITY_EFFECT=NONE_EVIDENCE_ONLY"
      - name: Install pinned crypto dependency
        run: |
          python -m pip install --disable-pip-version-check -r governance-runtime/requirements-review-safe-evidence-v16.txt
          python - <<'PY'
          import cryptography
          assert cryptography.__version__ == "46.0.4", cryptography.__version__
          print("V16_SLICE2_CRYPTOGRAPHY_VERSION=" + cryptography.__version__)
          PY
      - name: Compile Slice 2 source and tests
        run: |
          python -m compileall -q \
            governance-runtime/review_safe_evidence_v16_trust.py \
            governance-runtime/review_safe_evidence_v16_independence.py \
            governance-runtime/review_safe_evidence_v16_independence_v2.py \
            governance-runtime/test_review_safe_evidence_v16_trust.py \
            governance-runtime/test_review_safe_evidence_v16_independence.py \
            governance-runtime/test_review_safe_evidence_v16_independence_v2.py \
            governance-runtime/test_review_safe_evidence_v16_independence_iar2.py \
            governance-runtime/test_review_safe_evidence_v16_independence_iar3.py
      - name: Run Slice 2 mandatory adversarial tests
        working-directory: governance-runtime
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/v16-slice2-v4-unittest.log"
          python -m unittest -v \
            test_review_safe_evidence_v16_independence.py \
            test_review_safe_evidence_v16_independence_v2.py \
            test_review_safe_evidence_v16_independence_iar2.py \
            test_review_safe_evidence_v16_independence_iar3.py 2>&1 | tee "$LOG"
          echo "V16_SLICE2_TEST_LOG=$LOG" >> "$GITHUB_ENV"
      - name: Verify current stable manifests against source and raw execution log
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json, os, pathlib, re, subprocess
          root=pathlib.Path("governance-runtime")
          baseline_source=root/"test_review_safe_evidence_v16_independence.py"
          iar3_source=root/"test_review_safe_evidence_v16_independence_iar3.py"
          source_paths=[
              baseline_source,
              root/"test_review_safe_evidence_v16_independence_v2.py",
              root/"test_review_safe_evidence_v16_independence_iar2.py",
              iar3_source,
          ]
          manifest_paths=[
              root/"review-safe-evidence-v16-slice2-test-manifest-v2.json",
              root/"review-safe-evidence-v16-slice2-test-manifest-iar1.json",
              root/"review-safe-evidence-v16-slice2-test-manifest-iar2.json",
              root/"review-safe-evidence-v16-slice2-test-manifest-iar3.json",
          ]
          manifests=[json.loads(p.read_text(encoding="utf-8")) for p in manifest_paths]
          expected_manifest_ids=[
              "REVIEW-SAFE-EVIDENCE-V16-SLICE2-MANDATORY-TESTS-002",
              "REVIEW-SAFE-EVIDENCE-V16-SLICE2-IAR1-MANDATORY-TESTS-001",
              "REVIEW-SAFE-EVIDENCE-V16-SLICE2-IAR2-MANDATORY-TESTS-001",
              "REVIEW-SAFE-EVIDENCE-V16-SLICE2-IAR3-MANDATORY-TESTS-001",
          ]
          assert [m["manifest_id"] for m in manifests] == expected_manifest_ids
          for manifest in manifests:
              assert type(manifest["schema_version"]) is int and manifest["schema_version"] == 1
              assert manifest["slice_id"] == "V16-S2-CONTROL-DOMAIN-INDEPENDENCE"
              assert manifest["slice1_frozen_commit"] == "36f22a35ff57b6994d55c705c08686609276ddb3"
              assert manifest["authority_effect"] == "NONE_EVIDENCE_ONLY"
              assert manifest["implementation_qualification"] == "NOT_CLAIMED"
              assert manifest["runtime_qualification"] == "NOT_CLAIMED"
          baseline=manifests[0]
          assert baseline["semantic_revision"] == 2
          assert baseline["supersedes_manifest_id"] == "REVIEW-SAFE-EVIDENCE-V16-SLICE2-MANDATORY-TESTS-001"
          assert baseline["test_source_git_blob_sha"] == "8ed790401280862796ea1f79eadb17f18cfe7ff8"
          assert subprocess.check_output(["git","hash-object",str(baseline_source)],text=True).strip() == baseline["test_source_git_blob_sha"]
          assert "Fail-closed global promotion" in baseline["semantic_change_reason"]
          assert all(row["requirement_test_id"].startswith("V16-S2-B2-") for row in baseline["tests"])
          assert manifests[3]["test_source_git_blob_sha"] == "7537c9517366bbff30c430306975da3b4caf6b96"
          assert subprocess.check_output(["git","hash-object",str(iar3_source)],text=True).strip() == manifests[3]["test_source_git_blob_sha"]
          historical=json.loads((root/"review-safe-evidence-v16-slice2-test-manifest.json").read_text(encoding="utf-8"))
          assert historical["manifest_id"] == "REVIEW-SAFE-EVIDENCE-V16-SLICE2-MANDATORY-TESTS-001"
          index=json.loads((root/"review-safe-evidence-v16-slice2-current-manifests.json").read_text(encoding="utf-8"))
          assert index["current_baseline_manifest_id"] == expected_manifest_ids[0]
          assert index["current_manifest_ids"] == expected_manifest_ids
          assert index["historical_manifest_ids"] == [historical["manifest_id"]]
          assert historical["manifest_id"] not in index["current_manifest_ids"]
          assert index["authority_effect"] == "NONE_EVIDENCE_ONLY"
          rows=[row for manifest in manifests for row in manifest["tests"]]
          assert rows and all(row["mandatory"] is True for row in rows)
          requirement_ids=[row["requirement_test_id"] for row in rows]
          declared=[row["python_test_id"] for row in rows]
          assert len(rows)==61,len(rows)
          assert len(requirement_ids)==len(set(requirement_ids))
          assert len(declared)==len(set(declared))
          discovered=[]
          for source in source_paths:
              tree=ast.parse(source.read_text(encoding="utf-8"),filename=str(source))
              module=source.stem
              for node in tree.body:
                  if isinstance(node,ast.ClassDef):
                      for child in node.body:
                          if isinstance(child,(ast.FunctionDef,ast.AsyncFunctionDef)) and child.name.startswith("test_"):
                              discovered.append(f"{module}.{node.name}.{child.name}")
          log=pathlib.Path(os.environ["V16_SLICE2_TEST_LOG"]).read_text(encoding="utf-8",errors="strict")
          executed=re.findall(
              r"^test_[A-Za-z0-9_]+ \((test_review_safe_evidence_v16_independence(?:_v2|_iar2|_iar3)?\.[A-Za-z0-9_]+\.[A-Za-z0-9_]+)\) \.\.\. ok$",
              log,flags=re.MULTILINE,
          )
          assert len(discovered)==61,len(discovered)
          assert len(executed)==61,len(executed)
          assert set(declared)==set(discovered),sorted(set(declared)^set(discovered))
          assert set(declared)==set(executed),sorted(set(declared)^set(executed))
          assert "skipped=" not in log
          assert "FAILED" not in log
          assert "\nOK\n" in log
          print("V16_SLICE2_MANDATORY_TESTS_VERIFIED=61")
          print("V16_SLICE2_SOURCE_MANIFEST_EXECUTION_SET_EQUALITY=PASS")
          print("V16_SLICE2_CURRENT_BASELINE_MANIFEST=SEMANTIC_REVISION_2")
          print("V16_SLICE2_HISTORICAL_BASELINE_CURRENT=false")
          print("V16_SLICE2_COMPOSITE_MANIFEST=30_PLUS_15_PLUS_8_PLUS_8")
          PY
      - name: Construction boundary
        run: |
          echo "V16_SLICE2_IAR3_REPAIRS=CONSTRUCTION_PASS_NONAUTHORITATIVE"
          echo "V16_SLICE2_OUTER_BINDING_QUORUM=GRAPH_REPRESENTED_NONCANDIDATE_PAIRWISE_INDEPENDENT"
          echo "V16_SLICE2_BASELINE_MANIFEST_IDENTITY=REVISIONED_AND_SOURCE_BLOB_BOUND"
          echo "V16_SLICE2_DIRECT_CORE_DOWNGRADE=BLOCKED"
          echo "V16_SLICE2_BOOTSTRAP_ROOT_QUORUM=GRAPH_REPRESENTED_NONCANDIDATE_PAIRWISE_INDEPENDENT"
          echo "V16_SLICE2_REGISTRY_BOOTSTRAP_QUORUM=REQUALIFIED_THROUGH_CONTROL_GRAPH"
          echo "V16_SLICE2_GLOBAL_PROMOTION_BLOCKING=ENFORCED_WHILE_REAL_WORLD_COMPLETENESS_UNPROVEN"
          echo "V16_SLICE2_VALIDATOR_ARTIFACT_MEASUREMENT=LOCAL_SOURCE_BYTES_SELF_MEASURED"
          echo "V16_SLICE2_VALIDATOR_ARTIFACT_MEASUREMENT_INDEPENDENTLY_PROVEN=false"
          echo "V16_SLICE2_GENERATION_CURRENTNESS=LOCAL_EQUALITY_CONTRACT_NOT_FINAL_AUTHENTICATED_GENERATION_MECHANISM"
          echo "V16_SLICE2_GRAPH_COMPLETENESS_REAL_WORLD_PROVEN=false"
          echo "V16_SLICE2_TRUST_HEAD_PROVISIONING=OUT_OF_BAND_NOT_PROVEN"
          echo "INTERNAL_ADVERSARIAL_REVIEW_EXHAUSTED=false"
          echo "IMPLEMENTATION_QUALIFICATION=NOT_CLAIMED"
          echo "RUNTIME_QUALIFICATION=NOT_CLAIMED"
          echo "SCIENTIFIC_AUTHORITY=NOT_CLAIMED"
          echo "AUTHORITY_EFFECT=NONE_EVIDENCE_ONLY"
