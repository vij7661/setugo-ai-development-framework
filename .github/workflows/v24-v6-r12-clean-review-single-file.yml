name: V24 V6 R12 Single File Clean Manual Review Bundle

on:
  push:
    branches:
      - review/v24-i11-v6-r12-external-authority
    paths:
      - '.github/workflows/v24-v6-r12-clean-review-single-file.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-single-file-review-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Fetch exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='e887613f4e9012be59dcd8c4840035748ee0de7e'
          CANDIDATE_TREE='c584cf728ca70c663ba04cf4bfb50fd29f5f1e0f'
          REVIEW_AUTH='f36191d039c711f693a3aaf3e1f34c975c3192ab'
          INSTRUCTIONS_COMMIT='a0de986fd97cd778e057d344d5973edde7445e0e'
          DESIGN_COMMIT='0e1c6dd99e608d6771df98549bb28a9b92b8e7a0'
          DESIGN_SOURCE='remediation/v24/V24-I11-SYSTEMIC-REMEDIATION-DESIGN-V6-CLEAN-REVIEW-PACKET.md'

          git fetch --no-tags --depth=1 origin "$CANDIDATE"
          git fetch --no-tags --depth=1 origin "$REVIEW_AUTH"
          git fetch --no-tags --depth=1 origin "$INSTRUCTIONS_COMMIT"
          git fetch --no-tags --depth=1 origin "$DESIGN_COMMIT"

          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$DESIGN_COMMIT:$DESIGN_SOURCE")" = '8682df137aa12d57927e7891c16048e90b04caac'
          test "$(git rev-parse "$INSTRUCTIONS_COMMIT:review/v24/V24-I11-V6-R12-CLEAN-SUCCESSOR-REVIEW-INSTRUCTIONS.md")" = 'c8fb94632b5dd037b712d211c06f6945f079382c'

          echo "R12_CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          echo "R12_CANDIDATE_TREE=$CANDIDATE_TREE" >> "$GITHUB_ENV"
          echo "R12_REVIEW_AUTH=$REVIEW_AUTH" >> "$GITHUB_ENV"
          echo "R12_INSTRUCTIONS_COMMIT=$INSTRUCTIONS_COMMIT" >> "$GITHUB_ENV"
          echo "R12_DESIGN_COMMIT=$DESIGN_COMMIT" >> "$GITHUB_ENV"
          echo "R12_DESIGN_SOURCE=$DESIGN_SOURCE" >> "$GITHUB_ENV"

      - name: Verify frozen review-side identities
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1" expected="$2"
            local actual
            actual="$(git rev-parse "$R12_REVIEW_AUTH:$path")"
            test "$actual" = "$expected" || { echo "REVIEW_OBJECT_BLOB_MISMATCH:$path:$actual:$expected"; exit 1; }
          }
          check_blob review/v24/V24-I11-V6-R12-CONSTRUCTION-EVIDENCE.md 8ca12f8bd0139ddab77d4fe717881accf5e523f3
          check_blob review/v24/V24-I11-V6-R12-CONSTRUCTION-RED-001.md b9309d5e928e2c5a4608cf37aa72362c2e3acf2f
          check_blob review/v24/V24-I11-V6-R12-FROZEN-SUCCESSOR-BINDING.json 9f0551e9adeafd0511e5c2f07bae9370a420025d
          check_blob review/v24/r12_trusted_external_guard.py 28e82a1e995fea9b585950e8ea33886f3f900fcf
          check_blob review/v24/r12_trusted_test_parent.py 8d7dbb76f766c8314dfd8143cf6be0b6961f4359
          check_blob review/v24/r12_untrusted_test_worker.py e20534e76652c9019c93ffd69787b659d5f7d807
          check_blob review/v24/r12_trusted_adversarial_evidence.py a0a4a58fe066ad4f12e5161d097642ba28dbf460
          check_blob .github/workflows/v24-v6-r12-trust-boundary-construction-v2.yml 762f78d1b2844e6aa89224e27bf44fdaca8c2e72
          check_blob .github/workflows/v24-v6-r12-trust-boundary-construction.yml a8b6f7103bd7d5aa8feaee47f5d762e16c76ef67

      - name: Download frozen R12 construction evidence artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10321730032/zip"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$url" -o "$RUNNER_TEMP/r12-construction-evidence.zip"
          echo '9cab1354dc01e189a6d52ef2a57448fe829182797bfe4d6164f67ff358ba8c8b  '"$RUNNER_TEMP/r12-construction-evidence.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/r12-artifact"
          unzip -q "$RUNNER_TEMP/r12-construction-evidence.zip" -d "$RUNNER_TEMP/r12-artifact"

      - name: Build and independently re-verify single Markdown bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/build_r12_review_md.py" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          CANDIDATE = os.environ['R12_CANDIDATE']
          CANDIDATE_TREE = os.environ['R12_CANDIDATE_TREE']
          REVIEW_AUTH = os.environ['R12_REVIEW_AUTH']
          INSTRUCTIONS_COMMIT = os.environ['R12_INSTRUCTIONS_COMMIT']
          DESIGN_COMMIT = os.environ['R12_DESIGN_COMMIT']
          DESIGN_SOURCE = os.environ['R12_DESIGN_SOURCE']
          ART = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r12-artifact'
          OUT = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r12-clean-review-single-file'
          OUT.mkdir(parents=True, exist_ok=True)
          MD = OUT / 'V24-I11-V6-R12-CLEAN-MANUAL-REVIEW.md'

          PINSET_SHA = '8f6ca5108354cadacbf9b836faffb3f27e8b87fbb9bba981529148693f95429e'
          PARENT_SHA = 'ee9b3c3400eb6c6dcdba6d8ba656e5787da0f43c65f88b510e93da37887f70b3'
          ADV_SHA = '02c48e384f268033ec3058f93216ca105f23d20f84f412178f8c95ce5acf06c3'
          BOUNDARY_SHA = '9450cc020ef6d65597ef5a99eeba772622c2084b737ba1269c4ce27e03a19c5f'
          VERIFY_SHA = '2072551ad91b0db51f80a681b5e802cf1256b60d5b6c97f362addd359d7c0d7f'
          DESIGN_SOURCE_SHA = '5164747405b2de4d97228318a200e97c6b9c0e2afe58e4daddf09fe804bbc9d9'
          DESIGN_SOURCE_BYTES = 19296
          DESIGN_INSERT_OFFSET = 17321
          DESIGN_PRECONDITION = b'## 18A. Mandatory V6 adversarial review checks'
          DESIGN_SHA = '96ec464fbf602ac6b8c89fca5af16aa71a8d53f9f042605e46a07b4cd628ca62'
          DESIGN_BLOB = '4a15d50a0488464816d235b273d1dbf808fdce94'
          DESIGN_BYTES = 19297
          DESIGN_BODY_SHA = '286217399947144630c29e991c3529dfee64d382be08a6ccd3f87e9fc5173ad5'

          def git_bytes(spec: str) -> bytes:
              return subprocess.check_output(['git', 'show', spec])

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          def must_utf8(data: bytes, label: str) -> str:
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError as exc:
                  raise SystemExit(f'NON_UTF8_REVIEW_OBJECT:{label}:{exc}')
              if text.encode('utf-8') != data:
                  raise SystemExit(f'UTF8_ROUNDTRIP_MISMATCH:{label}')
              return text

          artifact_files = {
              'external/V24-I11-V6-R12-EXTERNAL-PINSET.json': ('V24-I11-V6-R12-EXTERNAL-PINSET.json', PINSET_SHA),
              'external/V24-I11-V6-R12-PARENT-RESULT.txt': ('V24-I11-V6-R12-PARENT-RESULT.txt', PARENT_SHA),
              'external/V24-I11-V6-R12-ADVERSARIAL-EVIDENCE.json': ('V24-I11-V6-R12-ADVERSARIAL-EVIDENCE.json', ADV_SHA),
              'external/V24-I11-V6-R12-EXECUTION-BOUNDARY-EVIDENCE.json': ('V24-I11-V6-R12-EXECUTION-BOUNDARY-EVIDENCE.json', BOUNDARY_SHA),
              'external/V24-I11-V6-R12-CONSTRUCTION-VERIFICATION.json': ('V24-I11-V6-R12-CONSTRUCTION-VERIFICATION.json', VERIFY_SHA),
          }

          entries: list[dict] = []

          def add(path: str, data: bytes, source_class: str) -> None:
              must_utf8(data, path)
              entries.append({
                  'path': path,
                  'bytes': len(data),
                  'sha256': sha256(data),
                  'source_class': source_class,
                  'data': data,
              })

          instructions = git_bytes(f'{INSTRUCTIONS_COMMIT}:review/v24/V24-I11-V6-R12-CLEAN-SUCCESSOR-REVIEW-INSTRUCTIONS.md')
          add('00-REVIEW-INSTRUCTIONS.md', instructions, 'CLEAN_REVIEW_METADATA')

          review_files = {
              'review/V24-I11-V6-R12-FROZEN-SUCCESSOR-BINDING.json': 'review/v24/V24-I11-V6-R12-FROZEN-SUCCESSOR-BINDING.json',
              'evidence/V24-I11-V6-R12-CONSTRUCTION-EVIDENCE.md': 'review/v24/V24-I11-V6-R12-CONSTRUCTION-EVIDENCE.md',
              'evidence/V24-I11-V6-R12-CONSTRUCTION-RED-001.md': 'review/v24/V24-I11-V6-R12-CONSTRUCTION-RED-001.md',
              'external/r12_trusted_external_guard.py': 'review/v24/r12_trusted_external_guard.py',
              'external/r12_trusted_test_parent.py': 'review/v24/r12_trusted_test_parent.py',
              'external/r12_untrusted_test_worker.py': 'review/v24/r12_untrusted_test_worker.py',
              'external/r12_trusted_adversarial_evidence.py': 'review/v24/r12_trusted_adversarial_evidence.py',
              'external/v24-v6-r12-trust-boundary-construction-v2.yml': '.github/workflows/v24-v6-r12-trust-boundary-construction-v2.yml',
              'history/v24-v6-r12-trust-boundary-construction-red-workflow.yml': '.github/workflows/v24-v6-r12-trust-boundary-construction.yml',
          }
          for rel, repo_path in review_files.items():
              source_class = 'HISTORICAL_CONSTRUCTION_RED' if rel.startswith('history/') else ('NON_AUTHORITATIVE_CONSTRUCTION_EVIDENCE' if rel.startswith('evidence/') else ('CLEAN_REVIEW_METADATA' if rel.startswith('review/') else 'EXTERNAL_REVIEW_AUTHORITY_EVIDENCE'))
              add(rel, git_bytes(f'{REVIEW_AUTH}:{repo_path}'), source_class)

          for rel, (name, expected) in artifact_files.items():
              data = (ART / name).read_bytes()
              if sha256(data) != expected:
                  raise SystemExit(f'ARTIFACT_OBJECT_SHA256_MISMATCH:{name}')
              add(rel, data, 'EXTERNAL_REVIEW_AUTHORITY_EVIDENCE')

          pinset = json.loads((ART / 'V24-I11-V6-R12-EXTERNAL-PINSET.json').read_text(encoding='utf-8'))
          if pinset.get('candidate_commit') != CANDIDATE or pinset.get('candidate_tree') != CANDIDATE_TREE:
              raise SystemExit('PINSET_CANDIDATE_IDENTITY_MISMATCH')
          admitted = pinset.get('admitted_files')
          if not isinstance(admitted, list) or len(admitted) != 72:
              raise SystemExit('PINSET_ADMITTED_FILE_COUNT_INVALID')
          if len(pinset.get('executed_tests', [])) != 20:
              raise SystemExit('PINSET_EXECUTED_TEST_COUNT_INVALID')
          if len(pinset.get('required_support_files', [])) != 11:
              raise SystemExit('PINSET_SUPPORT_FILE_COUNT_INVALID')
          seen = set()
          for row in sorted(admitted, key=lambda x: x['path']):
              path = row['path']
              if path in seen:
                  raise SystemExit(f'DUPLICATE_ADMITTED_PATH:{path}')
              seen.add(path)
              line = subprocess.check_output(['git','ls-tree',CANDIDATE,'--',path], text=True).strip()
              if not line:
                  raise SystemExit(f'CANDIDATE_FILE_MISSING:{path}')
              mode, typ, rest = line.split(None, 2)
              blob = rest.split('\t',1)[0]
              if typ != 'blob' or mode == '120000':
                  raise SystemExit(f'CANDIDATE_FILE_NOT_REGULAR:{path}')
              if blob != row['git_blob_sha1']:
                  raise SystemExit(f'CANDIDATE_GIT_BLOB_MISMATCH:{path}')
              data = git_bytes(f'{CANDIDATE}:{path}')
              if sha256(data) != row['raw_sha256']:
                  raise SystemExit(f'CANDIDATE_SHA256_MISMATCH:{path}')
              add(f'candidate/{path}', data, 'FROZEN_CANDIDATE')

          source = git_bytes(f'{DESIGN_COMMIT}:{DESIGN_SOURCE}')
          if len(source) != DESIGN_SOURCE_BYTES or sha256(source) != DESIGN_SOURCE_SHA:
              raise SystemExit('DESIGN_SOURCE_IDENTITY_MISMATCH')
          if source[DESIGN_INSERT_OFFSET:DESIGN_INSERT_OFFSET+len(DESIGN_PRECONDITION)] != DESIGN_PRECONDITION:
              raise SystemExit('DESIGN_RECONSTRUCTION_PRECONDITION_MISMATCH')
          design = source[:DESIGN_INSERT_OFFSET] + b'\n' + source[DESIGN_INSERT_OFFSET:]
          if len(design) != DESIGN_BYTES or sha256(design) != DESIGN_SHA or git_blob(design) != DESIGN_BLOB:
              raise SystemExit('DESIGN_RECONSTRUCTED_IDENTITY_MISMATCH')
          sep = design.find(b'---\n\n')
          if sep < 0 or sha256(design[sep+5:]) != DESIGN_BODY_SHA:
              raise SystemExit('DESIGN_BODY_SHA256_MISMATCH')
          add('design/V24-I11-V6-APPROVED-DESIGN-EXACT.md', design, 'APPROVED_V6_DESIGN')

          entries.sort(key=lambda x: x['path'])
          if len({x['path'] for x in entries}) != len(entries):
              raise SystemExit('BUNDLE_PATH_DUPLICATE')

          manifest_rows = [
              {k: e[k] for k in ('path','bytes','sha256','source_class')}
              for e in entries
          ]
          manifest = {
              'schema_version': 1,
              'bundle_id': 'V24-I11-V6-R12-CLEAN-MANUAL-REVIEW-SINGLE-FILE',
              'format': 'UTF8_MARKED_SINGLE_MARKDOWN_PROJECTION',
              'frozen_candidate_commit': CANDIDATE,
              'frozen_candidate_tree': CANDIDATE_TREE,
              'canonical_candidate_admitted_file_count': 72,
              'canonical_executed_test_module_count': 20,
              'canonical_test_case_count': 270,
              'mandatory_adversarial_evidence_record_count': 6,
              'approved_design_sha256': DESIGN_SHA,
              'approved_design_git_blob_sha1': DESIGN_BLOB,
              'approved_design_bytes': DESIGN_BYTES,
              'approved_design_body_sha256': DESIGN_BODY_SHA,
              'construction_artifact_id': 10321730032,
              'construction_artifact_sha256': '9cab1354dc01e189a6d52ef2a57448fe829182797bfe4d6164f67ff358ba8c8b',
              'scientific_execution_state': 'CLOSED_PENDING_SUCCESSOR_REVIEW',
              'runtime_qualification_state': 'NOT_CLAIMED',
              'automated_external_reviewer_api_calls': False,
              'authority_effect': 'NONE_EVIDENCE_ONLY',
              'embedded_file_count': len(entries),
              'files': manifest_rows,
          }
          manifest_bytes = (json.dumps(manifest, sort_keys=True, indent=2) + '\n').encode('utf-8')
          manifest_sha = sha256(manifest_bytes)

          preamble = (
              '# V24-I11-V6-R12 — Single-File Clean Manual Review Bundle\n\n'
              'This file is a readable projection of the exact frozen R12 review surface. '\
              'It is not itself authority and does not open scientific execution.\n\n'
              f'- Frozen candidate: `{CANDIDATE}`\n'
              f'- Frozen tree: `{CANDIDATE_TREE}`\n'
              f'- Embedded original files: `{len(entries)}`\n'
              f'- Embedded manifest SHA-256: `{manifest_sha}`\n'
              '- Candidate admitted files: `72`\n'
              '- Executed test modules in construction pinset: `20`\n'
              '- Construction test cases reported: `270`\n'
              '- Mandatory adversarial evidence records: `6`\n'
              '- Scientific execution: `CLOSED_PENDING_SUCCESSOR_REVIEW`\n'
              '- Runtime qualification: `NOT_CLAIMED`\n'
              '- Automated external reviewer API calls: `false`\n'
              '- Authority effect: `NONE_EVIDENCE_ONLY`\n\n'
              '## Projection extraction rule\n\n'
              'For each embedded object, locate its `<<<BEGIN ORIGINAL FILE CONTENT>>>` marker and take exactly the declared `BYTES` number of UTF-8 bytes immediately following the marker newline. '\
              'Those bytes are the canonical original object. The wrapper/end marker is not part of the original object.\n\n'
              '## Bundle manifest\n\n'
              '<<<BEGIN BUNDLE MANIFEST>>>\n' + manifest_bytes.decode('utf-8') + '<<<END BUNDLE MANIFEST>>>\n\n'
              '---\n\n# Embedded original files\n'
          )

          with MD.open('wb') as fh:
              fh.write(preamble.encode('utf-8'))
              for idx, e in enumerate(entries, 1):
                  header = (
                      f'\n---\n\n## Embedded File {idx} of {len(entries)}\n\n'
                      f'PATH: `{e["path"]}`\n\n'
                      f'SOURCE_CLASS: `{e["source_class"]}`\n\n'
                      f'BYTES: `{e["bytes"]}`\n\n'
                      f'SHA256: `{e["sha256"]}`\n\n'
                      '<<<BEGIN ORIGINAL FILE CONTENT>>>\n'
                  ).encode('utf-8')
                  fh.write(header)
                  fh.write(e['data'])
                  fh.write(b'\n<<<END ORIGINAL FILE CONTENT>>>\n')

          # Independent byte-count/hash recovery from the completed bundle.
          blob = MD.read_bytes()
          cursor = 0
          for e in entries:
              marker = (
                  f'PATH: `{e["path"]}`\n\n'
                  f'SOURCE_CLASS: `{e["source_class"]}`\n\n'
                  f'BYTES: `{e["bytes"]}`\n\n'
                  f'SHA256: `{e["sha256"]}`\n\n'
                  '<<<BEGIN ORIGINAL FILE CONTENT>>>\n'
              ).encode('utf-8')
              pos = blob.find(marker, cursor)
              if pos < 0:
                  raise SystemExit(f'RECOVERY_MARKER_MISSING:{e["path"]}')
              start = pos + len(marker)
              recovered = blob[start:start+e['bytes']]
              if sha256(recovered) != e['sha256']:
                  raise SystemExit(f'RECOVERY_SHA256_MISMATCH:{e["path"]}')
              endmarker = b'\n<<<END ORIGINAL FILE CONTENT>>>'
              if blob[start+e['bytes']:start+e['bytes']+len(endmarker)] != endmarker:
                  raise SystemExit(f'RECOVERY_END_MARKER_MISMATCH:{e["path"]}')
              cursor = start + e['bytes'] + len(endmarker)

          bundle_sha = sha256(blob)
          (OUT / 'V24-I11-V6-R12-CLEAN-MANUAL-REVIEW.sha256').write_text(
              f'{bundle_sha}  {MD.name}\n', encoding='utf-8'
          )
          record = {
              'bundle_file': MD.name,
              'bundle_bytes': len(blob),
              'bundle_sha256': bundle_sha,
              'embedded_manifest_sha256': manifest_sha,
              'embedded_file_count': len(entries),
              'candidate_admitted_file_count': 72,
              'candidate_commit': CANDIDATE,
              'candidate_tree': CANDIDATE_TREE,
              'content_recovery_verification': 'PASS',
              'approved_design_reconstruction': 'PASS',
              'artifact_identity_verification': 'PASS',
              'scientific_execution_state': 'CLOSED_PENDING_SUCCESSOR_REVIEW',
              'runtime_qualification_state': 'NOT_CLAIMED',
              'authority_effect': 'NONE_EVIDENCE_ONLY',
          }
          (OUT / 'V24-I11-V6-R12-CLEAN-MANUAL-REVIEW.BUILD-RECORD.json').write_text(
              json.dumps(record, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(record, sort_keys=True, indent=2))
          PY
          python "$RUNNER_TEMP/build_r12_review_md.py"

      - name: Upload review bundle transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: v24-v6-r12-clean-manual-review-single-file
          path: ${{ runner.temp }}/r12-clean-review-single-file/
          if-no-files-found: error
          retention-days: 90
