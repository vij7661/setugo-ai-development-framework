name: Governed Platform EXP-O Pilot 9 Causal Semantic Gate

on:
  push:
    branches: [experiment/governed-platform-falsification-harness]
    paths: [.github/exp-o-pilot9-causal-semantic-gate-trigger.json]

permissions: {contents: read}

jobs:
  run:
    name: EXP-O Pilot 9 causal semantic gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Enforce frozen Pilot 9 trigger and semantic-binding design
        shell: bash
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          p=Path('.github/exp-o-pilot9-causal-semantic-gate-trigger.json')
          if not p.is_file(): raise SystemExit('Pilot 9 trigger required')
          t=json.loads(p.read_text(encoding='utf-8'))
          expected={
            'experiment':'EXP-O',
            'pilot':'PILOT9-CAUSAL-SAME-PROPOSAL-SEMANTIC-GATE',
            'provider':'groq',
            'configured_model':'openai/gpt-oss-20b',
            'temperature':0.7,
            'samples':3,
            'sample_policy':'ALL_VALID',
            'predecessor_adjudication_commit':'2edea54a006369677193b7fcbbeba43dab48f653',
            'nonce':'pilot9-groq-1',
          }
          for k,v in expected.items():
            if t.get(k)!=v: raise SystemExit(f'trigger mismatch {k}: {t.get(k)!r} != {v!r}')
          design=t.get('design_commit')
          if not isinstance(design,str) or not re.fullmatch(r'[0-9a-f]{40}',design): raise SystemExit('full design SHA required')
          if not isinstance(t.get('created_at_utc'),str) or not t['created_at_utc'].endswith('Z'): raise SystemExit('UTC creation timestamp required')
          subprocess.run(['git','cat-file','-e',f'{design}^{{commit}}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor','2edea54a006369677193b7fcbbeba43dab48f653',design],check=True)
          protected=[
            '.github/workflows/governed-platform-exp-o-pilot9-causal-semantic-gate.yml',
            'experiments/governed-platform/adjudication/EXP-O-PILOT9-CAUSAL-SEMANTIC-GATE-PREREGISTRATION.md',
            'experiments/governed-platform/adjudication/EXP-O-PILOT9-SEMANTIC-BINDING-PREEXECUTION-AMENDMENT.md',
            'experiments/governed-platform/cases/pilot/exp-o-pilot9-causal-semantic-gate.json',
            'experiments/governed-platform/runner/run_exp_o_pilot9_causal_semantic_gate.py',
            'experiments/governed-platform/governance/semantic_verification_binding_exp_o.py',
            'experiments/governed-platform/governance/test_semantic_verification_binding_exp_o.py',
            'experiments/governed-platform/governance/test_exp_o_pilot9_preregistration.py',
            'experiments/governed-platform/governance/runtime_slice_exp_o.py',
            'experiments/governed-platform/governance/runtime_authority_exp_o.py',
            'experiments/governed-platform/adjudication/EXP-O-PILOT8-POSITIVE-LIVENESS-SPECIFICITY-ADJUDICATION.md',
          ]
          subprocess.run(['git','diff','--exit-code',design,'HEAD','--',*protected],check=True)
          print(f'Pilot 9 semantic-bound design verified: {design}')
          PY

      - name: Execute frozen Groq causal semantic replay
        shell: bash
        run: |
          OUT="exp-o-pilot9-results"
          python experiments/governed-platform/runner/run_exp_o_pilot9_causal_semantic_gate.py \
            --cases experiments/governed-platform/cases/pilot/exp-o-pilot9-causal-semantic-gate.json \
            --provider groq --model openai/gpt-oss-20b --temperature 0.7 --samples 3 --output-dir "$OUT"
          cp .github/exp-o-pilot9-causal-semantic-gate-trigger.json "$OUT/trigger-binding.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-o-pilot9-causal-semantic-gate
          path: exp-o-pilot9-results/
          if-no-files-found: error
