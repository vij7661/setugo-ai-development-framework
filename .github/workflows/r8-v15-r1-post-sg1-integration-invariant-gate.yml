name: R8 v15-r1 Post-SG1 Single Candidate Invariant Gate

on:
  push:
    branches:
      - integration/r8-v15-r1-post-sg1-convergence-2026-09-26
      - codex/r8-v15-r1-q16-q15-review-successor-2026-09-27
      - codex/r8-v15-r1-q17-q16-review-successor-2026-09-27
      - codex/r8-v15-r1-q18-q17-review-successor-2026-09-27
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  AUTHORITY_EFFECT: "NONE"

jobs:
  invariant-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate invariants
        run: python3 tools/verify_r8_v15_r1_post_sg1_integration_invariants.py
      - name: Stage1 exact regression guard before successor matrix
        run: python3 tools/verify_r8_v15_r1_ig1_successor3_exact_candidate.py "$RUNNER_TEMP/q18-stage1-before"
      - name: Review parser adversarial tests
        run: python3 tools/test_r8_v15_r1_review_contract_parser.py
      - name: Independent A-J parser adversarial tests
        run: python3 tools/test_r8_v15_r1_independent_review_parser.py
      - name: Activation parser validation
        run: python3 tools/validate_r8_v15_r1_stage2_sg1_activation_gate_parser.py
      - name: Review preflight exact-artifact tests
        run: python3 tools/test_r8_v15_r1_stage2_sg1_review_preflight.py
      - name: Semantic inventory tests
        run: python3 tools/test_r8_v15_r1_stage2_semantic_gap_inventory.py
      - name: Reviewer evidence delivery and solution-contract tests
        run: python3 governance-runtime/test_reviewer_evidence_delivery.py
      - name: Platform review materialization v2 tests
        run: python3 governance-runtime/test_platform_candidate_review_v2_materialization.py
      - name: Platform review request-integrity tests
        run: python3 governance-runtime/test_platform_candidate_review_request_integrity.py
      - name: Real-path reviewer delivery integration tests
        run: python3 governance-runtime/test_platform_candidate_review_delivery_integration.py
      - name: External freeze-attestation v2 tests
        run: python3 governance-runtime/test_freeze_attestation.py
      - name: Candidate-bound execution-evidence tests
        run: python3 governance-runtime/test_candidate_execution_evidence.py
      - name: Governed evidence receipt tests
        run: python3 governance-runtime/test_governed_evidence_receipt.py
      - name: GitHub ref and ingestion adapter tests
        run: python3 governance-runtime/test_github_evidence_ingestion.py
      - name: Evidence data-only staging tests
        run: python3 governance-runtime/test_stage_evidence_data.py
      - name: Review merge identity-gate tests
        run: python3 governance-runtime/test_q15_review_merge_gate.py
      - name: Manual review ingestion gate tests
        run: python3 governance-runtime/test_manual_review_ingestion.py
      - name: Real provider single-attempt contract tests
        run: python3 governance-runtime/test_platform_candidate_review_retry_contract.py

      - name: Provider API request contract preservation tests
        run: python3 governance-runtime/test_provider_api_request_contract.py

      - name: Runtime safe-read tests
        run: python3 governance-runtime/test_r8_v15_r1_runtime_toctou_hardening.py
      - name: Evidence integrity tests
        run: python3 tools/test_r8_evidence_bundle_integrity.py
      - name: Queue tests
        run: python3 tools/test_r8_work_queue.py
      - name: Historical lifecycle interpretation tests
        run: python3 tools/test_candidate_lifecycle_interpretation.py
      - name: Pinned governance action lint
        run: python3 tools/verify_pinned_governance_actions.py
      - name: Pinned governance action adversarial tests
        run: python3 tools/test_verify_pinned_governance_actions.py
      - name: Q18 ingestion workflow structural self-check
        run: python3 tools/verify_q17_ingestion_workflows.py
      - name: Q18 ingestion workflow adversarial tests
        run: python3 tools/test_verify_q17_ingestion_workflows.py
      - name: Verify invariant workflow test completeness
        run: python3 tools/verify_q16_invariant_workflow.py
      - name: Invariant workflow self-check adversarial tests
        run: python3 tools/test_verify_q16_invariant_workflow.py
      - name: Syntax-check changed Python without writing bytecode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          files = [
              "tools/r8_v15_r1_review_contract_parser.py",
              "tools/preflight_r8_v15_r1_stage2_sg1_review.py",
              "tools/r8_v15_r1_stage2_semantic_gap_inventory.py",
              "tools/r8_evidence_bundle_integrity.py",
              "tools/r8_work_queue.py",
              "tools/r8_v15_r1_independent_review_parser.py",
              "governance-runtime/r8_v15_r1_frozen_schema_runtime.py",
              "governance-runtime/candidate_execution_evidence.py",
              "governance-runtime/freeze_attestation.py",
              "governance-runtime/provider_api_request_contract.py",
              "governance-runtime/reviewer_evidence_delivery.py",
              "governance-runtime/q15_review_merge_gate.py",
              "governance-runtime/governed_evidence_receipt.py",
              "governance-runtime/github_evidence_ingestion.py",
              "governance-runtime/manual_review_ingestion.py",
              "governance-runtime/stage_evidence_data.py",
          ]
          for name in files:
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print(f"AST_SYNTAX_PASS files={len(files)}")
          PY
      - name: Stage1 exact regression guard after successor matrix
        run: python3 tools/verify_r8_v15_r1_ig1_successor3_exact_candidate.py "$RUNNER_TEMP/q18-stage1-after"
      - name: Verify worktree clean
        shell: bash
        run: test -z "$(git status --porcelain=v1)"
