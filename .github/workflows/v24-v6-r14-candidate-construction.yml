name: V24 V6 R14 Candidate Construction

on:
  push:
    branches:
      - implementation/v24-i11-v6-r14-native-observer
    paths:
      - 'governance-runtime/**'
      - 'implementation/v24/V24-I11-V6-R14-**'
      - '.github/workflows/v24-v6-r14-candidate-construction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Bind exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          echo "R14_CANDIDATE_COMMIT=$(git rev-parse HEAD)" | tee -a "$GITHUB_ENV"
          echo "R14_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" | tee -a "$GITHUB_ENV"
          echo 'R14_AUTHORITY_EFFECT=NONE_EVIDENCE_ONLY'
          echo 'R14_SCIENTIFIC_EXECUTION=CLOSED_PENDING_SUCCESSOR_REVIEW'

      - name: Compile candidate Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q governance-runtime
          echo 'R14_CANDIDATE_COMPILE=PASS'

      - name: R14 evidence-validator regression
        working-directory: governance-runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_v24_v6_r14_successor.py

      - name: Review-protocol regression
        working-directory: governance-runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_review_protocol.py

      - name: Full V24 construction regression
        working-directory: governance-runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import unittest
          loader=unittest.TestLoader()
          suite=loader.discover('.',pattern='test_v24*.py')
          print(f'R14_V24_DISCOVERED_TESTS={suite.countTestCases()}')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print(f'R14_V24_PASS={result.testsRun}/{result.testsRun}')
          PY

      - name: Construction posture
        shell: bash
        run: |
          set -euo pipefail
          echo "R14_CONSTRUCTION_CANDIDATE=$R14_CANDIDATE_COMMIT"
          echo "R14_CONSTRUCTION_TREE=$R14_CANDIDATE_TREE"
          echo 'R14_CONSTRUCTION_RESULT=PASS_NONAUTHORITATIVE'
          echo 'R14_RUNTIME_QUALIFICATION=NOT_CLAIMED'
          echo 'R14_SCIENTIFIC_EXECUTION=CLOSED_PENDING_SUCCESSOR_REVIEW'
          echo 'R14_AUTOMATED_REVIEWER_API_CALLS=NONE'
