name: R8 v15-r1 Materialize Verified R2 Successor-1 SPM

on:
  push:
    branches:
      - enrollment/r8-v15-r1-spg1-r2-successor-1
    paths:
      - governance-r8/R8-V15-R1-SPG1-R2-S1-MATERIALIZE-MARKER.json

permissions:
  contents: write
  actions: read
  attestations: read

concurrency:
  group: r8-v15-r1-materialize-r2-successor-1
  cancel-in-progress: false

env:
  TARGET_BRANCH: freeze/r8-v15-r1-sfv45-r2-successor-1-qualified
  BASE_COMMIT: fd969231dd61d76ae52c05f48f7eec826e508846
  GENERATION_RUN_ID: "36023881055"
  GENERATION_RUN_HEAD: c89812efa5ba505bbd2c5273699f90582be855ea
  GENERATION_ARTIFACT_ID: "10818336755"
  GENERATION_ARTIFACT_NAME: r8-v15-r1-spg1-r2-s1-36023881055-1
  GENERATION_ARTIFACT_ZIP_SHA256: a42c46b9837a3c6fa22f15951fd4ac39d7c207246b10cbe475b413c5560450c4
  VERIFY_RUN_ID: "36024268005"
  VERIFY_RUN_HEAD: 5a39601b18e8c221468f1da0359778681635d354
  VERIFY_ARTIFACT_ID: "10819176062"
  VERIFY_ARTIFACT_NAME: r8-v15-r1-spg1-r2-s1-post-run-verify-36024268005-1
  VERIFY_ARTIFACT_ZIP_SHA256: 52510e6d94847249dfba61a6f4e36cea7128e612c23c63cd2830093a336abff3
  SUBJECT_SHA256: 64cd69110e978a613b39efb0aaccc38823eedcabf41dec5eac44f9f2fe525315
  BUNDLE_SHA256: 8a50421328d27f54c84c53e6dfa33ca4381724ab26794935c7c642e9e6c6f4ef
  QUALIFIED_SPM_SHA256: cdaf34d1f256890c5bcad1f3924d673ae0877ad876d3be3403b2b925b404fa4f
  REJECTED_SPM_SHA256: 3fbd3a7ce5b09a1de9b46af95702a7cf382a9e2792cf9fdb8bdc1fdbfd19683f
  ATTESTATION_ID: "49907502"

jobs:
  materialize:
    name: Materialize exact independently verified fresh SPM
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Fail closed on target drift
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = "vij7661/setugo-ai-development-framework"
          test "$(git -C target rev-parse HEAD)" = "$BASE_COMMIT"
          test -z "$(git -C target status --porcelain)"
          test "$(sha256sum target/schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json | awk '{print $1}')" = "$REJECTED_SPM_SHA256"

      - name: Verify generation and independent-verifier run identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repo='vij7661/setugo-ai-development-framework'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path]))
          gr=api(f'repos/{repo}/actions/runs/{os.environ["GENERATION_RUN_ID"]}')
          assert gr['status']=='completed' and gr['conclusion']=='success'
          assert gr['head_sha']==os.environ['GENERATION_RUN_HEAD']
          ga=api(f'repos/{repo}/actions/runs/{os.environ["GENERATION_RUN_ID"]}/artifacts')['artifacts']
          gm=[a for a in ga if str(a['id'])==os.environ['GENERATION_ARTIFACT_ID']]
          assert len(gm)==1
          assert gm[0]['name']==os.environ['GENERATION_ARTIFACT_NAME']
          assert gm[0]['digest']=='sha256:'+os.environ['GENERATION_ARTIFACT_ZIP_SHA256']
          assert not gm[0]['expired']

          vr=api(f'repos/{repo}/actions/runs/{os.environ["VERIFY_RUN_ID"]}')
          assert vr['status']=='completed' and vr['conclusion']=='success'
          assert vr['head_sha']==os.environ['VERIFY_RUN_HEAD']
          va=api(f'repos/{repo}/actions/runs/{os.environ["VERIFY_RUN_ID"]}/artifacts')['artifacts']
          vm=[a for a in va if str(a['id'])==os.environ['VERIFY_ARTIFACT_ID']]
          assert len(vm)==1
          assert vm[0]['name']==os.environ['VERIFY_ARTIFACT_NAME']
          assert vm[0]['digest']=='sha256:'+os.environ['VERIFY_ARTIFACT_ZIP_SHA256']
          assert not vm[0]['expired']
          PY

      - name: Download exact generation and verifier artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p generation verifier
          gh run download "$GENERATION_RUN_ID" --repo "${{ github.repository }}" --name "$GENERATION_ARTIFACT_NAME" --dir generation
          gh run download "$VERIFY_RUN_ID" --repo "${{ github.repository }}" --name "$VERIFY_ARTIFACT_NAME" --dir verifier
          test "$(sha256sum generation/spg1-r2-s1-subject.tar | awk '{print $1}')" = "$SUBJECT_SHA256"
          test "$(sha256sum generation/stage-r2-s1-attestation-bundle.jsonl | awk '{print $1}')" = "$BUNDLE_SHA256"
          test "$(sha256sum generation/stage-r2-s1/spm-qualified-r2-s1.json | awk '{print $1}')" = "$QUALIFIED_SPM_SHA256"
          test "$QUALIFIED_SPM_SHA256" != "$REJECTED_SPM_SHA256"

      - name: Reverify attestation and verifier evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify generation/spg1-r2-s1-subject.tar \
            --repo "${{ github.repository }}" \
            --bundle generation/stage-r2-s1-attestation-bundle.jsonl \
            --format json > materialization-attestation-verification.json
          python3 - <<'PY'
          import json, os, pathlib
          v=json.loads(pathlib.Path('verifier/r2-s1-independent-post-run-verification.json').read_text())
          assert v['status']=='POST_RUN_FRESH_SUCCESSOR_GENERATION_VERIFICATION_PASS'
          assert v['input_commit']==os.environ['BASE_COMMIT']
          assert str(v['generation_run_id'])==os.environ['GENERATION_RUN_ID']
          assert str(v['generation_artifact_id'])==os.environ['GENERATION_ARTIFACT_ID']
          assert v['generation_artifact_zip_sha256']==os.environ['GENERATION_ARTIFACT_ZIP_SHA256']
          assert str(v['attestation_id'])==os.environ['ATTESTATION_ID']
          assert v['subject_sha256']==os.environ['SUBJECT_SHA256']
          assert v['attestation_bundle_sha256']==os.environ['BUNDLE_SHA256']
          assert v['qualified_spm_sha256']==os.environ['QUALIFIED_SPM_SHA256']
          assert v['rejected_candidate_spm_sha256']==os.environ['REJECTED_SPM_SHA256']
          assert v['fresh_spm_distinct_from_rejected_candidate'] is True
          assert v['github_attestation_verification_pass'] is True
          assert v['oidc_identity_exact_match'] is True
          assert v['artifact_expanded_bytes_match'] is True
          assert v['qualified_provenance_validation_pass'] is True
          assert v['sfv_35']=='EVIDENCE_COMPLETE_FOR_INPUT_COMMIT'
          assert v['sfv_36']=='EVIDENCE_COMPLETE_FOR_INPUT_COMMIT'
          assert v['sfv_44']=='EVIDENCE_COMPLETE_FOR_INPUT_COMMIT'
          assert v['sfv_45']=='STILL_REQUIRED'
          assert not any(v[k] for k in [
            'implementation_authorized','runtime_qualification_authorized','release_authorized',
            'deployment_authorized','production_authorized','policy_authorized','terminal_authority'
          ])
          PY

      - name: Materialize exact verified fresh SPM
        shell: bash
        run: |
          set -euo pipefail
          cp generation/stage-r2-s1/spm-qualified-r2-s1.json target/schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json
          test "$(sha256sum target/schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json | awk '{print $1}')" = "$QUALIFIED_SPM_SHA256"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('target/schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json')
          s=json.loads(p.read_text())
          assert s['status']=='FINAL_FREEZE_ELIGIBLE'
          assert s['authority_effect']=='NONE'
          assert s['semantic_candidate_commit']=='c721b38cf8b00294797300b526596ce723a47ff8'
          assert s['generator']['generator_id']=='R8V15R1-SPG-V2'
          assert s['generator']['qualification_status']=='QUALIFIED'
          PY

      - name: Prove only verified SPM bytes changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -C target diff --name-only "$BASE_COMMIT" -- | sort)"
          expected="schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json"
          test "$changed" = "$expected"
          git -C target diff --exit-code "$BASE_COMMIT" -- . ':(exclude)schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json'

      - name: Commit exact verified fresh SPM
        shell: bash
        run: |
          set -euo pipefail
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json
          git -C target commit -m "Materialize independently verified SFV45 R2 successor SPM"
          git -C target push origin "HEAD:$TARGET_BRANCH"
          git -C target rev-parse HEAD
