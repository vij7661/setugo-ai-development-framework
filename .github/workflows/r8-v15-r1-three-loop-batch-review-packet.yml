name: R8 v15-r1 Three-Loop Batch Review Packet

on:
  push:
    branches:
      - review-packet/r8-v15-r1-slices8-10-three-loop-batch-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-IMPLEMENTATION-THREE-LOOP-BATCH-REVIEW-PACKET-MARKER.json

permissions:
  contents: read
  actions: read

jobs:
  build-review-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout packet branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build exact seven-file batch review packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/build_r8_v15_r1_three_loop_batch_review_packet.py
          test "$(find review-packet-three-loop -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Upload batch review packet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-three-loop-batch-review-packet
          path: review-packet-three-loop/*.txt
          if-no-files-found: error
          retention-days: 30
