name: R8 v15-r1 SPG-1 Qualified V2 Regeneration

on:
  push:
    branches:
      - enrollment/r8-v15-r1-spg1-qualified-v1
    paths:
      - governance-r8/R8-V15-R1-SPG1-V2-REGEN-MARKER.json

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: r8-v15-r1-spg1-v2-regeneration
  cancel-in-progress: false

env:
  INPUT_COMMIT: 8bd1934f65531607b1bdb4449c0c72b8f04d3ea9
  PREDECESSOR_QUALIFIED_COMMIT: e6a4f9e9ee5fb466ee89cf9113999df425af2cf5
  TARGET_BRANCH: freeze/r8-v15-r1-executable-schema-qualified-v2
  EXPECTED_GENERATOR_SHA256: 388fb8a61f31cbf99b001a2313d554c8a4aac36e61188eb95230b93c6b0077e6
  EXPECTED_RUNTIME_MANIFEST_DIGEST: 5d284ca4039368e3f74cbc9127cac07930f7852621d22c7e3a169fd51dd0147a
  CONTAINER_REPO_DIGEST: python@sha256:adafcc17694d715c905b4c7bebd96907a1fd5cf183395f0ebc4d3428bd22d92d

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualified-v2 input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.INPUT_COMMIT }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout predecessor qualified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PREDECESSOR_QUALIFIED_COMMIT }}
          path: predecessor
          persist-credentials: false
          fetch-depth: 1

      - name: Fail closed on input, generator, binding, or unintended drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$INPUT_COMMIT"
          test "$(sha256sum candidate/tools/generate_r8_v15_r1_spm.py | awk '{print $1}')" = "$EXPECTED_GENERATOR_SHA256"
          python3 - <<'PY'
          import json, pathlib, subprocess
          c=pathlib.Path('candidate')
          b=json.loads((c/'schemas/governance-r8/v15-r1/schema-provenance-generator-binding.json').read_text())
          assert b['status']=='QUALIFIED_GENERATOR_BINDING'
          assert b['qualification_status']=='QUALIFIED'
          assert b['revocation_state']=='ACTIVE'
          assert b['runtime_manifest']['runtime_manifest_digest']=='5d284ca4039368e3f74cbc9127cac07930f7852621d22c7e3a169fd51dd0147a'
          assert b['workload_attestation_proof_digest']=='9cca9f7e996e9e956f6c1dc93451a9a9e53794071275e9074f5a25b31478c51c'
          t=json.loads((c/'schemas/governance-r8/v15-r1/schema-freeze-traceability.json').read_text())
          sfg3=next(x for x in t['freeze_process_mappings'] if x['rule_id']=='SFG-003')
          assert sfg3['status']=='QUALIFIED_GENERATOR_EVIDENCE_COMPLETE'
          assert t['final_freeze_blockers']==['SFV-45']
          sm=json.loads((c/'schemas/governance-r8/v15-r1/schema-provenance-source-map.json').read_text())
          assert 'SRC-SPG-ENROLLMENT' in sm['named_source_refs']
          assert 'SRC-SPG-STAGEB-VERIFY' in sm['named_source_refs']
          PY
          python3 - <<'PY'
          from pathlib import Path
          a=Path('predecessor/schemas/governance-r8/v15-r1')
          b=Path('candidate/schemas/governance-r8/v15-r1')
          ap={p.relative_to(a).as_posix():p for p in a.rglob('*') if p.is_file()}
          bp={p.relative_to(b).as_posix():p for p in b.rglob('*') if p.is_file()}
          assert set(ap)==set(bp), 'schema file set drift'
          changed={name for name in ap if ap[name].read_bytes()!=bp[name].read_bytes()}
          assert changed=={'schema-freeze-traceability.json','schema-provenance-source-map.json'}, changed
          PY

      - name: Regenerate SPM in exact enrolled runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage-c
          docker pull "$CONTAINER_REPO_DIGEST"
          RESOLVED="$(docker image inspect "$CONTAINER_REPO_DIGEST" --format '{{index .RepoDigests 0}}')"
          test "$RESOLVED" = "$CONTAINER_REPO_DIGEST"
          docker run --rm             -v "$PWD/candidate:/candidate:ro"             -v "$PWD/stage-c:/stage-c"             -w /candidate             "$CONTAINER_REPO_DIGEST"             python tools/generate_r8_v15_r1_spm.py               --schema-root schemas/governance-r8/v15-r1               --source-map schemas/governance-r8/v15-r1/schema-provenance-source-map.json               --generator-binding schemas/governance-r8/v15-r1/schema-provenance-generator-binding.json               --output /stage-c/spm-qualified-v2.json
          sha256sum stage-c/spm-qualified-v2.json > stage-c/spm-qualified-v2.sha256

      - name: Validate regenerated provenance structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          c=pathlib.Path('candidate/schemas/governance-r8/v15-r1')
          s=json.loads(pathlib.Path('stage-c/spm-qualified-v2.json').read_text())
          sm=json.loads((c/'schema-provenance-source-map.json').read_text())
          assert s['status']=='FINAL_FREEZE_ELIGIBLE'
          assert s['semantic_candidate_commit']=='c721b38cf8b00294797300b526596ce723a47ff8'
          assert s['generator']['generator_id']=='R8V15R1-SPG-V2'
          assert s['generator']['runtime_manifest_digest']=='5d284ca4039368e3f74cbc9127cac07930f7852621d22c7e3a169fd51dd0147a'
          assert s['generator']['qualification_status']=='QUALIFIED'
          assert s['source_ref_catalog']==sm['named_source_refs']
          assert s['coverage']=={'uncovered_semantic_elements':[],'non_authoritative_only_sources':[],'conflicting_entries':[]}
          amap={a['path'].split('/')[-1]:a for a in s['artifacts']}
          assert set(amap)==set(sm['artifact_sources'])
          for name in amap:
              raw=(c/name).read_bytes()
              assert amap[name]['sha256']==hashlib.sha256(raw).hexdigest()
          refs=set(sm['named_source_refs'])
          for e in s['entries']:
              assert e['generator_runtime_manifest_digest']=='5d284ca4039368e3f74cbc9127cac07930f7852621d22c7e3a169fd51dd0147a'
              assert e['reviewer_status']=='REVIEW_REQUIRED'
              assert e['source_ref_ids'] and set(e['source_ref_ids'])<=refs
          PY

      - name: Build deterministic Stage-C subject
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/schemas/governance-r8/v15-r1/schema-provenance-generator-binding.json stage-c/qualified-binding.json
          cp candidate/schemas/governance-r8/v15-r1/schema-freeze-traceability.json stage-c/schema-freeze-traceability.json
          cp candidate/schemas/governance-r8/v15-r1/schema-provenance-source-map.json stage-c/schema-provenance-source-map.json
          cp candidate/tools/generate_r8_v15_r1_spm.py stage-c/generator.py
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('stage-c')
          files=[]
          for p in sorted(d.iterdir()):
              if p.is_file():
                  files.append({'name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
          out={
            'schema':'r8-v15-r1-spg1-stage-c-qualified-v2-generation/v1',
            'status':'QUALIFIED_V2_GENERATION_PENDING_INDEPENDENT_POST_RUN_VERIFICATION',
            'authority_effect':'NONE',
            'input_commit':'8bd1934f65531607b1bdb4449c0c72b8f04d3ea9',
            'target_branch':'freeze/r8-v15-r1-executable-schema-qualified-v2',
            'semantic_candidate_commit':'c721b38cf8b00294797300b526596ce723a47ff8',
            'generator_id':'R8V15R1-SPG-V2',
            'runtime_manifest_digest':'5d284ca4039368e3f74cbc9127cac07930f7852621d22c7e3a169fd51dd0147a',
            'files':files
          }
          (d/'stage-c-subject-manifest.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf spg1-stage-c-qualified-v2-subject.tar -C stage-c .
          sha256sum spg1-stage-c-qualified-v2-subject.tar > spg1-stage-c-qualified-v2-subject.sha256

      - name: Attest Stage-C qualified generation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: spg1-stage-c-qualified-v2-subject.tar

      - name: Record diagnostic verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION_BUNDLE" stage-c-attestation-bundle.jsonl
          gh attestation verify spg1-stage-c-qualified-v2-subject.tar --repo "${{ github.repository }}" --bundle stage-c-attestation-bundle.jsonl --format json > stage-c-same-run-verification.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out={
            'schema':'r8-v15-r1-spg1-stage-c-output/v1',
            'status':'SIGNED_QUALIFIED_V2_GENERATION_PENDING_INDEPENDENT_POST_RUN_VERIFICATION',
            'authority_effect':'NONE',
            'input_commit':'8bd1934f65531607b1bdb4449c0c72b8f04d3ea9',
            'subject_sha256':hashlib.sha256(pathlib.Path('spg1-stage-c-qualified-v2-subject.tar').read_bytes()).hexdigest(),
            'attestation_bundle_sha256':hashlib.sha256(pathlib.Path('stage-c-attestation-bundle.jsonl').read_bytes()).hexdigest(),
            'qualified_spm_sha256':hashlib.sha256(pathlib.Path('stage-c/spm-qualified-v2.json').read_bytes()).hexdigest(),
            'attestation_id':os.environ['ATTESTATION_ID'],
            'attestation_url':os.environ['ATTESTATION_URL'],
            'sfv_45':'STILL_REQUIRED'
          }
          pathlib.Path('stage-c-attestation-output.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Upload Stage-C evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-spg1-stage-c-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            spg1-stage-c-qualified-v2-subject.tar
            spg1-stage-c-qualified-v2-subject.sha256
            stage-c-attestation-bundle.jsonl
            stage-c-attestation-output.json
            stage-c-same-run-verification.json
            stage-c/**
          if-no-files-found: error
          retention-days: 90
