name: OpenRouter Review Runner Repair

on:
  push:
    branches: [governance/live-conversation-runtime]
    paths:
      - governance-runtime/platform_candidate_review_v7.py
      - governance-runtime/test_platform_candidate_review_v7.py
      - governance-runtime/repair-preregistrations/GOV-REVIEWER-SERVING-PROVIDER-PIN-001.md
      - .github/workflows/openrouter-review-runner-repair.yml
      - .github/workflows/governance-candidate-platform-review.yml

permissions:
  contents: read

jobs:
  deterministic-openrouter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen provider-pinning tests
        run: python governance-runtime/test_platform_candidate_review_v7.py
      - name: Assert deterministic tests make no real provider call
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'OPENROUTER_API_KEY.*os\.environ|https://openrouter\.ai/api/v1/chat/completions' governance-runtime/test_platform_candidate_review_v7.py
      - name: Assert authoritative workflow routes through v7
        shell: bash
        run: |
          set -euo pipefail
          grep -q "provider not in {'gemini','groq','openrouter'}" .github/workflows/governance-candidate-platform-review.yml
          grep -q 'OPENROUTER_API_KEY' .github/workflows/governance-candidate-platform-review.yml
          grep -q 'platform_candidate_review_v7.py' .github/workflows/governance-candidate-platform-review.yml
