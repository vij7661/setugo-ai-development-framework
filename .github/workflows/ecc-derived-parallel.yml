name: ECC Derived Parallel Falsification

on:
  push:
    branches:
      - experiments/ecc-derived-parallel-v1
      - experiments/ecc-derived-parallel-v2-remediation
      - experiments/ecc-derived-parallel-v3-omission-hardening
    paths:
      - 'experiments/ecc-derived/**'
      - 'experiments/ecc_derived/**'
      - '.github/workflows/ecc-derived-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record exact checkout
        run: |
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
          git status --short

      - name: Run ECC-derived representative and full named coverage
        run: python -m unittest discover -v -s experiments/ecc_derived -p 'test_*.py'
