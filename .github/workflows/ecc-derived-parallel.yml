name: ECC Derived Parallel Falsification

on:
  push:
    branches:
      - experiments/ecc-derived-parallel-v1
      - experiments/ecc-derived-parallel-v2-remediation
      - experiments/ecc-derived-parallel-v3-omission-hardening
      - experiments/ecc-derived-parallel-v4-mandatory-boundary
      - experiments/ecc-derived-parallel-v5-closed-boundary
      - experiments/ecc-derived-parallel-v6-eligibility-provenance
      - experiments/ecc-derived-parallel-v7-seal-capability
      - experiments/ecc-derived-parallel-v8-verifier-substitution
      - experiments/ecc-derived-parallel-v9-verifier-primitive-integrity
      - experiments/ecc-derived-parallel-v10-path-primitive-integrity
      - experiments/ecc-derived-parallel-v11-module-global-integrity
    paths:
      - 'experiments/ecc-derived/**'
      - 'experiments/ecc_derived/**'
      - '.github/workflows/ecc-derived-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record exact checkout
        run: |
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
          git status --short

      - name: Run ECC-derived falsification suite
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "experiments/ecc-derived-parallel-v11-module-global-integrity" ]]; then
            python experiments/ecc_derived/run_v11_suite.py
          elif [[ "$GITHUB_REF_NAME" == "experiments/ecc-derived-parallel-v10-path-primitive-integrity" ]]; then
            python experiments/ecc_derived/run_v10_suite.py
          elif [[ "$GITHUB_REF_NAME" == "experiments/ecc-derived-parallel-v9-verifier-primitive-integrity" ]]; then
            python experiments/ecc_derived/run_v9_suite.py
          elif [[ "$GITHUB_REF_NAME" == "experiments/ecc-derived-parallel-v8-verifier-substitution" ]]; then
            python experiments/ecc_derived/run_v8_suite.py
          elif [[ "$GITHUB_REF_NAME" == "experiments/ecc-derived-parallel-v7-seal-capability" ]]; then
            python experiments/ecc_derived/run_v7_suite.py
          elif [[ "$GITHUB_REF_NAME" == "experiments/ecc-derived-parallel-v6-eligibility-provenance" ]]; then
            python experiments/ecc_derived/run_v6_suite.py
          elif [[ "$GITHUB_REF_NAME" == "experiments/ecc-derived-parallel-v5-closed-boundary" ]]; then
            python experiments/ecc_derived/run_v5_suite.py
          else
            python -m unittest discover -v -s experiments/ecc_derived -p 'test_*.py'
          fi
