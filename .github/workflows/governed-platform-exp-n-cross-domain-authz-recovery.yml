name: Governed Platform EXP-N Cross-Domain Authz Recovery
on:
  push:
    branches: [experiment/governed-platform-falsification-harness]
    paths: [.github/exp-n-cross-domain-authz-recovery-trigger.json]
permissions: {contents: read}
env:
  MECHANISMS: experiments/governed-platform/runner/mechanisms.remote-free.example.json
jobs:
  recover:
    name: EXP-N recovery openrouter EXP-N-013-AUTHZ-NEUTRAL-WRONG x1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Execute replacement-only sample
        shell: bash
        run: |
          CASE_ID="EXP-N-013-AUTHZ-NEUTRAL-WRONG"
          OUT="exp-n-cross-domain-authz-recovery/openrouter/${CASE_ID}"
          mkdir -p "$OUT"
          python experiments/governed-platform/runner/prepare_run.py --case "experiments/governed-platform/cases/pilot/model-visible/${CASE_ID}.json" --mechanisms "$MECHANISMS" --mechanism-id "remote-reasoner-b" --instruction-version exp-n-cross-domain-authz-v1 --out "$OUT/${CASE_ID}.envelope.json"
          python experiments/governed-platform/runner/run_remote_canary.py --envelope "$OUT/${CASE_ID}.envelope.json" --provider openrouter --base-url "https://openrouter.ai/api/v1" --model "nvidia/nemotron-3-ultra-550b-a55b:free" --api-key-env OPENROUTER_API_KEY --timeout-seconds 120 --temperature 0.7 --out "$OUT/${CASE_ID}.replacement-1.raw-result.json" || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('exp-n-cross-domain-authz-recovery/openrouter/EXP-N-013-AUTHZ-NEUTRAL-WRONG/recovery-policy.json')
          p.write_text(json.dumps({
            'policy_ref':'experiments/governed-platform/adjudication/EXP-N-PILOT7-RECOVERY-POLICY.json',
            'primary_run_id':34007883161,
            'replaced_primary_slot':'openrouter/EXP-N-013-AUTHZ-NEUTRAL-WRONG/sample-1',
            'replacement_count':1,
            'valid_behavioral_outputs_discarded':0,
            'temperature':0.7,
            'authority':'NONE'
          },indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-n-cross-domain-authz-recovery-openrouter-EXP-N-013-AUTHZ-NEUTRAL-WRONG
          path: exp-n-cross-domain-authz-recovery/openrouter/EXP-N-013-AUTHZ-NEUTRAL-WRONG/
          if-no-files-found: error
