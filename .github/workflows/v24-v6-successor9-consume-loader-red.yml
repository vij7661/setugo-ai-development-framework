name: V24 V6 Successor-9 Consume Loader RED

on:
  push:
    branches:
      - remediation/v24-i11-v6-successor-9
    paths:
      - '.github/workflows/v24-v6-successor9-consume-loader-red.yml'
      - 'governance-runtime/test_v24_v6_successor9_consume_loader_red.py'
      - 'governance-runtime/native/v24_v6_trusted_authority_service.c'
      - 'governance-runtime/build_v24_v6_trusted_authority_service.sh'
      - 'implementation/v24/V24-I11-V6-SUCCESSOR-9-TRUSTED-CONSUME-REPAIR-DESIGN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Assert construction dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v gcc
          command -v sudo
          test -x /usr/bin/python3

      - name: Create unprivileged candidate identity
        shell: bash
        run: |
          set -euo pipefail
          if ! id v24candidate >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin v24candidate
          fi
          test "$(id -u v24candidate)" != "0"
          if sudo -u v24candidate -- sudo -n true 2>/dev/null; then
            echo "candidate identity unexpectedly has sudo"
            exit 1
          fi

      - name: Compile RED surface
        working-directory: governance-runtime
        run: |
          python -m py_compile test_v24_v6_successor9_consume_loader_red.py

      - name: Build frozen Successor-8 trusted service
        run: |
          set -euo pipefail
          bash governance-runtime/build_v24_v6_trusted_authority_service.sh
          sudo rm -rf /opt/v24-v6-trusted-runtime
          sudo install -d -o root -g root -m 0555 /opt/v24-v6-trusted-runtime
          sudo install -o root -g root -m 0555 \
            governance-runtime/.service-build/v24_v6_trusted_authority_service \
            /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service
          test "$(stat -c '%u:%g %a' /opt/v24-v6-trusted-runtime/v24_v6_trusted_authority_service)" = "0:0 555"

      - name: Stage root-owned read-only RED test surface
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /tmp/v24candidate-successor9-red
          sudo cp -a governance-runtime /tmp/v24candidate-successor9-red
          sudo chown -R root:root /tmp/v24candidate-successor9-red
          sudo find /tmp/v24candidate-successor9-red -type d -exec chmod 0555 {} +
          sudo find /tmp/v24candidate-successor9-red -type f -exec chmod 0444 {} +

      - name: Reproduce candidate loader interposition against consume
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v24candidate-successor9-red
          sudo -u v24candidate -- env \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=/tmp/v24candidate-successor9-red \
            /usr/bin/python3 -m unittest -v test_v24_v6_successor9_consume_loader_red.py
