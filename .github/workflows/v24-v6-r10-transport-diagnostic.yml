name: V24 V6 R10 Transport Diagnostic

on:
  push:
    branches:
      - implementation/v24-i11-v6-r10-successor-review-remediation
    paths:
      - '.github/workflows/v24-v6-r10-transport-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-exact-fragments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search historical fragment versions by exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected
          expected[part-001.b64]='658e11b4b6b735d4a28eda40fef93bb678946b2a525906115de0957184867967'
          expected[part-002.b64]='e25a13c46bac088c58fcf03be4bcbc834808c18e817fa4df5d4b51d3f8396c43'
          expected[part-003.b64]='3658f9de702c4e15c231789531986a9a0043a6134793b6f97dab1ffaef7e8ca4'

          rm -rf /tmp/recovered && mkdir -p /tmp/recovered
          all_found=1
          for name in part-001.b64 part-002.b64 part-003.b64; do
            path="remediation/v24/r10-apply-gz-v2/$name"
            target="${expected[$name]}"
            found=''
            echo "=== HISTORY $name TARGET=$target ==="
            while read -r commit; do
              [ -n "$commit" ] || continue
              if git cat-file -e "$commit:$path" 2>/dev/null; then
                git show "$commit:$path" > "/tmp/$name"
                bytes=$(wc -c < "/tmp/$name")
                sha=$(sha256sum "/tmp/$name" | awk '{print $1}')
                echo "COMMIT=$commit BYTES=$bytes SHA256=$sha"
                if [ "$sha" = "$target" ] && [ -z "$found" ]; then
                  found="$commit"
                  cp "/tmp/$name" "/tmp/recovered/$name"
                fi
              fi
            done < <(git log --all --format='%H' -- "$path")
            if [ -n "$found" ]; then
              echo "EXACT_MATCH $name COMMIT=$found"
            else
              echo "NO_EXACT_MATCH $name"
              all_found=0
            fi
          done

          echo "ALL_EXACT_FRAGMENTS_FOUND=$all_found"
          if [ "$all_found" -eq 1 ]; then
            for p in /tmp/recovered/part-*.b64; do
              echo "RECOVERED $(basename "$p") BYTES=$(wc -c < "$p") SHA256=$(sha256sum "$p" | awk '{print $1}')"
            done
            cat /tmp/recovered/part-*.b64 | base64 -d > /tmp/recovered.patch.gz
            echo "RECOVERED_GZIP_BYTES=$(wc -c < /tmp/recovered.patch.gz) RECOVERED_GZIP_SHA256=$(sha256sum /tmp/recovered.patch.gz | awk '{print $1}')"
            gzip -t /tmp/recovered.patch.gz
            gzip -dc /tmp/recovered.patch.gz > /tmp/recovered.patch
            echo "RECOVERED_PATCH_BYTES=$(wc -c < /tmp/recovered.patch) RECOVERED_PATCH_SHA256=$(sha256sum /tmp/recovered.patch | awk '{print $1}')"
            echo 'RECOVERED_PATCH_PATHS_BEGIN'
            grep -E '^(---|\+\+\+) ' /tmp/recovered.patch || true
            echo 'RECOVERED_PATCH_PATHS_END'
            git apply --check /tmp/recovered.patch
          fi
