name: V24 V6 R10 Transport Diagnostic

on:
  push:
    branches:
      - implementation/v24-i11-v6-r10-successor-review-remediation
    paths:
      - '.github/workflows/v24-v6-r10-transport-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-old-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Apply old valid transport only in ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          cat remediation/v24/r10-apply-gz/part-*.b64 | base64 -d > /tmp/old.patch.gz
          gzip -dc /tmp/old.patch.gz > /tmp/old.patch
          echo "OLD_PATCH_SHA256=$(sha256sum /tmp/old.patch | awk '{print $1}')"
          git apply --check /tmp/old.patch
          git apply /tmp/old.patch
          git diff --check
          echo 'APPLIED_PATHS_BEGIN'
          git diff --name-only
          echo 'APPLIED_PATHS_END'

      - name: Compile old-patch successor modules
        working-directory: governance-runtime
        shell: bash
        run: |
          set +e
          python -m py_compile \
            v24_v6_governance_foundation.py \
            v24_v6_endpoint_projection.py \
            v24_v6_material_surface.py \
            v24_v6_decision_apply.py \
            v24_v6_normative_clause_projection.py \
            v24_v6_effect_ledger_closure.py \
            v24_v6_atomic_binding_modes.py \
            v24_v6_qualification_integrity.py \
            v24_v6_integrated_successor.py
          rc=$?
          echo "COMPILE_RC=$rc"
          exit 0

      - name: Run old-patch reviewer-bypass suites and preserve failures
        working-directory: governance-runtime
        shell: bash
        run: |
          set +e
          python -m unittest -v \
            test_v24_v6_governance_foundation.py \
            test_v24_v6_atomic_binding_modes.py \
            test_v24_v6_normative_clause_projection.py \
            test_v24_v6_qualification_integrity.py \
            test_v24_v6_material_surface.py \
            test_v24_v6_decision_apply.py \
            test_v24_v6_effect_ledger_closure.py
          rc=$?
          echo "REVIEWER_BYPASS_SUITE_RC=$rc"
          exit 0

      - name: Run old-patch R9 integration and inherited regression probes
        working-directory: governance-runtime
        shell: bash
        run: |
          set +e
          python -m unittest -v test_v24_v6_integrated_successor.py
          r9=$?
          echo "R9_INTEGRATION_RC=$r9"
          python -m unittest -v \
            test_normative_control_catalog.py \
            test_v24_authority_universe.py \
            test_v24_effective_control.py \
            test_v24_completeness_bootstrap.py \
            test_v24_endpoint_proof_compiler.py \
            test_v24_admission_application_witness.py \
            test_v24_aggregate_budget.py \
            test_v24_generation_migration.py \
            test_v24_review_proof_audit.py
          inherited=$?
          echo "INHERITED_REGRESSION_RC=$inherited"
          exit 0
