name: Package Review Engine MVP v0.1.1 Re-review

on:
  push:
    paths:
      - ".github/workflows/package-review-engine-mvp-v011-rereview.yml"

permissions:
  contents: read

jobs:
  package-remediated-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen Review Engine MVP v0.1.1 remediation
        uses: actions/checkout@v4
        with:
          ref: 40d2e3012d6bd974f0ea897ba9e22f4c5ff0d086
          fetch-depth: 1

      - name: Build exact remediation re-review package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp -R review_engine package/review_engine
          mkdir -p package/.github/workflows
          cp .github/workflows/governed-platform-experiments.yml package/.github/workflows/governed-platform-experiments.yml
          cp README.md package/REPOSITORY_README.md
          cat > package/FROZEN_REMEDIATION_MANIFEST.txt <<'EOF'
          Review Engine MVP v0.1.1 remediation source package
          Repository: vij7661/setugo-ai-development-framework
          Frozen remediation commit: 40d2e3012d6bd974f0ea897ba9e22f4c5ff0d086
          Exact-head CI run: 33980165263
          Exact-head CI result: SUCCESS
          Scope: review_engine/** plus validating CI workflow and repository README
          Purpose: targeted independent re-review of original Claude findings R-01 through R-05.
          This package was generated by checking out the frozen remediation commit explicitly.
          EOF
          cat > package/TARGETED_CLAUDE_REREVIEW.md <<'EOF'
          # Targeted Independent Re-review — MVP v0.1.1

          Review the actual remediated source and tests in this archive. The previous independent review produced R-01 through R-09 and a verdict of REOPEN CORE DESIGN. This re-review is intentionally narrow: try to falsify the claimed closure of R-01 through R-05.

          ## R-01 — finding materiality
          Try to produce a false-green where a reviewer emits a serious defect but manipulates `material`, `severity`, malformed values, or combinations thereof. Confirm whether HIGH/CRITICAL findings can still be ignored.

          ## R-02 — request/platform trust boundary
          Try to make an actually consequential-looking request route as low-risk by forging/omitting `operation_class`, tool declarations, target environment, risk, materiality or task type. Distinguish what is truly platform-owned from caller declarations. Do not assume deterministic text hints are a complete semantic classifier; identify any contract overclaim or bypass that matters within the declared review-only MVP boundary.

          ## R-03 — reviewer independence
          Try same-lineage and correlated R1/R2/R3 configurations at LOW/MEDIUM/HIGH/CRITICAL and through revision paths. Check whether any required reviewer can count as independent when it should not.

          ## R-04 — unqualified assurance
          With no retained qualification registry, try to reach CONVERGED_PASS for any task that actually requires R2/R3 or is material/consequential/external/mutating/high-uncertainty/ambiguous/incomplete-evidence. Check both initial request floors and R1 escalation.

          ## R-05 — session/request replay
          Reuse the same request/session id before and after terminal decisions, with identical and different payloads, including concurrent starts. Try to merge or append independent reviews into one chain while `chain_valid` remains true.

          ## Output
          For each R-01..R-05 return exactly one of:
          - CLOSED — no bypass found after source/test inspection and attempted reproduction
          - PARTIALLY CLOSED — original exploit is closed but a materially equivalent bypass remains
          - OPEN — original exploit remains
          - NEEDS EVIDENCE — cannot establish closure

          For every non-CLOSED result provide exact file/function, reproduction, expected safe behavior and recommended regression. Also list any NEW CRITICAL/HIGH defect discovered incidentally, but do not broaden into a generic style review.

          Final targeted verdict: CLOSE REMEDIATION GATE / KEEP GATE OPEN / REOPEN CORE DESIGN.

          Do not treat green CI as proof. Do not grant production or release authority.
          EOF
          find package -type f -print0 | sort -z | xargs -0 sha256sum > package/SHA256SUMS.txt
          python -m unittest discover -v -s package/review_engine -p 'test_*.py'
          (cd package && zip -r ../Review_Engine_MVP_v0.1.1_Targeted_Claude_Rereview_40d2e301.zip .)
          sha256sum Review_Engine_MVP_v0.1.1_Targeted_Claude_Rereview_40d2e301.zip > Review_Engine_MVP_v0.1.1_Targeted_Claude_Rereview_40d2e301.zip.sha256

      - name: Upload remediation re-review package
        uses: actions/upload-artifact@v4
        with:
          name: review-engine-mvp-v0.1.1-targeted-rereview
          path: |
            Review_Engine_MVP_v0.1.1_Targeted_Claude_Rereview_40d2e301.zip
            Review_Engine_MVP_v0.1.1_Targeted_Claude_Rereview_40d2e301.zip.sha256
          if-no-files-found: error
          retention-days: 14
