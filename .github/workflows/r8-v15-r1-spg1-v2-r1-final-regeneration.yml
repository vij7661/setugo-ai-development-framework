name: R8 v15-r1 SPG-1 V2-R1 Final Rebind Regeneration

on:
  push:
    branches:
      - enrollment/r8-v15-r1-spg1-qualified-v2-r1
    paths:
      - governance-r8/R8-V15-R1-SPG1-V2-R1-FINAL-REGEN-MARKER.json

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: r8-v15-r1-spg1-v2-r1-final-regeneration
  cancel-in-progress: false

env:
  INPUT_COMMIT: 94cf195e6e429fa69c6fa62184241ec47f712f1c
  SEMANTIC_CANDIDATE_COMMIT: c721b38cf8b00294797300b526596ce723a47ff8
  EXPECTED_GENERATOR_SHA256: 388fb8a61f31cbf99b001a2313d554c8a4aac36e61188eb95230b93c6b0077e6
  EXPECTED_RUNTIME_MANIFEST_DIGEST: 5d284ca4039368e3f74cbc9127cac07930f7852621d22c7e3a169fd51dd0147a
  CONTAINER_REPO_DIGEST: python@sha256:adafcc17694d715c905b4c7bebd96907a1fd5cf183395f0ebc4d3428bd22d92d

jobs:
  regenerate:
    name: Final exact-byte qualified regeneration over fixed-point rebind
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact rebind candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.INPUT_COMMIT }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Fail closed on fixed-point or qualification drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$INPUT_COMMIT"
          test "$(sha256sum candidate/tools/generate_r8_v15_r1_spm.py | awk '{print $1}')" = "$EXPECTED_GENERATOR_SHA256"
          test ! -e candidate/schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json
          python3 - <<'PY'
          import json,pathlib,os
          c=pathlib.Path('candidate')
          tr=json.loads((c/'schemas/governance-r8/v15-r1/schema-freeze-traceability.json').read_text())
          sm=json.loads((c/'schemas/governance-r8/v15-r1/schema-provenance-source-map.json').read_text())
          b=json.loads((c/'schemas/governance-r8/v15-r1/schema-provenance-generator-binding.json').read_text())
          ext=json.loads((c/'governance-r8/R8-V15-R1-SPG1-ENROLLMENT-EXTENSION-V2-R1.json').read_text())
          pv=json.loads((c/'governance-r8/R8-V15-R1-SPG1-V2-R1-POST-RUN-VERIFICATION.json').read_text())
          assert tr['status']=='QUALIFIED_EVIDENCE_REBIND_PRECOMMIT_NON_AUTHORITATIVE'
          assert tr['final_freeze_blockers']==['SFV-45']
          m={x['rule_id']:x for x in tr['freeze_process_mappings']}
          assert 'PENDING_EXACT_FINAL_REGENERATION' in m['SFG-001']['status']
          assert 'PENDING_EXACT_FINAL_REGENERATION' in m['SFG-002']['status']
          assert 'PENDING_EXACT_FINAL_REGENERATION' in m['SFG-003']['status']
          assert m['SFG-007']['status']=='BLOCKED_PENDING_EXACT_QUALIFIED_CANDIDATE_REVIEW'
          assert 'SRC-SPG-V2R1-EXTENSION' in sm['named_source_refs']
          assert 'SRC-SPG-V2R1-VERIFY' in sm['named_source_refs']
          assert any(r['match_prefix']=='SPG-QUALIFICATION-V2-R1-2026-09-24' for r in sm['source_ref_routes'])
          assert b['qualification_status']=='QUALIFIED' and b['revocation_state']=='ACTIVE'
          assert b['generator_artifact_sha256']==os.environ['EXPECTED_GENERATOR_SHA256']
          assert b['runtime_manifest']['runtime_manifest_digest']==os.environ['EXPECTED_RUNTIME_MANIFEST_DIGEST']
          assert ext['approval']['target_repaired_successor_commit']=='cd3a47c9f8d6830764f6f98c5f3a28d8c988f8cb'
          assert ext['lifecycle']['revocation_state']=='ACTIVE'
          assert pv['status']=='POST_RUN_REPAIRED_SUCCESSOR_GENERATION_VERIFICATION_PASS'
          assert pv['sfv_35']=='EVIDENCE_COMPLETE_FOR_INPUT_COMMIT'
          assert pv['sfv_36']=='EVIDENCE_COMPLETE_FOR_INPUT_COMMIT'
          assert pv['sfv_44']=='EVIDENCE_COMPLETE_FOR_INPUT_COMMIT'
          PY

      - name: Regenerate final SPM in exact enrolled runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-r1
          docker pull "$CONTAINER_REPO_DIGEST"
          RESOLVED="$(docker image inspect "$CONTAINER_REPO_DIGEST" --format '{{index .RepoDigests 0}}')"
          test "$RESOLVED" = "$CONTAINER_REPO_DIGEST"
          docker run --rm             -v "$PWD/candidate:/candidate:ro"             -v "$PWD/final-r1:/final-r1"             -w /candidate             "$CONTAINER_REPO_DIGEST"             python tools/generate_r8_v15_r1_spm.py               --schema-root schemas/governance-r8/v15-r1               --source-map schemas/governance-r8/v15-r1/schema-provenance-source-map.json               --generator-binding schemas/governance-r8/v15-r1/schema-provenance-generator-binding.json               --output /final-r1/spm-final-v2-r1.json
          sha256sum final-r1/spm-final-v2-r1.json > final-r1/spm-final-v2-r1.sha256

      - name: Validate final regenerated provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          c=pathlib.Path('candidate/schemas/governance-r8/v15-r1')
          s=json.loads(pathlib.Path('final-r1/spm-final-v2-r1.json').read_text())
          sm=json.loads((c/'schema-provenance-source-map.json').read_text())
          tr=json.loads((c/'schema-freeze-traceability.json').read_text())
          assert s['status']=='FINAL_FREEZE_ELIGIBLE'
          assert s['semantic_candidate_commit']==os.environ['SEMANTIC_CANDIDATE_COMMIT']
          assert s['generator']['generator_id']=='R8V15R1-SPG-V2'
          assert s['generator']['runtime_manifest_digest']==os.environ['EXPECTED_RUNTIME_MANIFEST_DIGEST']
          assert s['generator']['qualification_status']=='QUALIFIED'
          assert s['source_ref_catalog']==sm['named_source_refs']
          assert s['coverage']=={'uncovered_semantic_elements':[],'non_authoritative_only_sources':[],'conflicting_entries':[]}
          amap={a['path'].split('/')[-1]:a for a in s['artifacts']}
          assert set(amap)==set(sm['artifact_sources'])
          for name,a in amap.items():
              raw=(c/name).read_bytes()
              assert a['sha256']==hashlib.sha256(raw).hexdigest(), name
          trace_art=amap['schema-freeze-traceability.json']
          assert trace_art['sha256']==hashlib.sha256((c/'schema-freeze-traceability.json').read_bytes()).hexdigest()
          refs=set(sm['named_source_refs'])
          for e in s['entries']:
              assert e['generator_runtime_manifest_digest']==os.environ['EXPECTED_RUNTIME_MANIFEST_DIGEST']
              assert e['reviewer_status']=='REVIEW_REQUIRED'
              assert e['source_ref_ids'] and set(e['source_ref_ids'])<=refs
          assert tr['final_freeze_blockers']==['SFV-45']
          PY

      - name: Build deterministic final subject
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/schemas/governance-r8/v15-r1/schema-provenance-generator-binding.json final-r1/qualified-binding.json
          cp candidate/schemas/governance-r8/v15-r1/schema-provenance-source-map.json final-r1/schema-provenance-source-map.json
          cp candidate/schemas/governance-r8/v15-r1/schema-freeze-traceability.json final-r1/schema-freeze-traceability.json
          cp candidate/governance-r8/R8-V15-R1-SPG1-ENROLLMENT-EXTENSION-V2-R1.json final-r1/enrollment-extension.json
          cp candidate/governance-r8/R8-V15-R1-SPG1-V2-R1-POST-RUN-VERIFICATION.json final-r1/prior-post-run-verification.json
          cp candidate/tools/generate_r8_v15_r1_spm.py final-r1/generator.py
          cp control/.github/workflows/r8-v15-r1-spg1-v2-r1-final-regeneration.yml final-r1/workflow.yml
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          d=pathlib.Path('final-r1')
          files=[]
          for p in sorted(d.iterdir()):
              if p.is_file():
                  files.append({'name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
          out={
            'schema':'r8-v15-r1-spg1-v2-r1-final-rebind-subject/v1',
            'status':'FINAL_REGENERATION_PENDING_INDEPENDENT_POST_RUN_VERIFICATION',
            'authority_effect':'NONE',
            'input_commit':os.environ['INPUT_COMMIT'],
            'semantic_candidate_commit':os.environ['SEMANTIC_CANDIDATE_COMMIT'],
            'generator_id':'R8V15R1-SPG-V2',
            'runtime_manifest_digest':os.environ['EXPECTED_RUNTIME_MANIFEST_DIGEST'],
            'fixed_point_traceability':True,
            'files':files
          }
          (d/'final-subject-manifest.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -cf spg1-v2-r1-final-subject.tar -C final-r1 .
          sha256sum spg1-v2-r1-final-subject.tar > spg1-v2-r1-final-subject.sha256

      - name: Attest final rebind generation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: spg1-v2-r1-final-subject.tar

      - name: Record same-run diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION_BUNDLE" final-r1-attestation-bundle.jsonl
          gh attestation verify spg1-v2-r1-final-subject.tar             --repo "${{ github.repository }}"             --bundle final-r1-attestation-bundle.jsonl             --format json > final-r1-same-run-verification.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out={
            'schema':'r8-v15-r1-spg1-v2-r1-final-generation-output/v1',
            'status':'SIGNED_FINAL_REGENERATION_PENDING_INDEPENDENT_POST_RUN_VERIFICATION',
            'authority_effect':'NONE',
            'input_commit':os.environ['INPUT_COMMIT'],
            'subject_sha256':hashlib.sha256(pathlib.Path('spg1-v2-r1-final-subject.tar').read_bytes()).hexdigest(),
            'attestation_bundle_sha256':hashlib.sha256(pathlib.Path('final-r1-attestation-bundle.jsonl').read_bytes()).hexdigest(),
            'qualified_spm_sha256':hashlib.sha256(pathlib.Path('final-r1/spm-final-v2-r1.json').read_bytes()).hexdigest(),
            'attestation_id':os.environ['ATTESTATION_ID'],
            'attestation_url':os.environ['ATTESTATION_URL'],
            'sfv_35':'PENDING_FINAL_INDEPENDENT_POST_RUN_VERIFICATION',
            'sfv_36':'PENDING_FINAL_INDEPENDENT_POST_RUN_VERIFICATION',
            'sfv_44':'PENDING_FINAL_INDEPENDENT_POST_RUN_VERIFICATION',
            'sfv_45':'STILL_REQUIRED'
          }
          pathlib.Path('final-r1-output.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Upload final regeneration evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-spg1-v2-r1-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            spg1-v2-r1-final-subject.tar
            spg1-v2-r1-final-subject.sha256
            final-r1-attestation-bundle.jsonl
            final-r1-output.json
            final-r1-same-run-verification.json
            final-r1/**
          if-no-files-found: error
          retention-days: 90
