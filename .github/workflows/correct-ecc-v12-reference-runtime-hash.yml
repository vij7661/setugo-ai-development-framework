name: Correct ECC V12 Reference Runtime Hash

on:
  push:
    branches:
      - experiments/ecc-derived-parallel-v12-transitive-primitive-integrity
    paths:
      - '.github/scripts/correct_ecc_v12_reference_runtime_hash.py'
      - '.github/workflows/correct-ecc-v12-reference-runtime-hash.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V12 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record correction input
        run: echo "CORRECTION_INPUT_SHA=$(git rev-parse HEAD)"

      - name: Correct exact reference runtime hash
        run: python .github/scripts/correct_ecc_v12_reference_runtime_hash.py

      - name: Commit manifest-only correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/ecc_derived/ecc_governance_trust_manifest.json
          git diff --cached --exit-code && { echo "No manifest correction produced"; exit 1; } || true
          git commit -m "Correct ECC V12 reference runtime code hash"
          git push origin HEAD:experiments/ecc-derived-parallel-v12-transitive-primitive-integrity
