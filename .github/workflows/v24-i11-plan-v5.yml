name: V24 I11 Plan V5 Contract

on:
  push:
    branches:
      - testing/v24-i11-falsification-plan-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V5 harness contract tests
        working-directory: testing/v24
        run: python -m unittest -v test_v24_i11_harness_contract_v3.py
      - name: Verify this is a plan-contract workflow only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v24-i11-plan-v5.yml').read_text()
          required='python -m unittest -v test_v24_i11_harness_contract_v3.py'
          if p.count(required) != 1:
              raise SystemExit('Expected exactly one harness-contract test command')
          execution_like=[]
          for line in p.splitlines():
              s=line.strip()
              if s.startswith('run:') and 'unittest' not in s and s != 'run: |':
                  execution_like.append(s)
          if execution_like:
              raise SystemExit(f'Unexpected direct run commands in plan workflow: {execution_like}')
          print('PLAN_CONTRACT_ONLY')
          PY
