name: V24 I11 Plan V5 Contract

on:
  push:
    branches:
      - testing/v24-i11-falsification-plan-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V5 harness contract tests
        working-directory: testing/v24
        run: python -m unittest -v test_v24_i11_harness_contract_v3.py
      - name: Plan-contract marker
        run: echo PLAN_CONTRACT_ONLY_NO_FALSIFICATION_EXECUTION
