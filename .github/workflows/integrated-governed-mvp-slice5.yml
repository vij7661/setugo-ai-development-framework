name: Integrated Governed MVP Slice 5

on:
  push:
    branches:
      - feature/integrated-governed-mvp-slice5-authoritative-state-ledger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice5-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Slice 5 construction branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run frozen Slice 5 acceptance harness
        run: |
          python -m unittest -v experiments/governed-platform/test_slice5_authoritative_state_ledger.py

      - name: Run accepted Slice 4 regression harness
        run: |
          cd experiments/governed-platform/governance
          python -m unittest -v test_integrated_governed_mvp_slice4.py
