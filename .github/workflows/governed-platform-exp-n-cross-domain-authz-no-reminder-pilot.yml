name: Governed Platform EXP-N Cross-Domain Authz No-Reminder Pilot
on:
  push:
    branches: [experiment/governed-platform-falsification-harness]
    paths: [.github/exp-n-cross-domain-authz-no-reminder-trigger.json]
permissions: {contents: read}
env:
  MECHANISMS: experiments/governed-platform/runner/mechanisms.remote-free.example.json
jobs:
  run:
    name: EXP-N no-reminder ${{ matrix.provider }} ${{ matrix.case_id }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        provider: [groq, openrouter]
        case_id: [EXP-N-018-AUTHZ-NOREMINDER-NEUTRAL-WRONG, EXP-N-019-AUTHZ-NOREMINDER-SENIOR-WRONG, EXP-N-020-AUTHZ-NOREMINDER-PRESTIGE-WRONG, EXP-N-021-AUTHZ-NOREMINDER-MAJORITY-WRONG, EXP-N-022-AUTHZ-NOREMINDER-CORRECT-CONTROL]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
      OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Execute frozen no-reminder authorization arm
        shell: bash
        run: |
          N="$(python -c 'import json;print(json.load(open(".github/exp-n-cross-domain-authz-no-reminder-trigger.json")).get("sample_count",3))')"
          CASE_ID="${{ matrix.case_id }}"
          PROVIDER="${{ matrix.provider }}"
          OUT="exp-n-cross-domain-authz-no-reminder-results/${PROVIDER}/${CASE_ID}"
          mkdir -p "$OUT"
          if [ "$PROVIDER" = "groq" ]; then
            BASE_URL="https://api.groq.com/openai/v1"; MODEL="openai/gpt-oss-20b"; KEY_ENV="GROQ_API_KEY"; MECH="remote-reasoner-a"
          else
            BASE_URL="https://openrouter.ai/api/v1"; MODEL="nvidia/nemotron-3-ultra-550b-a55b:free"; KEY_ENV="OPENROUTER_API_KEY"; MECH="remote-reasoner-b"
          fi
          python experiments/governed-platform/runner/prepare_run.py --case "experiments/governed-platform/cases/pilot/model-visible/${CASE_ID}.json" --mechanisms "$MECHANISMS" --mechanism-id "$MECH" --instruction-version exp-n-cross-domain-authz-no-reminder-v1 --out "$OUT/${CASE_ID}.envelope.json"
          for i in $(seq 1 "$N"); do
            python experiments/governed-platform/runner/run_remote_canary.py --envelope "$OUT/${CASE_ID}.envelope.json" --provider "$PROVIDER" --base-url "$BASE_URL" --model "$MODEL" --api-key-env "$KEY_ENV" --timeout-seconds 120 --temperature 0.7 --out "$OUT/${CASE_ID}.sample-${i}.raw-result.json" || true
          done
          python - <<PY
          import json
          from pathlib import Path
          Path("$OUT/sampling-policy.json").write_text(json.dumps({"policy_version":"exp-n-cross-domain-authz-no-reminder-sampling-v1","strategy":"ALL_VALID_SCORED","sample_count":int("$N"),"experimental_arm_label_visible":False,"ground_truth_registered_before_execution":True,"authority":"NONE","max_parallel_jobs":1,"matched_predecessor":"PILOT7-CROSS-DOMAIN-AUTHZ-AUTHORITY-CONSENSUS","experimental_change":"ANTI_DEFERENCE_REMINDER_REMOVED"},indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-n-cross-domain-authz-no-reminder-${{ matrix.provider }}-${{ matrix.case_id }}
          path: exp-n-cross-domain-authz-no-reminder-results/${{ matrix.provider }}/${{ matrix.case_id }}/
          if-no-files-found: error
