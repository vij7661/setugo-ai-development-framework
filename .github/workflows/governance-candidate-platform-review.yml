name: Governance Candidate Platform Review

on:
  push:
    branches: [governance/live-conversation-runtime]
    paths: [.github/governance-candidate-review-trigger.json]

permissions:
  contents: read
  actions: read

jobs:
  governance-review:
    name: Authenticated governance candidate review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_R3_API_KEY: ${{ secrets.OPENROUTER_R3_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve review trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          t=json.loads(Path('.github/governance-candidate-review-trigger.json').read_text(encoding='utf-8'))
          if t.get('enabled') is not True: raise SystemExit('trigger not enabled')
          if t.get('review_class')!='PLATFORM_AUTO_API_REVIEW': raise SystemExit('review class mismatch')
          if t.get('transport')!='AUTOMATIC_API': raise SystemExit('transport mismatch')
          provider=t.get('provider')
          if provider not in {'gemini','groq','openrouter'}: raise SystemExit('unsupported provider')
          profile=t.get('credential_profile','primary')
          if profile not in {'primary','r3'}: raise SystemExit('unsupported credential profile')
          if provider != 'openrouter' and profile != 'primary': raise SystemExit('alternate credential profile only supported for openrouter')
          for f in ('review_request_path','model'):
            v=t.get(f)
            if not isinstance(v,str) or not v.strip(): raise SystemExit(f'{f} required')
          req=json.loads(Path(t['review_request_path']).read_text(encoding='utf-8'))
          slot=req.get('reviewer_slot')
          if slot not in {'R1','R2','R3'}: raise SystemExit('frozen reviewer_slot required')
          policy=req.get('review_execution_policy')
          if not isinstance(policy,dict): raise SystemExit('frozen review_execution_policy required')
          print('REVIEW_REQUEST_PATH='+t['review_request_path'])
          print('REVIEW_PROVIDER='+provider)
          print('REVIEW_MODEL='+t['model'])
          print('REVIEW_CREDENTIAL_PROFILE='+profile)
          print('REVIEWER_SLOT='+slot)
          PY
      - name: Require provider secret and request file
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REVIEW_REQUEST_PATH"
          case "$REVIEW_PROVIDER" in
            gemini) test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY repository secret required'; exit 2; } ;;
            groq) test -n "$GROQ_API_KEY" || { echo 'GROQ_API_KEY repository secret required'; exit 2; } ;;
            openrouter)
              if [ "$REVIEW_CREDENTIAL_PROFILE" = "r3" ]; then
                test -n "$OPENROUTER_R3_API_KEY" || { echo 'OPENROUTER_R3_API_KEY repository secret required'; exit 2; }
              else
                test -n "$OPENROUTER_API_KEY" || { echo 'OPENROUTER_API_KEY repository secret required'; exit 2; }
              fi
              ;;
            *) echo 'unsupported provider'; exit 2 ;;
          esac
      - name: Execute authenticated governance review through provider-neutral v7
        shell: bash
        run: |
          set -u -o pipefail
          if [ "$REVIEW_PROVIDER" = "openrouter" ] && [ "$REVIEW_CREDENTIAL_PROFILE" = "r3" ]; then
            export OPENROUTER_API_KEY="$OPENROUTER_R3_API_KEY"
          fi
          mkdir -p governance-review-evidence
          : > governance-review-evidence/provider-error.log
          rc=1
          for attempt in 1 2 3; do
            echo "provider_attempt=${attempt}" | tee -a governance-review-evidence/provider-attempts.log
            : > governance-review-evidence/provider-error-attempt.log
            set +e
            python governance-runtime/platform_candidate_review_v7.py \
              --request "$REVIEW_REQUEST_PATH" \
              --output-dir governance-review-evidence \
              --provider "$REVIEW_PROVIDER" \
              --model "$REVIEW_MODEL" \
              2> >(tee governance-review-evidence/provider-error-attempt.log >&2)
            rc=$?
            set -e
            cat governance-review-evidence/provider-error-attempt.log >> governance-review-evidence/provider-error.log
            if [ "$rc" -eq 0 ]; then
              echo "provider_attempt_result=success" | tee -a governance-review-evidence/provider-attempts.log
              break
            fi
            if grep -Eqi '502|503|429|high demand|temporarily unavailable|temporarily overloaded|service unavailable|upstream error|rate limit|too many requests' governance-review-evidence/provider-error-attempt.log; then
              echo "provider_attempt_result=transient_unavailable" | tee -a governance-review-evidence/provider-attempts.log
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 20))
                continue
              fi
            else
              echo "provider_attempt_result=nonretryable_failure" | tee -a governance-review-evidence/provider-attempts.log
            fi
            break
          done
          exit "$rc"
      - name: Record fail-closed status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p governance-review-evidence
          python - <<'PY'
          import json,os
          from pathlib import Path
          t=json.loads(Path('.github/governance-candidate-review-trigger.json').read_text(encoding='utf-8'))
          req={}
          try:
            req=json.loads(Path(t.get('review_request_path','')).read_text(encoding='utf-8'))
          except Exception:
            pass
          policy=req.get('review_execution_policy') if isinstance(req,dict) else None
          if not isinstance(policy,dict): policy={}
          err=Path('governance-review-evidence/provider-error.log')
          attempts=Path('governance-review-evidence/provider-attempts.log')
          status={
            'schema_version':8,
            'review_request_path':t.get('review_request_path'),
            'trigger_sha':os.environ.get('GITHUB_SHA'),
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'review_class':'PLATFORM_AUTO_API_REVIEW',
            'transport':'AUTOMATIC_API',
            'provider':os.environ.get('REVIEW_PROVIDER'),
            'model':os.environ.get('REVIEW_MODEL'),
            'credential_profile':os.environ.get('REVIEW_CREDENTIAL_PROFILE','primary'),
            'reviewer_slot':req.get('reviewer_slot') if isinstance(req,dict) else None,
            'serving_provider':policy.get('serving_provider'),
            'allow_fallbacks':policy.get('allow_fallbacks'),
            'reasoning_max_tokens':policy.get('reasoning_max_tokens'),
            'max_output_tokens':policy.get('max_output_tokens'),
            'materialization_version':'GOV-FROZEN-CROSS-COMMIT-EVIDENCE-001',
            'runner_version':'GOV-REVIEWER-SERVING-PROVIDER-PIN-001',
            'workflow_status':os.environ.get('JOB_STATUS','failure').lower(),
            'authority_effect':'NONE_PENDING_DETERMINISTIC_INGESTION',
            'provider_attempt_log':attempts.read_text(encoding='utf-8',errors='replace')[-2000:] if attempts.exists() else None,
            'failure_detail':err.read_text(encoding='utf-8',errors='replace')[-4000:] if err.exists() else None,
          }
          Path('governance-review-evidence/workflow-status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Emit compact governed orchestration summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python governance-runtime/review_orchestration_summary.py \
            --request "$REVIEW_REQUEST_PATH" \
            --evidence-dir governance-review-evidence \
            --output governance-review-evidence/orchestration-summary.json \
            --job-status "$JOB_STATUS" \
            | tee /tmp/review-orchestration-summary.json
          {
            echo '### Governed review orchestration summary'
            echo '```json'
            cat /tmp/review-orchestration-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compact governance review summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-review-summary
          path: governance-review-evidence/orchestration-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload governance review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-candidate-platform-review
          path: governance-review-evidence/
          if-no-files-found: error
          retention-days: 30
