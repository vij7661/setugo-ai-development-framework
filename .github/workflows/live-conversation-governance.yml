name: Live Conversation Governance

on:
  push:
    branches:
      - governance/live-conversation-runtime
    paths:
      - 'governance-runtime/**'
      - '.github/workflows/live-conversation-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout live governance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate checkpoint, shared memory, and decision log
        run: python governance-runtime/validate_runtime.py

      - name: Test manual/API review transport equivalence and fail-closed promotion
        run: |
          cd governance-runtime
          python -m unittest -v test_review_protocol.py

      - name: Verify authoritative references exist and active head is exact
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_BRANCH=$(python - <<'PY'
          import json
          print(json.load(open('governance-runtime/session-state.json'))['active_workstream']['branch'])
          PY
          )
          EXPECTED_HEAD=$(python - <<'PY'
          import json
          print(json.load(open('governance-runtime/session-state.json'))['active_workstream']['head_commit'])
          PY
          )
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | awk '{print $1}')
          test -n "$REMOTE_HEAD"
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"

          git fetch --no-tags origin main "$ACTIVE_BRANCH"

          python - <<'PY' > /tmp/governed-shas.txt
          import json
          s=json.load(open('governance-runtime/session-state.json'))
          print(s['runtime']['normative_contract_commit'])
          for item in s['applicable_standards']:
              print(item['blob_sha'])
          w=s['active_workstream']
          for key in ('head_commit','preregistration_commit','frozen_acceptance_harness_commit','first_mechanism_commit','preserved_failure_record_commit'):
              print(w[key])
          p=s.get('accepted_prior_boundary',{})
          for key in ('scientific_freeze_commit','bounded_adjudication_commit'):
              if key in p:
                  print(p[key])
          PY

          while read -r SHA; do
            if git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              continue
            fi
            if git cat-file -e "${SHA}^{blob}" 2>/dev/null; then
              continue
            fi
            echo "Referenced Git object does not exist locally after authoritative fetch: ${SHA}" >&2
            exit 1
          done < /tmp/governed-shas.txt

      - name: Assert frozen Slice 3 harness is unchanged at referenced commit
        shell: bash
        run: |
          set -euo pipefail
          FROZEN_SHA=$(python - <<'PY'
          import json
          print(json.load(open('governance-runtime/session-state.json'))['active_workstream']['frozen_acceptance_harness_commit'])
          PY
          )
          git show "${FROZEN_SHA}:experiments/governed-platform/governance/test_integrated_governed_mvp_slice3.py" >/dev/null
          echo "Verified frozen Slice 3 harness at ${FROZEN_SHA}"

      - name: Build candidate-bound Claude review packet
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=governance-runtime python - <<'PY'
          import json, os
          from review_protocol import build_review_request
          questions = [
              'Independently assess whether AUTO_MODE and MANUAL_MODE are separated from review authority semantics correctly.',
              'Assess whether primary R1 may recommend review without being able to waive deterministic REQUIRED review.',
              'Assess whether production MANUAL_MODE using USER_INITIATED_API preserves the same provider API and governance semantics as AUTO_MODE/AUTOMATIC_API.',
              'Assess whether MANUAL_RELAY is safely limited to a fallback transport and cannot redesign or weaken production API review.',
              'Assess whether CI-built self-contained review packets are sufficient for a reviewer with zero GitHub/repository/tool access and whether full-file packet integrity/revision binding fail closed.',
              'Assess shared project memory continuity and authority separation across chat/session boundaries.',
              'Identify any path by which proposer confidence, reviewer consensus, platform mode, user choice, transport behavior, shared memory, API failure, packet export, or chat-window changes could bypass mandatory evidence/review/governor gates.',
              'Assess whether deterministic tests and CI are sufficient for this bounded candidate and identify missing adversarial cases.',
              'Return an independent disposition without assuming or using the proposer conclusion.'
          ]
          req = build_review_request(
              review_request_id='REV-GOV-PR5-006',
              trigger='MATERIAL_GOVERNANCE_CHANGE',
              artifact_type='live_conversation_governance_runtime_candidate',
              artifact_ref='PR-5',
              artifact_commit=os.environ['GITHUB_SHA'],
              proposer={'provider':'openai','model':'gpt-5.6-sol'},
              required_reviewer={'provider':'anthropic','model_class':'claude'},
              blind_review_required=True,
              review_questions=questions,
              evidence_refs=[
                  {'type':'ci_run','ref':os.environ['GITHUB_RUN_ID']},
                  {'type':'history','ref':'REV-GOV-PR5-001 through REV-GOV-PR5-005 superseded before external review'}
              ],
          )
          with open('/tmp/REV-GOV-PR5-006.json','w',encoding='utf-8') as f:
              json.dump(req,f,indent=2)
          PY
          python governance-runtime/build_portable_review_packet.py \
            --request /tmp/REV-GOV-PR5-006.json \
            --output-dir candidate-review-output \
            --ci-run-id "$GITHUB_RUN_ID" \
            --builder-head "$GITHUB_SHA"
          cp /tmp/REV-GOV-PR5-006.json candidate-review-output/REV-GOV-PR5-006.request.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('candidate-review-output')
          packet=root/'REV-GOV-PR5-006-portable-review-packet.md'
          manifest=json.loads((root/'REV-GOV-PR5-006.manifest.json').read_text(encoding='utf-8'))
          request=json.loads((root/'REV-GOV-PR5-006.request.json').read_text(encoding='utf-8'))
          actual=hashlib.sha256(packet.read_bytes()).hexdigest()
          assert actual == manifest['bundle_file_sha256']
          assert manifest['reviewed_candidate_commit'] == os.environ['GITHUB_SHA']
          assert request['artifact']['commit'] == os.environ['GITHUB_SHA']
          assert manifest['review_request_id'] == request['review_request_id'] == 'REV-GOV-PR5-006'
          assert manifest['repository_access_required'] is False
          PY

      - name: Upload candidate-bound Claude review packet
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-REV-GOV-PR5-006-${{ github.run_id }}
          path: candidate-review-output/
          if-no-files-found: error
          retention-days: 30

      - name: Build portable manual-review packet when an active request exists
        id: portable_packet
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_PATH=$(python - <<'PY'
          import json
          value=json.load(open('governance-runtime/session-state.json'))['runtime']['promotion'].get('review_request_path')
          print(value or '')
          PY
          )
          if [ -z "$REQUEST_PATH" ]; then
            echo "No active review request; packet build skipped."
            echo "has_packet=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python governance-runtime/build_portable_review_packet.py \
            --request "$REQUEST_PATH" \
            --output-dir review-output \
            --ci-run-id "$GITHUB_RUN_ID" \
            --builder-head "$GITHUB_SHA"
          echo "has_packet=true" >> "$GITHUB_OUTPUT"

      - name: Upload portable manual-review packet
        if: steps.portable_packet.outputs.has_packet == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: portable-review-packet-${{ github.run_id }}
          path: review-output/
          if-no-files-found: error
          retention-days: 30
