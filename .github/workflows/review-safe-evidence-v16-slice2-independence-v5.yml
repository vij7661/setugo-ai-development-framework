name: Review Safe Evidence V16 Slice 2 Independence V5

on:
  push:
    branches: [implementation/review-safe-evidence-v16]
    paths:
      - 'governance-runtime/review_safe_evidence_v16_trust.py'
      - 'governance-runtime/review_safe_evidence_v16_independence.py'
      - 'governance-runtime/review_safe_evidence_v16_independence_v2.py'
      - 'governance-runtime/review_safe_evidence_v16_manifest_validation.py'
      - 'governance-runtime/test_review_safe_evidence_v16_trust.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_v2.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_iar2.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_iar3.py'
      - 'governance-runtime/test_review_safe_evidence_v16_independence_iar4.py'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-v2.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar1.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar2.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar3.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-test-manifest-iar4.json'
      - 'governance-runtime/review-safe-evidence-v16-slice2-current-manifests.json'
      - 'governance-runtime/requirements-review-safe-evidence-v16.txt'
      - 'implementation/review-safe-evidence/V16-SLICE-2-IAR4-REPAIR-CONTRACT.md'
      - '.github/workflows/review-safe-evidence-v16-slice2-independence-v5.yml'
permissions: {contents: read}
concurrency:
  group: review-safe-evidence-v16-slice2-v5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independence-iar4-repair-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - name: Record candidate and verify exact dependency blobs
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git hash-object governance-runtime/review_safe_evidence_v16_trust.py)" = "7030d6643e76743cf086f7749292442bdadc3262"
          test "$(git hash-object governance-runtime/review_safe_evidence_v16_independence.py)" = "268095665ff8b414c532bb9289437ca72782e8db"
          test "$(git hash-object governance-runtime/review_safe_evidence_v16_independence_v2.py)" = "b76a4a6ecdcb4c001107e9ce22d6addbf8b39dfa"
          test "$(git hash-object governance-runtime/review_safe_evidence_v16_manifest_validation.py)" = "8f5582300658e003755aab19bc7e0b5d917bae07"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_trust.py)" = "41cdb6a6caccd1a24797f0859f50ece557c83ea0"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_independence.py)" = "8ed790401280862796ea1f79eadb17f18cfe7ff8"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_independence_v2.py)" = "f5f130543641d7675fe4eba9f52dca969d52d74e"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_independence_iar2.py)" = "d62eb7cde62805ace95b1dff6d27a08cdf295213"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_independence_iar3.py)" = "7537c9517366bbff30c430306975da3b4caf6b96"
          test "$(git hash-object governance-runtime/test_review_safe_evidence_v16_independence_iar4.py)" = "dcbfde5e548d500cbececed331956965cc10d5ff"
          test "$(git hash-object governance-runtime/review-safe-evidence-v16-slice2-test-manifest.json)" = "27983a245408589ec39681aa69da3a003294ddd8"
          echo "V16_SLICE1_FROZEN_COMMIT=36f22a35ff57b6994d55c705c08686609276ddb3"
          echo "V16_SLICE2_HISTORICAL_BASELINE_BLOB=EXACT_MATCH"
          echo "V16_SLICE2_SOURCE_BLOBS=EXACT_MATCH"
          echo "IMPLEMENTATION_QUALIFICATION=NOT_CLAIMED"
          echo "RUNTIME_QUALIFICATION=NOT_CLAIMED"
          echo "AUTHORITY_EFFECT=NONE_EVIDENCE_ONLY"
      - name: Install pinned crypto dependency
        run: |
          python -m pip install --disable-pip-version-check -r governance-runtime/requirements-review-safe-evidence-v16.txt
          python - <<'PY'
          import cryptography
          assert cryptography.__version__ == "46.0.4", cryptography.__version__
          print("V16_SLICE2_CRYPTOGRAPHY_VERSION=" + cryptography.__version__)
          PY
      - name: Compile Slice 2 source and tests
        run: |
          python -m compileall -q \
            governance-runtime/review_safe_evidence_v16_trust.py \
            governance-runtime/review_safe_evidence_v16_independence.py \
            governance-runtime/review_safe_evidence_v16_independence_v2.py \
            governance-runtime/review_safe_evidence_v16_manifest_validation.py \
            governance-runtime/test_review_safe_evidence_v16_trust.py \
            governance-runtime/test_review_safe_evidence_v16_independence.py \
            governance-runtime/test_review_safe_evidence_v16_independence_v2.py \
            governance-runtime/test_review_safe_evidence_v16_independence_iar2.py \
            governance-runtime/test_review_safe_evidence_v16_independence_iar3.py \
            governance-runtime/test_review_safe_evidence_v16_independence_iar4.py
      - name: Run Slice 2 mandatory adversarial tests
        working-directory: governance-runtime
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/v16-slice2-v5-unittest.log"
          python -m unittest -v \
            test_review_safe_evidence_v16_independence.py \
            test_review_safe_evidence_v16_independence_v2.py \
            test_review_safe_evidence_v16_independence_iar2.py \
            test_review_safe_evidence_v16_independence_iar3.py \
            test_review_safe_evidence_v16_independence_iar4.py 2>&1 | tee "$LOG"
          echo "V16_SLICE2_TEST_LOG=$LOG" >> "$GITHUB_ENV"
      - name: Verify strict current manifests against source and raw execution log
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=governance-runtime python - <<'PY'
          import ast, os, pathlib, re
          from review_safe_evidence_v16_manifest_validation import validate_current_manifest_set
          root=pathlib.Path("governance-runtime")
          validation=validate_current_manifest_set(root)
          assert validation["valid"], validation["problems"]
          assert validation["test_count"] == 69
          assert validation["authority_effect"] == "NONE_EVIDENCE_ONLY"
          source_paths=[
              root/"test_review_safe_evidence_v16_independence.py",
              root/"test_review_safe_evidence_v16_independence_v2.py",
              root/"test_review_safe_evidence_v16_independence_iar2.py",
              root/"test_review_safe_evidence_v16_independence_iar3.py",
              root/"test_review_safe_evidence_v16_independence_iar4.py",
          ]
          discovered=[]
          for source in source_paths:
              tree=ast.parse(source.read_text(encoding="utf-8"),filename=str(source))
              module=source.stem
              for node in tree.body:
                  if isinstance(node,ast.ClassDef):
                      for child in node.body:
                          if isinstance(child,(ast.FunctionDef,ast.AsyncFunctionDef)) and child.name.startswith("test_"):
                              discovered.append(f"{module}.{node.name}.{child.name}")
          import json
          manifest_names=[
              "review-safe-evidence-v16-slice2-test-manifest-v2.json",
              "review-safe-evidence-v16-slice2-test-manifest-iar1.json",
              "review-safe-evidence-v16-slice2-test-manifest-iar2.json",
              "review-safe-evidence-v16-slice2-test-manifest-iar3.json",
              "review-safe-evidence-v16-slice2-test-manifest-iar4.json",
          ]
          declared=[]
          requirement_ids=[]
          for name in manifest_names:
              manifest=json.loads((root/name).read_text(encoding="utf-8"))
              for row in manifest["tests"]:
                  declared.append(row["python_test_id"])
                  requirement_ids.append(row["requirement_test_id"])
          log=pathlib.Path(os.environ["V16_SLICE2_TEST_LOG"]).read_text(encoding="utf-8",errors="strict")
          executed=re.findall(
              r"^test_[A-Za-z0-9_]+ \((test_review_safe_evidence_v16_independence(?:_v2|_iar2|_iar3|_iar4)?\.[A-Za-z0-9_]+\.[A-Za-z0-9_]+)\) \.\.\. ok$",
              log,flags=re.MULTILINE,
          )
          assert len(declared)==69,len(declared)
          assert len(discovered)==69,len(discovered)
          assert len(executed)==69,len(executed)
          assert len(requirement_ids)==len(set(requirement_ids))
          assert len(declared)==len(set(declared))
          assert set(declared)==set(discovered),sorted(set(declared)^set(discovered))
          assert set(declared)==set(executed),sorted(set(declared)^set(executed))
          assert "skipped=" not in log
          assert "FAILED" not in log
          assert "\nOK\n" in log
          print("V16_SLICE2_MANDATORY_TESTS_VERIFIED=69")
          print("V16_SLICE2_STRICT_MANIFEST_VALIDATION=PASS")
          print("V16_SLICE2_HISTORICAL_PREDECESSOR_CONTENT_BINDING=PASS")
          print("V16_SLICE2_SOURCE_MANIFEST_EXECUTION_SET_EQUALITY=PASS")
          print("V16_SLICE2_COMPOSITE_MANIFEST=30_PLUS_15_PLUS_8_PLUS_8_PLUS_8")
          PY
      - name: Construction boundary
        run: |
          echo "V16_SLICE2_IAR4_REPAIRS=CONSTRUCTION_PASS_NONAUTHORITATIVE"
          echo "V16_SLICE2_BOUND_GRAPH_INPUT=ONE_OWNED_SNAPSHOT_PER_PUBLIC_OPERATION"
          echo "V16_SLICE2_HISTORICAL_MANIFEST_LINEAGE=EXACT_GIT_BLOB_BOUND"
          echo "V16_SLICE2_MANIFEST_JSON=DUPLICATE_KEYS_AND_UNKNOWN_FIELDS_REJECTED"
          echo "V16_SLICE2_OUTER_BINDING_QUORUM=GRAPH_REPRESENTED_NONCANDIDATE_PAIRWISE_INDEPENDENT"
          echo "V16_SLICE2_GLOBAL_PROMOTION_BLOCKING=ENFORCED_WHILE_REAL_WORLD_COMPLETENESS_UNPROVEN"
          echo "V16_SLICE2_VALIDATOR_ARTIFACT_MEASUREMENT_INDEPENDENTLY_PROVEN=false"
          echo "V16_SLICE2_GENERATION_CURRENTNESS=LOCAL_EQUALITY_CONTRACT_NOT_FINAL_AUTHENTICATED_GENERATION_MECHANISM"
          echo "V16_SLICE2_GRAPH_COMPLETENESS_REAL_WORLD_PROVEN=false"
          echo "V16_SLICE2_TRUST_HEAD_PROVISIONING=OUT_OF_BAND_NOT_PROVEN"
          echo "INTERNAL_ADVERSARIAL_REVIEW_EXHAUSTED=false"
          echo "IMPLEMENTATION_QUALIFICATION=NOT_CLAIMED"
          echo "RUNTIME_QUALIFICATION=NOT_CLAIMED"
          echo "SCIENTIFIC_AUTHORITY=NOT_CLAIMED"
          echo "AUTHORITY_EFFECT=NONE_EVIDENCE_ONLY"
