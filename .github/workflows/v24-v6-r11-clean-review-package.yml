name: V24 V6 R11 Clean Manual Review Package

on:
  push:
    branches:
      - review/v24-i11-v6-r11-successor-clean
    paths:
      - '.github/workflows/v24-v6-r11-clean-review-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-clean-review-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Fetch exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_META='dfe9273b444e856274f1dbae5d0a165eda1d07f4'
          CANDIDATE='68ce0df63ce0133ae19ec4402b41c4c09adfb54e'
          CANDIDATE_TREE='d202b039285213b386557083a26de42e0fb20cf4'
          DESIGN_COMMIT='0e1c6dd99e608d6771df98549bb28a9b92b8e7a0'
          DESIGN_BLOB='4a15d50a0488464816d235b273d1dbf808fdce94'

          git fetch --no-tags --depth=1 origin "$REVIEW_META"
          git fetch --no-tags --depth=1 origin "$CANDIDATE"
          git fetch --no-tags --depth=1 origin "$DESIGN_COMMIT"

          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$CANDIDATE_TREE"
          git cat-file -e "$DESIGN_BLOB"

          echo "R11_REVIEW_META=$REVIEW_META" >> "$GITHUB_ENV"
          echo "R11_CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          echo "R11_CANDIDATE_TREE=$CANDIDATE_TREE" >> "$GITHUB_ENV"
          echo "R11_DESIGN_BLOB=$DESIGN_BLOB" >> "$GITHUB_ENV"

      - name: Verify fixed review-side object identities
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1" expected="$2"
            local actual
            actual="$(git rev-parse "$R11_REVIEW_META:$path")"
            test "$actual" = "$expected" || { echo "REVIEW_OBJECT_BLOB_MISMATCH:$path:$actual:$expected"; exit 1; }
          }

          check_blob review/v24/V24-I11-V6-R11-CLEAN-REVIEW-BINDING.json fb44300e2fd01cfd3907eb5a0e3901b01ec4db90
          check_blob review/v24/V24-I11-V6-R11-CLEAN-SUCCESSOR-REVIEW-INSTRUCTIONS.md 9324953110fb59c0be2b2b1d6bb5940073a9964d
          check_blob review/v24/V24-I11-V6-R11-CONSTRUCTION-EVIDENCE.md f9be183265aeedbe91daf2ff5d1af5b0f11b25b6
          check_blob review/v24/V24-I11-V6-R11-EXTERNAL-AUTHORITY-EVIDENCE.md d42b7283fd625954669e053e6e1d0e8a2863d145
          check_blob review/v24/V24-I11-V6-R11-EXTERNAL-PINSET.json bcdf504956b4fd9ebb3502a4b410bbe4b85f2ea2
          check_blob review/v24/V24-I11-V6-R11-EXTERNAL-VERIFICATION.json 423744215e6c8b3dfc2f64f065dab015206e9fea
          check_blob review/v24/V24-I11-V6-R11-FROZEN-SUCCESSOR-BINDING.json e702a69151b3f7bbcab81fecfe9c1ea41fd9cf45
          check_blob review/v24/V24-I11-V6-R11-STATIC-EXTERNAL-VERIFICATION.json 7b56bf1402d59a67cf4494c9f309e709a2ed96ae
          check_blob review/v24/r11_trusted_external_guard.py d8792e90c379426a4f304c02761181707f10ca48
          check_blob review/v24/r11_trusted_unittest_runner.py 1773c33e3898859a3733774736ce0c5036646dd8

      - name: Build deterministic package twice and verify byte identity
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/build_r11_package.py" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import zipfile

          REVIEW_META = os.environ['R11_REVIEW_META']
          CANDIDATE = os.environ['R11_CANDIDATE']
          CANDIDATE_TREE = os.environ['R11_CANDIDATE_TREE']
          DESIGN_BLOB = os.environ['R11_DESIGN_BLOB']
          ROOT_NAME = 'V24-I11-V6-R11-CLEAN-REVIEW'
          OUT = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r11-clean-review-package'
          STAGE = OUT / ROOT_NAME
          ZIP1 = OUT / f'{ROOT_NAME}.zip'
          ZIP2 = OUT / f'{ROOT_NAME}.second-build.zip'

          PINSET_SHA256 = 'dfd5663e767ae507a0c695bd8484f9d1e338eda96c775a6a2eb304f4cbbcea14'
          GENERATED_VERIFICATION_SHA256 = '27e524dc6efd569dd9462097933926c2fda648ec47eb2475f11078f6469f75e7'
          STATIC_VERIFICATION_SHA256 = 'bb9786661b5b996c4b3ed185d981879cd9b93b56aa941f486958fcd1795c9c35'
          DESIGN_SHA256 = '96ec464fbf602ac6b8c89fca5af16aa71a8d53f9f042605e46a07b4cd628ca62'
          DESIGN_BYTES = 19297

          REVIEW_FILES = {
              '00-REVIEW-INSTRUCTIONS.md': 'review/v24/V24-I11-V6-R11-CLEAN-SUCCESSOR-REVIEW-INSTRUCTIONS.md',
              'review/V24-I11-V6-R11-CLEAN-REVIEW-BINDING.json': 'review/v24/V24-I11-V6-R11-CLEAN-REVIEW-BINDING.json',
              'review/V24-I11-V6-R11-FROZEN-SUCCESSOR-BINDING.json': 'review/v24/V24-I11-V6-R11-FROZEN-SUCCESSOR-BINDING.json',
              'evidence/V24-I11-V6-R11-CONSTRUCTION-EVIDENCE.md': 'review/v24/V24-I11-V6-R11-CONSTRUCTION-EVIDENCE.md',
              'evidence/V24-I11-V6-R11-EXTERNAL-AUTHORITY-EVIDENCE.md': 'review/v24/V24-I11-V6-R11-EXTERNAL-AUTHORITY-EVIDENCE.md',
              'external/V24-I11-V6-R11-EXTERNAL-PINSET.json': 'review/v24/V24-I11-V6-R11-EXTERNAL-PINSET.json',
              'external/V24-I11-V6-R11-EXTERNAL-VERIFICATION.json': 'review/v24/V24-I11-V6-R11-EXTERNAL-VERIFICATION.json',
              'external/V24-I11-V6-R11-STATIC-EXTERNAL-VERIFICATION.json': 'review/v24/V24-I11-V6-R11-STATIC-EXTERNAL-VERIFICATION.json',
              'external/r11_trusted_external_guard.py': 'review/v24/r11_trusted_external_guard.py',
              'external/r11_trusted_unittest_runner.py': 'review/v24/r11_trusted_unittest_runner.py',
          }

          def git_bytes(spec: str) -> bytes:
              return subprocess.check_output(['git', 'show', spec])

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def write_bytes(rel: str, data: bytes) -> None:
              p = STAGE / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)

          if OUT.exists():
              shutil.rmtree(OUT)
          STAGE.mkdir(parents=True)

          for rel, repo_path in REVIEW_FILES.items():
              write_bytes(rel, git_bytes(f'{REVIEW_META}:{repo_path}'))

          pinset_path = STAGE / 'external/V24-I11-V6-R11-EXTERNAL-PINSET.json'
          pinset_bytes = pinset_path.read_bytes()
          if sha256(pinset_bytes) != PINSET_SHA256:
              raise SystemExit('STATIC_PINSET_SHA256_MISMATCH')
          pinset = json.loads(pinset_bytes.decode('utf-8'))

          if pinset.get('candidate_commit') != CANDIDATE:
              raise SystemExit('PINSET_CANDIDATE_COMMIT_MISMATCH')
          if pinset.get('candidate_tree') != CANDIDATE_TREE:
              raise SystemExit('PINSET_CANDIDATE_TREE_MISMATCH')
          if pinset.get('authority_origin') != 'EXTERNAL_REVIEW_BRANCH':
              raise SystemExit('PINSET_AUTHORITY_ORIGIN_INVALID')
          if pinset.get('candidate_self_grant') is not False:
              raise SystemExit('PINSET_SELF_GRANT_INVALID')

          admitted = pinset.get('admitted_files')
          if not isinstance(admitted, list) or len(admitted) != 69:
              raise SystemExit('PINSET_ADMITTED_FILE_COUNT_INVALID')
          if len(pinset.get('executed_tests', [])) != 19:
              raise SystemExit('PINSET_EXECUTED_TEST_COUNT_INVALID')
          if len(pinset.get('required_support_files', [])) != 10:
              raise SystemExit('PINSET_SUPPORT_FILE_COUNT_INVALID')

          seen: set[str] = set()
          for item in sorted(admitted, key=lambda x: x['path']):
              path = item['path']
              if path in seen:
                  raise SystemExit(f'DUPLICATE_ADMITTED_PATH:{path}')
              seen.add(path)
              tree_line = subprocess.check_output(['git', 'ls-tree', CANDIDATE, '--', path], text=True).strip()
              if not tree_line:
                  raise SystemExit(f'ADMITTED_PATH_MISSING:{path}')
              mode, typ, blob_and_path = tree_line.split(None, 2)
              blob = blob_and_path.split('\t', 1)[0]
              if typ != 'blob' or mode == '120000':
                  raise SystemExit(f'ADMITTED_PATH_NOT_REGULAR_FILE:{path}:{mode}:{typ}')
              if blob != item['git_blob_sha1']:
                  raise SystemExit(f'ADMITTED_BLOB_MISMATCH:{path}')
              data = git_bytes(f'{CANDIDATE}:{path}')
              if sha256(data) != item['raw_sha256']:
                  raise SystemExit(f'ADMITTED_RAW_SHA256_MISMATCH:{path}')
              write_bytes(f'candidate/{path}', data)

          design = subprocess.check_output(['git', 'cat-file', 'blob', DESIGN_BLOB])
          if len(design) != DESIGN_BYTES or sha256(design) != DESIGN_SHA256:
              raise SystemExit('APPROVED_DESIGN_IDENTITY_MISMATCH')
          write_bytes('design/V24-I11-V6-APPROVED-DESIGN-EXACT.md', design)

          generated_ver = (STAGE / 'external/V24-I11-V6-R11-EXTERNAL-VERIFICATION.json').read_bytes()
          static_ver = (STAGE / 'external/V24-I11-V6-R11-STATIC-EXTERNAL-VERIFICATION.json').read_bytes()
          if sha256(generated_ver) != GENERATED_VERIFICATION_SHA256:
              raise SystemExit('GENERATED_VERIFICATION_SHA256_MISMATCH')
          if sha256(static_ver) != STATIC_VERIFICATION_SHA256:
              raise SystemExit('STATIC_VERIFICATION_SHA256_MISMATCH')

          package_files = []
          for p in sorted(x for x in STAGE.rglob('*') if x.is_file()):
              rel = p.relative_to(STAGE).as_posix()
              data = p.read_bytes()
              if rel.startswith('candidate/'):
                  source_class = 'FROZEN_CANDIDATE'
              elif rel.startswith('design/'):
                  source_class = 'APPROVED_V6_DESIGN'
              elif rel.startswith('external/'):
                  source_class = 'EXTERNAL_REVIEW_AUTHORITY_EVIDENCE'
              elif rel.startswith('evidence/'):
                  source_class = 'NON_AUTHORITATIVE_CONSTRUCTION_EVIDENCE'
              else:
                  source_class = 'CLEAN_REVIEW_METADATA'
              package_files.append({
                  'path': rel,
                  'bytes': len(data),
                  'sha256': sha256(data),
                  'source_class': source_class,
              })

          manifest = {
              'schema_version': 1,
              'package_id': 'V24-I11-V6-R11-CLEAN-MANUAL-REVIEW-PACKAGE',
              'package_format': 'ZIP_STORED_FIXED_1980_TIMESTAMP_SORTED_PATHS',
              'manifest_scope': 'ALL_PACKAGE_FILES_EXCEPT_PACKAGE-MANIFEST.json',
              'frozen_candidate': {
                  'commit': CANDIDATE,
                  'tree': CANDIDATE_TREE,
                  'admitted_file_count': 69,
              },
              'review_metadata_commit': REVIEW_META,
              'approved_v6_design': {
                  'git_blob_sha1': DESIGN_BLOB,
                  'bytes': DESIGN_BYTES,
                  'raw_sha256': DESIGN_SHA256,
              },
              'external_authority': {
                  'static_pinset_sha256': PINSET_SHA256,
                  'generated_verification_sha256': GENERATED_VERIFICATION_SHA256,
                  'static_verification_sha256': STATIC_VERIFICATION_SHA256,
                  'executed_test_module_count': 19,
                  'executed_test_case_count': 259,
                  'required_support_file_count': 10,
              },
              'review_isolation': {
                  'prior_r10_reviewer_prose_included': False,
                  'prior_adjudication_prose_included': False,
                  'prior_chat_or_model_memory_included': False,
                  'automated_reviewer_api_calls_permitted': False,
              },
              'state': {
                  'independent_manual_review_completed': False,
                  'scientific_execution_state': 'CLOSED_PENDING_SUCCESSOR_REVIEW',
                  'runtime_qualification_state': 'NOT_CLAIMED',
                  'authority_effect': 'NONE_EVIDENCE_ONLY',
              },
              'files': package_files,
          }
          manifest_bytes = (json.dumps(manifest, sort_keys=True, indent=2) + '\n').encode('utf-8')
          write_bytes('PACKAGE-MANIFEST.json', manifest_bytes)

          def build_zip(target: pathlib.Path) -> None:
              with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
                  for p in sorted(x for x in STAGE.rglob('*') if x.is_file()):
                      rel = p.relative_to(STAGE).as_posix()
                      arc = f'{ROOT_NAME}/{rel}'
                      info = zipfile.ZipInfo(arc, date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_STORED
                      info.create_system = 3
                      info.external_attr = 0o100644 << 16
                      info.internal_attr = 0
                      info.extra = b''
                      info.comment = b''
                      zf.writestr(info, p.read_bytes())

          build_zip(ZIP1)
          build_zip(ZIP2)
          if ZIP1.read_bytes() != ZIP2.read_bytes():
              raise SystemExit('NON_DETERMINISTIC_ZIP_BYTES')

          with zipfile.ZipFile(ZIP1, 'r') as zf:
              names = zf.namelist()
              expected = [f'{ROOT_NAME}/{p.relative_to(STAGE).as_posix()}' for p in sorted(x for x in STAGE.rglob('*') if x.is_file())]
              if names != expected or len(names) != len(set(names)):
                  raise SystemExit('ZIP_ENTRY_SET_OR_ORDER_MISMATCH')
              for p in sorted(x for x in STAGE.rglob('*') if x.is_file()):
                  rel = p.relative_to(STAGE).as_posix()
                  if zf.read(f'{ROOT_NAME}/{rel}') != p.read_bytes():
                      raise SystemExit(f'ZIP_CONTENT_MISMATCH:{rel}')

          zip_sha = sha256(ZIP1.read_bytes())
          manifest_sha = sha256(manifest_bytes)
          (OUT / f'{ROOT_NAME}.sha256').write_text(f'{zip_sha}  {ROOT_NAME}.zip\n', encoding='utf-8')
          (OUT / f'{ROOT_NAME}.MANIFEST.sha256').write_text(f'{manifest_sha}  {ROOT_NAME}/PACKAGE-MANIFEST.json\n', encoding='utf-8')
          build_record = {
              'schema_version': 1,
              'package_id': 'V24-I11-V6-R11-CLEAN-MANUAL-REVIEW-PACKAGE',
              'frozen_candidate_commit': CANDIDATE,
              'frozen_candidate_tree': CANDIDATE_TREE,
              'review_metadata_commit': REVIEW_META,
              'zip_sha256': zip_sha,
              'manifest_sha256': manifest_sha,
              'zip_bytes': ZIP1.stat().st_size,
              'package_entry_count': len(expected),
              'deterministic_double_build': 'PASS',
              'content_reverification': 'PASS',
              'scientific_execution_state': 'CLOSED_PENDING_SUCCESSOR_REVIEW',
              'runtime_qualification_state': 'NOT_CLAIMED',
              'authority_effect': 'NONE_EVIDENCE_ONLY',
          }
          (OUT / f'{ROOT_NAME}.BUILD-RECORD.json').write_text(
              json.dumps(build_record, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )

          print(f'PACKAGE_ZIP_SHA256={zip_sha}')
          print(f'PACKAGE_MANIFEST_SHA256={manifest_sha}')
          print(f'PACKAGE_ZIP_BYTES={ZIP1.stat().st_size}')
          print(f'PACKAGE_ENTRY_COUNT={len(expected)}')
          print('DETERMINISTIC_DOUBLE_BUILD=PASS')
          print('CONTENT_REVERIFICATION=PASS')
          PY

          python "$RUNNER_TEMP/build_r11_package.py"

      - name: Upload clean manual-review package
        uses: actions/upload-artifact@v4
        with:
          name: v24-v6-r11-clean-manual-review-package
          path: |
            ${{ runner.temp }}/r11-clean-review-package/V24-I11-V6-R11-CLEAN-REVIEW.zip
            ${{ runner.temp }}/r11-clean-review-package/V24-I11-V6-R11-CLEAN-REVIEW.sha256
            ${{ runner.temp }}/r11-clean-review-package/V24-I11-V6-R11-CLEAN-REVIEW.MANIFEST.sha256
            ${{ runner.temp }}/r11-clean-review-package/V24-I11-V6-R11-CLEAN-REVIEW.BUILD-RECORD.json
          if-no-files-found: error
          retention-days: 90
