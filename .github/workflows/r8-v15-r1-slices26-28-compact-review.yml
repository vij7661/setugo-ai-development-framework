name: R8 v15-r1 Slices26-28 Compact Review

on:
  push:
    branches:
      - implementation/r8-v15-r1-slice28-scope-replacement-outside-table-input-local-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-SLICES26-28-COMPACT-REVIEW-MARKER.json

permissions:
  contents: read
  actions: read

jobs:
  build-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build compact single-file review packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/build_r8_v15_r1_slices26_28_compact_review.py
          test "$(find review-compact-s26-28 -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Upload compact review packet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-slices26-28-compact-review
          path: review-compact-s26-28/R8-V15-R1-SLICES26-28-COMPACT-REVIEW.txt
          if-no-files-found: error
          retention-days: 30
