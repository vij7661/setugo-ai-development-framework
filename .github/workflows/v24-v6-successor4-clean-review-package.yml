name: V24 V6 Successor-4 Clean Review Package

on:
  push:
    branches:
      - review/v24-i11-v6-successor-4-clean
    paths:
      - '.github/workflows/v24-v6-successor4-clean-review-package.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Verify and extract exact frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='ef30eba1dfbe5ccf0ec6edb9e8d1295da5c70ddb'
          TREE='bfbf49021514240668b24612d53ea790bcdf0baa'
          git fetch --no-tags --depth=1 origin "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$TREE"

          PKG="$RUNNER_TEMP/v24-v6-successor4-clean-review"
          mkdir -p "$PKG/candidate" "$PKG/evidence" "$PKG/approved-design" "$PKG/external-trust" "$PKG/predecessor-review"

          PATHS=(
            '.github/workflows/v24-v6-successor4-final-head.yml'
            '.github/workflows/v24-v6-successor4-attestation-inventory.yml'
            '.github/workflows/v24-v6-successor4-external-anchor-red.yml'
            'implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json'
            'implementation/v24/V24-I11-V6-SUCCESSOR-4-ROOT-TRUST-REPAIR-DESIGN.md'
            'implementation/v24/V24-I11-V6-R1-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R2-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R3-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R4-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R5-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R6-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R7-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R8-CONSTRUCTION-EVIDENCE.md'
            'governance-runtime/v24_v6_governance_foundation.py'
            'governance-runtime/v24_v6_root_attestation.py'
            'governance-runtime/v24_v6_proof_reference_closure.py'
            'governance-runtime/v24_v6_test_proof_context.py'
            'governance-runtime/fixtures/v24-v6-construction-root-attestation-v3.json'
            'governance-runtime/fixtures/v24-v6-construction-context-signatures-v3.json'
            'governance-runtime/v24_v6_endpoint_projection.py'
            'governance-runtime/v24_v6_material_surface.py'
            'governance-runtime/v24_v6_decision_apply.py'
            'governance-runtime/v24_v6_normative_clause_projection.py'
            'governance-runtime/v24_v6_effect_ledger_closure.py'
            'governance-runtime/v24_v6_atomic_binding_modes.py'
            'governance-runtime/v24_v6_qualification_integrity.py'
            'governance-runtime/v24_v6_integrated_successor.py'
            'governance-runtime/v24_endpoint_proof_compiler.py'
            'governance-runtime/normative_control_catalog.py'
            'governance-runtime/test_v24_v6_governance_foundation.py'
            'governance-runtime/test_v24_v6_proof_reference_closure.py'
            'governance-runtime/test_v24_v6_proof_resolution_red.py'
            'governance-runtime/test_v24_v6_successor3_manual_review_red.py'
            'governance-runtime/test_v24_v6_successor4_external_anchor_red.py'
            'governance-runtime/test_v24_v6_successor4_root_attestation.py'
            'governance-runtime/test_v24_v6_endpoint_projection.py'
            'governance-runtime/test_v24_v6_material_surface.py'
            'governance-runtime/test_v24_v6_decision_apply.py'
            'governance-runtime/test_v24_v6_normative_clause_projection.py'
            'governance-runtime/test_v24_v6_effect_ledger_closure.py'
            'governance-runtime/test_v24_v6_atomic_binding_modes.py'
            'governance-runtime/test_v24_v6_qualification_integrity.py'
            'governance-runtime/test_v24_v6_integrated_successor.py'
            'governance-runtime/test_v24_v6_integrated_successor_dependency_red.py'
            'governance-runtime/test_v24_endpoint_proof_compiler.py'
            'governance-runtime/test_normative_control_catalog.py'
            'remediation/v24/V24-I11-V6-PROOF-REFERENCE-CLOSURE-REPAIR-DESIGN.md'
            'remediation/v24/V24-I11-V6-R9-PROOF-REFERENCE-CLOSURE-FINDING.md'
          )

          git archive --format=tar "$CANDIDATE" "${PATHS[@]}" | tar -xf - -C "$PKG/candidate"
          cp review/v24/V24-I11-V6-SUCCESSOR-4-FROZEN-BINDING.json "$PKG/evidence/FROZEN-SUCCESSOR-4-BINDING.json"
          cp review/v24/V24-I11-V6-SUCCESSOR-4-REVIEW-INSTRUCTIONS.md "$PKG/00-REVIEW-INSTRUCTIONS.md"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Download exact final-head verification artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10539040564/zip" > "$RUNNER_TEMP/verification.zip"
          test "$(sha256sum "$RUNNER_TEMP/verification.zip" | awk '{print $1}')" = '50f9e004b13de66cdd19f6ae8aa6310dc45e2a7769dd0aaa259d355f2d42a2f7'
          unzip -p "$RUNNER_TEMP/verification.zip" v24-v6-successor4-verification.json > "$PKG/evidence/SUCCESSOR-4-VERIFICATION.json"
          test "$(sha256sum "$PKG/evidence/SUCCESSOR-4-VERIFICATION.json" | awk '{print $1}')" = 'e1492d7fd035085591ea5d29d21231180f9aac4f417d0d8da898c4e8e81afe54'
          test "$(wc -c < "$PKG/evidence/SUCCESSOR-4-VERIFICATION.json" | tr -d ' ')" = '7966'

      - name: Extract exact external trust artifacts
        shell: bash
        run: |
          set -euo pipefail
          TRUST='2515582a5e2f0e1041bf5cc83523ffa732620724'
          TRUST_TREE='1c2a1d0f60d3e2a62a2355831dc46f76ff72df7e'
          git fetch --no-tags --depth=1 origin "$TRUST"
          test "$(git rev-parse "$TRUST^{tree}")" = "$TRUST_TREE"

          git show "$TRUST:trust/v24-v6-construction-root-attestation-v3.json" > "$PKG/external-trust/v24-v6-construction-root-attestation-v3.json"
          git show "$TRUST:trust/v24-v6-construction-context-signatures-v3.json" > "$PKG/external-trust/v24-v6-construction-context-signatures-v3.json"
          git show "$TRUST:trust/v24-v6-construction-signing-ceremony-v3.json" > "$PKG/external-trust/v24-v6-construction-signing-ceremony-v3.json"

          test "$(git hash-object "$PKG/external-trust/v24-v6-construction-root-attestation-v3.json")" = '7722a5725324fb805283bce9764b2d151a774ec2'
          test "$(git hash-object "$PKG/external-trust/v24-v6-construction-context-signatures-v3.json")" = 'b16e2a2bfac013e6e600cf9944595a88eefd2ca8'
          test "$(git hash-object "$PKG/external-trust/v24-v6-construction-signing-ceremony-v3.json")" = 'cc2d8bec17b6775392094920f9549ca2e5174d44'

          cmp "$PKG/external-trust/v24-v6-construction-root-attestation-v3.json" "$PKG/candidate/governance-runtime/fixtures/v24-v6-construction-root-attestation-v3.json"
          cmp "$PKG/external-trust/v24-v6-construction-context-signatures-v3.json" "$PKG/candidate/governance-runtime/fixtures/v24-v6-construction-context-signatures-v3.json"

      - name: Preserve predecessor independent review evidence
        shell: bash
        run: |
          set -euo pipefail
          PREDECESSOR='3b16e06e8e2d6dc7d5d1f0864b8dea508edada8f'
          git fetch --no-tags --depth=1 origin "$PREDECESSOR"
          git show "$PREDECESSOR:review/v24/V24-I11-V6-SUCCESSOR-3-FINAL-INDEPENDENT-MANUAL-REVIEW.md" > "$PKG/predecessor-review/SUCCESSOR-3-INDEPENDENT-MANUAL-REVIEW.md"
          git show "$PREDECESSOR:review/v24/V24-I11-V6-SUCCESSOR-3-FINAL-ADJUDICATION.md" > "$PKG/predecessor-review/SUCCESSOR-3-FINAL-ADJUDICATION.md"

      - name: Reconstruct exact approved V6 reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin adjudication/v24-i11-v6-exact-reviewed-bytes
          SRC='FETCH_HEAD:remediation/v24/V24-I11-SYSTEMIC-REMEDIATION-DESIGN-V6-CLEAN-REVIEW-PACKET.md'
          REC='FETCH_HEAD:remediation/v24/exact-reviewed-v6/V24-I11-V6-EXACT-REVIEWED-BYTE-RECONSTRUCTION.json'
          git show "$SRC" > "$RUNNER_TEMP/v6-source.md"
          git show "$REC" > "$PKG/approved-design/V6-EXACT-BYTE-RECONSTRUCTION.json"

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          pkg=Path(os.environ['PKG'])
          source=(Path(os.environ['RUNNER_TEMP'])/'v6-source.md').read_bytes()
          rec=json.loads((pkg/'approved-design/V6-EXACT-BYTE-RECONSTRUCTION.json').read_text())
          tx=rec['exact_transformation']; off=tx['offset']
          reviewed=source[:off]+bytes.fromhex(tx['insert_hex'])+source[off:]
          assert len(reviewed)==19297
          assert hashlib.sha256(reviewed).hexdigest()=='96ec464fbf602ac6b8c89fca5af16aa71a8d53f9f042605e46a07b4cd628ca62'
          body=reviewed.split(b'---\n\n',1)[1]
          assert hashlib.sha256(body).hexdigest()=='286217399947144630c29e991c3529dfee64d382be08a6ccd3f87e9fc5173ad5'
          assert hashlib.sha1(f'blob {len(reviewed)}\0'.encode()+reviewed).hexdigest()=='4a15d50a0488464816d235b273d1dbf808fdce94'
          (pkg/'approved-design/V24-I11-V6-EXACT-REVIEWED-DESIGN.md').write_bytes(reviewed)
          PY

      - name: Generate deterministic package manifest and binding
        shell: bash
        env:
          CANDIDATE: 'ef30eba1dfbe5ccf0ec6edb9e8d1295da5c70ddb'
          CANDIDATE_TREE: 'bfbf49021514240668b24612d53ea790bcdf0baa'
          TRUST_COMMIT: '2515582a5e2f0e1041bf5cc83523ffa732620724'
          PREDECESSOR_COMMIT: '3b16e06e8e2d6dc7d5d1f0864b8dea508edada8f'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, zipfile

          pkg=Path(os.environ['PKG'])
          candidate=os.environ['CANDIDATE']
          trust=os.environ['TRUST_COMMIT']
          predecessor=os.environ['PREDECESSOR_COMMIT']
          entries=[]

          for p in sorted(x for x in pkg.rglob('*') if x.is_file()):
              rel=p.relative_to(pkg).as_posix()
              data=p.read_bytes()
              item={'path':rel,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}

              if rel.startswith('candidate/'):
                  rp=rel[len('candidate/'):]
                  item['candidate_git_blob_sha1']=subprocess.check_output(
                      ['git','rev-parse',f'{candidate}:{rp}'],text=True
                  ).strip()
              elif rel.startswith('external-trust/'):
                  name=rel.split('/',1)[1]
                  rp='trust/'+name
                  item['external_trust_git_blob_sha1']=subprocess.check_output(
                      ['git','rev-parse',f'{trust}:{rp}'],text=True
                  ).strip()
              elif rel=='predecessor-review/SUCCESSOR-3-INDEPENDENT-MANUAL-REVIEW.md':
                  rp='review/v24/V24-I11-V6-SUCCESSOR-3-FINAL-INDEPENDENT-MANUAL-REVIEW.md'
                  item['predecessor_git_blob_sha1']=subprocess.check_output(
                      ['git','rev-parse',f'{predecessor}:{rp}'],text=True
                  ).strip()
              elif rel=='predecessor-review/SUCCESSOR-3-FINAL-ADJUDICATION.md':
                  rp='review/v24/V24-I11-V6-SUCCESSOR-3-FINAL-ADJUDICATION.md'
                  item['predecessor_git_blob_sha1']=subprocess.check_output(
                      ['git','rev-parse',f'{predecessor}:{rp}'],text=True
                  ).strip()

              entries.append(item)

          manifest={
              'schema_version':4,
              'package_id':'V24-I11-V6-SUCCESSOR-4-CLEAN-MANUAL-REVIEW-PACKAGE-V1',
              'candidate_family_id':'V24-I11-V6-INTEGRATED-SUCCESSOR-4',
              'candidate_commit':candidate,
              'candidate_tree':os.environ['CANDIDATE_TREE'],
              'exact_final_head_run_id':'35324254339',
              'verification_artifact_id':10539040564,
              'verification_artifact_digest':'sha256:50f9e004b13de66cdd19f6ae8aa6310dc45e2a7769dd0aaa259d355f2d42a2f7',
              'verification_json_sha256':'e1492d7fd035085591ea5d29d21231180f9aac4f417d0d8da898c4e8e81afe54',
              'integration_binding_digest':'f55d1354bb3c012d59711b4cd2dac6a7fb334387adc38ed506ee2f595043e348',
              'bound_file_count':21,
              'trust_commit_sha':trust,
              'trust_tree_sha':'1c2a1d0f60d3e2a62a2355831dc46f76ff72df7e',
              'trust_public_artifact_blob_sha':'7722a5725324fb805283bce9764b2d151a774ec2',
              'trust_signature_bundle_blob_sha':'b16e2a2bfac013e6e600cf9944595a88eefd2ca8',
              'trust_signing_ceremony_blob_sha':'cc2d8bec17b6775392094920f9549ca2e5174d44',
              'preserved_successor4_self_grant_red_run_id':'35318618058',
              'successor4_construction_all_up_run_id':'35323905839',
              'scientific_execution_state':'CLOSED_PENDING_SUCCESSOR_REVIEW',
              'runtime_qualification_state':'NOT_CLAIMED',
              'successor_review_state':'REQUIRED_MANUAL_INDEPENDENT_REVIEW',
              'authority_effect':'NONE_EVIDENCE_ONLY',
              'files':entries,
          }

          mp=pkg/'PACKAGE-MANIFEST.json'
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          msha=hashlib.sha256(mp.read_bytes()).hexdigest()

          binding={
              'package_manifest_sha256':msha,
              'candidate_family_id':manifest['candidate_family_id'],
              'candidate_commit':candidate,
              'candidate_tree':os.environ['CANDIDATE_TREE'],
              'exact_final_head_run_id':'35324254339',
              'verification_json_sha256':manifest['verification_json_sha256'],
              'integration_binding_digest':manifest['integration_binding_digest'],
              'trust_commit_sha':trust,
              'scientific_execution_state':manifest['scientific_execution_state'],
              'runtime_qualification_state':'NOT_CLAIMED',
              'authority_effect':'NONE_EVIDENCE_ONLY',
          }
          (pkg/'PACKAGE-BINDING.json').write_text(json.dumps(binding,indent=2,sort_keys=True)+'\n')

          zp=Path('V24-I11-V6-SUCCESSOR-4-CLEAN-MANUAL-REVIEW-PACKAGE.zip')
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in pkg.rglob('*') if x.is_file()):
                  rel=p.relative_to(pkg).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,p.read_bytes())

          digest=hashlib.sha256(zp.read_bytes()).hexdigest()
          Path(str(zp)+'.sha256').write_text(digest+'  '+zp.name+'\n')
          print(json.dumps({
              'zip':zp.name,
              'bytes':zp.stat().st_size,
              'sha256':digest,
              'manifest_sha256':msha,
              'file_count':len(entries)+2,
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v24-v6-successor4-clean-manual-review-package
          path: |
            V24-I11-V6-SUCCESSOR-4-CLEAN-MANUAL-REVIEW-PACKAGE.zip
            V24-I11-V6-SUCCESSOR-4-CLEAN-MANUAL-REVIEW-PACKAGE.zip.sha256
          if-no-files-found: error
