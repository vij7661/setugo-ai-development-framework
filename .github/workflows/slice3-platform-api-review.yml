name: Slice 3 Platform API Review

on:
  push:
    branches: [governance/live-conversation-runtime]
    paths: [.github/slice3-platform-review-trigger.json]

permissions:
  contents: read

jobs:
  slice3-review:
    name: Gemini authenticated Slice 3 review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve governed review request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json,re
          from pathlib import Path
          t=json.loads(Path('.github/slice3-platform-review-trigger.json').read_text(encoding='utf-8'))
          if t.get('enabled') is not True: raise SystemExit('trigger not enabled')
          if t.get('review_class')!='PLATFORM_AUTO_API_REVIEW': raise SystemExit('review class mismatch')
          if t.get('transport')!='AUTOMATIC_API': raise SystemExit('transport mismatch')
          if t.get('provider')!='gemini': raise SystemExit('provider mismatch')
          for f in ('candidate_sha','parent_sha'):
            v=t.get(f)
            if not isinstance(v,str) or not re.fullmatch(r'[0-9a-f]{40}',v): raise SystemExit(f'{f} invalid')
          for f in ('review_request_id','model'):
            v=t.get(f)
            if not isinstance(v,str) or not v.strip(): raise SystemExit(f'{f} required')
          print('REVIEW_REQUEST_ID='+t['review_request_id'])
          print('CANDIDATE_SHA='+t['candidate_sha'])
          print('PARENT_SHA='+t['parent_sha'])
          print('GEMINI_REVIEW_MODEL='+t['model'])
          PY

      - name: Require Gemini secret
        shell: bash
        run: test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY repository secret required'; exit 2; }

      - name: Validate exact candidate objects
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${PARENT_SHA}^{commit}"
          git merge-base --is-ancestor "$PARENT_SHA" "$CANDIDATE_SHA"

      - name: Execute authenticated Gemini review
        shell: bash
        run: |
          set -o pipefail
          mkdir -p slice3-review-evidence
          python governance-runtime/slice3_platform_api_review.py \
            --output-dir slice3-review-evidence \
            --review-request-id "$REVIEW_REQUEST_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --parent-sha "$PARENT_SHA" \
            --model "$GEMINI_REVIEW_MODEL" \
            2> >(tee slice3-review-evidence/provider-error.log >&2)

      - name: Record fail-closed workflow status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p slice3-review-evidence
          python - <<'PY'
          import json,os
          from pathlib import Path
          err=Path('slice3-review-evidence/provider-error.log')
          s={
            'schema_version':1,
            'review_request_id':os.environ.get('REVIEW_REQUEST_ID'),
            'candidate_sha':os.environ.get('CANDIDATE_SHA'),
            'trigger_sha':os.environ.get('GITHUB_SHA'),
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'review_class':'PLATFORM_AUTO_API_REVIEW',
            'transport':'AUTOMATIC_API',
            'provider':'gemini',
            'model':os.environ.get('GEMINI_REVIEW_MODEL'),
            'workflow_status':os.environ.get('JOB_STATUS','failure').lower(),
            'authority_effect':'NONE_PENDING_DETERMINISTIC_INGESTION',
            'failure_detail':err.read_text(encoding='utf-8',errors='replace')[-2000:] if err.exists() else None,
          }
          Path('slice3-review-evidence/workflow-status.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload Slice 3 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice3-platform-api-review
          path: slice3-review-evidence/
          if-no-files-found: error
          retention-days: 30
