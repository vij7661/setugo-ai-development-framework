name: Package Review Engine MVP v0.1

on:
  push:
    paths:
      - ".github/workflows/package-review-engine-mvp-v01.yml"

permissions:
  contents: read

jobs:
  package-frozen-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen Review Engine MVP v0.1
        uses: actions/checkout@v4
        with:
          ref: 5fda61c3078c80ac0d607f546f40db316f2c9b6d
          fetch-depth: 1

      - name: Build exact frozen source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp -R review_engine package/review_engine
          mkdir -p package/.github/workflows
          cp .github/workflows/governed-platform-experiments.yml package/.github/workflows/governed-platform-experiments.yml
          cp README.md package/REPOSITORY_README.md
          cat > package/FROZEN_SOURCE_MANIFEST.txt <<'EOF'
          Review Engine MVP v0.1 frozen source package
          Repository: vij7661/setugo-ai-development-framework
          Frozen commit: 5fda61c3078c80ac0d607f546f40db316f2c9b6d
          Exact-head CI run: 33977202103
          Scope: review_engine/** plus the CI workflow that validated it and the repository README
          This package was generated by checking out the frozen commit explicitly.
          EOF
          find package -type f -print0 | sort -z | xargs -0 sha256sum > package/SHA256SUMS.txt
          python -m unittest discover -v -s package/review_engine -p 'test_*.py'
          (cd package && zip -r ../Review_Engine_MVP_v0.1_Frozen_Source_5fda61c3.zip .)
          sha256sum Review_Engine_MVP_v0.1_Frozen_Source_5fda61c3.zip > Review_Engine_MVP_v0.1_Frozen_Source_5fda61c3.zip.sha256

      - name: Upload frozen source package
        uses: actions/upload-artifact@v4
        with:
          name: review-engine-mvp-v0.1-frozen-source
          path: |
            Review_Engine_MVP_v0.1_Frozen_Source_5fda61c3.zip
            Review_Engine_MVP_v0.1_Frozen_Source_5fda61c3.zip.sha256
          if-no-files-found: error
          retention-days: 14
