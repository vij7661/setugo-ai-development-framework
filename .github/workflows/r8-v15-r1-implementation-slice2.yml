name: R8 v15-r1 Implementation Slice 2

on:
  push:
    branches:
      - implementation/r8-v15-r1-slice2-state-roots-2026-09-25
    paths:
      - governance-r8/R8-V15-R1-IMPLEMENTATION-SLICE2-MARKER.json

permissions:
  contents: read

concurrency:
  group: r8-v15-r1-implementation-slice2
  cancel-in-progress: false

jobs:
  frozen-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Slice 2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run frozen Slice 2 acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v governance-runtime/test_r8_v15_r1_implementation_slice2.py

      - name: Run inherited Slice 1 acceptance and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            governance-runtime/test_r8_v15_r1_implementation_slice1.py \
            governance-runtime/test_r8_v15_r1_implementation_slice1_successor1.py \
            governance-runtime/test_r8_v15_r1_implementation_slice1_successor2.py \
            governance-runtime/test_r8_v15_r1_sfv45_r2_repair.py \
            governance-runtime/test_r8_v15_r1_post_freeze_regression.py
