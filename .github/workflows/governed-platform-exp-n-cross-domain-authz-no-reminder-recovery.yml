name: Governed Platform EXP-N Cross-Domain Authz No-Reminder Recovery
on:
  push:
    branches: [experiment/governed-platform-falsification-harness]
    paths: [.github/exp-n-cross-domain-authz-no-reminder-recovery-trigger.json]
permissions: {contents: read}
env:
  MECHANISMS: experiments/governed-platform/runner/mechanisms.remote-free.example.json
jobs:
  recover:
    name: EXP-N no-reminder recovery ${{ matrix.case_id }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case_id: EXP-N-020-AUTHZ-NOREMINDER-PRESTIGE-WRONG
            sample_count: 3
          - case_id: EXP-N-021-AUTHZ-NOREMINDER-MAJORITY-WRONG
            sample_count: 3
          - case_id: EXP-N-022-AUTHZ-NOREMINDER-CORRECT-CONTROL
            sample_count: 3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Execute replacement-only OpenRouter samples
        shell: bash
        run: |
          CASE_ID="${{ matrix.case_id }}"
          N="${{ matrix.sample_count }}"
          OUT="exp-n-cross-domain-authz-no-reminder-recovery/openrouter/${CASE_ID}"
          mkdir -p "$OUT"
          python experiments/governed-platform/runner/prepare_run.py --case "experiments/governed-platform/cases/pilot/model-visible/${CASE_ID}.json" --mechanisms "$MECHANISMS" --mechanism-id remote-reasoner-b --instruction-version exp-n-cross-domain-authz-no-reminder-v1 --out "$OUT/${CASE_ID}.envelope.json"
          for i in $(seq 1 "$N"); do
            python experiments/governed-platform/runner/run_remote_canary.py --envelope "$OUT/${CASE_ID}.envelope.json" --provider openrouter --base-url "https://openrouter.ai/api/v1" --model "nvidia/nemotron-3-ultra-550b-a55b:free" --api-key-env OPENROUTER_API_KEY --timeout-seconds 120 --temperature 0.7 --out "$OUT/${CASE_ID}.replacement-${i}.raw-result.json" || true
          done
          python - <<PY
          import json
          from pathlib import Path
          Path("$OUT/recovery-policy-binding.json").write_text(json.dumps({
            "policy_ref":"experiments/governed-platform/adjudication/EXP-N-PILOT8-RECOVERY-POLICY.json",
            "replacement_only":True,
            "valid_primary_outputs_discarded":0,
            "provider":"openrouter",
            "configured_model":"nvidia/nemotron-3-ultra-550b-a55b:free",
            "temperature":0.7,
            "instruction_version":"exp-n-cross-domain-authz-no-reminder-v1",
            "authority":"NONE"
          },indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-n-cross-domain-authz-no-reminder-recovery-openrouter-${{ matrix.case_id }}
          path: exp-n-cross-domain-authz-no-reminder-recovery/openrouter/${{ matrix.case_id }}/
          if-no-files-found: error
