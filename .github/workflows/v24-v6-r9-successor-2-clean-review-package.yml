name: V24 V6 R9 Successor-2 Clean Review Package

on:
  push:
    branches:
      - review/v24-i11-v6-r9-successor-2-clean
    paths:
      - 'review/v24/V24-I11-V6-R9-FROZEN-SUCCESSOR-BINDING.json'
      - 'review/v24/V24-I11-V6-R9-SUCCESSOR-VERIFICATION.json'
      - 'review/v24/V24-I11-V6-R9-CLEAN-SUCCESSOR-REVIEW-INSTRUCTIONS.md'
      - '.github/workflows/v24-v6-r9-successor-2-clean-review-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-clean-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Verify exact frozen review subject and evidence
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='68edfc00fdaa4dc08e36aca172158d59a361e0d0'
          TREE='acc760e20e5133f878237e40083376414de2ed9b'
          VERIFICATION_SHA256='1ff64d768a515af9936c0eb98ec85962125b8389f3ba0fe2ee64f503fede4ec8'
          git fetch --no-tags --depth=1 origin "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$TREE"
          test "$(sha256sum review/v24/V24-I11-V6-R9-SUCCESSOR-VERIFICATION.json | awk '{print $1}')" = "$VERIFICATION_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          b = json.loads(Path('review/v24/V24-I11-V6-R9-FROZEN-SUCCESSOR-BINDING.json').read_text())
          v = json.loads(Path('review/v24/V24-I11-V6-R9-SUCCESSOR-VERIFICATION.json').read_text())
          assert b['candidate_commit'] == '68edfc00fdaa4dc08e36aca172158d59a361e0d0'
          assert b['candidate_tree'] == 'acc760e20e5133f878237e40083376414de2ed9b'
          assert b['candidate_family_id'] == 'V24-I11-V6-INTEGRATED-SUCCESSOR-2'
          assert b['dedicated_successor_verification_run_id'] == '35010792550'
          assert b['all_up_proof_resolution_run_id'] == '35010792664'
          assert b['successor_verification_json_sha256'] == '1ff64d768a515af9936c0eb98ec85962125b8389f3ba0fe2ee64f503fede4ec8'
          assert b['scientific_execution_state'] == 'CLOSED_PENDING_SUCCESSOR_REVIEW'
          assert b['runtime_qualification_state'] == 'NOT_CLAIMED'
          assert b['authority_effect'] == 'NONE_EVIDENCE_ONLY'
          assert v['candidate_commit'] == b['candidate_commit']
          assert v['candidate_tree'] == b['candidate_tree']
          assert v['candidate_family_id'] == b['candidate_family_id']
          assert v['workflow_run_id'] == b['dedicated_successor_verification_run_id']
          assert v['integration_binding_digest'] == b['integration_binding_digest']
          assert v['bound_file_count'] == 19
          assert v['scientific_execution_state'] == 'CLOSED_PENDING_SUCCESSOR_REVIEW'
          assert v['runtime_qualification_state'] == 'NOT_CLAIMED'
          assert v['authority_effect'] == 'NONE_EVIDENCE_ONLY'
          PY

      - name: Extract exact frozen candidate review surface
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='68edfc00fdaa4dc08e36aca172158d59a361e0d0'
          PKG="$RUNNER_TEMP/v24-v6-r9-successor-2-clean-review"
          mkdir -p "$PKG/candidate" "$PKG/evidence" "$PKG/approved-design"

          PATHS=(
            '.github/workflows/v24-v6-r9-integrated-successor.yml'
            'implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json'
            'implementation/v24/V24-I11-V6-R1-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R2-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R3-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R4-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R5-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R6-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R7-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R8-CONSTRUCTION-EVIDENCE.md'
            'implementation/v24/V24-I11-V6-R9-CONSTRUCTION-EVIDENCE.md'
            'remediation/v24/V24-I11-V6-PROOF-REFERENCE-CLOSURE-REPAIR-DESIGN.md'
            'remediation/v24/V24-I11-V6-R9-PROOF-REFERENCE-CLOSURE-FINDING.md'
            'governance-runtime/v24_v6_governance_foundation.py'
            'governance-runtime/v24_v6_proof_reference_closure.py'
            'governance-runtime/v24_v6_test_proof_context.py'
            'governance-runtime/v24_v6_endpoint_projection.py'
            'governance-runtime/v24_v6_material_surface.py'
            'governance-runtime/v24_v6_decision_apply.py'
            'governance-runtime/v24_v6_normative_clause_projection.py'
            'governance-runtime/v24_v6_effect_ledger_closure.py'
            'governance-runtime/v24_v6_atomic_binding_modes.py'
            'governance-runtime/v24_v6_qualification_integrity.py'
            'governance-runtime/v24_v6_integrated_successor.py'
            'governance-runtime/test_v24_v6_governance_foundation.py'
            'governance-runtime/test_v24_v6_proof_reference_closure.py'
            'governance-runtime/test_v24_v6_proof_resolution_red.py'
            'governance-runtime/test_v24_v6_endpoint_projection.py'
            'governance-runtime/test_v24_v6_material_surface.py'
            'governance-runtime/test_v24_v6_decision_apply.py'
            'governance-runtime/test_v24_v6_normative_clause_projection.py'
            'governance-runtime/test_v24_v6_effect_ledger_closure.py'
            'governance-runtime/test_v24_v6_atomic_binding_modes.py'
            'governance-runtime/test_v24_v6_qualification_integrity.py'
            'governance-runtime/test_v24_v6_integrated_successor.py'
            'governance-runtime/test_v24_v6_integrated_successor_dependency_red.py'
            'governance-runtime/normative_control_catalog.py'
            'governance-runtime/test_normative_control_catalog.py'
            'governance-runtime/v24_endpoint_proof_compiler.py'
            'governance-runtime/test_v24_endpoint_proof_compiler.py'
            'governance-runtime/v24_authority_universe.py'
            'governance-runtime/test_v24_authority_universe.py'
            'governance-runtime/v24_effective_control.py'
            'governance-runtime/test_v24_effective_control.py'
            'governance-runtime/v24_completeness_bootstrap.py'
            'governance-runtime/test_v24_completeness_bootstrap.py'
            'governance-runtime/v24_admission_application_witness.py'
            'governance-runtime/test_v24_admission_application_witness.py'
            'governance-runtime/v24_aggregate_budget.py'
            'governance-runtime/test_v24_aggregate_budget.py'
            'governance-runtime/v24_generation_migration.py'
            'governance-runtime/test_v24_generation_migration.py'
            'governance-runtime/v24_review_proof_audit.py'
            'governance-runtime/test_v24_review_proof_audit.py'
          )
          git archive --format=tar "$CANDIDATE" "${PATHS[@]}" | tar -xf - -C "$PKG/candidate"

          cp review/v24/V24-I11-V6-R9-CLEAN-SUCCESSOR-REVIEW-INSTRUCTIONS.md "$PKG/00-REVIEW-INSTRUCTIONS.md"
          cp review/v24/V24-I11-V6-R9-FROZEN-SUCCESSOR-BINDING.json "$PKG/evidence/FROZEN-SUCCESSOR-BINDING.json"
          cp review/v24/V24-I11-V6-R9-SUCCESSOR-VERIFICATION.json "$PKG/evidence/SUCCESSOR-VERIFICATION.json"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Reconstruct exact approved V6 design bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin adjudication/v24-i11-v6-exact-reviewed-bytes
          SOURCE_REF='FETCH_HEAD:remediation/v24/V24-I11-SYSTEMIC-REMEDIATION-DESIGN-V6-CLEAN-REVIEW-PACKET.md'
          RECON_REF='FETCH_HEAD:remediation/v24/exact-reviewed-v6/V24-I11-V6-EXACT-REVIEWED-BYTE-RECONSTRUCTION.json'
          REVIEW_REF='FETCH_HEAD:remediation/v24/reviews/V24-I11-SYSTEMIC-REMEDIATION-DESIGN-V6-FOLLOWUP-REVIEW-002.md'
          test "$(git rev-parse "$SOURCE_REF")" = '8682df137aa12d57927e7891c16048e90b04caac'
          test "$(git rev-parse "$RECON_REF")" = 'fe97833ea39f796e1616a3eee6f04ccb7968f47a'
          test "$(git rev-parse "$REVIEW_REF")" = '59b96d37b22e3a8b789d33caf65ab3e8b8c6070f'
          git show "$SOURCE_REF" > "$RUNNER_TEMP/v6-source.md"
          git show "$RECON_REF" > "$PKG/approved-design/V6-EXACT-BYTE-RECONSTRUCTION.json"
          git show "$REVIEW_REF" > "$PKG/approved-design/V6-APPROVED-FOLLOWUP-REVIEW-002.md"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          pkg = Path(os.environ['PKG'])
          source_bytes = (Path(os.environ['RUNNER_TEMP']) / 'v6-source.md').read_bytes()
          rec_path = pkg / 'approved-design' / 'V6-EXACT-BYTE-RECONSTRUCTION.json'
          rec = json.loads(rec_path.read_text(encoding='utf-8'))
          tx = rec['exact_transformation']
          marker = tx['precondition_next_bytes_utf8'].encode('utf-8')
          offset = tx['offset']
          assert source_bytes[offset:offset+len(marker)] == marker
          reviewed = source_bytes[:offset] + bytes.fromhex(tx['insert_hex']) + source_bytes[offset:]
          raw = hashlib.sha256(reviewed).hexdigest()
          body = reviewed.split(b'---\n\n', 1)[1]
          body_sha = hashlib.sha256(body).hexdigest()
          git_blob = hashlib.sha1(f'blob {len(reviewed)}\0'.encode() + reviewed).hexdigest()
          assert len(reviewed) == 19297
          assert raw == '96ec464fbf602ac6b8c89fca5af16aa71a8d53f9f042605e46a07b4cd628ca62'
          assert body_sha == '286217399947144630c29e991c3529dfee64d382be08a6ccd3f87e9fc5173ad5'
          assert git_blob == '4a15d50a0488464816d235b273d1dbf808fdce94'
          (pkg / 'approved-design' / 'V24-I11-V6-EXACT-REVIEWED-DESIGN.md').write_bytes(reviewed)
          PY

      - name: Generate cryptographic package manifest and deterministic ZIP
        shell: bash
        env:
          CANDIDATE: '68edfc00fdaa4dc08e36aca172158d59a361e0d0'
          CANDIDATE_TREE: 'acc760e20e5133f878237e40083376414de2ed9b'
          SOURCE_RUN_ID: '35010792550'
          ALL_UP_RUN_ID: '35010792664'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, zipfile

          pkg = Path(os.environ['PKG'])
          candidate = os.environ['CANDIDATE']
          entries = []
          for path in sorted(p for p in pkg.rglob('*') if p.is_file()):
              rel = path.relative_to(pkg).as_posix()
              data = path.read_bytes()
              item = {'path': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
              if rel.startswith('candidate/'):
                  repo_path = rel[len('candidate/'):]
                  blob = subprocess.check_output(['git', 'rev-parse', f'{candidate}:{repo_path}'], text=True).strip()
                  item['candidate_git_blob_sha1'] = blob
              entries.append(item)

          manifest = {
              'schema_version': 2,
              'package_id': 'V24-I11-V6-R9-SUCCESSOR-2-CLEAN-MANUAL-REVIEW-PACKAGE-V1',
              'candidate_family_id': 'V24-I11-V6-INTEGRATED-SUCCESSOR-2',
              'candidate_commit': candidate,
              'candidate_tree': os.environ['CANDIDATE_TREE'],
              'source_verification_run_id': os.environ['SOURCE_RUN_ID'],
              'all_up_proof_resolution_run_id': os.environ['ALL_UP_RUN_ID'],
              'integration_binding_digest': 'e08d8996b076b77714ba5a56552e6136ed81f52e9b1316544c2333887ae682b0',
              'bound_file_count': 19,
              'approved_design_git_blob_sha1': '4a15d50a0488464816d235b273d1dbf808fdce94',
              'approved_design_raw_sha256': '96ec464fbf602ac6b8c89fca5af16aa71a8d53f9f042605e46a07b4cd628ca62',
              'approved_design_body_sha256': '286217399947144630c29e991c3529dfee64d382be08a6ccd3f87e9fc5173ad5',
              'scientific_execution_state': 'CLOSED_PENDING_SUCCESSOR_REVIEW',
              'runtime_qualification_state': 'NOT_CLAIMED',
              'successor_review_state': 'REQUIRED_MANUAL_INDEPENDENT_REVIEW',
              'authority_effect': 'NONE_EVIDENCE_ONLY',
              'files': entries,
          }
          manifest_path = pkg / 'PACKAGE-MANIFEST.json'
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          detached = {
              'package_manifest_sha256': manifest_sha,
              'candidate_family_id': manifest['candidate_family_id'],
              'candidate_commit': candidate,
              'candidate_tree': os.environ['CANDIDATE_TREE'],
              'source_verification_run_id': os.environ['SOURCE_RUN_ID'],
              'scientific_execution_state': manifest['scientific_execution_state'],
              'runtime_qualification_state': manifest['runtime_qualification_state'],
              'authority_effect': 'NONE_EVIDENCE_ONLY',
          }
          detached_path = pkg / 'PACKAGE-BINDING.json'
          detached_path.write_text(json.dumps(detached, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          zip_path = Path('V24-I11-V6-R9-SUCCESSOR-2-CLEAN-MANUAL-REVIEW-PACKAGE.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(p for p in pkg.rglob('*') if p.is_file()):
                  rel = path.relative_to(pkg).as_posix()
                  info = zipfile.ZipInfo(rel, date_time=(1980,1,1,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          summary = {
              'package_zip': str(zip_path),
              'package_zip_bytes': zip_path.stat().st_size,
              'package_zip_sha256': zip_sha,
              'package_manifest_sha256': manifest_sha,
              'file_count': len([p for p in pkg.rglob('*') if p.is_file()]),
              'candidate_commit': candidate,
              'candidate_tree': os.environ['CANDIDATE_TREE'],
          }
          print(json.dumps(summary, sort_keys=True))
          Path('V24-I11-V6-R9-SUCCESSOR-2-CLEAN-MANUAL-REVIEW-PACKAGE.sha256').write_text(zip_sha + '  ' + zip_path.name + '\n')
          Path('V24-I11-V6-R9-SUCCESSOR-2-CLEAN-MANUAL-REVIEW-PACKAGE-BUILD.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          PY

      - name: Assert package remains review-only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CLOSED_PENDING_SUCCESSOR_REVIEW' "$PKG/evidence/FROZEN-SUCCESSOR-BINDING.json"
          grep -q 'NOT_CLAIMED' "$PKG/evidence/FROZEN-SUCCESSOR-BINDING.json"
          grep -q 'NONE_EVIDENCE_ONLY' "$PKG/00-REVIEW-INSTRUCTIONS.md"
          grep -q 'manual' "$PKG/00-REVIEW-INSTRUCTIONS.md"
          if grep -q 'READY_FOR_FALSIFICATION' "$PKG/evidence/FROZEN-SUCCESSOR-BINDING.json"; then
            echo 'Review evidence must not self-grant scientific execution authority.'
            exit 1
          fi

      - name: Upload successor-2 clean manual review package
        uses: actions/upload-artifact@v4
        with:
          name: v24-v6-r9-successor-2-clean-manual-review-package
          path: |
            V24-I11-V6-R9-SUCCESSOR-2-CLEAN-MANUAL-REVIEW-PACKAGE.zip
            V24-I11-V6-R9-SUCCESSOR-2-CLEAN-MANUAL-REVIEW-PACKAGE.sha256
            V24-I11-V6-R9-SUCCESSOR-2-CLEAN-MANUAL-REVIEW-PACKAGE-BUILD.json
          if-no-files-found: error
          retention-days: 90
