name: R8 Q17 Linux Validation

on:
  push:
    branches:
      - evidence/r8-v15-r1-q17-linux-validation-2026-09-27
    paths:
      - .github/workflows/r8-q17-linux-validation.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  AUTHORITY_EFFECT: "NONE"
  BASE_SHA: "7cd2787d85b189a4161f271ee131e42bd961140a"
  Q17_SHA: "b88b5d51dc0f5299c611f57df36153ab0962b54c"
  Q17_TREE: "9f3d5429b30db1036c937efa8895bf001e986783"
  Q17_CHANGED_COUNT: "77"

jobs:
  q17-linux-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create exact Q17 candidate worktree
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/q17-candidate"
          git worktree add --detach "$ROOT" "$Q17_SHA"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$Q17_SHA"
          test "$(git -C "$ROOT" rev-parse HEAD^{tree})" = "$Q17_TREE"
          test "$(git -C "$ROOT" diff --name-only "$BASE_SHA..$Q17_SHA" | wc -l)" -eq "$Q17_CHANGED_COUNT"
          test -z "$(git -C "$ROOT" status --porcelain=v1)"
          echo "Q17_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Resolve exact numeric job id
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          job_name = "q17-linux-validation"
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run}/jobs?per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "r8-q17-linux-validation/1.0",
          }
          job_id = None
          for _ in range(30):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              for job in data.get("jobs", []):
                  if job.get("name") == job_name:
                      job_id = str(job["id"])
                      break
              if job_id:
                  break
              time.sleep(1)
          if not job_id:
              raise SystemExit("current numeric job id unavailable")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as h:
              h.write(f"Q17_JOB_ID={job_id}\n")
          print("Q17_JOB_ID_RESOLVED")
          PY

      - name: Run complete Q17 matrix without stopping at first failure
        shell: bash
        run: |
          set -uo pipefail
          failures=()
          LOGDIR="$RUNNER_TEMP/q17-logs"
          mkdir -p "$LOGDIR"

          run_case() {
            label="$1"
            shift
            echo "===== BEGIN $label ====="
            if "$@" > >(tee "$LOGDIR/$label.txt") 2> >(tee -a "$LOGDIR/$label.txt" >&2); then
              echo "Q17_CASE_PASS::$label"
            else
              rc=$?
              echo "Q17_CASE_FAIL::$label::exit=$rc"
              failures+=("$label")
            fi
            echo "===== END $label ====="
          }

          run_root() {
            (cd "$Q17_ROOT" && "$@")
          }

          run_case permanent_invariant run_root python3 tools/verify_r8_v15_r1_post_sg1_integration_invariants.py
          run_case stage1_before run_root python3 tools/verify_r8_v15_r1_ig1_successor3_exact_candidate.py "$RUNNER_TEMP/stage1-before"
          run_case legacy_AH_parser run_root python3 tools/test_r8_v15_r1_review_contract_parser.py
          run_case generic_AJ_parser run_root python3 tools/test_r8_v15_r1_independent_review_parser.py
          run_case review_preflight run_root python3 tools/test_r8_v15_r1_stage2_sg1_review_preflight.py
          run_case activation_parser run_root python3 tools/validate_r8_v15_r1_stage2_sg1_activation_gate_parser.py
          run_case semantic_inventory run_root python3 tools/test_r8_v15_r1_stage2_semantic_gap_inventory.py
          run_case reviewer_delivery run_root python3 governance-runtime/test_reviewer_evidence_delivery.py
          run_case platform_materialization_v2 run_root python3 governance-runtime/test_platform_candidate_review_v2_materialization.py
          run_case platform_request_integrity run_root python3 governance-runtime/test_platform_candidate_review_request_integrity.py
          run_case platform_delivery_integration run_root python3 governance-runtime/test_platform_candidate_review_delivery_integration.py
          run_case freeze_attestation run_root python3 governance-runtime/test_freeze_attestation.py
          run_case candidate_execution_evidence run_root python3 governance-runtime/test_candidate_execution_evidence.py
          run_case governed_evidence_receipt run_root python3 governance-runtime/test_governed_evidence_receipt.py
          run_case review_merge_identity_gate run_root python3 governance-runtime/test_q15_review_merge_gate.py
          run_case manual_review_ingestion run_root python3 governance-runtime/test_manual_review_ingestion.py
          run_case provider_retry_contract run_root python3 governance-runtime/test_platform_candidate_review_retry_contract.py
          run_case provider_api_contract run_root python3 governance-runtime/test_provider_api_request_contract.py
          run_case runtime_toctou run_root python3 governance-runtime/test_r8_v15_r1_runtime_toctou_hardening.py
          run_case evidence_integrity run_root python3 tools/test_r8_evidence_bundle_integrity.py
          run_case queue run_root python3 tools/test_r8_work_queue.py
          run_case lifecycle_interpretation run_root python3 tools/test_candidate_lifecycle_interpretation.py
          run_case pinned_action_lint run_root python3 tools/verify_pinned_governance_actions.py
          run_case pinned_action_adversarial run_root python3 tools/test_verify_pinned_governance_actions.py
          run_case ingestion_workflow_selfcheck run_root python3 tools/verify_q17_ingestion_workflows.py
          run_case ingestion_workflow_adversarial run_root python3 tools/test_verify_q17_ingestion_workflows.py
          run_case invariant_workflow_selfcheck run_root python3 tools/verify_q16_invariant_workflow.py
          run_case invariant_workflow_adversarial run_root python3 tools/test_verify_q16_invariant_workflow.py
          run_case stage1_after run_root python3 tools/verify_r8_v15_r1_ig1_successor3_exact_candidate.py "$RUNNER_TEMP/stage1-after"

          echo "===== BEGIN compileall ====="
          if (cd "$Q17_ROOT" && PYTHONPYCACHEPREFIX="$RUNNER_TEMP/q17-pycache" python3 -m compileall -q governance-runtime tools) > >(tee "$LOGDIR/compileall.txt") 2> >(tee -a "$LOGDIR/compileall.txt" >&2); then
            echo "Q17_CASE_PASS::compileall"
          else
            rc=$?
            echo "Q17_CASE_FAIL::compileall::exit=$rc"
            failures+=("compileall")
          fi
          echo "===== END compileall ====="

          echo "===== BEGIN final_identity ====="
          if test "$(git -C "$Q17_ROOT" rev-parse HEAD)" = "$Q17_SHA"              && test "$(git -C "$Q17_ROOT" rev-parse HEAD^{tree})" = "$Q17_TREE"              && test "$(git -C "$Q17_ROOT" diff --name-only "$BASE_SHA..$Q17_SHA" | wc -l)" -eq "$Q17_CHANGED_COUNT"              && test -z "$(git -C "$Q17_ROOT" status --porcelain=v1)"; then
            echo "Q17_CASE_PASS::final_identity"
          else
            echo "Q17_CASE_FAIL::final_identity"
            failures+=("final_identity")
          fi
          echo "===== END final_identity ====="

          echo "Q17_MATRIX_FAILURE_COUNT=${#failures[@]}"
          if (("${#failures[@]}")); then
            printf 'Q17_MATRIX_FAILURE::%s\n' "${failures[@]}"
            exit 1
          fi
          echo "Q17_LINUX_VALIDATION_PASS"
          echo "PASS" > "$RUNNER_TEMP/q17-result.txt"
          echo "Q17_LOGDIR=$LOGDIR" >> "$GITHUB_ENV"

      - name: Build candidate-bound Q17 Linux evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/Q17-LINUX-EVIDENCE.tar"
          tar -cf "$BUNDLE" -C "$Q17_LOGDIR" .
          DIGEST="sha256:$(sha256sum "$BUNDLE" | awk '{print $1}')"
          cd "$Q17_ROOT"
          python3 governance-runtime/candidate_execution_evidence.py             --kind LINUX_VALIDATION             --run-id "$GITHUB_RUN_ID"             --job-id "$Q17_JOB_ID"             --workflow-identity "R8 Q17 Linux Validation/q17-linux-validation"             --baseline-commit "$BASE_SHA"             --candidate-commit "$Q17_SHA"             --candidate-tree "$Q17_TREE"             --changed-file-count "$Q17_CHANGED_COUNT"             --conclusion SUCCESS             --artifact-digest "$DIGEST"             --output "$RUNNER_TEMP/Q17-LINUX-EXECUTION-STATEMENT.json"
          sha256sum "$BUNDLE"
          sha256sum "$RUNNER_TEMP/Q17-LINUX-EXECUTION-STATEMENT.json"

      - name: Upload Q17 Linux evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r8-v15-r1-q17-linux-evidence
          path: |
            ${{ runner.temp }}/Q17-LINUX-EVIDENCE.tar
            ${{ runner.temp }}/Q17-LINUX-EXECUTION-STATEMENT.json
          if-no-files-found: error
          retention-days: 30
