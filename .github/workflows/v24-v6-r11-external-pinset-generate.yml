name: V24 V6 R11 External Pinset Generation

on:
  push:
    branches:
      - review/v24-i11-v6-r11-successor-clean
    paths:
      - 'review/v24/r11_trusted_external_guard.py'
      - 'review/v24/r11_trusted_unittest_runner.py'
      - 'review/v24/V24-I11-V6-R11-FROZEN-SUCCESSOR-BINDING.json'
      - '.github/workflows/v24-v6-r11-external-pinset-generate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-pinset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Prove review-side authority separation and extract exact candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='68ce0df63ce0133ae19ec4402b41c4c09adfb54e'
          TREE='d202b039285213b386557083a26de42e0fb20cf4'
          git fetch --no-tags --depth=1 origin "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$TREE"
          if git cat-file -e "$CANDIDATE:review/v24/r11_trusted_external_guard.py" 2>/dev/null; then
            echo 'Trusted guard unexpectedly exists in frozen candidate.'; exit 1
          fi
          if git cat-file -e "$CANDIDATE:review/v24/r11_trusted_unittest_runner.py" 2>/dev/null; then
            echo 'Trusted runner unexpectedly exists in frozen candidate.'; exit 1
          fi
          if git cat-file -e "$CANDIDATE:review/v24/V24-I11-V6-R11-EXTERNAL-PINSET.json" 2>/dev/null; then
            echo 'External pinset unexpectedly exists in frozen candidate.'; exit 1
          fi
          test -f review/v24/r11_trusted_external_guard.py
          test -f review/v24/r11_trusted_unittest_runner.py
          SUBJECT="$RUNNER_TEMP/r11-frozen-candidate"
          rm -rf "$SUBJECT" && mkdir -p "$SUBJECT"
          git archive "$CANDIDATE" | tar -xf - -C "$SUBJECT"
          echo "R11_CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          echo "R11_TREE=$TREE" >> "$GITHUB_ENV"
          echo "R11_SUBJECT=$SUBJECT" >> "$GITHUB_ENV"
          echo "R11_REVIEW_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R11_GUARD_BLOB=$(git rev-parse HEAD:review/v24/r11_trusted_external_guard.py)" >> "$GITHUB_ENV"
          echo "R11_RUNNER_BLOB=$(git rev-parse HEAD:review/v24/r11_trusted_unittest_runner.py)" >> "$GITHUB_ENV"
          echo 'EXTERNAL_AUTHORITY_SEPARATION=PASS'

      - name: Generate external candidate-independent pinset
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)"
          PINSET="$RUNNER_TEMP/V24-I11-V6-R11-EXTERNAL-PINSET.json"
          env -i HOME="$HOME" PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" \
            "$PYTHON_BIN" -I -S "$GITHUB_WORKSPACE/review/v24/r11_trusted_external_guard.py" build-pinset \
            --root "$R11_SUBJECT" \
            --commit "$R11_CANDIDATE" \
            --tree "$R11_TREE" \
            --review-commit "$R11_REVIEW_COMMIT" \
            --output "$PINSET"
          echo "R11_PINSET=$PINSET" >> "$GITHUB_ENV"
          echo "R11_PINSET_SHA256=$(sha256sum "$PINSET" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Independently verify frozen source then stage exact sandbox
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)"
          SANDBOX="$RUNNER_TEMP/r11-external-sandbox"
          rm -rf "$SANDBOX"
          env -i HOME="$HOME" PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" \
            "$PYTHON_BIN" -I -S "$GITHUB_WORKSPACE/review/v24/r11_trusted_external_guard.py" verify-source \
            --root "$R11_SUBJECT" --pinset "$R11_PINSET" --commit "$R11_CANDIDATE" --tree "$R11_TREE"
          env -i HOME="$HOME" PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" \
            "$PYTHON_BIN" -I -S "$GITHUB_WORKSPACE/review/v24/r11_trusted_external_guard.py" stage \
            --root "$R11_SUBJECT" --pinset "$R11_PINSET" --commit "$R11_CANDIDATE" --tree "$R11_TREE" --target "$SANDBOX"
          env -i HOME="$HOME" PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" \
            "$PYTHON_BIN" -I -S "$GITHUB_WORKSPACE/review/v24/r11_trusted_external_guard.py" verify-sandbox \
            --root "$SANDBOX" --pinset "$R11_PINSET" --commit "$R11_CANDIDATE" --tree "$R11_TREE"
          echo "R11_SANDBOX=$SANDBOX" >> "$GITHUB_ENV"

      - name: External adversarial probes must fail closed before test launch
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)"
          GUARD="$GITHUB_WORKSPACE/review/v24/r11_trusted_external_guard.py"
          reject_attack() {
            local name="$1"
            local attack="$RUNNER_TEMP/r11-ext-attack-$name"
            rm -rf "$attack"
            cp -a "$R11_SANDBOX" "$attack"
            case "$name" in
              test-swap) printf 'raise SystemExit(0)\n' > "$attack/governance-runtime/test_v24_v6_external_execution_binding.py" ;;
              support-swap) printf '{}\n' > "$attack/implementation/v24/V24-I11-V6-INTEGRATED-SUCCESSOR-MANIFEST.json" ;;
              unpinned) printf 'untrusted\n' > "$attack/implementation/v24/unpinned-support.txt" ;;
              unittest) printf 'raise SystemExit(0)\n' > "$attack/governance-runtime/unittest.py" ;;
              sitecustomize) printf 'raise SystemExit(0)\n' > "$attack/governance-runtime/sitecustomize.py" ;;
              usercustomize) printf 'raise SystemExit(0)\n' > "$attack/governance-runtime/usercustomize.py" ;;
              stdlib) printf 'VALUE = 1\n' > "$attack/governance-runtime/json.py" ;;
              symlink)
                rm "$attack/governance-runtime/test_v24_v6_external_execution_binding.py"
                ln -s v24_v6_external_execution_binding.py "$attack/governance-runtime/test_v24_v6_external_execution_binding.py"
                ;;
              *) echo "unknown attack $name"; exit 2 ;;
            esac
            if env -i HOME="$HOME" PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" \
              "$PYTHON_BIN" -I -S "$GUARD" verify-sandbox \
              --root "$attack" --pinset "$R11_PINSET" --commit "$R11_CANDIDATE" --tree "$R11_TREE"; then
              echo "FALSE_GREEN_ATTACK_ACCEPTED:$name"; exit 1
            fi
            echo "EXTERNAL_ATTACK_REJECTED:$name"
          }
          for x in test-swap support-swap unpinned unittest sitecustomize usercustomize stdlib symlink; do reject_attack "$x"; done

      - name: Run externally pinned tests with review-side isolated trusted runner
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)"
          PINSET_SHA_BEFORE="$(sha256sum "$R11_PINSET" | awk '{print $1}')"
          test "$PINSET_SHA_BEFORE" = "$R11_PINSET_SHA256"
          env -i HOME="$HOME" PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" \
            "$PYTHON_BIN" -I -S "$GITHUB_WORKSPACE/review/v24/r11_trusted_unittest_runner.py" \
            --sandbox "$R11_SANDBOX" --pinset "$R11_PINSET"
          PINSET_SHA_AFTER="$(sha256sum "$R11_PINSET" | awk '{print $1}')"
          test "$PINSET_SHA_AFTER" = "$PINSET_SHA_BEFORE"
          env -i HOME="$HOME" PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" \
            "$PYTHON_BIN" -I -S "$GITHUB_WORKSPACE/review/v24/r11_trusted_external_guard.py" verify-sandbox \
            --root "$R11_SANDBOX" --pinset "$R11_PINSET" --commit "$R11_CANDIDATE" --tree "$R11_TREE"
          echo 'EXTERNAL_TRUSTED_RUNNER_POSTCHECK=PASS'

      - name: Write non-authoritative external verification record
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/V24-I11-V6-R11-EXTERNAL-VERIFICATION.json" <<EOF
          {
            "schema_version": 1,
            "verification_id": "V24-I11-V6-R11-EXTERNAL-EXECUTION-VERIFICATION",
            "candidate_commit": "$R11_CANDIDATE",
            "candidate_tree": "$R11_TREE",
            "review_branch_commit": "$R11_REVIEW_COMMIT",
            "trusted_guard_git_blob_sha1": "$R11_GUARD_BLOB",
            "trusted_runner_git_blob_sha1": "$R11_RUNNER_BLOB",
            "external_pinset_sha256": "$R11_PINSET_SHA256",
            "admitted_file_count": 69,
            "expected_test_case_count": 259,
            "source_binding": "PASS",
            "sandbox_binding_pre_execution": "PASS",
            "adversarial_probe_set": "PASS",
            "trusted_runner": "PASS",
            "sandbox_binding_post_execution": "PASS",
            "independent_manual_review_completed": false,
            "scientific_execution_state": "CLOSED_PENDING_SUCCESSOR_REVIEW",
            "runtime_qualification_state": "NOT_CLAIMED",
            "authority_effect": "NONE_EVIDENCE_ONLY"
          }
          EOF
          python -m json.tool "$RUNNER_TEMP/V24-I11-V6-R11-EXTERNAL-VERIFICATION.json" >/dev/null
          echo "EXTERNAL_VERIFICATION_SHA256=$(sha256sum "$RUNNER_TEMP/V24-I11-V6-R11-EXTERNAL-VERIFICATION.json" | awk '{print $1}')"

      - name: Upload external pinset and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v24-v6-r11-external-pinset-evidence
          path: |
            ${{ runner.temp }}/V24-I11-V6-R11-EXTERNAL-PINSET.json
            ${{ runner.temp }}/V24-I11-V6-R11-EXTERNAL-VERIFICATION.json
          if-no-files-found: error
          retention-days: 90
