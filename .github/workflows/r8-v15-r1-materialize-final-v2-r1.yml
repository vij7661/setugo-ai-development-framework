name: R8 v15-r1 Materialize Final Qualified V2-R1 SPM

on:
  push:
    branches:
      - enrollment/r8-v15-r1-spg1-qualified-v2-r1
    paths:
      - governance-r8/R8-V15-R1-MATERIALIZE-FINAL-V2-R1-MARKER.json

permissions:
  contents: write
  actions: read

concurrency:
  group: r8-v15-r1-materialize-final-v2-r1
  cancel-in-progress: false

env:
  TARGET_BRANCH: freeze/r8-v15-r1-executable-schema-qualified-r3-reviewed-semantic
  BASE_COMMIT: d61f9278f1daceac6de536a8894d266726733345
  SOURCE_RUN_ID: "36051390674"
  SOURCE_ARTIFACT_NAME: r8-v15-r1-spg1-v2-r1-final-36051390674-1
  EXPECTED_SPM_SHA256: 84c484121c4c8dd0592bcd7e4c070d8a3ab7f17215f4c3d2b31863fb6dbf6797
  EXPECTED_TRACE_SHA256: cbe0a8cd1c955145bab3f00973fee465af1901a9d24dfd6748790d11a0b602ac
  EXPECTED_SOURCE_MAP_SHA256: 6d35964bfaa0cccfdd09bb46128a5efe3197d146e90144d1ac61ebe08c0aeec5
  SOURCE_RUN_HEAD: 39baa35fe4750c1ab8d5d332c9be6b9a231da892
  SOURCE_ARTIFACT_ID: "10831151305"
  SOURCE_ARTIFACT_ZIP_SHA256: d1b5df7c294a9e208ee72ecfe2ee5cb9ef3b34b0a5f3f44e610c516546c6dd44
  FINAL_VERIFY_RUN_ID: "36051607632"
  FINAL_VERIFY_RUN_HEAD: f980766a7cc1f04e8847ac5032ab8b20707f52eb
  FINAL_VERIFY_ARTIFACT_ID: "10830213828"
  FINAL_VERIFY_ARTIFACT_NAME: r8-v15-r1-spg1-v2-r1-final-post-run-36051607632-1
  FINAL_VERIFY_ARTIFACT_ZIP_SHA256: 5821dbc2b9bb367a361ef79da2153df43ffbd98066a6e7752715fa60974eab85

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact fixed-point freeze branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fail closed if target branch drifted
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test -z "$(git status --porcelain)"
          test ! -e schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json
          test "$(sha256sum schemas/governance-r8/v15-r1/schema-freeze-traceability.json | awk '{print $1}')" = "$EXPECTED_TRACE_SHA256"
          test "$(sha256sum schemas/governance-r8/v15-r1/schema-provenance-source-map.json | awk '{print $1}')" = "$EXPECTED_SOURCE_MAP_SHA256"

      - name: Verify exact source run and independent final verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repo='vij7661/setugo-ai-development-framework'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path]))
          src=api(f'repos/{repo}/actions/runs/{os.environ["SOURCE_RUN_ID"]}')
          assert src['status']=='completed' and src['conclusion']=='success'
          assert src['head_sha']==os.environ['SOURCE_RUN_HEAD']
          assert src['head_branch']=='enrollment/r8-v15-r1-spg1-qualified-v2-r1'
          sa=api(f'repos/{repo}/actions/runs/{os.environ["SOURCE_RUN_ID"]}/artifacts')['artifacts']
          sa=[x for x in sa if str(x['id'])==os.environ['SOURCE_ARTIFACT_ID']]
          assert len(sa)==1
          assert sa[0]['name']==os.environ['SOURCE_ARTIFACT_NAME']
          assert sa[0]['digest']=='sha256:'+os.environ['SOURCE_ARTIFACT_ZIP_SHA256']
          assert not sa[0]['expired']

          vr=api(f'repos/{repo}/actions/runs/{os.environ["FINAL_VERIFY_RUN_ID"]}')
          assert vr['status']=='completed' and vr['conclusion']=='success'
          assert vr['head_sha']==os.environ['FINAL_VERIFY_RUN_HEAD']
          assert vr['head_branch']=='enrollment/r8-v15-r1-spg1-qualified-v2-r1'
          va=api(f'repos/{repo}/actions/runs/{os.environ["FINAL_VERIFY_RUN_ID"]}/artifacts')['artifacts']
          va=[x for x in va if str(x['id'])==os.environ['FINAL_VERIFY_ARTIFACT_ID']]
          assert len(va)==1
          assert va[0]['name']==os.environ['FINAL_VERIFY_ARTIFACT_NAME']
          assert va[0]['digest']=='sha256:'+os.environ['FINAL_VERIFY_ARTIFACT_ZIP_SHA256']
          assert not va[0]['expired']
          PY

          mkdir -p verifier-download
          gh run download "$FINAL_VERIFY_RUN_ID" --repo "${{ github.repository }}" --name "$FINAL_VERIFY_ARTIFACT_NAME" --dir verifier-download
          test -f verifier-download/final-post-run-verification.json
          python3 - <<'PY'
          import json, os, pathlib
          v=json.loads(pathlib.Path('verifier-download/final-post-run-verification.json').read_text())
          assert v['status']=='POST_RUN_FINAL_FIXED_POINT_VERIFICATION_PASS'
          assert v['input_commit']==os.environ['BASE_COMMIT']
          assert str(v['source_run_id'])==os.environ['SOURCE_RUN_ID']
          assert v['source_run_head']==os.environ['SOURCE_RUN_HEAD']
          assert str(v['source_artifact_id'])==os.environ['SOURCE_ARTIFACT_ID']
          assert v['source_artifact_zip_sha256']==os.environ['SOURCE_ARTIFACT_ZIP_SHA256']
          assert v['final_spm_sha256']==os.environ['EXPECTED_SPM_SHA256']
          assert v['github_attestation_verification_pass'] is True
          assert v['oidc_identity_exact_match'] is True
          assert v['verified_timestamp_present'] is True
          assert v['artifact_expanded_bytes_match'] is True
          assert v['qualified_provenance_validation_pass'] is True
          assert v['fixed_point_traceability_condition_satisfied'] is True
          assert v['sfv_35']=='EVIDENCE_COMPLETE_EXACT_REBIND_BYTES'
          assert v['sfv_36']=='EVIDENCE_COMPLETE_EXACT_REBIND_BYTES'
          assert v['sfv_44']=='EVIDENCE_COMPLETE_EXACT_REBIND_BYTES'
          assert v['sfv_45']=='SOLE_REMAINING_EXECUTABLE_SCHEMA_FREEZE_BLOCKER'
          assert not any(v.get(k,False) for k in [
              'implementation_authorized','runtime_qualification_authorized',
              'release_authorized','deployment_authorized','production_authorized'
          ])
          PY

      - name: Download exact final regeneration artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p final-download
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" --name "$SOURCE_ARTIFACT_NAME" --dir final-download
          test -f final-download/final-r1/spm-final-v2-r1.json
          test "$(sha256sum final-download/final-r1/spm-final-v2-r1.json | awk '{print $1}')" = "$EXPECTED_SPM_SHA256"
          test "$(sha256sum final-download/final-r1/schema-freeze-traceability.json | awk '{print $1}')" = "$EXPECTED_TRACE_SHA256"
          test "$(sha256sum final-download/final-r1/schema-provenance-source-map.json | awk '{print $1}')" = "$EXPECTED_SOURCE_MAP_SHA256"
          cmp -s final-download/final-r1/schema-freeze-traceability.json schemas/governance-r8/v15-r1/schema-freeze-traceability.json
          cmp -s final-download/final-r1/schema-provenance-source-map.json schemas/governance-r8/v15-r1/schema-provenance-source-map.json

      - name: Materialize only verified final SPM
        shell: bash
        run: |
          set -euo pipefail
          cp final-download/final-r1/spm-final-v2-r1.json schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json
          test "$(sha256sum schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json | awk '{print $1}')" = "$EXPECTED_SPM_SHA256"
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json').read_text())
          assert s['status']=='FINAL_FREEZE_ELIGIBLE'
          assert s['semantic_candidate_commit']=='1fa49fa4adfa6aa47fae68c0f1938083eeb1497f'
          assert s['generator']['generator_id']=='R8V15R1-SPG-V2'
          assert s['generator']['qualification_status']=='QUALIFIED'
          assert s['coverage']=={
            'uncovered_semantic_elements':[],
            'non_authoritative_only_sources':[],
            'conflicting_entries':[]
          }
          PY

      - name: Prove no other schema or repository bytes changed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verifier-download final-download
          changed="$(git status --porcelain --untracked-files=all)"
          expected="?? schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json"
          test "$changed" = "$expected"
          git diff --exit-code "$BASE_COMMIT" -- . ':(exclude)schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json'

      - name: Commit exact verified final SPM
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/governance-r8/v15-r1/schema-provenance-manifest-candidate.json
          git commit -m "Materialize verified final qualified v2-r1 SPM"
          git push origin "HEAD:$TARGET_BRANCH"
