name: Governed Platform Dashboard Pages

on:
  workflow_dispatch:
    inputs:
      execution_status:
        description: "Authoritative lifecycle state to publish"
        required: false
        type: string
      campaign:
        required: false
        type: string
      experiment:
        required: false
        type: string
      case_id:
        required: false
        type: string
      execution_branch:
        required: false
        type: string
      execution_sha:
        required: false
        type: string
      source_run_id:
        required: false
        type: string
      controller_decision:
        required: false
        type: string
      scientific_status:
        required: false
        type: string
      next_case:
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "experiments/governed-platform/observability/dashboard/**"
      - ".github/workflows/governed-platform-dashboard-pages.yml"
  workflow_run:
    workflows: ["Governed Platform Remote Pilot"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: governed-platform-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp experiments/governed-platform/observability/dashboard/index.html _site/index.html
          cp experiments/governed-platform/observability/dashboard/execution-status.json _site/execution-status.json
      - name: Publish dispatched lifecycle state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_status != '' }}
        env:
          EXECUTION_STATUS: ${{ inputs.execution_status }}
          CAMPAIGN: ${{ inputs.campaign }}
          EXPERIMENT: ${{ inputs.experiment }}
          CASE_ID: ${{ inputs.case_id }}
          EXECUTION_BRANCH: ${{ inputs.execution_branch }}
          EXECUTION_SHA: ${{ inputs.execution_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CONTROLLER_DECISION: ${{ inputs.controller_decision }}
          SCIENTIFIC_STATUS: ${{ inputs.scientific_status }}
          NEXT_CASE: ${{ inputs.next_case }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          def opt(name):
              value=os.environ.get(name,'').strip()
              return value or None
          run_id=opt('SOURCE_RUN_ID')
          state={
              'campaign': opt('CAMPAIGN'),
              'experiment': opt('EXPERIMENT'),
              'case_id': opt('CASE_ID'),
              'execution_status': opt('EXECUTION_STATUS'),
              'scientific_status': opt('SCIENTIFIC_STATUS') or 'AWAITING_ADJUDICATION',
              'controller_decision': opt('CONTROLLER_DECISION') or 'WAIT',
              'failure_classification': 'NONE',
              'human_required': False,
              'next_case': opt('NEXT_CASE'),
              'run_id': int(run_id) if run_id and run_id.isdigit() else run_id,
              'execution_sha': opt('EXECUTION_SHA'),
              'branch': opt('EXECUTION_BRANCH'),
              'jobs': [],
              'event_type': 'LIFECYCLE_STATE_PUBLISHED',
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'source': 'governed workflow dispatch'
          }
          required=['campaign','experiment','case_id','execution_status','execution_sha','branch','run_id']
          missing=[k for k in required if state.get(k) in (None,'')]
          if missing:
              raise SystemExit('refusing incomplete lifecycle publication: '+','.join(missing))
          with open('_site/execution-status.json','w',encoding='utf-8') as f:
              json.dump(state,f,indent=2)
              f.write('\n')
          PY
      - name: Resolve governed execution artifact
        if: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.execution_status == '' && inputs.source_run_id != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$WORKFLOW_RUN_ID"
          if [ -z "$RUN_ID" ]; then RUN_ID="$DISPATCH_RUN_ID"; fi
          test -n "$RUN_ID"
          mkdir -p _status
          rm -rf _status/*
          if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name governed-platform-execution-status --dir _status; then
            STATUS="$(find _status -name execution-status.json -type f | head -n 1)"
            if [ -n "$STATUS" ]; then
              cp "$STATUS" _site/execution-status.json
            else
              echo "Execution artifact downloaded without execution-status.json" >&2
              exit 1
            fi
          else
            echo "No governed execution-status artifact available for run $RUN_ID; refusing to publish inferred state." >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
