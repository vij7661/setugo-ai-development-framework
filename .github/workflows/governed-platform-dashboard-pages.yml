name: Governed Platform Dashboard Pages

on:
  workflow_dispatch:
    inputs:
      source_run_id: {required: false, type: string}
  push:
    branches: [main]
    paths:
      - "experiments/governed-platform/observability/dashboard/**"
      - ".github/workflows/governed-platform-dashboard-pages.yml"
  workflow_run:
    workflows:
      - "Governed Platform Remote Pilot"
      - "Governed Platform Gemini Qualification"
      - "Governed Platform Mistral Qualification"
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: governed-platform-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp experiments/governed-platform/observability/dashboard/index.html _site/index.html
          cp experiments/governed-platform/observability/dashboard/execution-status.json _site/execution-status.json
      - name: Resolve governed execution artifact when explicitly bound to a run
        if: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.source_run_id != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$WORKFLOW_RUN_ID"; if [ -z "$RUN_ID" ]; then RUN_ID="$DISPATCH_RUN_ID"; fi
          test -n "$RUN_ID"
          mkdir -p _status
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name governed-platform-execution-status --dir _status
          STATUS="$(find _status -name execution-status.json -type f | head -n 1)"
          test -n "$STATUS"
          cp "$STATUS" _site/execution-status.json
      - name: Validate governed state and stamp publication time
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          p='_site/execution-status.json'; s=json.load(open(p,encoding='utf-8'))
          required=['campaign','experiment','case_id','execution_status','execution_sha','branch','run_id']
          missing=[k for k in required if s.get(k) in (None,'')]
          if missing: raise SystemExit('refusing incomplete governed state: '+','.join(missing))
          s['last_event_at']=s.get('last_event_at') or s.get('updated_at') or s.get('event_time')
          s['last_publication_at']=datetime.now(timezone.utc).isoformat()
          json.dump(s,open(p,'w',encoding='utf-8'),indent=2);open(p,'a',encoding='utf-8').write('\n')
          PY
      - name: Build authoritative case history
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _history; mkdir -p _history/runs
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status=="completed") | select(.name=="Governed Platform Remote Pilot" or .name=="Governed Platform Gemini Qualification" or .name=="Governed Platform Mistral Qualification") | .id' > _history/run-ids.txt
          while read -r RUN_ID; do [ -n "$RUN_ID" ] || continue; DEST="_history/runs/$RUN_ID"; mkdir -p "$DEST"; gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name governed-platform-execution-status --dir "$DEST" >/dev/null 2>&1 || true; done < _history/run-ids.txt
          python - <<'PY'
          import json
          from pathlib import Path
          latest={}
          for path in Path('_history/runs').glob('*/execution-status.json'):
            try:s=json.loads(path.read_text())
            except Exception:continue
            case=s.get('case_id'); rid=s.get('run_id')
            if not case or rid in (None,''):continue
            try:rid=int(rid)
            except:continue
            jobs=s.get('jobs') or []; failed=[j.get('name') or 'unnamed' for j in jobs if str(j.get('conclusion','')).lower() not in ('','success','skipped')]
            ex=s.get('execution_status'); result='PASSED' if ex in ('COMPLETE','CONTINUING') and not failed else ('FAILED' if ex in ('FAILED','BLOCKED') or failed else 'INCOMPLETE')
            reason=s.get('failure_reason')
            if not reason and result=='FAILED': reason=' — '.join(([str(s.get('failure_classification'))] if s.get('failure_classification') not in (None,'NONE') else [])+(['failed job(s): '+', '.join(failed)] if failed else [])) or 'Execution failed; no classified reason published.'
            item={'case_id':case,'experiment':s.get('experiment'),'execution_result':result,'execution_status':ex,'scientific_status':s.get('scientific_status'),'failure_classification':s.get('failure_classification'),'failure_reason':reason,'controller_decision':s.get('controller_decision'),'human_required':bool(s.get('human_required')),'run_id':rid,'execution_sha':s.get('execution_sha'),'updated_at':s.get('updated_at') or s.get('event_time'),'jobs':jobs}
            if case not in latest or rid>=latest[case]['run_id']:latest[case]=item
          Path('_site/execution-history.json').write_text(json.dumps({'cases':sorted(latest.values(),key=lambda x:x['run_id'],reverse=True)},indent=2)+'\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
