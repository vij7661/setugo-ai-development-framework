name: Governed Platform Dashboard Pages

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/governed-platform-falsification-harness
    paths:
      - "experiments/governed-platform/observability/dashboard/**"
      - ".github/workflows/governed-platform-dashboard-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: governed-platform-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp experiments/governed-platform/observability/dashboard/index.html _site/index.html
          cp experiments/governed-platform/observability/dashboard/execution-status.json _site/execution-status.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
