name: V24 I11 Plan Contract V3
on:
  push:
    branches: [testing/v24-i11-falsification-plan-v3]
    paths:
      - 'testing/v24/v24_i11_harness_contract_v2.py'
      - 'testing/v24/test_v24_i11_harness_contract_v2.py'
      - 'testing/v24/V24-I11-FALSIFICATION-PLAN-V3-REVIEW-BINDING.json'
      - '.github/workflows/v24-i11-plan-contract-v3.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  plan-contract-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: testing/v24
        run: python -m unittest -v test_v24_i11_harness_contract_v2.py
