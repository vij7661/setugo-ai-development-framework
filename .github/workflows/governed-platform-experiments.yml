name: Governed Platform Experiment Harness

on:
  pull_request:
    paths:
      - "experiments/governed-platform/**"
      - ".github/workflows/governed-platform-experiments.yml"
  push:
    paths:
      - "experiments/governed-platform/**"
      - ".github/workflows/governed-platform-experiments.yml"

permissions:
  contents: read

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed JSON and canonical case identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("experiments/governed-platform")
          mismatches = []
          for p in root.rglob("*.json"):
              data = json.loads(p.read_text(encoding="utf-8"))
              print("valid", p)
              if p.parent.name == "model-visible":
                  actual = data.get("case_id")
                  expected = p.stem
                  if actual != expected:
                      mismatches.append((str(p), actual, expected))
          if mismatches:
              for path, actual, expected in mismatches:
                  print(f"CASE_ID_MISMATCH {path}: payload={actual!r} filename={expected!r}")
              raise SystemExit(f"{len(mismatches)} canonical case identity mismatch(es)")
          PY
      - name: Compile harness Python
        run: |
          python -m py_compile experiments/governed-platform/score/score_pilot.py
          python -m py_compile experiments/governed-platform/runner/prepare_run.py
          python -m py_compile experiments/governed-platform/runner/review_contract.py
          python -m py_compile experiments/governed-platform/runner/adapters.py
          python -m py_compile experiments/governed-platform/runner/openai_compatible.py
          python -m py_compile experiments/governed-platform/runner/provider_router.py
          python -m py_compile experiments/governed-platform/runner/run_ollama_canary.py
          python -m py_compile experiments/governed-platform/runner/run_remote_canary.py
          python -m py_compile experiments/governed-platform/ground-truth/freeze_truth.py
          python -m py_compile experiments/governed-platform/observability/normalize_github_event.py
          python -m py_compile experiments/governed-platform/observability/render_status.py
          python -m py_compile experiments/governed-platform/continuation/controller.py
          python -m py_compile experiments/governed-platform/continuation/diagnosis.py
          python -m py_compile experiments/governed-platform/governance/governor.py
          python -m py_compile experiments/governed-platform/governance/impact_graph.py
      - name: Run scorer regressions
        working-directory: experiments/governed-platform/score
        run: python -m unittest -v test_score_pilot.py
      - name: Run runner regressions
        working-directory: experiments/governed-platform/runner
        run: python -m unittest -v test_prepare_run.py test_review_contract.py test_adapters.py test_ollama_adapter.py test_openai_compatible.py test_provider_router.py
      - name: Run protected-truth regressions
        working-directory: experiments/governed-platform/ground-truth
        run: python -m unittest -v test_freeze_truth.py
      - name: Run observability regressions
        working-directory: experiments/governed-platform/observability
        run: python -m unittest -v test_observability.py
      - name: Run continuation authority regressions
        working-directory: experiments/governed-platform/continuation
        run: python -m unittest -v test_controller.py test_diagnosis.py
      - name: Run governor falsification regressions
        working-directory: experiments/governed-platform/governance
        run: python -m unittest -v test_governor.py test_governor_exp_f.py test_impact_graph.py
