name: V24 I11 Plan V8 Contract

on:
  push:
    branches:
      - testing/v24-i11-falsification-plan-v8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V8 plan and harness contract preflight
        run: python testing/v24/preflight_v24_i11_plan_v8.py
