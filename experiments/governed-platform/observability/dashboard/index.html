<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Governed Platform — Execution Dashboard</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{padding:8px 12px;border-radius:999px;background:#e8eefc;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:14px;padding:18px;box-shadow:0 2px 8px #0000000a}.k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#667085}.v{font-size:18px;font-weight:700;margin-top:6px;overflow-wrap:anywhere}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#667085}.muted{color:#667085;font-size:13px}.ok{color:#067647}.bad{color:#b42318}.wait{color:#b54708}.skip{color:#667085}.stale{color:#b42318;font-weight:800}button{border:1px solid #ccd3df;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.timeline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stage{padding:8px 10px;border:1px solid #e4e8f0;border-radius:9px;font-size:13px}.stage.active{font-weight:700;background:#eef3ff}.meta{margin-top:8px}.source{font-size:12px;margin-top:6px}.result{font-weight:800}.reason{max-width:360px;white-space:normal}.history-wrap{overflow-x:auto}@media(max-width:600px){.wrap{padding:18px}.head{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="wrap"><div class="head"><div><h1>Execution Dashboard</h1><div class="muted">Governed AI Development Platform · authoritative state + execution telemetry</div></div><div><button onclick="refreshAll()">Refresh</button> <span id="health" class="badge">Loading…</span></div></div>
<section class="card wide" style="margin-top:22px"><div class="k">Execution lifecycle</div><div id="timeline" class="timeline"></div><div id="freshness" class="muted meta"></div><div id="sourceNote" class="source muted"></div></section><section id="cards" class="grid"></section>
<section class="card wide" style="margin-top:14px"><div class="k">API usage / fallback trail</div><div id="providers"></div></section><section class="card wide" style="margin-top:14px"><div class="k">Provider / job status</div><div id="jobs"></div></section><section class="card wide" style="margin-top:14px"><div class="k">Case history</div><div id="history" class="history-wrap"></div></section>
<p class="muted">Execution and scientific status are independent. A green workflow never implies scientific PASS.</p></main>
<script>
const repo='vij7661/setugo-ai-development-framework';const stages=['QUEUED','RUNNING','PROVIDER_PROGRESS','DIAGNOSING','REPAIRING','CONTINUING','COMPLETE','BLOCKED','FAILED','STALE'];let governed=null;
function val(x){return x===null||x===undefined||x===''?'—':String(x)}function esc(x){return val(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtIST(x){if(!x)return'—';const d=new Date(x);if(Number.isNaN(d.getTime()))return val(x);const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d);const p=Object.fromEntries(parts.map(a=>[a.type,a.value]));return`${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second} IST`}function lifecycle(status){return stages.map(x=>`<span class="stage ${x===status?'active':''}">${x}</span>`).join('')}
function renderProviders(s){const rows=s.provider_routing||[];document.getElementById('providers').innerHTML=rows.length?`<table><thead><tr><th>Slot</th><th>API</th><th>Result</th><th>Attempts</th><th>Reason</th><th>Time (IST)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.slot)}</td><td>${esc(r.provider)}</td><td>${esc(r.result)}</td><td>${esc(r.attempts)}</td><td>${esc(r.reason)}</td><td>${esc(fmtIST(r.updated_at))}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">No provider-routing evidence published for this recovered snapshot.</p>'}
function render(s,staleReason){const status=staleReason?'STALE':s.execution_status;const h=document.getElementById('health');h.textContent=status||'UNKNOWN';h.className='badge '+(status==='COMPLETE'?'ok':['FAILED','BLOCKED','STALE'].includes(status)?'bad':'wait');document.getElementById('timeline').innerHTML=lifecycle(status);document.getElementById('freshness').innerHTML=`Last event: ${esc(fmtIST(s.last_event_at||s.updated_at))} · last publication: ${esc(fmtIST(s.last_publication_at))}${staleReason?` · <span class="stale">STALE: ${esc(staleReason)}</span>`:''}`;document.getElementById('sourceNote').textContent=s.source||'authoritative governed state';const fields=[['Campaign',s.campaign],['Experiment',s.experiment],['Current case',s.case_id],['Execution',status],['Scientific status',s.scientific_status],['Controller decision',s.controller_decision],['Failure classification',s.failure_classification],['Human intervention',s.human_required?'REQUIRED':'Not required'],['Continuation status',s.continuation_status],['Next case',s.next_case],['Next action',s.next_action],['Run ID',s.run_id],['Exact SHA',s.execution_sha],['Branch',s.branch]];document.getElementById('cards').innerHTML=fields.map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('');renderProviders(s);const jobs=s.jobs||[];document.getElementById('jobs').innerHTML=jobs.length?`<table><thead><tr><th>Job</th><th>Status</th><th>Conclusion</th></tr></thead><tbody>${jobs.map(j=>`<tr><td>${esc(j.name)}</td><td>${esc(j.status)}</td><td>${esc(j.conclusion)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">No job data.</p>'}
function renderHistory(data){const rows=data?.cases||[];document.getElementById('history').innerHTML=rows.length?`<table><thead><tr><th>Case</th><th>Execution</th><th>Scientific</th><th>Failure</th><th>Run</th><th>Updated (IST)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.case_id)}</td><td>${esc(r.execution_result)}</td><td>${esc(r.scientific_status)}</td><td>${esc(r.failure_reason||r.failure_classification)}</td><td>${esc(r.run_id)}</td><td>${esc(fmtIST(r.updated_at))}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">No history published.</p>'}
async function latestRemoteRun(){try{const r=await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=50`,{cache:'no-store'});if(!r.ok)return null;const runs=(await r.json()).workflow_runs||[];return runs.find(x=>x.name==='Governed Platform Remote Pilot')||null}catch(e){return null}}
async function refreshAll(){try{const r=await fetch('./execution-status.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();governed=await r.json();let stale=null;const live=await latestRemoteRun();if(live&&Number(live.id)>Number(governed.run_id||0))stale=`newer Remote Pilot run ${live.id} exists`;render(governed,stale);try{const hr=await fetch('./execution-history.json?ts='+Date.now(),{cache:'no-store'});renderHistory(hr.ok?await hr.json():{cases:[]})}catch(e){renderHistory({cases:[]})}}catch(e){document.getElementById('health').textContent='STATE UNAVAILABLE';document.getElementById('health').className='badge bad'}}refreshAll();setInterval(refreshAll,30000);
</script></body></html>
